  requisite: Конституционный Закон Республики Казахстан от 11 апреля 1997 года № 91-1
  title:
    rus: О внесении дополнений в Указы Президента Республики Казахстан, имеющие силу Конституционных законов, "О Парламенте Республики Казахстан и статусе его депутатов" и "О судах и статусе судей в Республике Казахстан" по вопросам упорядочения предоставления льгот отдельным категориям граждан
    kaz: '"Азаматтардың жекелеген санаттарына жеңiлдiктер берудi ретке келтiру мәселелерi бойынша Қазақстан Республикасы Президентiнiң "Қазақстан Республикасының Парламентi және оның депутаттарының мәртебесi туралы" және "Қазақстан Республикасындағы соттар және судьялардың мәртебесi туралы" Конституциялық заң күшi бар Жарлықтарына толықтырулар енгiзу жөнiнде'
  link: https://zan.gov.kz/client/#!/doc/104134/rus
