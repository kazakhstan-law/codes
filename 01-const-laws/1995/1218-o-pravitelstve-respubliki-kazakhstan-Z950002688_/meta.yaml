  title:
    rus: О внесении изменений и дополнений в некоторые конституционные законы Республики Казахстан по вопросам приведения их в соответствие с Конституцией Республики Казахстан, совершенствования законодательства Республики Казахстан о выборах и прокуратуре
    kaz: Қазақстан Республикасының кейбір конституциялық заңдарына оларды Қазақстан Республикасының Конституциясына сәйкес келтіру, Қазақстан Республикасының сайлау және прокуратура туралы заңнамасын жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
