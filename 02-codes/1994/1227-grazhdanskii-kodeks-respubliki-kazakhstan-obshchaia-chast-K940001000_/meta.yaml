  requisite: Закон Республики Казахстан от 20 января 2010 года № 239-IV
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам упрощения государственной регистрации юридических лиц и учетной регистрации филиалов и представительств
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне заңды тұлғаларды мемлекеттік тіркеуді және филиалдар мен өкілдіктерді есептік тіркеуді оңайлату мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/50300/rus
