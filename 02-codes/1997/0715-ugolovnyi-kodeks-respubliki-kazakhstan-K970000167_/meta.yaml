  requisite: Конституционный Закон Республики Казахстан от 3 июля 2013 года № 121-V
  title:
    rus: О внесении изменений и дополнений в Конституционный закон Республики Казахстан и в некоторые законодательные акты Республики Казахстан по вопросам исключения противоречий, пробелов, коллизий между нормами права различных законодательных актов и норм, способствующих совершению коррупционных правонарушений
    kaz: Қазақстан Республикасының Конституциялық заңына және Қазақстан Республикасының кейбір заңнамалық актілеріне әртүрлі заңнамалық актілердің құқық нормалары арасындағы қайшылықтарды, олқылықтарды, коллизияларды және сыбайлас жемқорлық құқық бұзушылықтар жасауға ықпал ететін нормаларды жою мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/73281/rus
