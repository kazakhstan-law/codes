  title:
    rus: О внесении изменений и дополнений в Уголовный, Уголовно-процессуальный, Уголовно-исполнительный кодексы Республики Казахстан и Кодекс Республики Казахстан об административных правонарушениях по вопросам упрощения процедур расследования уголовных дел, декриминализации некоторых составов преступлений и совершенствования законодательства об административных правонарушениях
    kaz: Қазақстан Республикасының Қылмыстық, Қылмыстық iс жүргiзу, Қылмыстық-атқару кодекстерiне және Қазақстан Республикасының Әкiмшiлiк құқық бұзушылық туралы кодексiне қылмыстық iстердi тергеу рәсiмдерiн жеңiлдету, қылмыстардың кейбiр құрамдарын қылмыстық сипаттан арылту және әкiмшiлiк құқық бұзушылық туралы заңнаманы жетiлдiру мәселелерi бойынша өзгерiстер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/22148/rus
