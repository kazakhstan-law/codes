  requisite: Закон Республики Казахстан от 18 апреля 2011 года № 429-IV
  title:
    rus: О внесении дополнений в некоторые законодательные акты Республики Казахстан по вопросам запретных зон и запретных районов при арсеналах, базах и складах Вооруженных Сил, других войск и воинских формирований
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аймақтар мен тыйым салынған аудандар мәселелері бойынша толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/58467/rus
