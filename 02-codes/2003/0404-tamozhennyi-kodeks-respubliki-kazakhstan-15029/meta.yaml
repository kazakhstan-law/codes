  title:
    rus: Об утверждении запретов на ввоз в Республику Казахстан и вывоз из Республики Казахстан товаров и транспортных средств, перечней товаров, запрещенных к помещению под некоторые таможенные режимы, а также запретов и ограничений на проведение операций с товарами, помещенными под отдельные таможенные режимы
    kaz: Тауарлар мен көлiк құралдарын Қазақстан Республикасына әкелуге және Қазақстан Республикасынан әкетуге тыйым салуларды, кейбiр кедендік режимдерге орналастыруға тыйым салынған тауарлардың тiзбелерiн, сондай-ақ жекелеген кедендік режимдерге орналастырылған тауарлармен жасалатын операцияларды жүргiзуге арналған тыйым салулар мен шектеулерді бекiту туралы
