  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам перераспределения полномочий между ветвями государственной власти
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік билік тармақтары арасында өкілеттіктерді қайта бөлу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
