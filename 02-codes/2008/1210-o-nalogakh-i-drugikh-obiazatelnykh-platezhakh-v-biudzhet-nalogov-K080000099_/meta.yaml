  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам исполнения исполнительных документов, организации работ по учету, хранению, оценке и дальнейшему использованию имущества, обращенного (поступившего) в республиканскую собственность
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне атқарушылық құжаттарды орындау, республикалық меншікке айналдырылған (түскен) мүлікті есепке алу, сақтау, бағалау және одан әрі пайдалану жөніндегі жұмыстарды ұйымдастыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
