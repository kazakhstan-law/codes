  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам декриминализации отдельных видов экономических правонарушений и совершенствования законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне экономикалық құқық бұзушылықтардың жекелеген түрлерін қылмыстық сипаттан арылту және Қазақстан Республикасының заңсыз жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы заңнамасын жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198608/rus
