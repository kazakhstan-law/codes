  requisite: Закон Республики Казахстан от 11 июня 2026 года № 307-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в Уголовный, Уголовно-процессуальный, Уголовно-исполнительный кодексы Республики Казахстан и Кодекс Республики Казахстан об административных правонарушениях по вопросам приведения их в соответствие с Конституцией Республики Казахстан, совершенствования законодательства Республики Казахстан о выборах и прокуратуре
    kaz: Қазақстан Республикасының Қылмыстық, Қылмыстық-процестік, Қылмыстық-атқару кодекстеріне және Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексіне оларды Қазақстан Республикасының Конституциясына сәйкес келтіру, Қазақстан Республикасының сайлау және прокуратура туралы заңнамасын жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226351/rus
