  title:
    rus: О внесении изменений и дополнений в Кодекс Республики Казахстан об административных правонарушениях по вопросам противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма
    kaz: Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексіне қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
