    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне арнайы экономикалық және индустриялық аймақтар, инвестицияларды тарту, экспортты дамыту және ілгерілету, сондай-ақ әлеуметтік қамсыздандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
