  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма, а также государственного ценового регулирования
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл, сондай-ақ мемлекеттік баға реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
