    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам государственного управления, совершенствования залоговой политики банков второго уровня, регулирования оценочной деятельности и исполнительного производства
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік басқару, екінші деңгейдегі банктердің кепілдік саясатын, бағалау қызметін реттеуді және атқарушылық іс жүргізуді жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
