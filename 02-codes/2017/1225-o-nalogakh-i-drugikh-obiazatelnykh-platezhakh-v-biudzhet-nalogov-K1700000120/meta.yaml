  requisite: Закон Республики Казахстан от 15 июля 2025 года № 208-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в Кодекс Республики Казахстан «О налогах и других обязательных платежах в бюджет» (Налоговый кодекс) и законы Республики Казахстан по вопросам введения его в действие
    kaz: «Салық және бюджетке төленетін басқа да міндетті төлемдер туралы» Қазақстан Республикасының Кодексіне (Салық кодексі) және оны қолданысқа енгізу мәселелері бойынша Қазақстан Республикасының заңдарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/212509/rus
