  requisite: Закон Республики Казахстан от 26 декабря 2025 года № 243-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в Кодекс Республики Казахстан «О недрах и недропользовании» по вопросам совершенствования недропользования в сфере углеводородов и урана
    kaz: «Жер қойнауы және жер қойнауын пайдалану туралы» Қазақстан Республикасының Кодексіне көмірсутектер мен уран саласында жер қойнауын пайдалануды жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
