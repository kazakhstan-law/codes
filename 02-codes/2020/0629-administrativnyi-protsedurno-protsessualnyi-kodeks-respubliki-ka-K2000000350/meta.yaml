  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам приведения их в соответствие с Конституцией Республики Казахстан, совершенствования законодательства Республики Казахстан о выборах, прокуратуре и социальном  обеспечении
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне оларды Қазақстан Республикасының Конституциясына сәйкес келтіру, Қазақстан Республикасының сайлау, прокуратура және әлеуметтік қамсыздандыру туралы заңнамасын жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
