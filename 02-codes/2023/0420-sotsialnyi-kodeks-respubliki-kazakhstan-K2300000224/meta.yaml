  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам развития столицы и городов республиканского значения, национальных проектов, предпринимательства и оптимизации функций государственных органов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне астананы және республикалық маңызы бар қалаларды, ұлттық жобаларды дамыту, кәсіпкерлік және мемлекеттік органдардың функцияларын оңтайландыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
