    rus: О внесении изменений в Закон Республики Казахстан "О социальной защите граждан, пострадавших вследствие экологического бедствия в Приаралье" и признании утратившим силу Закона Республики Казахстан "О приостановлении действия некоторых статей Закона Республики Казахстан "О социальной защите граждан, пострадавших вследствие экологического бедствия в Приаралье"
    kaz: '"Арал өңіріндегі экологиялық қасірет салдарынан зардап шеккен азаматтарды әлеуметтік қорғау туралы" Қазақстан Республикасының Заңына өзгерістер енгізу және "Арал өңіріндегі экологиялық қасірет салдарынан зардап шеккен азаматтарды әлеуметтік қорғау туралы" Қазақстан Республикасы Заңының кейбір баптарының қолданылуын тоқтата тұру туралы" Қазақстан Республикасы Заңының күші жойылды деп тану туралы'
