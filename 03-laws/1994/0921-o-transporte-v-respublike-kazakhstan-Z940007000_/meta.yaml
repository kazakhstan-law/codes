  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам связи, цифровизации, улучшения инвестиционного климата и исключения излишней законодательной регламентации
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне байланыс, цифрландыру, инвестициялық ахуалды жақсарту және артық заңнамалық регламенттеуді болғызбау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
