  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам разграничения полномочий между уровнями государственного управления и бюджетных отношений
    kaz: Қазақстан Республикасының кейбiр заңнамалық актiлерiне мемлекеттік басқару деңгейлерi арасында өкiлеттiктердiң аражiгін ажырату және бюджеттiк қатынастар мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы
