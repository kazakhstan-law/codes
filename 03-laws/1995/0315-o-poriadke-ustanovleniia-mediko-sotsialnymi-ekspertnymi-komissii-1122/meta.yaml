title:
  rus: О порядке установления медико-социальными экспертными комиссиями (МСЭК) степени утраты профессиональной трудоспособности работникам, получившим увечье или иное повреждение здоровья, связанное с исполнением ими трудовых обязанностей
  kaz: Қызметкерлердiң еңбек мiндеттерiн атқару кезiндегi зақымдануы салдарынан денсаулығының бұзылуына немесе жарымжан болуына байланысты медициналық-әлеуметтiк сараптау комиссияларының (МӘСК) оның кәсiптiк еңбек қабiлетiнен айрылу дәрежесiн белгiлеу тәртiбi туралы Нұсқама
