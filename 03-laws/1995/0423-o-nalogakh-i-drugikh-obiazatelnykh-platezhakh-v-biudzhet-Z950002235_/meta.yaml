  requisite: Закон Республики Казахстан от 10 октября 2001 года № 247-II
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам оплаты труда и социальной защиты военнослужащих, сотрудников правоохранительных и других государственных органов
    kaz: Қазақстан Республикасының кейбір заң актілеріне әскери қызметшілердің, құқық қорғау органдары және басқа да мемлекеттік органдар қызметкерлерінің еңбегіне ақы төлеу және оларды әлеуметтік қорғау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
