  requisite: Закон Республики Казахстан от 5 июля 2024 года № 115-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам государственного контроля и статистики, совершенствования системы защиты населения, управления данными, регистрации юридических лиц и исключения излишней законодательной регламентации
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік бақылау мен статистика, халықты қорғау жүйесін жетілдіру, деректерді басқару, заңды тұлғаларды тіркеу және артық заңнамалық регламенттеуді болғызбау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
