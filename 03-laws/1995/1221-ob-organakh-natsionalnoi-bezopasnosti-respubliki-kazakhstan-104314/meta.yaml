act_code: '104314'
requisite: Закон Республики Казахстан от 21 декабря 1995 года N 2710
title:
  rus: Об органах национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасының ұлттық қауiпсiздiк органдары туралы
form: ЗАК
type_codes:
