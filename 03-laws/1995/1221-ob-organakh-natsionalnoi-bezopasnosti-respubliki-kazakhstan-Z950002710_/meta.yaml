  requisite: Закон Республики Казахстан от 24 июня 2026 года № 326-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам цифровизации, защиты персональных данных, дорожного движения и регулирования передовых технологий на транспорте
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне цифрландыру, дербес деректерді қорғау, жол жүрісі және көліктегі озық технологияларды реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226889/rus
