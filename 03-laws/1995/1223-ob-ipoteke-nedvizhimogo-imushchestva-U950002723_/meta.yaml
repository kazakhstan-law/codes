  requisite: Закон Республики Казахстан от 19 сентября 2025 года № 219-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
