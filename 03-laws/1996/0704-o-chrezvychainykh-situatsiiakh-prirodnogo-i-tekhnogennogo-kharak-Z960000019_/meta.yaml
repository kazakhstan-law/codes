    kaz: Қазақстан Республикасының кейбiр заң актiлерiне табиғи және техногендiк сипаттағы төтенше жағдайлардың алдын алу мен оларды жою және өнеркәсiптiк қауiпсiздiк мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы
