  title:
    rus: 'О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросу реализации отдельных положений Послания Главы государства народу Казахстана от 1 сентября 2020 года «Казахстан в новой реальности: время действий»'
    kaz: 'Қазақстан Республикасының кейбір заңнамалық актілеріне Мемлекет басшысының 2020 жылғы 1 қыркүйектегі «Жаңа жағдайдағы Қазақстан: іс-қимыл кезеңі» атты Қазақстан халқына Жолдауының жекелеген ережелерін іске асыру мәселесі бойынша өзгерістер мен толықтырулар енгізу туралы'
