    kaz: Қазақстан Республикасының кейбір заң актілеріне өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Президентінің "Қазақстан Республикасының анықтау мен тергеуді жүзеге асыратын арнаулы мемлекеттік органдары туралы" және "Қазақстан Республикасының Мемлекеттік тергеу комитеті және оның органдары туралы" заң күші бар Жарлықтарының күші жойылды деп тану туралы
