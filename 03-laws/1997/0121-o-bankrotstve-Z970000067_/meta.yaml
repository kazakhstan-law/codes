  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан в связи с принятием Кодекса Республики Казахстан "О налогах и других обязательных платежах в бюджет" (Налоговый кодекс)
    kaz: '"Салық және бюджетке төленетін басқа да міндетті төлемдер туралы" Қазақстан Республикасы кодексінің (Салық кодексінің) қабылдануына байланысты Қазақстан Республикасының кейбір заң актілеріне өзгерістер мен толықтырулар енгізу туралы'
