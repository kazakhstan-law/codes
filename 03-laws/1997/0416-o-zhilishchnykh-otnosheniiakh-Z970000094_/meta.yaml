  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам жилищно-коммунального хозяйства, предпринимательства и деятельности экспортно-кредитного агентства
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне тұрғын үй-коммуналдық шаруашылық, кәсіпкерлік және экспорттық-кредиттік агенттіктің қызметі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
