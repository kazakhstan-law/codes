  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам социального обеспечения участников Великой Отечественной войны, инвалидов и получателей пособий по случаю потери кормильца
    kaz: Қазақстан Республикасының кейбiр заңнамалық актілеріне Ұлы Отан соғысына қатысушыларды, мүгедектерді және асыраушысынан айырылу жағдайы бойынша жәрдемақы алушыларды әлеуметтік қамсыздандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
