  requisite: Закон Республики Казахстан от 27 апреля 2012 года № 15-V
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам исключения противоречий, пробелов, коллизий между нормами права различных законодательных актов и норм, способствующих совершению коррупционных правонарушений
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне әртүрлі заңнамалық актілердің құқық нормалары арасындағы қайшылықтарды, олқылықтарды, коллизияларды және сыбайлас жемқорлық құқық бұзушылықтар жасауға ықпал ететін нормаларды жою мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
