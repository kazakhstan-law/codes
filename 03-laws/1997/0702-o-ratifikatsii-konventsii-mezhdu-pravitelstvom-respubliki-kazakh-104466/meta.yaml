title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Республики Индия об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и на капитал
  kaz: Қазақстан Республикасының Үкiметi мен Үндiстан Республикасының Үкiметi арасындағы Қосарланған салық салуды болдырмау және табыс пен капиталға салынатын салықтарға қатысты салық салудан жалтаруға жол бермеу туралы конвенцияны бекiту туралы
