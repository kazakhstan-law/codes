  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам правоохранительной службы и присвоения классных чинов, воинских и специальных званий, права ношения форменной одежды военнослужащими и сотрудниками иных государственных органов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне құқық қорғау қызметі және сыныптық шендер, әскери және арнаулы атақтар беру, әскери қызметшiлердiң және өзге де мемлекеттiк органдар қызметкерлерiнiң нысанды киiм киiп жүру құқығы мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы
