  requisite: Закон Республики Казахстан от 13 января 2025 года № 157-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам доступа к информации, общественного участия, государственных наград и исключения излишней законодательной регламентации
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне ақпаратқа қол жеткізу, қоғамдық қатысу, мемлекеттік наградалар және артық заңнамалық регламенттеуді болғызбау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
