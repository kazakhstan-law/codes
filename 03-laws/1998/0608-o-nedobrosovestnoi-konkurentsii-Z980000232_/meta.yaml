  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам контроля и регулирования деятельности субъектов естественной монополии и субъектов рынка, занимающих доминирующее положение на соответствующем товарном рынке
    kaz: Қазақстан Республикасының кейбiр заңнамалық актiлерiне тиiстi тауар нарығында үстем жағдайға ие табиғи монополия субъектiлерi мен нарық субъектiлерiнiң қызметiн бақылау және реттеу мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы
