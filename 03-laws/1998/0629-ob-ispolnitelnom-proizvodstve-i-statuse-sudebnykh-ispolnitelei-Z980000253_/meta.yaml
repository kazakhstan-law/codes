  requisite: Закон Республики Казахстан от 11 июля 2009 года № 185-IV
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам совершенствования законодательства Республики Казахстан о платежах и переводах денег, бухгалтерском учете и финансовой отчетности финансовых организаций, банковской деятельности и деятельности Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне ақша төлемі мен аударымы, қаржы ұйымдарының бухгалтерлік есебі мен қаржылық есептілігі, банк қызметі және Қазақстан Республикасы Ұлттық Банкінің қызметі туралы Қазақстан Республикасының заңнамасын жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
