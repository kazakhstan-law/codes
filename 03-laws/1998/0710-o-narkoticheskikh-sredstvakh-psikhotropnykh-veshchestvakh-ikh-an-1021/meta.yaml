act_code: '1021'
requisite: Закон Республики Казахстан от 10 июля 1998 года N 279
title:
  rus: О наркотических средствах, психотропных веществах, их аналогах и прекурсорах и мерах противодействия их незаконному обороту и злоупотреблению ими
  kaz: Есiрткi, психотроптық заттар, сол тектестер мен прекурсорлар және олардың заңсыз айналымы мен терiс пайдаланылуына қарсы iс-қимыл шаралары туралы
