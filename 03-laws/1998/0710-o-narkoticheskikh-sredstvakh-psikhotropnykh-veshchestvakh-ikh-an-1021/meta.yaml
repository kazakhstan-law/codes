  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам контроля над оборотом наркотических средств, психотропных веществ и прекурсоров
    kaz: Қазақстан Республикасының кейбір заң актілеріне есірткі, психотроптық заттар мен прекурсорлар айналымына бақылау жасау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
