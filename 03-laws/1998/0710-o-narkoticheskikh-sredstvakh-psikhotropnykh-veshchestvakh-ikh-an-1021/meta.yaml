  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам противодействия незаконному обороту наркотических средств, психотропных веществ, их аналогов, прекурсоров и сильнодействующих веществ
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне есірткі, психотроптық заттардың, сол тектестердің,  прекурсорлардың  және күшті әсер ететін заттардың заңсыз айналымына қарсы іс-қимыл мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
