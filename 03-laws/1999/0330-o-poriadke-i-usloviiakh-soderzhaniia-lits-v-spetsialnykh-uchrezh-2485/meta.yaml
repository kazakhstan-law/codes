    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне қылмыстық, қылмыстық-процестік заңнама мен құқық қорғау және арнаулы мемлекеттік органдар қызметін жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
