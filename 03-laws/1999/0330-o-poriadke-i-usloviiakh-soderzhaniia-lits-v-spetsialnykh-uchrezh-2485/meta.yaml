title:
  rus: О порядке и условиях содержания лиц в специальных учреждениях, специальных помещениях, обеспечивающих временную изоляцию от общества
  kaz: Адамдарды қоғамнан уақытша оқшаулауды қамтамасыз ететін арнаулы мекемелерде, арнаулы үй-жайларда ұстау тәртібі мен шарттары туралы
