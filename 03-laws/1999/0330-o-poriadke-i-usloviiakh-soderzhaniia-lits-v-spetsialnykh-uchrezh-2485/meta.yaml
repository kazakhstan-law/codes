  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам создания национального превентивного механизма, направленного на предупреждение пыток и других жестоких, бесчеловечных или унижающих достоинство видов обращения и наказания
    kaz: Қазақстан Республикасының кейбiр заңнамалық актiлерiне азаптаудың және басқа да қатыгез, адамгершiлiкке жатпайтын немесе ар-намысты қорлайтын iс-әрекеттер мен жазалау түрлерiнің алдын алуға бағытталған ұлттық алдын алу тетiгiн жасау мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы
