  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам закрепления оснований, порядка и условий содержания лиц в учреждениях, обеспечивающих временную изоляцию от общества
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне адамдарды қоғамнан уақытша оқшаулауды қамтамасыз ететін мекемелерде ұстау негіздерін, тәртібі мен шарттарын бекіту мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
