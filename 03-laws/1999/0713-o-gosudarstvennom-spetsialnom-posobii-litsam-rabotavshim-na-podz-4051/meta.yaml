    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік басқару деңгейлері арасындағы өкілеттіктердің аражігін ажырату мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
