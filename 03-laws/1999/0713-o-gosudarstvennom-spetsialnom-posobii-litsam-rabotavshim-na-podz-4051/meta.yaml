    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне әлеуметтік-еңбек саласындағы мемлекеттік көрсетілетін қызметтерді оңтайландыру және автоматтандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
