act_code: '4051'
requisite: Закон Республики Казахстан от 13 июля 1999 года N 414
title:
  rus: О государственном специальном пособии лицам, работавшим на подземных и открытых горных работах, на работах с особо вредными и особо тяжелыми условиями труда или на работах с вредными и тяжелыми условиями труда
  kaz: Жерасты және ашық кен жұмыстарында, еңбек жағдайлары ерекше зиянды және ерекше ауыр жұмыстарда немесе еңбек жағдайлары зиянды және ауыр жұмыстарда істеген адамдарға берілетін мемлекеттік арнайы жәрдемақы туралы
