act_code: '3730'
requisite: Закон Республики Казахстан от 16 июля 1999 года N 429
title:
  rus: О государственном регулировании производства и оборота этилового спирта и алкогольной продукции
  kaz: Этил спирті мен алкоголь өнімінің өндірілуін және айналымын мемлекеттік реттеу туралы
