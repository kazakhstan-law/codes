  requisite: Закон Республики Казахстан от 30 декабря 2020 года № 397-VI ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам технического регулирования, предпринимательства, совершенствования системы государственного управления и платежей
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне техникалық реттеу, кәсіпкерлік, мемлекеттік басқару жүйесін жетілдіру және төлемдер мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/151252/rus
