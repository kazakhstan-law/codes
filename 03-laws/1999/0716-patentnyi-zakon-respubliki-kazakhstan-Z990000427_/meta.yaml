  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам совершенствования законодательства в сферах интеллектуальной собственности и оказания гарантированной государством юридической помощи
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне зияткерлік меншік және мемлекет кепілдік берген заң көмегін көрсету салаларындағы заңнаманы жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
