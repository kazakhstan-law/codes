  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по усилению ответственности участников бюджетного процесса, получателей бюджетных средств и повышению эффективности бюджетных процедур
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне бюджет процесіне қатысушылардың, бюджет қаражатын алушылардың жауапкершілігін күшейту және бюджеттік рәсімдердің тиімділігін арттыру бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/63416/rus
