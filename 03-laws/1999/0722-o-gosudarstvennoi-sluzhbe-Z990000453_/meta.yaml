  title:
    rus: О внесении изменений и дополнения в некоторые законодательные акты Республики Казахстан по вопросам правового положения лиц, уполномоченных на выполнение государственных функций, и лиц, приравненных к ним
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік функцияларды орындауға уәкілетті адамдар мен оған теңестірілген адамдардың құқықтық жағдайы мәселелері бойынша өзгерістер мен толықтыру енгізу туралы
