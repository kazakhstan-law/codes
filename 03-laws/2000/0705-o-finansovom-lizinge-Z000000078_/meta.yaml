    rus: О ратификации Протокола между Правительством Республики Казахстан и Правительством Российской Федерации о внесении изменений в Договор между Правительством Республики Казахстан и Правительством Российской Федерации об аренде объектов и боевых полей 929 Государственного летно-испытательного центра Российской Федерации, расположенных на территории Республики Казахстан, от 18 октября 1996 года
