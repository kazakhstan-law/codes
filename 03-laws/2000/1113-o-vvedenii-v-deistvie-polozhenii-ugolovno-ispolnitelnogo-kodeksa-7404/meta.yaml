act_code: '7404'
requisite: Закон Республики Казахстан от 13 ноября 2000 года № 99. Утратил силу Кодексом Республики Казахстан от 5 июля 2014 года № 234-V (вводится в действие с 1 января 2015 года)
title:
  rus: О введении в действие положений Уголовно-исполнительного кодекса Республики Казахстан о льготных условиях содержания осужденных, отбывающих наказание в исправительных колониях общего и строгого режимов, а также в воспитательных колониях
  kaz: Қазақстан Республикасы Қылмыстық-атқару кодексінің жалпы және қатаң режимдердегі түзеу колонияларында, сондай-ақ тәрбиелеу колонияларында жазасын өтеп жатқан сотталғандарды ұстаудың жеңілдікті жағдайлары жөніндегі ережелерін қолданысқа енгізу туралы
