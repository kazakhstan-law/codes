  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам волонтерской деятельности, благотворительности, государственного социального заказа, государственного заказа на реализацию стратегического партнерства, грантов и премий для неправительственных организаций, лекарственного и социального обеспечения
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне волонтерлік қызмет, қайырымдылық, мемлекеттік әлеуметтік тапсырыс, стратегиялық әріптестікті іске асыруға арналған мемлекеттік тапсырыс, үкіметтік емес ұйымдарға арналған гранттар мен сыйлықақылар, дәрілік қамтамасыз ету және әлеуметтік қамсыздандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
