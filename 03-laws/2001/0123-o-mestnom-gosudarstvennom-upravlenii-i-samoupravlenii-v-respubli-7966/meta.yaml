act_code: '7966'
requisite: Закон Республики Казахстан от 23 января 2001 года № 148
title:
  rus: О местном государственном управлении и самоуправлении в Республике Казахстан
  kaz: Қазақстан Республикасындағы жергілікті мемлекеттік басқару және өзін-өзі басқару туралы
