  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам противодействия экстремизму и терроризму
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне экстремизмге және терроризмге қарсы іс-қимыл мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
