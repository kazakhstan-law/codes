  requisite: Закон Республики Казахстан от 13 июня 2013 года № 102-V
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам разграничения полномочий между органами государственного управления
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік басқару органдары арасындағы өкілеттіктердің аражігін ажырату мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
