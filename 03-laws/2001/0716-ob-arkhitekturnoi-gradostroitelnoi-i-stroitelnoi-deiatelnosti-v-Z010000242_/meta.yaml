  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам организации и проведения международной специализированной выставки ЭКСПО-2017 в Астане
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне Астанада ЭКСПО-2017 халықаралық мамандандырылған көрмесін ұйымдастыру және өткізу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
