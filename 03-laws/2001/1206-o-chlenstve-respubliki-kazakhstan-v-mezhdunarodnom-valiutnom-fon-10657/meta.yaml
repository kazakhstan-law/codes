act_code: '10657'
requisite: Закон Республики Казахстан от 6 декабря 2001 года № 264
title:
  rus: О членстве Республики Казахстан в Международном Валютном Фонде, Международном Банке Реконструкции и Развития, Международной Финансовой Корпорации, Международной Ассоциации Развития, Многостороннем Агентстве Гарантии Инвестиций, Международном Центре по Урегулированию Инвестиционных Споров, Европейском Банке Реконструкции и Развития, Азиатском Банке Развития, Исламском Банке Развития, Азиатском Банке Инфраструктурных Инвестиций
  kaz: Қазақстан Республикасының Халықаралық Валюта Қорына, Халықаралық Қайта Құру және Даму Банкiне, Халықаралық Қаржы Корпорациясына, Халықаралық Даму Қауымдастығына, Инвестициялар Кепiлдiгiнiң Көпжақты Агенттiгiне, Инвестициялық Дауларды Реттеу жөнiндегi Халықаралық Орталыққа, Еуропа Қайта Құру және Даму Банкiне, Азия Даму Банкiне, Ислам Даму Банкiне, Азия Инфрақұрылымдық Инвестициялар Банкіне мүшелiгi туралы
