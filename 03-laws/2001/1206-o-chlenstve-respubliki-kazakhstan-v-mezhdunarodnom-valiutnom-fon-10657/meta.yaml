  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам совершенствования бюджетного законодательства и признании утратившим силу Закона Республики Казахстан «О концессиях»
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне бюджет заңнамасын жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу және «Концессиялар туралы» Қазақстан Республикасы Заңының күші жойылды деп тану туралы
