  requisite: Закон Республики Казахстан от 10 июля 2012 года № 36-V
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам сокращения разрешительных документов и оптимизации контрольных и надзорных функций государственных органов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне рұқсат беру құжаттарын қысқарту және мемлекеттік органдардың бақылау мен қадағалау функцияларын оңтайландыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
