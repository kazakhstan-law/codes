  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам профилактики детской безнадзорности и предупреждения правонарушений среди несовершеннолетних
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне балалардың қадағалаусыз қалуының профилактикасы және кәмелетке толмағандар арасындағы құқық бұзушылықтардың алдын алу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
