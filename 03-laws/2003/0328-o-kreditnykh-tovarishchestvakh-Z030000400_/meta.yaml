  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам ипотечного кредитования и защиты прав потребителей финансовых услуг и инвесторов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне ипотекалық кредит беру және қаржылық қызметтерді тұтынушылар мен инвесторлардың құқықтарын қорғау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
