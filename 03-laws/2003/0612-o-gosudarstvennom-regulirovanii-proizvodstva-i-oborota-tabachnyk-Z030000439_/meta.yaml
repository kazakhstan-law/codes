  requisite: Закон Республики Казахстан от 30 декабря 2021 года № 95-VII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам внедрения новой регуляторной политики в сфере предпринимательской деятельности и перераспределения отдельных функций органов внутренних дел Республики Казахстан
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне кәсіпкерлік қызмет саласында жаңа реттеушілік саясатты ендіру және Қазақстан Республикасы ішкі істер органдарының жекелеген функцияларын қайта бөлу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
