  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам развития финансового рынка, защиты прав потребителей финансовых услуг, связи и исключения излишней законодательной регламентации
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне қаржы нарығын дамыту, қаржылық көрсетілетін қызметтерді тұтынушылардың құқықтарын қорғау, байланыс және артық заңнамалық регламенттеуді болғызбау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
