  requisite: Закон Республики Казахстан от 3 января 2026 года № 251-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам исполнения решений Конституционного Суда Республики Казахстан и возврата государству незаконно приобретенных активов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне Қазақстан Республикасы Конституциялық Сотының шешімдерін орындау және заңсыз иемденілген активтерді мемлекетке қайтару мәселелері бойынша өзгерістер мен  толықтырулар  енгізу туралы
