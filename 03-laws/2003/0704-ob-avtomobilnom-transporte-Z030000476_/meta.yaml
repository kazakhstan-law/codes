  requisite: Закон Республики Казахстан от 30 июня 2025 года № 204-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам долевого участия в жилищном строительстве, автомобильных дорог и оказания услуг по перевозке лиц с инвалидностью
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне тұрғын үй құрылысына үлестік қатысу, автомобиль жолдары және мүгедектігі бар адамдарды тасымалдау жөніндегі қызметтерді көрсету мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211873/rus
