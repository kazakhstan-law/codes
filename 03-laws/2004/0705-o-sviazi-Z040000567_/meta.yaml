  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам закрепления компетенции государственных органов на законодательном и (или) подзаконном уровнях
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік органдардың құзыретін заңнамалық және (немесе) заңға тәуелді деңгейде бекіту мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
