  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам регулирования и развития страхового рынка и рынка ценных бумаг, банковской деятельности
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне сақтандыру нарығын және бағалы қағаздар нарығын реттеу мен дамыту, банк қызметі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
