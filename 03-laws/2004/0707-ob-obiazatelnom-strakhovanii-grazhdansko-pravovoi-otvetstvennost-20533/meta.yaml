title:
  rus: Об обязательном страховании гражданско-правовой ответственности владельцев объектов, деятельность которых связана с опасностью причинения вреда третьим лицам
  kaz: Қызметi үшiншi тұлғаларға зиян келтiру қаупiмен байланысты объектiлер иелерiнiң азаматтық-құқықтық жауапкершiлiгiн мiндеттi сақтандыру туралы
