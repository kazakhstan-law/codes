  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам обязательного страхования гражданско-правовой ответственности владельцев объектов, деятельность которых связана с опасностью причинения вреда третьим лицам
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне қызметі үшінші тұлғаларға зиян келтіру қаупімен байланысты объектілер иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/52511/rus
