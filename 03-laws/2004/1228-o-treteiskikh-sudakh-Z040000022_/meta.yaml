  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам иммунитета государства и его собственности, совершенствования деятельности третейских судов и международного коммерческого арбитража
    kaz: Қазақстан Республикасының кейбiр заңнамалық актiлерiне мемлекеттiң және оның меншiгiнiң иммунитетi, аралық соттар және халықаралық коммерциялық төрелік қызметiн жетiлдiру мәселелерi бойынша өзгерістер мен толықтырулар енгiзу туралы
