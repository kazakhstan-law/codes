  requisite: Закон Республики Казахстан от 8 июля 2024 года № 116-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам игорного бизнеса, лотерейной деятельности, охраны здоровья, государственной инспекции труда, государственного контроля и исключения излишней законодательной регламентации
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне ойын бизнесі, лотерея қызметі, денсаулық сақтау, мемлекеттік еңбек инспекциясы, мемлекеттік бақылау және артық заңнамалық регламенттеуді болғызбау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198640/rus
