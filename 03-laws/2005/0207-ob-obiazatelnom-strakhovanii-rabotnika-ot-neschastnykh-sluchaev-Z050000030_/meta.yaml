  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам стимулирования инноваций, развития цифровизации, информационной безопасности и образования
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне инновацияларды ынталандыру, цифрландыруды, ақпараттық қауіпсіздікті дамыту және білім беру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
