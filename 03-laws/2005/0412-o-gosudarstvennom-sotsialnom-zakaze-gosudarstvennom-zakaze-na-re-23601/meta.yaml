act_code: '23601'
requisite: Закон Республики Казахстан от 12 апреля 2005 года № 36
title:
  rus: О государственном социальном заказе, государственном заказе на реализацию стратегического партнерства, грантах и премиях для неправительственных организаций в Республике Казахстан
  kaz: Қазақстан Республикасындағы мемлекеттік әлеуметтік тапсырыс, стратегиялық әріптестікті іске асыруға арналған мемлекеттік тапсырыс, үкіметтік емес ұйымдарға арналған гранттар және сыйлықақылар туралы
