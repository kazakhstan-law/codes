  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам передачи функций центральных и (или) местных исполнительных органов Республики Казахстан в конкурентную среду
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне Қазақстан Республикасы орталық және (немесе) жергілікті атқарушы органдарының функцияларын бәсекелес ортаға беру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
