  requisite: Закон Республики Казахстан от 16 июля 2025 года № 211-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам военно-патриотического воспитания, воинской службы и перераспределения функций отдельных центральных государственных органов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне әскери-патриоттық тәрбие, әскери қызмет және жекелеген орталық мемлекеттік органдардың функцияларын қайта бөлу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
