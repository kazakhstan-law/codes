  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам неработающих кредитов и активов банков второго уровня, оказания финансовых услуг и деятельности финансовых организаций и Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне екінші деңгейдегі банктердің жұмыс істемейтін кредиттері мен активтері, қаржылық қызметтер көрсету және қаржы ұйымдары мен Қазақстан Республикасы Ұлттық Банкінің қызметі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
