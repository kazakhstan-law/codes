  requisite: Закон Республики Казахстан от 12 июня 2025 года № 194-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам аквакультуры, агропромышленного комплекса, электроэнергетики и перераспределения функций отдельных центральных государственных органов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне аквашаруашылық, агроөнеркәсіптік кешен, электр энергетикасы және жекелеген орталық мемлекеттік органдардың функцияларын қайта бөлу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
