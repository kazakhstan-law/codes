act_code: '25653'
requisite: Закон Республики Казахстан от 21 октября 2005 года № 82
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о создании на космодроме "Байконур" космического ракетного комплекса "Байтерек"
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы "Байқоңыр" ғарыш айлағында "Бәйтерек" ғарыш зымыран кешенін құру туралы келісімді бекіту туралы
