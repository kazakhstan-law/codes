  title:
    rus: О ратификации Протокола о внесении изменений в Соглашение между Правительством Республики Казахстан и Правительством Российской Федерации о создании на космодроме «Байконур» космического ракетного комплекса «Байтерек» от 22 декабря 2004 года
    kaz: 2004 жылғы 22 желтоқсандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы «Байқоңыр» ғарыш айлағында «Бәйтерек» ғарыш зымыран кешенiн құру туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
