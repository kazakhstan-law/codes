  code: '160563'
  requisite: Закон Республики Казахстан от 23 ноября 2021 года № 74-VII ЗРК
  title:
    rus: О ратификации Протокола о внесении изменений и дополнений в Соглашение между Правительством Республики Казахстан и Правительством Российской Федерации о создании на космодроме «Байконур» космического ракетного комплекса «Байтерек» от 22 декабря 2004 года
    kaz: 2004 жылғы 22 желтоқсандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы «Байқоңыр» ғарыш айлағында «Бәйтерек» ғарыш зымыран кешенін құру туралы келісімге өзгерістер мен толықтырулар енгізу туралы хаттаманы ратификациялау туралы
