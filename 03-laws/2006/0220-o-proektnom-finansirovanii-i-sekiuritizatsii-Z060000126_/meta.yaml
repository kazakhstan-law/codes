  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам минимизации рисков при кредитовании, защиты прав заемщиков, совершенствования регулирования финансового рынка и исполнительного производства
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне кредит беру кезінде тәуекелдерді барынша азайту, қарыз алушылардың құқықтарын қорғау, қаржы нарығын реттеуді және атқарушылық іс жүргізуді жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
