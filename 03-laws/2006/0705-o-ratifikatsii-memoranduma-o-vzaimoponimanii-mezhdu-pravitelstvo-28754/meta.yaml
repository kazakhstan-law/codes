title:
  rus: О ратификации Меморандума о взаимопонимании между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки по Казахстанско-Американской программе по экономическому развитию
  kaz: Қазақстан Республикасының Үкіметі және Америка Құрама Штаттарының Үкіметі арасындағы Экономикалық даму жөніндегі Қазақстан-Американ бағдарламасы бойынша өзара түсіністік туралы меморандумды ратификациялау туралы
