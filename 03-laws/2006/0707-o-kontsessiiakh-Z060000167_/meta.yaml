  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам разграничения компетенции уполномоченных органов по государственному и бюджетному планированию и совершенствования бюджетного процесса
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне уәкілетті органдардың мемлекеттік және бюджеттік жоспарлау жөніндегі құзыретінің аражігін ажырату және бюджет процесін жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
