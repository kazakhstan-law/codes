title:
  rus: Об обязательном гарантировании депозитов, размещенных в банках второго уровня Республики Казахстан
  kaz: Қазақстан Республикасының екiншi деңгейдегі банктерiнде орналастырылған депозиттерге мiндеттi кепiлдiк беру туралы
