  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам организации и деятельности исламских банков и организации исламского финансирования
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне ислам банктерін ұйымдастыру мен олардың қызметі және исламдық қаржыландыруды ұйымдастыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
