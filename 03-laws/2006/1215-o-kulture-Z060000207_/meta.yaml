  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам обеспечения безопасности при проведении спортивных и спортивно-массовых, зрелищных культурно-массовых мероприятий
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне спорттық және спорттық-бұқаралық, ойын-сауық мәдени-бұқаралық іс-шаралар өткізу кезінде қауіпсіздікті қамтамасыз ету мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
