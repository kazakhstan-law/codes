  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам совершенствования правоохранительной службы, жилищного обеспечения и социальной защиты сотрудников правоохранительных, специальных государственных органов, органов гражданской защиты и военнослужащих, а также исключения излишней законодательной регламентации в сфере деятельности органов внутренних дел
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне құқық қорғау қызметін жетілдіру, құқық қорғау органдарының, арнаулы мемлекеттік органдардың, азаматтық қорғау органдарының қызметкерлерін және әскери қызметшілерді тұрғын үймен қамтамасыз ету және әлеуметтік қорғау, сондай-ақ ішкі істер органдарының қызметі саласында артық заңнамалық регламенттеуді болғызбау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
