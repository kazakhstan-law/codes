  requisite: Закон Республики Казахстан от 23 декабря 2023 года № 50-VIII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам Государственной корпорации «Правительство для граждан», международного технологического парка «Астана Хаб» и дактилоскопической регистрации
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне «Азаматтарға арналған үкімет» мемлекеттік корпорациясы, «Астана Хаб» халықаралық технологиялық паркі және дактилоскопиялық тіркеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/190597/rus
