  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 177 "Об утверждении Инструкции по формированию и ведению базы данных по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру жөніндегі деректер базасын қалыптастыру және жүргізу жөніндегі Нұсқаулықты бекіту туралы" 2007 жылғы 25 маусымдағы № 177 қаулысына өзгерістер мен толықтырулар енгізу туралы
