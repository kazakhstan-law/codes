  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам совершенствования гражданского, банковского законодательства и улучшения условий для предпринимательской деятельности
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне азаматтық, банктік заңнаманы жетілдіру және кәсіпкерлік қызмет үшін жағдайды жақсарту мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
