  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам цифровизации, транспорта и предпринимательства
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне цифрландыру, көлік және кәсіпкерлік мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
