act_code: '46327'
requisite: Закон Республики Казахстан от 2 июня 2009 года № 161-IV
title:
  rus: О ратификации Поправки к Соглашению между Республикой Казахстан и Соединенными Штатами Америки относительно уничтожения шахтных пусковых установок межконтинентальных баллистических ракет, ликвидации последствий аварийных ситуаций и предотвращения распространения ядерного оружия
  kaz: Қазақстан Республикасы мен Америка Құрама Штаттарының арасындағы континентаралық баллистикалық ракеталардың шахталық ұшыру қондырғыларын, апатты жағдайлардың салдарын жоюға және ядролық қарудың таралуына жол бермеуге қатысты келісімге Түзетуді ратификациялау туралы
