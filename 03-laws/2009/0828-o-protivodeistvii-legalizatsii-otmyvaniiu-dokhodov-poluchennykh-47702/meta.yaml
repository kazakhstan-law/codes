  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам противодействия легализации (отмыванию) доходов, полученных незаконным путем, и финансированию терроризма и обналичивания денег
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне заңсыз жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға және ақшаны қолма-қол ақшаға айналдыруға қарсы іс-қимыл мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
