  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам совершенствования порядка прохождения правоохранительной службы, повышения правовой и социальной защищенности и ответственности сотрудников правоохранительных, специальных государственных органов и военнослужащих, межведомственной координации, самостоятельности органов внутренних дел, усиления ответственности за отдельные уголовные правонарушения и оборота оружия
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне құқық қорғау қызметін өткеру тәртібін жетілдіру, құқық қорғау органдары, арнаулы мемлекеттік органдар қызметкерлерінің және әскери қызметшілердің құқықтық және әлеуметтік қорғалуы мен жауаптылығын арттыру, ведомствоаралық үйлестіру, ішкі істер органдарының дербестігі, жекелеген қылмыстық құқық бұзушылықтар үшін жауаптылықты күшейту және қару айналымы мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/169758/rus
