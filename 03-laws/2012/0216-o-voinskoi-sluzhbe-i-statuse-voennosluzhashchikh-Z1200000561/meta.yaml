  requisite: Закон Республики Казахстан от 15 апреля 2022 года № 114-VII ЗРК
  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам воинской службы и жилищных отношений сотрудников специальных государственных органов и военнослужащих
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне әскери қызмет және арнаулы мемлекеттік органдар қызметкерлері мен әскери қызметшілердің тұрғын үй қатынастары мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
