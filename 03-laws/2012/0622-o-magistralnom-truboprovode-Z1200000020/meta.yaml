  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам лесного хозяйства, особо охраняемых природных территорий и гарантирования обязательств субъектов частного предпринимательства
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне орман шаруашылығы, ерекше қорғалатын табиғи аумақтар және жеке кәсіпкерлік субъектілерінің міндеттемелеріне кепілдік беру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
