  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам валютного регулирования и валютного контроля, риск-ориентированного надзора за деятельностью финансовых организаций, защиты прав потребителей финансовых услуг и совершенствования деятельности Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне валюталық реттеу және валюталық бақылау, қаржы ұйымдарының қызметін тәуекелге бағдарланған қадағалау, қаржылық қызметтерді тұтынушылардың құқықтарын қорғау және Қазақстан Республикасы Ұлттық Банкінің қызметін жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
