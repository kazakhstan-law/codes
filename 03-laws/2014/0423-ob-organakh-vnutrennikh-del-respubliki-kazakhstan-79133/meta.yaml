  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам промышленной безопасности, индустриальных зон, животного мира, особо охраняемых природных территорий, энергетики, естественных монополий и жилищных выплат сотрудникам органов внутренних дел
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне өнеркәсіптік қауіпсіздік, индустриялық аймақтар, жануарлар дүниесі, ерекше қорғалатын табиғи аумақтар, энергетика, табиғи монополиялар және ішкі істер органдары қызметкерлеріне тұрғын үй төлемдері мәселелері бойынша өзгерістер мен толықтырулар  енгізу туралы
