  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам электроэнергетики, энергосбережения и повышения энергоэффективности, недропользования, местного государственного управления, государственной границы, жилищно-коммунального хозяйства и науки
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне электр энергетикасы, энергия үнемдеу және энергия тиімділігін арттыру, жер қойнауын пайдалану, жергілікті мемлекеттік басқару, мемлекеттік шекара, тұрғын үй-коммуналдық шаруашылық және ғылым мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
