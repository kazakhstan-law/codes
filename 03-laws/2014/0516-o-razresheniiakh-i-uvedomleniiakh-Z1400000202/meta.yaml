  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам организации движения отдельных видов транспортных средств и цифровизации дорожной безопасности
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне жекелеген көлік құралдары түрлерінің жүруін ұйымдастыру және жол қауіпсіздігін цифрландыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201335/rus
