title:
  rus: Об амнистии граждан Республики Казахстан, оралманов и лиц, имеющих вид на жительство в Республике Казахстан, в связи с легализацией ими имущества
  kaz: Қазақстан Республикасының азаматтарына, оралмандарға және Қазақстан Республикасында тұруға ықтиярхаты бар адамдарға олардың мүлікті жария етуіне байланысты рақымшылық жасау туралы
