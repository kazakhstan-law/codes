  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам амнистии граждан Республики Казахстан, оралманов и лиц, имеющих вид на жительство в Республике Казахстан, в связи с легализацией ими имущества
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне Қазақстан Республикасының азаматтарына, оралмандарға және Қазақстан Республикасында тұруға ықтиярхаты бар адамдарға олардың мүлікті жария етуіне байланысты рақымшылық жасау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
