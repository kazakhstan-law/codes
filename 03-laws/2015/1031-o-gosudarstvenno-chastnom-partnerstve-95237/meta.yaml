  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам государственных закупок, закупок недропользователей и субъектов естественных монополий, связи, автомобильного транспорта, обороны и финансирования науки
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне мемлекеттік сатып алу, жер қойнауын пайдаланушылар мен табиғи монополиялар субъектілерінің сатып алуы, байланыс, автомобиль көлігі, қорғаныс және ғылымды қаржыландыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
