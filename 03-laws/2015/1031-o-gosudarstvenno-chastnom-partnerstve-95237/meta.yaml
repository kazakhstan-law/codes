  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам ипотечных займов в иностранной валюте, совершенствования регулирования субъектов рынка платежных услуг, всеобщего декларирования и восстановления экономического роста
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне шетел валютасындағы ипотекалық қарыздар, көрсетілетін төлем қызметтері нарығының субъектілерін реттеуді жетілдіру, жалпыға бірдей декларациялау және экономикалық өсуді қалпына келтіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
