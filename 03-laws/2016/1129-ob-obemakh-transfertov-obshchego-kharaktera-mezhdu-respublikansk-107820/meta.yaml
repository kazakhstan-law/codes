title:
  rus: Об объемах трансфертов общего характера между республиканским и областными бюджетами, бюджетами городов республиканского значения, столицы на 2017 – 2019 годы
  kaz: Республикалық және облыстық бюджеттер, республикалық маңызы бар қалалар, Астана бюджеттері арасындағы 2017 - 2019 жылдарға арналған жалпы сипаттағы трансферттердің көлемі туралы
