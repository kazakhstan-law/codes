  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам административно-территориального устройства Республики Казахстан, совершенствования системы государственного управления, межбюджетных отношений, кредитования и образования
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне Қазақстан Республикасының әкімшілік-аумақтық құрылысы, мемлекеттік басқару жүйесін, бюджетаралық қатынастарды жетілдіру, кредиттеу және білім беру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
