  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам усиления борьбы с рейдерством, защиты предпринимательской деятельности от незаконного вмешательства государственных органов и должностных лиц и усиления мер, препятствующих нелегальному обороту драгоценных металлов
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне рейдерлікке қарсы күресті күшейту, кәсіпкерлік қызметті мемлекеттік органдар мен лауазымды адамдардың заңсыз араласуынан қорғау және бағалы металдардың заңсыз айналымына кедергі келтіретін шараларды күшейту мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
