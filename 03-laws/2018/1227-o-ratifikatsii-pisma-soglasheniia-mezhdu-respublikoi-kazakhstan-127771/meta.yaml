act_code: '127771'
requisite: Закон Республики Казахстан от 27 декабря 2018 года № 206-VІ ЗРК
title:
  rus: 'О ратификации Письма-соглашения между Республикой Казахстан и Международным Банком Реконструкции и Развития относительно поправок к Соглашению о займе № 8156-KZ (Проект развития автомобильных дорог Восток – Запад (участок Алматы – Хоргос): Международный транзитный коридор Западная Европа – Западный Китай (ЦАРЭС 1b) между Республикой Казахстан и Международным Банком Реконструкции и Развития'
  kaz: 'Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкi арасындағы № 8156-KZ Қарыз туралы келiсiмге (Шығыс – Батыс автомобиль жолдарын дамыту жобасы (Алматы – Қорғас учаскесі): Батыс Еуропа – Батыс Қытай халықаралық транзит дәлізі (ОАӨЭЫ 1b) түзетулерге қатысты Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкi арасындағы келісім-хатты ратификациялау туралы'
