title:
  rus: О ратификации Соглашения государств – участников Содружества Независимых Государств о сотрудничестве в материально-техническом обеспечении компетентных органов, осуществляющих борьбу с терроризмом и иными насильственными проявлениями экстремизма
  kaz: Тәуелсіз Мемлекеттер Достастығына қатысушы мемлекеттердің терроризмге және экстремизмнің өзге де зорлық-зомбылық көріністеріне қарсы күресті жүзеге асыратын құзыретті органдарды материалдық-техникалық қамтамасыз етудегі ынтымақтастығы туралы келісімді ратификациялау туралы
