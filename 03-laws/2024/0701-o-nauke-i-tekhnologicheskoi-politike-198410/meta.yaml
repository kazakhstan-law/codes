  title:
    rus: О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам деятельности фондов целевого капитала и эндаумент-фондов (целевых капиталов), а также экологически неблагополучных территорий казахстанской части Приаралья
    kaz: Қазақстан Республикасының кейбір заңнамалық актілеріне нысаналы капитал қорларының және эндаумент-қорлардың (нысаналы капиталдардың) қызметі, сондай-ақ Арал маңының қазақстандық бөлігінің экологиялық қолайсыз аумағы мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
