  requisite: Нормативное постановление Верховного Суда Республики Казахстан от 10 апреля 2015 года № 2
  title:
    rus: О внесении изменений и дополнений в нормативное постановление Верховного Суда Республики Казахстан от 18 июля 1997 года № 9 «О практике применения законодательства по приватизации гражданами жилых помещений» и признании утратившими силу некоторых постановлений Пленума Верховного Суда Республики Казахстан, нормативных постановлений Верховного Суда Республики Казахстан»
    kaz: «Азаматтардың тұрғын үй-жайларды жекешелендіру жөніндегі заңдарды соттардың қолдану тәжірибесі туралы» Қазақстан Республикасы Жоғарғы Сотының 1997 жылғы 18 шілдедегі № 9 нормативтік қаулысына өзгерістер мен толықтырулар енгізу туралы және Қазақстан Республикасы Жоғарғы Соты Пленумының кейбір қаулыларының, Қазақстан Республикасы Жоғарғы Сотының кейбір нормативтік қаулыларының күші жойылды деп тану туралы»
