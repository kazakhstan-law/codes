title:
  rus: О некоторых вопросах применения судами законодательства об ответственности за бандитизм и другие уголовные правонарушения, совершенные в соучастии
  kaz: Соттардың бандитизм және қылмыстық құқық бұзушылықтарға қатыса отырып, басқа қылмыстық құқық бұзушылықтар жасағаны үшін жауапкершілік туралы заңнаманы қолдануының кейбір мәселелері туралы
