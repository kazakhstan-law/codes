  title:
    rus: О внесении изменений и дополнений в нормативное постановление Верховного Суда Республики Казахстан от 13 декабря 2001 года № 21 «О подготовке гражданских дел к судебному разбирательству» и признании утратившими силу некоторых нормативных постановлений Верховного Суда Республики Казахстан, постановлений Пленумов Верховного Суда Казахской ССР и Республики Казахстан
    kaz: «Азаматтық істерді соттың қарауына әзірлеу туралы» Қазақстан Республикасы Жоғарғы Сотының 2001 жылғы 13 желтоқсандағы № 21 нормативтік қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Жоғарғы Сотының кейбір нормативтік қаулыларының, Қазақ КСР және Қазақстан Республикасы Жоғарғы Соты Пленумдары қаулыларының күші жойылды деп тану туралы
