title:
  rus: Об официальном толковании статьи 54, подпунктов 1) и 3) пункта 3 статьи 61, а также ряда других норм Конституции Республики Казахстан по вопросам организации государственного управления
  kaz: Қазақстан Республикасы Конституциясының 54-бабын, 61-бабы 3-тармағының 1) және 3) тармақшаларын, сондай-ақ мемлекеттік басқаруды ұйымдастыру мәселелері бойынша басқа да бірқатар нормаларын ресми түсіндіру туралы
