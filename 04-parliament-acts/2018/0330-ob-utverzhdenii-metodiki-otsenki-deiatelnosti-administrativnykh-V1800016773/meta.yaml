  title:
    rus: О внесении изменений в нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 30 марта 2018 года № 9-НҚ «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Счетного комитета по контролю за исполнением республиканского бюджета»
    kaz: «Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2018 жылғы 30 наурыздағы № 9-НҚ нормативтік қаулысына өзгерістер енгізу туралы
