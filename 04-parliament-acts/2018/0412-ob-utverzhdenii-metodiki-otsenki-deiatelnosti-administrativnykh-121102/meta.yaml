requisite: Нормативное постановление Ревизионной комиссии по Жамбылской области от 12 апреля 2018 года № 1-НҚ. Зарегистрировано Департаментом юстиции Жамбылской области 17 апреля 2018 года № 3790. Утратило силу постановлением ревизионной комиссии по Жамбылской области от 17 апреля 2023 года № 1-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
