  title:
    rus: О признании утратившим силу постановление ревизионной комиссии по Жамбылской области от 12 апреля 2018 года № 1-НҚ «Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" Ревизионной комиссии по Жамбылской области»
    kaz: «Жамбыл облысы бойынша тексеру комиссиясының "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Жамбыл облысы бойынша тексеру комиссиясының 2018 жылғы 12 сәуірдегі № 1-НҚ қаулысының күші жойылды деп тану туралы
