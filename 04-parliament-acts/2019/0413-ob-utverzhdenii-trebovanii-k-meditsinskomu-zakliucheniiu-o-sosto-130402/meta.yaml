  kaz: Қазақстан Республикасының Президенттігіне кандидаттың денсаулығының жай-күйі туралы медициналық қорытындыға қойылатын талаптарды және Қазақстан Республикасының Президенттігіне кандидат ретінде тіркеуге кедергі келтіретін аурулардың тізбесін бекіту туралы
