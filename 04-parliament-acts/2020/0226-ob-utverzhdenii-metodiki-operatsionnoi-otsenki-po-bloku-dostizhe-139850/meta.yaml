  title:
    rus: О внесении изменений и дополнений в совместное нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 26 февраля 2020 года № 1-НҚ и приказ Первого заместителя Премьер-Министра Республики Казахстан-Министра финансов Республики Казахстан от 26 февраля 2020 года № 201 «Об утверждении Методики операционной оценки по блоку достижения целей»
    kaz: «Мақсаттарға қол жеткізу блогы бойынша операциялық бағалау әдістемесін бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2020 жылғы 26 ақпандағы № 1-НҚ және Қазақстан Республикасы Премьер-Министрінің бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2020 жылғы 26 ақпандағы № 201 бірлескен нормативтік қаулысы мен бұйрығына өзгерістер мен толықтырулар енгізу туралы
