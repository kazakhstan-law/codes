    kaz: «Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің «Б» корпусының мемлекеттік әкiмшiлiк лауазымдарына қойылатын біліктілік талаптарын бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2020 жылғы 21 қазандағы № 8-НҚ нормативтік қаулысының күші жойылды деп тану туралы
