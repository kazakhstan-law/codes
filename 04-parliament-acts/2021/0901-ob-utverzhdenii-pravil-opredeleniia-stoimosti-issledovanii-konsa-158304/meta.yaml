act_code: '158304'
requisite: Нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 1 сентября 2021 года № 10-НҚ. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2021 года № 24213. Утратил силу нормативным постановлением Высшей аудиторской палаты Республики Казахстан от 29 мая 2025 года № 5-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
