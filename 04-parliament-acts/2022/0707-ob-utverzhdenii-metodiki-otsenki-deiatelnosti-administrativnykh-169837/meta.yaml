  title:
    rus: О внесении изменения в нормативное постановление Ревизионной комиссии по Западно-Казахстанской области от 7 июля 2022 года №2-НҚ «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Ревизионная комиссия по Западно-Казахстанской области»
    kaz: «Батыс Қазақстан облысы бойынша тексеру комиссиясы» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілердің қызметін бағалаудың әдістемесін бекіту туралы» Батыс Қазақстан облысы бойынша тексеру комиссиясының 2022 жылғы 7 шілдедегі №2-НҚ нормативтік қаулысына өзгеріс енгізу туралы
