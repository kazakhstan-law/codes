title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан части второй статьи 811, части первой статьи 852 и подпункта 2) части третьей статьи 855 Кодекса Республики Казахстан об административных правонарушениях от 5 июля 2014 года
