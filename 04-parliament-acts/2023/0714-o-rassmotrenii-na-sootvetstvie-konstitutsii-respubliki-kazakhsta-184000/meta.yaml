act_code: '184000'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 14 июля 2023 года № 21-НП
title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан пункта 1) части второй статьи 484 Уголовно-процессуального кодекса Республики Казахстан от 4 июля 2014 года и абзаца третьего пункта 2 нормативного постановления Верховного Суда Республики Казахстан от 10 марта 2022 года № 2 «О применении законодательства, регламентирующего рассмотрение уголовных дел в кассационном порядке»
  kaz: 2014 жылғы 4 шілдедегі Қазақстан Республикасы Қылмыстық-процестік кодексінің 484-бабы екінші бөлігі 1) тармағының және Қазақстан Республикасы Жоғарғы Сотының «Қылмыстық істерді кассациялық тәртіппен қарауды регламенттейтін заңнаманы қолдану туралы» 2022 жылғы 10 наурыздағы № 2 нормативтік қаулысының 2-тармағы үшінші абзацының Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы
