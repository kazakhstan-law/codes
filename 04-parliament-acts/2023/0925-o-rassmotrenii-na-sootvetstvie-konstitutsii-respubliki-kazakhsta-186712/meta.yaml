title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан статьи 13 Закона Республики Казахстан от 18 декабря 1992 года «О социальной защите граждан, пострадавших вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне»
  kaz: «Семей ядролық сынақ полигонындағы ядролық сынақтардың салдарынан зардап шеккен азаматтарды әлеуметтік қорғау туралы» 1992 жылғы 18 желтоқсандағы Қазақстан Республикасы Заңының 13-бабының Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы
