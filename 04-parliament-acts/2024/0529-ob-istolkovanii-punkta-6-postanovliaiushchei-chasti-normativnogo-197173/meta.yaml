act_code: '197173'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 29 мая 2024 года № 45-НП
title:
  rus: Об истолковании пункта 6 постановляющей части нормативного постановления Конституционного Совета Республики Казахстан от 6 марта 1997 года № 3 «Об официальном толковании пункта 1 статьи 4, пункта 1 статьи 14, подпункта 3) пункта 3 статьи 77, пункта 1 статьи 79 и пункта 1 статьи 83 Конституции Республики Казахстан»
  kaz: Қазақстан Республикасы Конституциялық Сотының «Қазақстан Республикасы Конституциялық Кеңесiнiң «Қазақстан Республикасы Конституциясы 4-бабының 1-тармағын, 14-бабының 1-тармағын, 77-бабы 3-тармағының 3) тармақшасын, 79-бабының 1-тармағын және 83-бабының 1-тармағын ресми түсiндiру туралы» 1997 жылғы 6 наурыздағы № 3 нормативтік қаулысының қарар бөлігінің 6-тармағына түсіндірме беру туралы
