act_code: '198279'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 28 июня 2024 года № 46-НП
title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан подпункта 11) пункта 1 Перечня видов заработной платы и (или) иного дохода, из которых производится удержание алиментов на содержание несовершеннолетних детей, утвержденного приказом Министра юстиции Республики Казахстан от 24 декабря 2014 года № 372
  kaz: Қазақстан Республикасы Әділет министрінің 2014 жылғы 24 желтоқсандағы № 372 бұйрығымен бекітілген Кәмелетке толмаған балаларды асырап-бағуға алимент ұсталатын жалақы және (немесе) өзге де кіріс түрлері тізбесінің 1-тармағы 11) тармақшасының Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы
