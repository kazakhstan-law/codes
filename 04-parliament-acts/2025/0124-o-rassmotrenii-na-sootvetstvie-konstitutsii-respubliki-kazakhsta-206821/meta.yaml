act_code: '206821'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 24 января 2025 года № 62-НП
title:
  rus: «О рассмотрении на соответствие Конституции Республики Казахстан подпункта 3) пункта 5 статьи 21 Закона Республики Казахстан от 16 февраля 2012 года «О воинской службе и статусе военнослужащих», пункта 64 Правил прохождения воинской службы в Вооруженных Силах, других войсках и воинских формированиях Республики Казахстан, утвержденных Указом Президента Республики Казахстан от 25 мая 2006 года № 124, части второй пункта 26 и пункта 30 Правил выплаты денежного довольствия, пособий и прочих выплат военнослужащим Вооруженных Сил Республики Казахстан, утвержденных приказом Министра обороны Республики Казахстан от 2 июня 2017 года № 255»
  kaz: «Әскери қызмет және әскери қызметшілердің мәртебесі туралы» 2012 жылғы 16 ақпандағы Қазақстан Республикасы Заңының 21-бабы 5-тармағы 3) тармақшасының, Қазақстан Республикасы Президентінің 2006 жылғы 25 мамырдағы № 124 Жарлығымен бекітілген Қазақстан Республикасының Қарулы Күштерінде, басқа да әскерлері мен әскери құралымдарында әскери қызмет өткеру қағидаларының 64-тармағының, Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 2 маусымдағы № 255 бұйрығымен бекітілген Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілеріне ақшалай ризық, жәрдемақы мен басқа да төлем төлеу қағидаларының 26-тармағы екінші бөлігінің және 30-тармағының Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы»
