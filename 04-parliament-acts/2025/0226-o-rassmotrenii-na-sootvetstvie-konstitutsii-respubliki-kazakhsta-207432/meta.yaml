act_code: '207432'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 26 февраля 2025 года № 67-НП
title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан подпункта 5) статьи 1 и пункта 1 статьи 8 Закона Республики Казахстан от 11 октября 2011 года «О религиозной деятельности и религиозных объединениях», части третьей статьи 490 Кодекса Республики Казахстан об административных правонарушениях от 5 июля 2014 года в отношении установления административной ответственности за «осуществление миссионерской деятельности без регистрации»
  kaz: «Діни қызмет және діни бірлестіктер туралы» 2011 жылғы 11 қазандағы Қазақстан Республикасы Заңының 1-бабы 5) тармақшасының және 8-бабы 1-тармағының, «миссионерлік қызметті тіркеусіз жүзеге асырғаны» үшін әкімшілік жауаптылықты белгілеуге қатысты 2014 жылғы 5 шілдедегі Қазақстан Республикасы Әкімшілік құқық бұзушылық туралы кодексінің 490-бабы үшінші бөлігінің Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы
