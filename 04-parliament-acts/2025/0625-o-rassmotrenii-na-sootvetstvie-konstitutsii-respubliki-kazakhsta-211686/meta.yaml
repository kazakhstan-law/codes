act_code: '211686'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 25 июня 2025 года № 72-НП
title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан части третьей статьи 245 в отношении слов «преступной группой» и статьи 262 Уголовного кодекса Республики Казахстан от 3 июля 2014 года, пунктов 11 и 13 нормативного постановления Верховного Суда Республики Казахстан от 21 июня 2001 года № 2 «О некоторых вопросах применения судами законодательства об ответственности за бандитизм и другие уголовные правонарушения, совершенные в соучастии»
  kaz: 2014 жылғы 3 шілдедегі Қазақстан Республикасы Қылмыстық кодексінің 245-бабы үшінші бөлігінің «қылмыстық топ» деген сөздерге қатысты және 262-бабының, Қазақстан Республикасы Жоғарғы Сотының «Соттардың бандитизм және қылмыстық құқық бұзушылықтарға қатыса отырып, басқа қылмыстық құқық бұзушылықтар жасағаны үшін жауапкершілік туралы заңнаманы қолдануының кейбір мәселелері туралы» 2001 жылғы 21 маусымдағы № 2 нормативтік қаулысының 11 және 13-тармақтарының Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы
