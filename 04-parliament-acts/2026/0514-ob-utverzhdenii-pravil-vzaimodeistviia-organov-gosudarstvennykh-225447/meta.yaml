act_code: '225447'
requisite: Совместные нормативное постановление Высшей аудиторской палаты Республики Казахстан от 14 мая 2026 года № 4-НҚ и приказ Министра финансов Республики Казахстан от 15 мая 2026 года № 308
title:
  rus: Об утверждении Правил взаимодействия органов государственных доходов и органов внешнего государственного аудита и финансового контроля по представлению сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента), и конфиденциальной информации
  kaz: Мемлекеттік кірістер органдары мен сыртқы мемлекеттік аудит және қаржылық бақылау органдарының салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан салық төлеуші (салық агенті) туралы салықтық құпияны құрайтын мәліметтерді және құпия ақпаратты ұсыну бойынша өзара іс-қимыл қағидаларын бекіту туралы
