act_code: '225411'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 18 мая 2026 года № 79-НП
title:
  rus: О проверке конституционности пункта 1 статьи 196, пункта 2 статьи 202, подпункта 2) пункта 3 статьи 204 Социального кодекса Республики Казахстан от 20 апреля 2023 года и части пятой пункта 5 Правил исчисления (определения) размеров, назначения, осуществления, приостановления, перерасчета, возобновления, прекращения и пересмотра решения о назначении (отказе в назначении) государственной базовой пенсионной выплаты, пенсионных выплат по возрасту, утвержденных приказом Заместителя Премьер-Министра – Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 232
  kaz: 2023 жылғы 20 сәуірдегі Қазақстан Республикасы Әлеуметтік кодексінің 196-бабы 1-тармағының, 202-бабы 2-тармағының, 204-бабы 3-тармағы 2) тармақшасының және Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 22 маусымдағы № 232 бұйрығымен бекітілген Мемлекеттік базалық зейнетақы төлемінің, жасына байланысты зейнетақы төлемдерінің мөлшерін есептеу (айқындау), оларды тағайындау, жүзеге асыру, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларының 5-тармағы бесінші бөлігінің конституциялылығын тексеру туралы
