act_code: '226279'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 9 июня 2026 года № 82-НП
title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан абзаца первого пункта 9 нормативного постановления Верховного Cуда Республики Казахстан от 2 октября 2015 года № 6 «О судебной практике условно-досрочного освобождения от отбывания наказания, замены неотбытой части наказания более мягким видом наказания и сокращения срока назначенного наказания»
  kaz: Қазақстан Республикасы Жоғарғы Сотының «Жазаны өтеуден шартты түрде мерзімінен бұрын босатудың, жазаның өтелмеген бөлігін жазаның неғұрлым жеңіл түріне ауыстырудың және тағайындалған жаза мерзімін қысқартудың сот практикасы туралы» 2015 жылғы 2 қазандағы № 6 нормативтік қаулысының 9-тармағы бірінші абзацының Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы
