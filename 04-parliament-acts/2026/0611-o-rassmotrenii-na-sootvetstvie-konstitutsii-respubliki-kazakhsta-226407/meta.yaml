act_code: '226407'
requisite: Нормативное постановление Конституционного Суда Республики Казахстан от 11 июня 2026 года № 86-НП
title:
  rus: О рассмотрении на соответствие Конституции Республики Казахстан части второй пункта 1 статьи 118 Закона Республики Казахстан от 2 апреля 2010 года «Об исполнительном производстве и статусе судебных исполнителей» и абзаца третьего примечания к размерам оплаты деятельности частного судебного исполнителя, утвержденным приказом Министра юстиции Республики Казахстан от 27 июня 2023 года № 416 «Об утверждении размеров оплаты деятельности частного судебного исполнителя»
  kaz: «Атқарушылық іс жүргізу және сот орындаушыларының мәртебесі туралы» 2010 жылғы 2 сәуірдегі Қазақстан Республикасы Заңының 118-бабы 1-тармағы екінші бөлігінің және Қазақстан Республикасы Әділет министрінің «Жеке сот орындаушысының қызметіне ақы төлеу мөлшерлерін бекіту туралы» 2023 жылғы 27 маусымдағы № 416 бұйрығымен бекітілген жеке сот орындаушысының қызметіне ақы төлеу мөлшерлеріне ескертпенің үшінші абзацының Қазақстан Республикасының Конституциясына сәйкестігін қарау туралы
