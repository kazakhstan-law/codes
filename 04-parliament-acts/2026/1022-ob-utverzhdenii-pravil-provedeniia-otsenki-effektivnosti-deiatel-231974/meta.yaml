act_code: '231974'
requisite: Нормативное постановление Высшей аудиторской палаты Республики Казахстан от 22 октября 2026 года № 16-НҚ
title:
  rus: Об утверждении Правил проведения оценки эффективности деятельности государственных органов по достижению целей планов развития государственных органов и планов развития столицы, областей, городов республиканского значения и по достижению конечных результатов, предусмотренных паспортами бюджетных программ
  kaz: Мемлекеттік органдардың даму жоспарларының және астананың, облыстардың, республикалық маңызы бар қалалардың даму жоспарларының мақсаттарына қол жеткізу жөніндегі және бюджеттік бағдарламалардың паспорттарында көзделген түпкілікті нәтижелерге қол жеткізу жөніндегі мемлекеттік органдар қызметінің тиімділігіне бағалау жүргізу қағидаларын бекіту туралы
