act_code: '3830'
requisite: Указ Президента Республики Казахстан от 12 ноября 1993 года № 1400
title:
  rus: «О сроках завершения обращения на территории Республики Казахстан казначейских и банковских билетов Госбанка СССР и Банка России образца 1961–1992 годов и их обмена на национальную валюту»
  kaz: «Қазақстан Республикасының аумағында КСРО Мембанкі мен Ресей банкінің 1961 – 1992 жылдардың үлгісіндегі қазынашылық және банк билеттерінің айналысын аяқтау және оларды ұлттық валютаға айырбастау мерзімдері туралы»
