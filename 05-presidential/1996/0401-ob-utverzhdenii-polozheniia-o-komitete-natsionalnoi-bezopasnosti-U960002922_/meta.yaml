  title:
    rus: О внесении дополнений в указы Президента Республики Казахстан от 1 апреля 1996 года № 2922 «Об утверждении Положения о Комитете национальной безопасности Республики Казахстан» и от 10 декабря 1999 года № 282 «Вопросы Пограничной службы Комитета национальной безопасности Республики Казахстан»
    kaz: Қазақстан Республикасы Президентiнiң «Қазақстан Республикасының Ұлттық қауiпсiздiк комитетi туралы ереженi бекiту туралы» 1996 жылғы 1 сәуiрдегі № 2922 және «Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Шекара қызметінің мәселелері» туралы 1999 жылғы 10 желтоқсандағы № 282 жарлықтарына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/199650/rus
