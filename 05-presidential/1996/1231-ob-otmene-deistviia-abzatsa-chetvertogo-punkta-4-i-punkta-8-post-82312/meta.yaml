act_code: '82312'
requisite: Указ Президента Республики Казахстан от 31 декабря 1996 г. N 3309
title:
  rus: Об отмене действия абзаца четвертого пункта 4 и пункта 8 постановления Правительства Республики Казахстан от 5 декабря 1996 г. N 1492 "Об упрощении порядка экспорта товаров из Республики Казахстан и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан"
  kaz: '"Қазақстан Республикасынан тауарларды экспортқа шығару тәртiбiн оңайлату және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне өзгертулер мен толықтырулар енгiзу туралы" Қазақстан Республикасы Үкiметiнiң 1996 жылғы 5 желтоқсандағы N 1492 қаулысының 4 тармағының 4-шi абзацы мен 8 тармақтың күшiн жою туралы'
