title:
  rus: О серьезных недостатках в деле выполнения постановления Президента Республики Казахстан от 5 ноября 1993 года N 1394 "Об учреждении международных стипендий Президента Республики Казахстан "Болашак" для подготовки кадров за рубежом"
  kaz: '"Шетелде кадрлар даярлау үшiн Қазақстан Республикасы Президентiнiң "Болашақ" халықаралық стипендияларын белгiлеу туралы" Қазақстан Республикасы Президентiнiң 1993 жылғы 5 қарашадағы N 1394 қаулысын орындау iсiндегi елеулi кемшiлiктер туралы'
