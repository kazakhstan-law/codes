act_code: '1994'
requisite: Распоряжение акима Восточно-Казахстанской области от 21 августа 1998 года № 1-439p. Зарегистрировано управлением юстиции Восточно-Казахстанской области 31 агуста 1998 года за № 78. Утратило силу - решением акима Восточно-Казахстанской области от 24 сентября 2004 года № 100
title:
  rus: О создании областной комиссии по проверке хода подготовки материально-технической базы хлебоприемных и хлебоперерабатывающих предприятий по Восточно-Казахстанской области к приему зерна урожая 1998 года
  kaz: Шығыс Қазақстан облысы бойынша астық қабылдау және өңдеу кәсіпорындарының материалдық-техникалық базасын 1998 жылғы өнімнің астығын қабылдауға әзірлеу барысын тексеру жөнінде облыстық комиссия құру туралы
