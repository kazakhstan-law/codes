title:
  rus: Об утверждении Положения о порядке подготовки, согласования, представления на подпись актов, проведения мониторинга нормативных правовых указов Президента Республики Казахстан и контроля за исполнением актов и поручений Президента Республики
  kaz: Қазақстан Республикасы Президентiнiң актiлерiн дайындау, келiсу, қол қоюға ұсыну, нормативтік құқықтық жарлықтарына мониторинг жүргізу және Республика Президентiнiң актiлерi мен тапсырмаларының орындалуын бақылау тәртiбi туралы ереженi бекiту туралы
