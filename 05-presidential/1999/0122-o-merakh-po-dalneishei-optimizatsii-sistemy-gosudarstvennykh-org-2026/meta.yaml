  requisite: Указ Президента Республики Казахстан от 20 октября 2011 года № 165
  title:
    rus: О внесении изменений и дополнения в указы Президента Республики Казахстан от 22 января 1999 года № 29 "О мерах по дальнейшей оптимизации системы государственных органов Республики Казахстан" и от 27 сентября 2010 года № 1072 "О мерах по оптимизации штатной численности органов, содержащихся за счет государственного бюджета и сметы (бюджета) Национального Банка Республики Казахстан"
    kaz: '"Қазақстан Республикасының мемлекеттік органдары жүйесін одан әрі оңтайландыру жөніндегі шаралар туралы" Қазақстан Республикасы Президентінің 1999 жылғы 22 қаңтардағы № 29 және "Қазақстан Республикасының мемлекеттік бюджеті және Ұлттық Банкінің сметасы (бюджеті) есебінен қамтылған органдардың штат санын онтайландыру жөніндегі шаралар туралы" 2010 жылғы 27 қыркүйектегі № 1072 жарлықтарына өзгерістер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/61131/rus
