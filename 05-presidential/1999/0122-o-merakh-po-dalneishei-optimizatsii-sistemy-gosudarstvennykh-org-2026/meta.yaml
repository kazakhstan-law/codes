  title:
    rus: О внесении изменений и дополнений в указы Президента Республики Казахстан от 22 января 1999 года № 29 «О мерах по дальнейшей оптимизации системы государственных органов Республики Казахстан» и от 23 декабря 2015 года № 137 «О мерах по совершенствованию деятельности Высшего Судебного Совета Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасының мемлекеттік органдары жүйесін одан әрі оңтайландыру жөніндегі шаралар туралы» 1999 жылғы 22 қаңтардағы № 29 және «Қазақстан Республикасы Жоғары Сот Кеңесінің қызметін жетілдіру шаралары туралы» 2015 жылғы 23 желтоқсандағы № 137 жарлықтарына өзгерістер мен толықтырулар енгізу туралы
