  title:
    rus: О внесении изменений и дополнений в некоторые указы Президента Республики Казахстан и признании утратившим силу Указа Президента Республики Казахстан от 28 марта 1996 года № 2920 «Об обеспечении деятельности Председателя и членов Конституционного Совета Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің кейбір жарлықтарына өзгерістер мен толықтырулар енгізу және «Қазақстан Республикасы Конституциялық Кеңесінің Төрағасы мен мүшелерінің қызметін қамтамасыз ету туралы» Қазақстан Республикасы Президентінің 1996 жылғы 28 наурыздағы № 2920 Жарлығының күші жойылды деп тану туралы
