    rus: О внесении изменений в Указ Президента Республики Казахстан от 24 марта 1999 года N 89 "О штатной численности, структуре Администрации Президента Республики Казахстан и перечне должностных лиц, обеспечивающих деятельность Президента Республики Казахстан"
    kaz: '"Қазақстан Республикасы Президенті Әкімшілігінің құрылымы, штат саны және Қазақстан Республикасы Президентінің қызметін қамтамасыз ететін органдар мен лауазымды адамдардың тізбесі туралы" Қазақстан Республикасы Президентінің 1999 жылғы 24 наурыздағы N 89 Жарлығына өзгерістер енгізу туралы'
