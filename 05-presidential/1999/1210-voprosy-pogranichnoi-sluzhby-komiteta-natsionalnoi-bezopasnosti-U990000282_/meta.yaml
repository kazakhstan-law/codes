  title:
    rus: О признании утратившими силу некоторых указов Президента Республики Казахстан и внесении изменений в Указ Президента Республики Казахстан от 10 декабря 1999 года № 282 "Вопросы Пограничной службы Комитета национальной безопасности Республики Казахстан"
    kaz: Қазақстан Республикасы Президентінің кейбір жарлықтарының күші жойылды деп тану және "Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Шекара қызметінің мәселелері" туралы Қазақстан Республикасы Президентінің 1999 жылғы 10 желтоқсандағы № 282 Жарлығына өзгерістер енгізу туралы
