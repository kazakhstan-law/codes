  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 29 декабря 1999 года № 319 "Об утверждении текста присяги административного государственного служащего и порядка принесения присяги административными государственными служащими" и от 13 апреля 2000 года № 372 "Об утверждении текста Присяги политического государственного служащего Республики Казахстан и Порядка принесения Присяги политическими государственными служащими Республики Казахстан"
    kaz: '"Мемлекеттік әкімшілік қызметші антының мәтінін және Мемлекеттік әкімшілік қызметшілердің ант беру тәртібін бекіту туралы" Қазақстан Республикасы Президентінің 1999 жылғы 29 желтоқсандағы № 319 және "Қазақстан Республикасының мемлекеттік саяси қызметшілері антының мәтінін және Қазақстан Республикасы мемлекеттік саяси қызметшілерінің ант беру тәртібін бекіту туралы" Қазақстан Республикасы Президентінің 2000 жылғы 13 сәуірдегі № 372 жарлықтарына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/73650/rus
