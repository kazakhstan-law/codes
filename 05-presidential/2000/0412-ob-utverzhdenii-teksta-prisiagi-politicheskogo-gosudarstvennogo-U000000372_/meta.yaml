  rus: Об утверждении текста присяги политического государственного служащего Республики Казахстан и Правил принесения присяги политическими государственными служащими Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік саяси қызметшісі антының мәтінін және Қазақстан Республикасы мемлекеттік саяси қызметшілерінің ант беру қағидаларын бекіту туралы
