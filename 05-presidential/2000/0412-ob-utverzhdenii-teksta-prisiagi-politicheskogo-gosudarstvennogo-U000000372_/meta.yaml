  title:
    rus: О дисциплинарных советах Агентства Республики Казахстан по делам государственной службы и противодействию коррупции в городах Астане и Алматы, областях и внесении изменений и дополнений в некоторые указы Президента Республики Казахстан
    kaz: Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққы қарсы іс-қимыл агенттігінің Астана және Алматы қалаларындағы, облыстардағы тәртіптік кеңестері және Қазақстан Республикасы Президентінің кейбiр жарлықтарына өзгерістер мен толықтырулар енгізу туралы
