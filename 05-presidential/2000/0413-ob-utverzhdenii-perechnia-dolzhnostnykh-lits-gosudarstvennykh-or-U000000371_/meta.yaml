  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 13 апреля 2000 года № 371 "Об утверждении Перечня должностных лиц государственных органов, наделенных полномочиями по отнесению сведений к государственным секретам Республики Казахстан" и от 19 марта 2010 года № 954 "О Системе ежегодной оценки эффективности деятельности центральных государственных и местных исполнительных органов областей, города республиканского значения, столицы"
    kaz: Қазақстан Республикасы Президентінің "Мемлекеттік органдардың мәліметтерді Қазақстан Республикасының мемлекеттік құпияларына жатқызу жөніндегі өкілеттіктер берілген лауазымды тұлғаларының тізбесін бекіту туралы" 2000 жылғы 13 сәуірдегі № 371 және "Орталық мемлекеттік органдар мен облыстардың, республикалық маңызы бар қаланың, астананың жергілікті атқарушы органдары қызметінің тиімділігін жыл сайынғы бағалау жүйесі туралы" 2010 жылғы 19 наурыздағы № 954 жарлықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/63556/rus
