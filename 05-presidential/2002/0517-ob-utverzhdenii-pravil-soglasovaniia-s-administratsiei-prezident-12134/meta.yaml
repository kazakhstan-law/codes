caused_by:
  code: '178683'
  requisite: Указ Президента Республики Казахстан от 15 февраля 2023 года № 127
  title:
    rus: О внесении изменений и дополнения в указы Президента Республики Казахстан от 2 июля 1996 года № 3051 «Об утверждении Положения о порядке представления на подпись и рассмотрения Президентом Республики Казахстан законов Республики Казахстан, их регистрации, обнародования и хранения» и от 17 мая 2002 года № 873 «Об утверждении Правил согласования с Президентом Республики Казахстан планов законопроектных работ Правительства Республики Казахстан и с Администрацией Президента Республики Казахстан проектов законов, вносимых Правительством в Мажилис Парламента Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасының заңдарын Қазақстан Республикасы Президентiнiң қол қоюына және қарауына ұсыну, оларды тiркеу, жария ету және сақтау тәртiбi туралы ереженi бекiту туралы» 1996 жылғы 2 шiлдедегі № 3051 және «Қазақстан Республикасы Үкіметінің заң жобалары жұмыстарының жоспарларын Қазақстан Республикасының Президентімен және Қазақстан Республикасы Парламентінің Мәжілісіне Үкімет енгізетін заң жобаларын Қазақстан Республикасы Президентінің Әкімшілігімен келісу ережелерін бекіту туралы» 2002 жылғы 17 мамырдағы № 873 жарлықтарына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178683/rus
