act_code: '12134'
requisite: Указ Президента Республики Казахстан от 17 мая 2002 года N 873.
title:
  rus: Об утверждении Правил согласования с Администрацией Президента Республики Казахстан проектов законов, вносимых Правительством Республики Казахстан в Мажилис Парламента Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі Қазақстан Республикасы Парламентінің Мәжілісіне енгізетін заң жобаларын Қазақстан Республикасы Президентінің Әкімшілігімен келісу қағидаларын бекіту туралы
