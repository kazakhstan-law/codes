  title:
    rus: О внесении изменений и дополнения в указы Президента Республики Казахстан от 5 августа 2002 года № 917 «Об утверждении Положения о Счетном комитете по контролю за исполнением республиканского бюджета» и от 11 января 2016 года № 169 «О внесении изменений и дополнений в некоторые акты Президента Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Республикалық бюджеттiң атқарылуын бақылау жөнiндегi есеп комитетi туралы ереженi бекiту туралы» 2002 жылғы 5 тамыздағы № 917 және «Қазақстан Республикасы Президентінің кейбір актілеріне өзгерістер мен толықтырулар енгізу туралы» 2016 жылғы 11 қаңтардағы № 169 жарлықтарына өзгерістер мен толықтыру енгізу туралы
