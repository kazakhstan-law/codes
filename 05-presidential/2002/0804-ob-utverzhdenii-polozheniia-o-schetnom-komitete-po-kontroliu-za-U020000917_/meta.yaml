  title:
    rus: О внесении изменений и дополнений в указы Президента Республики Казахстан от 22 января 1999 года № 29 "О мерах по дальнейшей оптимизации системы государственных органов Республики Казахстан" и от 5 августа 2002 года № 917 "Об утверждении Положения о Счетном комитете по контролю за исполнением республиканского бюджета"
    kaz: Қазақстан Республикасы Президентінің "Қазақстан Республикасының мемлекеттік органдары жүйесін одан әрі оңтайландыру жөніндегі шаралар туралы" 1999 жылғы 22 қаңтардағы № 29 және "Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитеті туралы ережені бекіту туралы" 2002 жылғы 5 тамыздағы № 917 жарлықтарына өзгерістер мен толықтырулар енгізу туралы
