caused_by:
  code: '65850'
  requisite: Указ Президента Республики Казахстан от 8 мая 2012 года № 324дсп
  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 17 января 2004 года № 1283 "Об утверждении реестров должностей военнослужащих, сотрудников правоохранительных органов, государственной противопожарной службы Агентства Республики Казахстан по чрезвычайным ситуациям и органов прокуратуры Республики Казахстан по категориям" и от 17 января 2004 года № 1284 "О единой системе оплаты труда работников органов Республики Казахстан, содержащихся за счет государственного бюджета и сметы (бюджета) Национального Банка Республики Казахстан"
    kaz: Қазақстан Республикасы Президентінің "Қазақстан Республикасының әскери қызметшілері, құқық қорғау органдары, Қазақстан Республикасы Төтенше жағдайлар жөніндегі министрлігінің мемлекеттік өртке қарсы органдары мен прокуратура органдарының қызметкерлері лауазымдарының санаттары бойынша тізілімдерін бекіту туралы" 2004 жылғы 17 қаңтардағы № 1283 және "Қазақстан Республикасының мемлекеттік бюджеті және Ұлттық Банкінің сметасы (бюджеті) есебінен қамтылған Қазақстан Республикасы органдарының қызметкерлеріне еңбекақы төлеудің бірыңғай жүйесі туралы" 2004 жылғы 17 қаңтардағы № 1284 жарлықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/65850/rus
