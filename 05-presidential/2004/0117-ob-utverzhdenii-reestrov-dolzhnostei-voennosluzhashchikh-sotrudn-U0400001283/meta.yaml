title:
  rus: Об утверждении реестров должностей военнослужащих, сотрудников специальных государственных органов, правоохранительных органов, органов противопожарной службы Министерства по чрезвычайным ситуациям Республики Казахстан и органов прокуратуры Республики Казахстан по категориям
  kaz: Қазақстан Республикасының әскери кызметшілері, арнаулы мемлекеттік органдары, құқық қорғау органдары, Қазақстан Республикасы Төтенше жағдайлар министрлігінің өртке қарсы қызмет органдары мен прокуратура органдарының қызметкерлері лауазымдарының санаттары бойынша тізілімдерін бекіту туралы
