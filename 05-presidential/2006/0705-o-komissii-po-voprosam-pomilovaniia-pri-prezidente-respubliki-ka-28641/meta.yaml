  title:
    rus: О внесении изменений и дополнения в Указ Президента Республики Казахстан от 5 июля 2006 года № 140 «О Комиссии по вопросам помилования при Президенте Республики Казахстан» и признании утратившим силу Указа Президента Республики Казахстан от 17 декабря 2003 года № 1251 «О введении в Республике Казахстан моратория на смертную казнь»
    kaz: «Қазақстан Республикасы Президентінің жанындағы Кешірім жасау мәселелері жөніндегі комиссия туралы» Қазақстан Республикасы Президентінің 2006 жылғы 5 шілдедегі № 140 Жарлығына өзгерістер мен толықтыру енгізу және «Қазақстан Республикасында өлім жазасына мораторий енгізу туралы» Қазақстан Республикасы Президентінің 2003 жылғы 17 желтоқсандағы № 1251 Жарлығының күші жойылды деп тану туралы
