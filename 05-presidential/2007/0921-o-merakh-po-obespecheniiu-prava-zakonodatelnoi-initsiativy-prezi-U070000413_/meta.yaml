title:
  rus: О мерах по обеспечению права законодательной инициативы Президента Республики Казахстан и приведению некоторых актов Президента Республики в соответствие с Конституцией Республики Казахстан
  kaz: Қазақстан Республикасы Президентінің заң шығару бастамасы құқығын қамтамасыз ету және Республика Президентінің кейбір актілерін Қазақстан Республикасының Конституциясына сәйкес келтіру жөніндегі шаралар туралы
