  title:
    rus: О внесении изменений и дополнений в некоторые акты Президента Республики Казахстан по вопросам организации деятельности консультативно-совещательных и иных органов при Президенте Республики Казахстан
    kaz: Қазақстан Республикасының Президенті жанындағы консультативтік-кеңесші және өзге де органдардың қызметін ұйымдастыру мәселелері жөніндегі Қазақстан Республикасы Президентінің кейбір актілеріне өзгерістер мен толықтырулар енгізу туралы
