  requisite: Указ Президента Республики Казахстан от 8 апреля 2012 года № 295
  title:
    rus: О внесении изменений и дополнений в указы Президента Республики Казахстан от 11 марта 2008 года № 552 "Об утверждении Положения об Администрации Президента Республики Казахстан" и от 27 апреля 2010 года № 976 "Об утверждении Правил подготовки, согласования, представления на подпись проектов актов и поручений Президента Республики Казахстан, осуществления контроля за исполнением актов и поручений Президента Республики Казахстан и проведения мониторинга нормативных правовых указов Президента Республики Казахстан"
    kaz: Қазақстан Республикасы Президентінің "Қазақстан Республикасы Президентінің Әкімшілігі туралы ережені бекіту туралы" 2008 жылғы 11 наурыздағы № 552 және "Қазақстан Республикасы Президентінің актілері мен тапсырмаларының жобаларын дайындау, келісу, қол қоюға ұсыну, Қазақстан Республикасы Президентінің актілері мен тапсырмаларының орындалуын бақылауды жүзеге асыру және Қазақстан Республикасы Президентінің нормативтік құқықтық жарлықтарына мониторинг жүргізу ережесін бекіту туралы" 2010 жылғы 27 сәуірдегі № 976 жарлықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/64510/rus
