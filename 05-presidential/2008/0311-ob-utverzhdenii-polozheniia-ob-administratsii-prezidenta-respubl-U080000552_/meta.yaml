    kaz: «Қазақстан Республикасының астанасы – Астана қаласын Қазақстан Республикасының астанасы – Нұр-Сұлтан қаласы деп қайта атау туралы» Қазақстан Республикасы Президентінің 2019 жылғы 23 наурыздағы № 6 Жарлығын іске асырудың кейбір мәселелері туралы
