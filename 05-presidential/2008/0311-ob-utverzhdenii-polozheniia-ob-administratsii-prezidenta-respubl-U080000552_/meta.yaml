  requisite: Указ Президента Республики Казахстан от 17 марта 2025 года № 815
  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 17 мая 2002 года № 873 «Об утверждении Правил согласования с Президентом Республики Казахстан планов законопроектных работ Правительства Республики Казахстан и с Администрацией Президента Республики Казахстан проектов законов, вносимых Правительством в Мажилис Парламента Республики Казахстан» и от 11 марта 2008 года № 552 «Об утверждении Положения об Администрации Президента Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасы Үкіметінің заң жобалары жұмыстарының жоспарларын Қазақстан Республикасының Президентімен және Қазақстан Республикасы Парламентінің Мәжілісіне Үкімет енгізетін заң жобаларын Қазақстан Республикасы Президентінің Әкімшілігімен келісу қағидаларын бекіту туралы» 2002 жылғы 17 мамырдағы № 873 және «Қазақстан Республикасы Президентінің Әкімшілігі туралы ережені бекіту туралы» 2008 жылғы 11 наурыздағы № 552 жарлықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208206/rus
