  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 18 июня 2009 года № 827 "О Системе государственного планирования в Республике Казахстан" и от 4 марта 2010 года № 931 "О некоторых вопросах дальнейшего функционирования Системы государственного планирования в Республике Казахстан"
    kaz: Қазақстан Республикасы Президентінің "Қазақстан Республикасындағы мемлекеттік жоспарлау жүйесі туралы" 2009 жылғы 18 маусымдағы № 827 және "Қазақстан Республикасындағы мемлекеттік жоспарлау жүйесінің одан әрі жұмыс істеуінің кейбір мәселелері туралы" 2010 жылғы 4 наурыздағы № 931 жарлықтарына өзгерістер енгізу туралы
