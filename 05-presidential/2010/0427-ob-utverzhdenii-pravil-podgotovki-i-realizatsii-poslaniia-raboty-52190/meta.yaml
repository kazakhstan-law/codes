  title:
    rus: О внесении изменений и дополнений в некоторые акты Президента Республики Казахстан и признании утратившими силу некоторых актов Президента Республики Казахстан
    kaz: Қазақстан Республикасы Президентінің кейбір актілеріне өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Президентінің кейбір актілерінің күші жойылды деп тану туралы
