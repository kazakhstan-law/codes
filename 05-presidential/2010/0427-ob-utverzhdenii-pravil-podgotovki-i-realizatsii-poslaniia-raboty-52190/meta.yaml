caused_by:
  code: '169611'
  requisite: Указ Президента Республики Казахстан от 14 июня 2022 года № 927
  title:
    rus: О статусе и полномочиях Государственного советника Республики Казахстан, внесении изменений в некоторые указы Президента Республики Казахстан и признании утратившими силу некоторых указов Президента Республики Казахстан
    kaz: Қазақстан Республикасы Мемлекеттік кеңесшісінің мәртебесі мен өкілеттіктері, Қазақстан Республикасы Президентінің кейбір жарлықтарына өзгерістер енгізу және Қазақстан Республикасы Президентінің кейбір жарлықтарын күші жойылды деп тану туралы
