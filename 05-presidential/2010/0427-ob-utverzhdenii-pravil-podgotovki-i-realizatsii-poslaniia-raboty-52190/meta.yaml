caused_by:
  code: '151392'
  requisite: Указ Президента Республики Казахстан от 20 декабря 2020 года № 473
  title:
    rus: О внесении изменений и дополнений в Указ Президента Республики Казахстан от 27 апреля 2010 года № 976 «Об утверждении Правил подготовки, согласования и представления на рассмотрение Президенту Республики Казахстан проекта послания Президента Республики Казахстан к народу Казахстана, подготовки, согласования и представления на подпись проектов актов и поручений Президента Республики Казахстан, реализации послания Президента Республики Казахстан к народу Казахстана, осуществления контроля за исполнением актов и поручений Президента Республики Казахстан и проведения мониторинга нормативных правовых указов Президента Республики Казахстан»
    kaz: «Қазақстан Республикасы Президентінің Қазақстан халқына жолдауының жобасын дайындау, келісу және Қазақстан Республикасы Президентінің қарауына ұсыну, Қазақстан Республикасы Президентінің актілері мен тапсырмаларының жобаларын дайындау, келісу, қол қоюға ұсыну, Қазақстан Республикасы Президентінің Қазақстан халқына жолдауын іске асыру, Қазақстан Республикасы Президентінің актілері мен тапсырмаларының орындалуын бақылауды жүзеге асыру және Қазақстан Республикасы Президентінің нормативтік құқықтық жарлықтарына мониторинг жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Президентінің 2010 жылғы 27 сәуірдегі № 976 Жарлығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/151392/rus
