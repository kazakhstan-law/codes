  title:
    rus: О внесении изменений в некоторые акты Президента Республики Казахстан по вопросам деятельности консультативно-совещательных и иных органов при Президенте Республики Казахстан
    kaz: Қазақстан Республикасы Президентінің жанындағы консультативтік-кеңесші және өзге де органдардың қызметі мәселелері бойынша Қазақстан Республикасы Президентінің кейбір актілеріне өзгерістер енгізу туралы
