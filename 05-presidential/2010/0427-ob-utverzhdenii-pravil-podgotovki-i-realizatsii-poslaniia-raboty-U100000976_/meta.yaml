  title:
    rus: О внесении изменений и дополнений в Указ Президента Республики Казахстан от 27 апреля 2010 года № 976 «Об утверждении Правил подготовки и реализации послания, работы с актами и поручениями Президента Республики Казахстан и осуществления контроля за их исполнением, проведения мониторинга нормативных правовых указов»
    kaz: «Қазақстан Республикасы Президентінің жолдауын дайындау және іске асыру, актілерімен және тапсырмаларымен жұмыс істеу және олардың орындалуын бақылауды жүзеге асыру, нормативтік құқықтық жарлықтарға мониторинг жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Президентінің 2010 жылғы 27 сәуірдегі № 976 Жарлығына өзгерістер мен толықтырулар енгізу туралы
