  requisite: Указ Президента Республики Казахстан от 27 февраля 2021 года № 526
  title:
    rus: О внесении изменений и дополнения в указы Президента Республики Казахстан от 12 августа 2010 года № 1037 «О вопросах подготовки информации о выполнении международных договоров Республики Казахстан и представления ее на рассмотрение Президента Республики Казахстан, а также согласования проектов решений международных организаций, участницей которых является Республика Казахстан, и их реализации, подготовки международных мероприятий Республики Казахстан с участием Президента Республики Казахстан, выполнения достигнутых договоренностей, взаимодействия с международными судебными органами и осуществления координации международной деятельности государственных органов Республики Казахстан» и от 6 мая 2015 года № 20 «Об органах и организации, уполномоченных на обращение в Суд Евразийского экономического союза»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасының халықаралық шарттарының орындалуы туралы ақпаратты дайындау және оны Қазақстан Республикасы Президентінің қарауына ұсыну, сондай-ақ Қазақстан Республикасы қатысушысы болып табылатын халықаралық ұйымдар шешімдерінің жобаларын келісу және оларды іске асыру, Қазақстан Республикасы Президентінің қатысуымен өтетін Қазақстан Республикасының халықаралық іс-шараларын дайындау, қол жеткізілген уағдаластықтарды орындау, халықаралық сот органдарымен өзара іс-қимыл және Қазақстан Республикасының мемлекеттік органдарының халықаралық қызметін үйлестіруді жүзеге асыру мәселелері туралы» 2010 жылғы 12 тамыздағы № 1037 және «Еуразиялық экономикалық одақтың Сотына жүгінуге уәкілеттік берілген органдар мен ұйым туралы» 2015 жылғы 6 мамырдағы № 20 жарлықтарына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/156394/rus
