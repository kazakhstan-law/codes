act_code: '53965'
requisite: Указ Президента Республики Казахстан от 12 августа 2010 года № 1037
title:
  rus: О вопросах подготовки информации о выполнении международных договоров Республики Казахстан и представления ее на рассмотрение Президента Республики Казахстан, а также согласования проектов решений международных организаций, участницей которых является Республика Казахстан, и их реализации, взаимодействия со специальными процедурами Совета Организации Объединенных Наций по правам человека и договорными органами по правам человека, подготовки международных мероприятий Республики Казахстан с участием Президента Республики Казахстан, выполнения достигнутых договоренностей, взаимодействия с международными судебными органами и осуществления координации международной деятельности государственных органов Республики Казахстан
  kaz: Қазақстан Республикасының халықаралық шарттарының орындалуы туралы ақпаратты дайындау және оны Қазақстан Республикасы Президентінің қарауына ұсыну, сондай-ақ Қазақстан Республикасы қатысушысы болып табылатын халықаралық ұйымдар шешімдерінің жобаларын келісу және оларды іске асыру, Біріккен Ұлттар Ұйымы Адам құқықтары жөніндегі кеңесінің арнайы рәсімдерімен және адам құқықтары жөніндегі шарттық органдармен өзара іс-қимыл, Қазақстан Республикасы Президентінің қатысуымен өтетін Қазақстан Республикасының халықаралық іс-шараларын дайындау, қол жеткізілген уағдаластықтарды орындау, халықаралық сот органдарымен өзара іс-қимыл және Қазақстан Республикасының мемлекеттік органдарының халықаралық қызметін үйлестіруді жүзеге асыру мәселелері туралы
