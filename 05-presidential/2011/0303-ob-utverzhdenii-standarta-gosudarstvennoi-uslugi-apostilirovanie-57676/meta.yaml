title:
  rus: Об утверждении стандарта государственной услуги "Апостилирование архивных справок и копий архивных документов, исходящих из специального государственного архива Комитета национальной безопасности Республики Казахстан"
  kaz: '"Қазақстан Республикасы Ұлттық қауіпсіздік комитеті арнайы мемлекеттік мұрағатынан шығатын мұрағаттық анықтамаларға және мұрағаттық құжаттардың көшірмелеріне апостиль қою" мемлекеттік қызмет көрсетулер стандартын бекіту туралы'
