title:
  rus: О порядке назначения на должность, прекращения полномочий и освобождения от должности акимов городов областного значения и районов областей, районов в городах областного значения, районов в городе республиканского значения и столицы
  kaz: Облыстық маңызы бар қалалар мен облыстар аудандарының, облыстық маңызы бар қалалардағы аудандардың, республикалық маңызы бар қала мен астанадағы аудандардың әкімдерін қызметке тағайындау, өкілеттігін тоқтату және қызметтен босату тәртібі туралы
