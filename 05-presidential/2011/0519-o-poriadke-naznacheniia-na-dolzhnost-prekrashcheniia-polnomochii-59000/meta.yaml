  title:
    rus: О некоторых вопросах проведения выборов акимов городов районного значения, сельских округов, поселков и сел Республики Казахстан, не входящих в состав сельского округа
    kaz: Қазақстан Республикасының аудандық маңызы бар қалалары, ауылдық округтері, ауылдық округтің құрамына кірмейтін кенттері мен ауылдары әкімдерінің сайлауын өткізудің кейбір мәселелері туралы
