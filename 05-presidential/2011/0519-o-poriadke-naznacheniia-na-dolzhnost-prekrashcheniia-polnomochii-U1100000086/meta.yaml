  title:
    rus: О признании утратившими силу пунктов 1 и 2 Указа Президента Республики Казахстан от 19 мая 2011 года № 86 «О порядке назначения на должность, прекращения полномочий и освобождения от должности акимов городов областного значения и районов областей, районов в городах областного значения, районов в городе республиканского значения и столицы»
    kaz: «Облыстық маңызы бар қалалар мен облыстар аудандарының, облыстық маңызы бар қалалардағы аудандардың, республикалық маңызы бар қала мен астанадағы аудандардың әкімдерін қызметке тағайындау, өкілеттігін тоқтату және қызметтен босату тәртібі туралы» Қазақстан Республикасы Президентінің 2011 жылғы 19 мамырдағы № 86 Жарлығының 1 және 2-тармақтарының күші жойылды деп тану туралы
