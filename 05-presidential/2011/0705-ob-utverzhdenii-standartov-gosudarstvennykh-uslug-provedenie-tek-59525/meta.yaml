requisite: Указ Президента Республики Казахстан от 5 июля 2011 года № 116. Утратил силу Указом Президента Республики Казахстан от 27 мая 2014 года № 829
title:
  rus: Об утверждении стандартов государственных услуг "Проведение технического исследования на предмет отнесения товаров к специальным техническим средствам для проведения оперативно-розыскных мероприятий" и "Проведение технического исследования на предмет отнесения товаров к средствам криптографической защиты информации"
  kaz: '"Жедел іздестіру іс-шараларын жүргізу үшін тауарларды арнайы техникалық құралдарға жатқызу тұрғысынан техникалық зерттеу жүргізу" және "Тауарларды ақпаратты криптографиялық қорғау құралдарына жатқызу тұрғысынан техникалық зерттеу жүргізу" мемлекеттік қызмет көрсетулер стандарттарын бекіту туралы'
