  code: '125329'
  requisite: Указ Президента Республики Казахстан от 22 октября 2018 года № 777
  title:
    rus: О внесении изменений и дополнений в Указ Президента Республики Казахстан от 30 сентября 2011 года № 155 «О вопросах государственных символов и геральдики ведомственных и иных, приравненных к ним, наград некоторых государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, Конституционного Совета Республики Казахстан, правоохранительных органов, судов, Вооруженных Сил, других войск и воинских формирований»
    kaz: «Мемлекеттік рәміздер және Қазақстан Республикасының Президентіне тікелей бағынатын және есеп беретін кейбір мемлекеттік органдардың, Қазақстан Республикасы Конституциялық Кеңесінің, құқық қорғау органдарының, соттардың, Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың ведомстволық және оларға теңестірілген өзге де наградаларының геральдикасы мәселелері туралы» Қазақстан Республикасы Президентiнiң 2011 жылғы 30 қыркүйектегі № 155 Жарлығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125329/rus
