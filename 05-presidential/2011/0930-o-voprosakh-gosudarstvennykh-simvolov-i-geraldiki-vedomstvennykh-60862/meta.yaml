caused_by:
  code: '228254'
  requisite: Указ Президента Республики Казахстан от 27 июля 2026 года № 1381
  title:
    rus: О внесении изменений в Указ Президента Республики Казахстан от 30 сентября 2011 года № 155 «О вопросах государственных символов и геральдики ведомственных и иных, приравненных к ним, наград некоторых государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, Конституционного Суда Республики Казахстан, Центральной избирательной комиссии Республики Казахстан, правоохранительных органов, судов, Вооруженных Сил, других войск и воинских формирований»
    kaz: «Мемлекеттік рәміздер және Қазақстан Республикасының Президентіне тікелей бағынатын және есеп беретін кейбір мемлекеттік органдардың, Қазақстан Республикасы Конституциялық Сотының, Қазақстан Республикасы Орталық сайлау комиссиясының, құқық қорғау органдарының, соттардың, Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың ведомстволық және оларға теңестірілген өзге де наградаларының геральдикасы мәселелері туралы» Қазақстан Республикасы Президентінің 2011 жылғы 30 қыркүйектегі № 155 Жарлығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228254/rus
