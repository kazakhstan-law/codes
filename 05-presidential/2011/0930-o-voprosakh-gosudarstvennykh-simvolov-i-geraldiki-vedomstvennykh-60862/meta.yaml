  code: '67613'
  requisite: Указ Президента Республики Казахстан от 14 сентября 2012 года № 377
  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 23 мая 1997 года № 3526 "О символах органов национальной безопасности Республики Казахстан" и от 30 сентября 2011 года № 155 "О ведомственных наградах некоторых государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, правоохранительных органов, судов, Вооруженных Сил, других войск и воинских формирований"
    kaz: '"Қазақстан Республикасы ұлттық қауіпсіздік органдарының нышандары туралы" Қазақстан Республикасы Президентінің 1997 жылғы 23 мамырдағы № 3526 және "Қазақстан Республикасының Президентіне тікелей бaғынатын және есеп беретін кейбір мемлекеттік органдардың, құқық қорғау органдарының, соттардың, Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың ведомстволық наградалары туралы" Қазақстан Республикасы Президентінің 2011 жылғы 30 қыркүйектегі № 155 жарлықтарына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/67613/rus
