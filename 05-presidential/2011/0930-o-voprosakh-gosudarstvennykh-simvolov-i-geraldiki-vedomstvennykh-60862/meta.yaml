  code: '152130'
  requisite: Указ Президента Республики Казахстан от 18 января 2021 года № 495
  title:
    rus: О внесении изменений и дополнений в некоторые указы Президента Республики Казахстан и признании утратившими силу некоторых указов Президента Республики Казахстан
    kaz: Қазақстан Республикасы Президентінің кейбір жарлықтарына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Президентінің кейбір жарлықтарының күші жойылды деп тану туралы
