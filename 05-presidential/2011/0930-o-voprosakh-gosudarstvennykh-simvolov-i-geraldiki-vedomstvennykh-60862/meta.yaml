  title:
    rus: О внесении изменений и дополнений в Указ Президента Республики Казахстан от 30 сентября 2011 года № 155 "О ведомственных наградах некоторых государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, правоохранительных органов, судов, Вооруженных Сил, других войск и воинских формирований"
    kaz: '"Қазақстан Республикасының Президентіне тікелей бағынатын және есеп беретін кейбір мемлекеттік органдардың, құқық қорғау органдарының, соттардың, Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың ведомстволық наградалары туралы" Қазақстан Республикасы Президентiнiң 2011 жылғы 30 қыркүйектегі № 155 Жарлығына өзгерістер мен толықтырулар енгізу туралы'
