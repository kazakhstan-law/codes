  requisite: Указ Президента Республики Казахстан от 29 августа 2016 года № 312
  title:
    rus: О внесении изменений и дополнений в Указ Президента Республики Казахстан от 30 сентября 2011 года № 155 "О ведомственных и иных, приравненных к ним, наградах некоторых государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, Конституционного Совета Республики Казахстан, правоохранительных органов, судов, Вооруженных Сил, других войск и воинских формирований" и признании утратившими силу некоторых актов Президента Республики Казахстан
    kaz: '"Қазақстан Республикасының Президентіне тікелей бағынатын және есеп беретін кейбір мемлекеттік органдардың, Қазақстан Республикасы Конституциялық Кеңесінің, құқық қорғау органдарының, соттардың, Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың ведомстволық және оларға теңестірілген өзге де наградалары туралы" Қазақстан Республикасы Президентінің 2011 жылғы 30 қыркүйектегі № 155 Жарлығына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Президентінің кейбір актілерінің күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/105908/rus
