act_code: '60862'
requisite: Указ Президента Республики Казахстан от 30 сентября 2011 года № 155
title:
  rus: О вопросах государственных символов и геральдики ведомственных и иных, приравненных к ним, наград некоторых государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, Конституционного Суда Республики Казахстан, правоохранительных органов, судов, Вооруженных Сил, других войск и воинских формирований
  kaz: Мемлекеттік рәміздер және Қазақстан Республикасының Президентіне тікелей бағынатын және есеп беретін кейбір мемлекеттік органдардың, Қазақстан Республикасы Конституциялық Сотының, құқық қорғау органдарының, соттардың, Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың ведомстволық және оларға теңестірілген өзге де наградаларының геральдикасы мәселелері туралы
