  title:
    rus: О внесении изменений и дополнений в некоторые акты Президента Республики Казахстан и признании утратившим силу некоторых распоряжений Президента Республики Казахстан
    kaz: Қазақстан Республикасы Президентінің кейбір актілеріне өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Президентінің кейбір өкімдерінің күші жойылды деп тану туралы
