  title:
    rus: Об утверждении текста Присяги сотрудников правоохранительных органов, органов гражданской защиты, государственной фельдъегерской службы Республики Казахстан и порядка ее принесения, а также признании утратившими силу некоторых указов Президента Республики Казахстан
    kaz: Қазақстан Республикасы құқық қорғау органдарының, азаматтық қорғау органдарының, мемлекеттік фельдъегерлік қызметінің қызметкерлері антының мәтінін және ант беру тәртібін бекіту, сондай-ақ Қазақстан Республикасы Президентінің кейбір жарлықтарының күші жойылды деп тану туралы
