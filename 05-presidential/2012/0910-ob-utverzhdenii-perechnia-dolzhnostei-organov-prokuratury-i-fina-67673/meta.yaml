title:
  rus: Об утверждении перечня должностей органов прокуратуры и финансовой полиции Республики Казахстан, которым присваиваются классные чины и специальные звания, и соответсвующих им предельных классных чинов и специальных званий
  kaz: Сыныптық шендер мен арнаулы атақтар берілетін Қазақстан Республикасының прокуратура және қаржы полициясы органдары лауазымдарының тізбесін және оларға сәйкес келетін шекті сыныптық шендер мен арнаулы атақтарды бекіту туралы
