  requisite: Указ Президента Республики Казахстан от 12 июня 2017 года № 498
  title:
    rus: О внесении изменений в Указ Президента Республики Казахстан от 7 марта 2013 года № 520 «О Национальной комиссии по кадровой политике при Президенте Республики Казахстан и кадровых комиссиях областей, столицы, города республиканского значения» и дополнения в Указ Президента Республики Казахстан от 5 октября 2016 года № 349 «О некоторых вопросах Агентства Республики Казахстан по делам государственной службы и противодействию коррупции и внесении изменений и дополнений в некоторые акты Президента Республики Казахстан»
    kaz: «Қазақстан Республикасының Президенті жанындағы Кадр саясаты жөніндегі ұлттық комиссия және облыстардың, астананың, республикалық маңызы бар қаланың кадр комиссиялары туралы» Қазақстан Республикасы Президентінің 2013 жылғы 7 наурыздағы № 520 Жарлығына өзгерістер және «Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің кейбір мәселелері және Қазақстан Республикасы Президентінің кейбір актілеріне өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Президентінің 2016 жылғы 5 қазандағы № 349 Жарлығына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113021/rus
