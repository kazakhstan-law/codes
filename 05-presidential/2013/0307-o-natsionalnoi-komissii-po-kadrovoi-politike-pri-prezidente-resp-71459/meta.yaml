  title:
    rus: О внесении изменений и дополнения в указы Президента Республики Казахстан от 13 января 2007 года № 273 "О мерах по модернизации системы государственного управления Республики Казахстан" и от 7 марта 2013 года № 520 "О Национальной комиссии по кадровой политике при Президенте Республики Казахстан и кадровых комиссиях областей, столицы, города республиканского значения"
    kaz: '"Қазақстан Республикасының мемлекеттік басқару жүйесін жаңғырту жөніндегі шаралар туралы" 2007 жылғы 13 қаңтардағы № 273 және "Қазақстан Республикасының Президенті жанындағы Кадр саясаты жөніндегі ұлттық комиссия және облыстардың, астананың, республикалық маңызы бар қаланың кадр комиссиялары туралы" 2013 жылғы 7 наурыздағы № 520 Қазақстан Республикасы Президентінің жарлықтарына өзгерістер мен толықтыру енгізу туралы'
