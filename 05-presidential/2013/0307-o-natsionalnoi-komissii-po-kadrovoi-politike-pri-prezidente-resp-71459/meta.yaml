title:
  rus: О Национальной комиссии по кадровой политике при Президенте Республики Казахстан и кадровых комиссиях областей, городов республиканского значения, столицы
  kaz: Қазақстан Республикасының Президенті жанындағы Кадр саясаты жөніндегі ұлттық комиссия және облыстардың, республикалық маңызы бар қалалардың, астананың кадр комиссиялары туралы
