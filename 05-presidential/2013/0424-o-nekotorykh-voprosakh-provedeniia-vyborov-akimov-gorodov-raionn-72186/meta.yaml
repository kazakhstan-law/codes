    kaz: '"Қазақстан Республикасының аудандық маңызы бар қалалары, ауылдық округтері, ауылдық округтің құрамына кірмейтін кенттері мен ауылдары әкімдерінің сайлауын өткізудің кейбір мәселелері туралы" Қазақстан Республикасы Президентінің 2013 жылғы 24 сәуірдегі № 555 Жарлығына өзгерістер мен толықтырулар енгізу туралы'
