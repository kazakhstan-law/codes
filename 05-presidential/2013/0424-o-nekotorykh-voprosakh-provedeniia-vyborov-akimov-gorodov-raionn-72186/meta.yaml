requisite: Указ Президента Республики Казахстан от 24 апреля 2013 года № 555. Утратил силу Указом Президента Республики Казахстан от 10 октября 2017 года № 559 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О некоторых вопросах проведения выборов акимов городов районного значения, сельских округов, поселков и сел Республики Казахстан, не входящих в состав сельского округа
