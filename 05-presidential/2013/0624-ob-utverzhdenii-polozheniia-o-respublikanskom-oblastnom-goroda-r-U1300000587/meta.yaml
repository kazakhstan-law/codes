  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 5 июля 2007 года № 364 "Об утверждении общевоинских уставов Вооруженных Сил, других войск и воинских формирований Республики Казахстан" и от 24 июня 2013 года № 587 "Об утверждении Положения о республиканском, областном, города республиканского значения, столицы, района (города областного значения) оперативных штабах по борьбе с терроризмом"
    kaz: Қазақстан Республикасы Президентінің "Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құралымдарының жалпыәскери жарғыларын бекіту туралы" 2007 жылғы 5 шілдедегі № 364 және "Республикалық, облыстық, республикалық маңызы бар қаланың, астананың, ауданның (облыстық маңызы бар қаланың) терроризмге қарсы күрес жөніндегі жедел штабтары туралы ережені бекіту туралы" 2013 жылғы 24 маусымдағы № 587 жарлықтарына өзгерістер енгізу туралы
