  title:
    rus: О внесении изменений и дополнений в указы Президента Республики Казахстан от 25 мая 2006 года № 124 «Об утверждении Правил прохождения воинской службы в Вооруженных Силах, других войсках и воинских формированиях Республики Казахстан» и от 28 августа 2013 года № 624 «О формировании Президентского резерва руководства правоохранительных и специальных государственных органов Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасының Қарулы Күштерiнде, басқа да әскерлерi мен әскери құралымдарында әскери қызмет өткеру қағидаларын бекiту туралы» 2006 жылғы 25 мамырдағы № 124 және «Қазақстан Республикасы құқық қорғау және арнаулы мемлекеттік органдары басшылығының президенттік резервін қалыптастыру туралы» 2013 жылғы 28 тамыздағы № 624 жарлықтарына өзгерістер мен толықтырулар енгізу туралы
