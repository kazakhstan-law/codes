title:
  rus: Об утверждении Правил оформления, выдачи, замены, сдачи, изъятия, учета, хранения и уничтожения дипломатических и служебных паспортов Республики Казахстан и перечня должностных лиц Республики Казахстан, которым выдаются дипломатические и служебные паспорта Республики Казахстан
  kaz: Қазақстан Республикасының дипломатиялық және қызметтік паспорттарын ресімдеу, беру, ауыстыру, тапсыру, алып қою, есепке алу, сақтау және жою қағидаларын және Қазақстан Республикасының дипломатиялық және қызметтік паспорттары берілетін Қазақстан Республикасының лауазымды адамдарының тізбесін бекіту туралы
