  title:
    rus: О внесении изменения в Указ Президента Республики Казахстан от 13 января 2014 года № 722 «Об утверждении Правил оформления, выдачи, замены, сдачи, изъятия, учета, хранения и уничтожения дипломатических и служебных паспортов Республики Казахстан и перечня должностных лиц Республики Казахстан, которым выдаются дипломатические и служебные паспорта Республики Казахстан»
    kaz: «Қазақстан Республикасының дипломатиялық және қызметтік паспорттарын ресімдеу, беру, ауыстыру, тапсыру, алып қою, есепке алу, сақтау және жою қағидаларын және Қазақстан Республикасының дипломатиялық және қызметтік паспорттары берілетін Қазақстан Республикасының лауазымды адамдарының тізбесін бекіту туралы» Қазақстан Республикасы Президентінің 2014 жылғы 13 қаңтардағы № 722 Жарлығына өзгеріс енгізу туралы
