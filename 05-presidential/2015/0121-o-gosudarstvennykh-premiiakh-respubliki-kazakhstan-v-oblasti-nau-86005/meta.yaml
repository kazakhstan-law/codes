title:
  rus: О государственных премиях Республики Казахстан в области науки и техники имени аль-Фараби, гуманитарных наук имени А. Байтурсынулы и литературы и искусства имени Абая
  kaz: Қазақстан Республикасының әл-Фараби атындағы ғылым мен техника, А. Байтұрсынұлы атындағы гуманитарлық ғылымдар және Абай атындағы әдебиет пен өнер саласындағы мемлекеттік сыйлықтары туралы
