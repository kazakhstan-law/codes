    rus: О внесении изменений и дополнений в некоторые акты Президента Республики Казахстан по вопросам деятельности консультативно-совещательных и иных органов при Президенте Республики Казахстан
    kaz: Қазақстан Республикасы Президентінің кейбір актілеріне Қазақстан Республикасы Президентінің жанындағы консультативтік-кеңесші және өзге де органдардың қызметі мәселелері бойынша өзгерістер мен толықтыруларды енгізу туралы
