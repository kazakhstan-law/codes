    kaz: «Қазақстан Республикасының әл-Фараби атындағы ғылым мен техника саласындағы және әдебиет пен өнер саласындағы мемлекеттік сыйлықтары туралы» Қазақстан Республикасы Президентінің 2015 жылғы 21 қаңтардағы № 993 Жарлығына толықтырулар енгізу туралы
