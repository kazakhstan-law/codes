act_code: '86463'
requisite: Указ Президента Республики Казахстан от 6 февраля 2015 года № 998
title:
  rus: Об утверждении Инструкции о порядке применения Вооруженными Силами Республики Казахстан оружия, боевой техники и специальных средств для пресечения актов терроризма в воздушном пространстве, во внутренних водах, в территориальном море, на континентальном шельфе Республики Казахстан, при обеспечении безопасности мореплавания
  kaz: Қазақстан Республикасының әуе кеңістігінде, ішкі суларында, аумақтық теңізінде, континенттік қайраңында терроризм актілерінің жолын кесу үшін, теңізде жүзу қауіпсіздігін қамтамасыз ету кезінде Қазақстан Республикасы Қарулы Күштерінің қаруды, жауынгерлік техниканы және арнайы құралдарды қолдану тәртібі туралы нұсқаулықты бекіту туралы
