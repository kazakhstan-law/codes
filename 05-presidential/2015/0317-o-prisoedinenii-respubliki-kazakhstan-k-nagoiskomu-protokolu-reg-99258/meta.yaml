act_code: '99258'
requisite: Указ Президента Республики Казахстан от 17 марта 2015 года № 1025
title:
  rus: О присоединении Республики Казахстан к Нагойскому протоколу регулирования доступа к генетическим ресурсам и совместного использования на справедливой и равной основе выгод от их применения к Конвенции о биологическом разнообразии
  kaz: '"Биологиялық әралуандық туралы конвенцияға Генетикалық ресурстарға қол жеткізуді және оларды қолданудан алынған пайданы әділетті және тепе-тең негізде бірлесіп пайдалануды реттеу жөніндегі Нагоя хаттамасына Қазақстан Республикасының қосылуы туралы"'
