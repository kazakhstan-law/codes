  title:
    rus: О внесении изменений и дополнений в указы Президента Республики Казахстан от 29 декабря 2015 года № 152 «О некоторых вопросах прохождения государственной службы» и от 22 июля 2019 года № 74 «О некоторых вопросах Агентства Республики Казахстан по делам государственной службы и Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы)»
    kaz: Қазақстан Республикасы Президентінің «Мемлекеттік қызмет өткерудің кейбір мәселелері туралы» 2015 жылғы 29 желтоқсандағы № 152 және «Қазақстан Республикасы Мемлекеттік қызмет істері агенттігінің және Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің (Сыбайлас жемқорлыққа қарсы қызметтің) кейбір мәселелері туралы» 2019 жылғы 22 шілдедегі № 74 жарлықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/148491/rus
