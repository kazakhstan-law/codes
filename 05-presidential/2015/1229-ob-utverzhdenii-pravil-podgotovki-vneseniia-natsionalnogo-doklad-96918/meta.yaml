caused_by:
  code: '164308'
  requisite: Указ Президента Республики Казахстан от 2 февраля 2022 года № 802
  title:
    rus: Об утверждении Концепции антикоррупционной политики Республики Казахстан на 2022 – 2026 годы и внесении изменений в некоторые указы Президента Республики Казахстан
    kaz: Қазақстан Республикасының сыбайлас жемқорлыққа қарсы саясатының 2022 – 2026 жылдарға арналған тұжырымдамасын бекіту және Қазақстан Республикасы Президентінің кейбір жарлықтарына өзгерістер енгізу туралы
