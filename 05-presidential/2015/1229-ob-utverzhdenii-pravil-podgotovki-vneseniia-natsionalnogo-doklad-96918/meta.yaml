act_code: '96918'
requisite: Указ Президента Республики Казахстан от 29 декабря 2015 года № 154
title:
  rus: Об утверждении Правил подготовки, внесения Национального доклада о противодействии коррупции Президенту Республики Казахстан и его опубликования
  kaz: Сыбайлас жемқорлыққа қарсы іс-қимыл туралы ұлттық баяндаманы дайындау, Қазақстан Республикасының Президентіне енгізу және оны жариялау қағидаларын бекіту туралы
