  requisite: Указ Президента Республики Казахстан от 13 июля 2016 года № 298
  title:
    rus: О внесении изменений и дополнений в некоторые указы Президента Республики Казахстан по вопросам государственной службы и противодействия коррупции
    kaz: Қазақстан Республикасы Президентінің кейбір жарлықтарына мемлекеттік қызмет және сыбайлас жемқорлыққа қарсы іс-қимыл мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
