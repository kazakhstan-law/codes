  code: '106796'
  requisite: Указ Президента Республики Казахстан от 5 октября 2016 года № 349
  title:
    rus: О некоторых вопросах Агентства Республики Казахстан по делам государственной службы и противодействию коррупции и внесении изменений и дополнений в некоторые акты Президента Республики Казахстан
    kaz: Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің кейбір мәселелері және Қазақстан Республикасы Президентінің кейбір актілеріне өзгерістер мен толықтырулар енгізу туралы
