  title:
    rus: О внесении изменений в указы Президента Республики Казахстан от 29 декабря 2015 года № 150 «Об утверждении Реестра должностей политических и административных государственных служащих» и № 151 «О некоторых вопросах поступления граждан на административную государственную службу корпуса «А»
    kaz: Қазақстан Республикасы Президентінің 2015 жылғы 29 желтоқсандағы «Мемлекеттік саяси және әкімшілік қызметшілер лауазымдарының тізілімін бекіту туралы» № 150 және «Азаматтардың «А» корпусының мемлекеттік әкімшілік қызметіне кіруінің кейбір мәселелері туралы» № 151 жарлықтарына өзгерістер енгізу туралы
