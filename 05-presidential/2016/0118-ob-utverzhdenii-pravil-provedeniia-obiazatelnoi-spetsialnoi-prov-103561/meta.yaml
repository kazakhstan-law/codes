title:
  rus: Об утверждении Правил проведения обязательной специальной проверки органами национальной безопасности Республики Казахстан иностранных работников при приеме на работу в государственные органы Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттік органдарына жұмысқа қабылдау кезінде шетелдік жұмыскерлерге Қазақстан Республикасы ұлттық қауіпсіздік органдарының міндетті арнайы тексеру жүргізу қағидаларын бекіту туралы
