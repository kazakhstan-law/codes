title:
  rus: О перечне должностей Вооруженных Сил, других войск и воинских формирований, специальных государственных и правоохранительных органов Республики Казахстан, замещаемых лицами высшего офицерского и начальствующего состава
  kaz: Жоғары офицерлік және басшы құрамның адамдары атқаратын Қазақстан Республикасының Қарулы Күштері, басқа да әскерлері мен әскери құралымдары, арнаулы мемлекеттік және құқық қорғау органдары лауазымдарының тізбесі туралы
