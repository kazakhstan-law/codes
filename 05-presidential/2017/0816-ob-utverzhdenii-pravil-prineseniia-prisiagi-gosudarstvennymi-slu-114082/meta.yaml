title:
  rus: Об утверждении Правил принесения присяги государственными служащими, депутатами Парламента Республики Казахстан и судьями Конституционного Суда Республики Казахстан
  kaz: Мемлекеттік қызметшілердің, Қазақстан Республикасының Парламенті депутаттарының және Қазақстан Республикасының Конституциялық Соты судьяларының ант беру қағидаларын бекіту туралы
