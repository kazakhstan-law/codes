  title:
    rus: О внесении изменений и дополнений в указы Президента Республики Казахстан от 5 августа 2002 года № 917 «Об утверждении Положения о Счетном комитете по контролю за исполнением республиканского бюджета» и от 24 ноября 2017 года № 590 «О рейтинге регионов и городов по легкости ведения бизнеса и присуждении специальной премии по его итогам»
    kaz: Қазақстан Республикасы Президентінің «Республикалық бюджеттiң атқарылуын бақылау жөнiндегi есеп комитетi туралы ереженi бекiту туралы» 2002 жылғы 5 тамыздағы № 917 және «Бизнесті жүргізу жеңілдігі бойынша өңірлер мен қалалар рейтингі және оның қорытындылары бойынша арнайы сыйлық беру туралы» 2017 жылғы 24 қарашадағы № 590 жарлықтарына өзгерістер мен толықтырулар енгiзу туралы
