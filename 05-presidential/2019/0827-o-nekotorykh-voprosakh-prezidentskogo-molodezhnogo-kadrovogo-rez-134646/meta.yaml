  title:
    rus: О внесении изменений и дополнения в указы Президента Республики Казахстан от 27 августа 2019 года № 141 «О некоторых вопросах Президентского молодежного кадрового резерва» и от 15 июня 2023 года № 255 «Об утверждении Правил формирования регионального кадрового резерва области, города республиканского значения, столицы и назначения из него и внесении изменений в указы Президента Республики Казахстан от 7 марта 2013 года № 520 «О Национальной комиссии по кадровой политике при Президенте Республики Казахстан и кадровых комиссиях областей, городов республиканского значения, столицы» и 27 августа 2019 года № 141 «О некоторых вопросах Президентского молодежного кадрового резерва»
    kaz: Қазақстан Республикасы Президентінің «Президенттік жастар кадр резервінің кейбір мәселелері туралы» 2019 жылғы 27 тамыздағы № 141 және «Облыстың, республикалық маңызы бар қаланың, астананың өңірлік кадр резервін қалыптастыру және одан тағайындау қағидаларын бекіту және Қазақстан Республикасы Президентінің «Қазақстан Республикасының Президенті жанындағы Кадр саясаты жөніндегі ұлттық комиссия және облыстардың, республикалық маңызы бар қалалардың, астананың кадр комиссиялары туралы» 2013 жылғы 7 наурыздағы № 520 және «Президенттік жастар кадр резервінің кейбір мәселелері туралы» 2019 жылғы 27 тамыздағы № 141 жарлықтарына өзгерістер енгізу туралы» 2023 жылғы 15 маусымдағы № 255 жарлықтарына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/190498/rus
