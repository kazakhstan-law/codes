    rus: О внесении изменений в указы Президента Республики Казахстан от 7 марта 2013 года № 520 «О Национальной комиссии по кадровой политике при Президенте Республики Казахстан и кадровых комиссиях областей, городов республиканского значения, столицы» и от 27 августа 2019 года № 141 «О некоторых вопросах Президентского молодежного кадрового резерва»
