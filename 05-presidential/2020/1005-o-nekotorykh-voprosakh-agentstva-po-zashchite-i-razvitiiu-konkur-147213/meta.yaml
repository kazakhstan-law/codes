  title:
    rus: О внесении изменения и дополнений в указы Президента Республики Казахстан от 22 января 1999 года № 29 «О мерах по дальнейшей оптимизации системы государственных органов Республики Казахстан» и от 5 октября 2020 года № 428 «О некоторых вопросах Агентства по защите и развитию конкуренции Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасының мемлекеттік органдары жүйесін одан әрі оңтайландыру жөніндегі шаралар туралы» 1999 жылғы 22 қаңтардағы № 29 және «Қазақстан Республикасының Бәсекелестікті қорғау және дамыту агенттігінің кейбір мәселелері туралы» 2020 жылғы 5 қазандағы № 428 жарлықтарына өзгеріс пен толықтырулар енгізу туралы
