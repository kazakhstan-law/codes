title:
  rus: Об утверждении Правил дачи согласия депутатами маслихата столицы, маслихатов, расположенных на территории области, маслихатов городов республиканского значения на назначение на должность акима столицы, области и города республиканского значения
  kaz: Астана мәслихаты, облыс аумағында орналасқан мәслихаттар, республикалық маңызы бар қалалар мәслихаттары депутаттарының астана, облыс және республикалық маңызы бар қала әкімін лауазымға тағайындауға келісім беруі қағидаларын бекіту туралы
