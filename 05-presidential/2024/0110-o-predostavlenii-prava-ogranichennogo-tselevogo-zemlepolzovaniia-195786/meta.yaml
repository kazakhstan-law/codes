act_code: '195786'
requisite: Распоряжение акима поселка Сарыколь Сарыкольского района Костанайской области от 10 января 2024 года № 9-р
title:
  rus: О предоставлении права ограниченного целевого землепользования (публичного сервитута) на земельный участок акционерному обществу «Казахтелеком» для прокладки, обслуживания и эксплуатации волоконно-оптической линии связи по объекту «Строительство ВОЛС для сегмента В2G, Костанайская область»
  kaz: «Қостанай облысы, В2G сегменті үшін талшықты-оптикалық байланыс желілерін салу» бойынша талшықты-оптикалық байланыс  желісін орнату, техникалық қызмет көрсету және пайдалану үшін «Қазақтелеком» акционерлік қоғамына жер учаскесіне шектеулі нысаналы жер пайдалану (қоғамдық сервитут) құқығын беру туралы
