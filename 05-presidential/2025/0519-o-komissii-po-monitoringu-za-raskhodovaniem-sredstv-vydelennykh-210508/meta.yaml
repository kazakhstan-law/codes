  title:
    rus: О внесении изменений и дополнений в указы Президента Республики Казахстан от 26 ноября 2022 года № 5 «О некоторых вопросах Высшей аудиторской палаты Республики Казахстан» и от 19 мая 2025 года № 879 «О Комиссии по мониторингу за расходованием средств, выделенных из Национального фонда Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасы Жоғары аудиторлық палатасының кейбір мәселелері туралы» 2022 жылғы 26 қарашадағы № 5 және «Қазақстан Республикасының Ұлттық қорынан бөлінген қаражаттың жұмсалуын мониторингтеу жөніндегі комиссия туралы» 2025 жылғы 19 мамырдағы № 879 жарлықтарына өзгерістер мен толықтырулар енгізу туралы
