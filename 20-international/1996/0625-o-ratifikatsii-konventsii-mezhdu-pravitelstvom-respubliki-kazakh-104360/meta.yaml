act_code: '104360'
requisite: Закон Республики Казахстан от 26 июня 1996 года N 12-1
title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Соединенного Королевства Великобритании и Северной Ирландии об устранении двойного налогообложения и предотвращении уклонения от уплаты налогов на доходы и прирост стоимости имущества
  kaz: Қазақстан Республикасы Үкiметi мен Ұлыбритания және Солтүстiк Ирландия Құрама Корольдiгi Үкiметiнiң арасындағы Қос салық салуды жою және табыс пен мүлiк құнының өсiмiне салынатын салықты төлеуден жалтаруды болғызбау туралы конвенцияны бекiту жөнiнде
