act_code: '104362'
requisite: Закон Республики Казахстан от 26 июня 1996 года № 14-I
title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доходы и капитал, подписанной в Алматы 24 октября 1993 года, Меморандума взаимопонимания в отношении некоторых положений Конвенции между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доходы и капитал и обмена Нотами в отношении налоговой Конвенции и Генерального Соглашения по Торговле Услугами (ГСТУ)
  kaz: 1993 жылғы 24 қазанда Алматыда қол қойылған Қазақстан Республикасының Үкiметi мен Америка Құрама Штаттарының Үкiметi арасындағы Қосарланған салық салуға жол бермеу және кiрiстер мен капиталға салынатын салықтарға қатысты салық салудан жалтаруды болғызбау туралы конвенцияны, Қазақстан Республикасының Үкiметi мен Америка Құрама Штаттарының Үкiметi арасындағы Қосарланған салық салуға жол бермеу және кiрiстер мен капиталға салынатын салықтарға қатысты салық салудан жалтаруды болғызбау туралы конвенцияның кейбiр ережелерi жөнiндегi өзара түсiнiстiк Меморандумын және Салық конвенциясы мен Көрсетiлетiн қызметтер Саудасы жөнiндегi Бас Келiсiмге (КҚСБК) қатысты Ноталар алмасуды бекiту туралы
