title:
  rus: О ратификации Соглашения по вопросам, связанным с восстановлением прав депортированных лиц, национальных меньшинств и народов, заключенного в городе Бишкеке 9 октября 1992 года между Республикой Армения, Республикой Беларусь, Республикой Казахстан, Республикой Кыргызстан, Республикой Молдова, Российской Федерацией, Республикой Таджикистан, Туркменистаном, Республикой Узбекистан, Украиной
