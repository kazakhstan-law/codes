title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики по сотрудничеству в обеспечении качества и взаимном освидетельствовании импортно-экспортных товаров
  kaz: Қазақстан Республикасының Үкiметi мен Қытай Халық Республикасының Үкiметi арасындағы Импорт-экспорт тауарларын сапамен қамтамасыз етудегi және өзара куәландырудағы ынтымақтастық жөнiндегi келiсiмдi бекiту туралы
