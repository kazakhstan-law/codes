title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Грузии о реструктуризации задолженности Правительства Грузии по государственным кредитам, предоставленным Правительству Грузии Правительством Республики Казахстан
  kaz: Қазақстан Республикасы Үкiметi мен Грузия Үкiметi арасындағы Қазақстан Республикасы Үкiметiнiң Грузия Үкiметiне берген мемлекеттiк несиелерi бойынша Грузия Үкiметiнiң қарызын қайта құрылымдау туралы келiсiмдi бекiту туралы
