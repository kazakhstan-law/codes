title:
  rus: О ратификации Временного Договора по торговле и связанным с ней вопросам между Европейским Сообществом, Европейским объединением по углю и стали, Европейским сообществом по атомной энергии, с одной стороны, и Республикой Казахстан, с другой стороны
  kaz: Сауда және соған байланысты мәселелер бойынша, бiр жағынан, Еуропалық қоғамдастық, Көмiр мен болат жөнiндегi еуропалық бiрлестiк, Атом энергиясы жөнiндегi еуропалық қоғамдастық және, екiншi жағынан, Қазақстан Республикасы арасындағы Уақытша Шартты бекiту туралы
