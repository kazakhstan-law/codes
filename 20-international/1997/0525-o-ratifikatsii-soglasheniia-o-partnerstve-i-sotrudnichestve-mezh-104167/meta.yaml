  code: '72062'
  requisite: Закон Республики Казахстан от 16 апреля 2013 года № 90-V ЗРК
  title:
    rus: О ратификации Протокола к Соглашению о партнерстве и сотрудничестве между Республикой Казахстан, с одной стороны, и Европейскими Сообществами и их государствами-членами, с другой стороны, касательно распространения действия положений Соглашения о партнерстве и сотрудничестве на двустороннюю торговлю текстилем с учетом истечения срока действия двустороннего Соглашения по торговле текстильными изделиями
    kaz: Бiр жағынан, Қазақстан Республикасы мен екiншi жағынан, Еуропалық Қоғамдастықтардың және оларға мүше мемлекеттердiң арасындағы Әрiптестiк пен ынтымақтастық туралы келісімге Тоқыма бұйымдарымен сауда жөніндегі екі жақты келісімнің қолданылу мерзімінің аяқталуын ескере отырып, Әріптестік пен ынтымақтастық туралы келісім ережелерінің күшін тоқымамен екі жақты саудаға қолдануға қатысты хаттаманы ратификациялау туралы
  link: https://zan.gov.kz/client/#!/doc/72062/rus
