title:
  rus: О ратификации Соглашения о партнерстве и сотрудничестве между Республикой Казахстан, с одной стороны, и Европейскими Сообществами и их Государствами - членами, с другой стороны
  kaz: Бiр жағынан, Қазақстан Республикасы мен екiншi жағынан, Еуропалық Қоғамдастықтардың және оларға мүше мемлекеттердiң арасындағы Әрiптестiк пен ынтымақтастық туралы келiсiмдi бекiту туралы
