title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Исламской Республики Иран об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доходы и капитал
  kaz: Қазақстан Республикасының Үкiметi мен Иран Ислам Республикасының Үкiметi арасындағы Қосарланған салық салуды болдырмау және табыс пен капиталға қатысты салық салудан жалтаруға жол бермеу туралы келiсiмдi бекiту туралы
