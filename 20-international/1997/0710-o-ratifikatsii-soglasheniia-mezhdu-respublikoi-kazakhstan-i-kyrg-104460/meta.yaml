title:
  rus: О ратификации Соглашения между Республикой Казахстан и Кыргызской Республикой об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и на капитал
  kaz: Қазақстан Республикасы мен Қырғыз Республикасының арасындағы табысқа қосарланған салық салуды болдырмау және табыс пен капитал салықтарына қатысты салық төлеуден жалтаруға жол бермеу туралы келiсiмдi бекiту туралы
