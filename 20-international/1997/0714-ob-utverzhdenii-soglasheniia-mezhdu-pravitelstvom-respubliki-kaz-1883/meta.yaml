  code: '112735'
  requisite: Закон Республики Казахстан от 13 июня 2017 года № 71-VI ЗРК
  title:
    rus: О ратификации Протокола о внесении изменений в Соглашение между Правительством Республики Казахстан и Правительством Российской Федерации об особенностях правового регулирования деятельности предприятий, учреждений и организаций железнодорожного транспорта от 18 октября 1996 года
    kaz: 1996 жылғы 18 қазандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясы Үкіметінің арасындағы теміржол көлігі кәсіпорындарының, мекемелері мен ұйымдарының қызметін құқықтық реттеудің ерекшеліктері туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
