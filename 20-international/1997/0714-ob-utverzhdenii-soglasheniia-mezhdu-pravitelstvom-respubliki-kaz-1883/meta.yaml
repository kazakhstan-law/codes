act_code: '1883'
requisite: Постановление Правительства Республики Казахстан от 15 июля 1997 года № 1114
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об особенностях правового регулирования деятельности предприятий, учреждений и организаций железнодорожного транспорта
  kaz: Қазақстан Республикасының Үкiметi мен Ресей Федерациясы Үкiметiнiң арасындағы темiржол көлiгi кәсiпорындарының мекемелерi мен ұйымдарының қызметiн құқықтық реттеудiң ерекшелiктерi туралы келiсiмдi бекiту туралы
