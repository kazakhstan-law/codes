act_code: '104449'
requisite: Закон Республики Казахстан от 16 июля 1997 года № 164-I
title:
  rus: О ратификации Соглашения между Республикой Казахстан, Кыргызской Республикой и Республикой Узбекистан "О внесении изменений и дополнений к Соглашению между Республикой Казахстан, Кыргызской Республикой и Республикой Узбекистан "Об учреждении Центральноазиатского банка сотрудничества и развития от 8 июля 1994 года"
  kaz: '"Орталық Азия ынтымақтастық және даму банкiн құру туралы" Қазақстан Республикасы, Қырғыз Республикасы және Өзбекстан Республикасы арасындағы 1994 жылғы 8 шiлдедегi Келiсiмге өзгерiстер мен толықтырулар енгiзу туралы" Қазақстан Республикасы, Қырғыз Республикасы және Өзбекстан Республикасы арасындағы келiсiмдi бекiту туралы'
