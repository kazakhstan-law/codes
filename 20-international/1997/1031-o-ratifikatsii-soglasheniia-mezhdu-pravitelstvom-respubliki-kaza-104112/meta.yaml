act_code: '104112'
requisite: Закон Республики Казахстан от 31 октября 1997 года № 184-I
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов в отношении налогов на доходы и имущество
  kaz: Табыс пен мүлiкке қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы Қазақстан Республикасының Үкiметi мен Беларусь Республикасының Үкiметi арасындағы келiсiмдi бекiту туралы
