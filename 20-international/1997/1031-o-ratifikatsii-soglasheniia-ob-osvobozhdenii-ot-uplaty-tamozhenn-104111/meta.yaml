  title:
    rus: О ратификации Протокола о внесении изменений в Соглашение об освобождении от уплаты таможенных пошлин, налогов и выдачи специальных разрешений за провоз нормативных документов, эталонов, средств измерений и стандартных образцов, провозимых с целью поверки и метрологической аттестации от 10 февраля 1995 года
    kaz: 1995 жылғы 10 ақпандағы Тексеру және метрологиялық аттестациялау мақсатында алып өтілетін нормативтік құжаттарды, эталондарды, өлшеу құралдарын және стандарттық үлгілерді алып өткені үшін кеден бажын, салықтар төлеуден және арнайы рұқсат беруден босату туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
