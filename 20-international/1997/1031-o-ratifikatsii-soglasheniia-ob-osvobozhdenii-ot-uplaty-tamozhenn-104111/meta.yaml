act_code: '104111'
requisite: Закон Республики Казахстан от 31 октября 1997 г. № 183
title:
  rus: О ратификации Соглашения об освобождении от уплаты таможенных пошлин, налогов и выдачи специальных разрешений за провоз нормативных документов, эталонов, средств измерений и стандартных образцов, провозимых с целью поверки калибровки, сличения и метрологической аттестации
  kaz: Тексеру калибрлеу, салыстыру және метрологиялық аттестациялау мақсатында алып өтiлетiн нормативтiк құжаттарды, эталондарды, өлшеу құралдарын және стандарттық үлгiлердi алып өткенi үшiн кеден бажын, салықтар төлеуден және арнайы рұқсат беруден босату туралы келiсiмдi бекiту туралы
