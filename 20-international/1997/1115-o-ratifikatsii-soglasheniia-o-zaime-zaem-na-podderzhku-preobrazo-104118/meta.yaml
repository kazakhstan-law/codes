title:
  rus: О ратификации Соглашения о займе (Заем на поддержку преобразований управления ресурсами государственного сектора) между Республикой Казахстан и Международным Банком Реконструкции и Развития от 4 сентября 1997 года
  kaz: Қазақстан Республикасы мен Халықаралық Қайта құру және Даму Банкi арасындағы 1997 жылғы 4 қыркүйектегi Қарыз туралы келiсiмдi (Мемлекеттiк сектор ресурстарын басқарудағы құрылымдық қайта құруды қолдауға арналған заем) бекiту туралы
