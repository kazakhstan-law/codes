title:
  rus: О ратификации Соглашения между Республикой Казахстан и Республикой Беларусь об упрощенном порядке приобретения гражданства гражданами Республики Казахстан, прибывающими для постоянного проживания в Республику Беларусь, и гражданами Республики Беларусь, прибывающими для постоянного проживания в Республику Казахстан
  kaz: Қазақстан Республикасы мен Беларусь Республикасы арасындағы Тұрақты тұру үшiн Беларусь Республикасына баратын Қазақстан Республикасы азаматтарының және тұрақты тұру үшiн Қазақстан Республикасына келетiн Беларусь Республикасы азаматтарының азаматтық алуының оңайлатылған тәртiбi туралы келiсiмдi бекiту туралы
