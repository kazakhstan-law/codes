act_code: '623'
requisite: Закон Республики Казахстан от 8 мая 1998 г. № 225
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о транзитной перевозке пассажиров, грузов и багажа, обеспечении их сохранности и безопасности при следовании по автомобильным и железнодорожным магистралям Республики Казахстан и Республики Узбекистан
  kaz: Қазақстан Республикасының Үкiметi мен Өзбекстан Республикасы Үкiметiнiң арасындағы Жолаушыларды, жүктердi және багаждарды транзиттiк тасымалдау, Қазақстан Республикасы мен Өзбекстан Республикасының автомобиль және темiр жол магистральдары арқылы жүруi барысында олардың сақталуы мен қауiпсiздiгiн қамтамасыз ету туралы келiсiмдi бекiту туралы
