title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о принципах взимания косвенных налогов при экспорте и импорте товаров (работ, услуг)
  kaz: Қазақстан Республикасының Үкiметi мен Өзбекстан Республикасы Үкiметiнiң арасындағы Тауарлардың (жұмыстардың, қызмет көрсетулердiң) экспорты мен импорты кезiнде жанама салықтар алудың принциптерi туралы келiсiмдi бекiту туралы
