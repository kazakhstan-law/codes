act_code: '1429'
requisite: Постановление Правительства Республики Казахстан от 25 июня 1998 года № 603
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Украины о временном использовании земельного участка на территории Республики Казахстан в качестве района падения отделяющихся частей ракеты-носителя "Зенит"
  kaz: Қазақстан Республикасының Үкіметі мен Украина Үкіметі арасындағы Қазақстан Республикасы аумағындағы жер учаскесін "Зенит" зымыран-тасығышының бөлінетін бөлшектері түсетін аудан ретінде уақытша пайдалану туралы келісімді бекіту туралы
