act_code: '848'
requisite: Закон Республики Казахстан от 29 июня 1998 года № 239
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Азербайджанской Республики о принципах взимания косвенных налогов при экспорте и импорте товаров (работ, услуг)
  kaz: Қазақстан Республикасының Үкiметi мен Әзiрбайжан Республикасының Үкiметi арасындағы Тауарларды (жұмыстарды, қызметтердi) экспорттау-импорттау кезiнде өзара жанама салықтар алу принциптерi туралы келiсiмдi бекiту туралы
