act_code: '922'
requisite: Закон Республики Казахстан от 29 июня 1998 года № 250-I
title:
  rus: О ратификации Соглашения между Республикой Казахстан и Исламским Банком Развития о полномочиях Республики Казахстан закупать и продавать оборудование в качестве агента от имени Банка и за Банк для использования в проекте Научного центра хирургии им. Сызганова
  kaz: Қазақстан Республикасы мен Ислам Даму Банкiнiң арасындағы Қазақстан Республикасының Сызғанов атындағы Хирургия ғылыми орталығының жобасына пайдалану үшiн агент ретiнде Банктiң атынан және Банк үшiн жабдықтар сатып алуға және сатуға өкiлеттiгi туралы келiсiмдi бекiту туралы
