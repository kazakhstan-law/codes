act_code: '965'
requisite: Закон Республики Казахстан от 9 июля 1998 года № 275-I
title:
  rus: О ратификации Протокола между Правительством Республики Казахстан и Правительством Соединенного Королевства Великобритании и Северной Ирландии об изменениях Конвенции об устранении двойного налогообложения и предотвращении уклонения от уплаты налогов на доходы и прирост стоимости имущества, подписанной от имени Договаривающихся Государств 21 марта 1994 года в Лондоне
  kaz: Қазақстан Республикасының Үкiметi мен Ұлыбритания және Солтүстiк Ирландия Құрама Корольдiгiнiң Үкiметi арасындағы 1994 жылғы 21 наурызда Лондонда Уағдаласышы Мемлекеттер атынан қол қойылған Табысқа және мүлiк құнының өсуiне қосарланған салық салуды жою және салық төлеуден жалтаруға жол бермеу туралы конвенциядағы өзгерiстер туралы Хаттаманы бекiту туралы
