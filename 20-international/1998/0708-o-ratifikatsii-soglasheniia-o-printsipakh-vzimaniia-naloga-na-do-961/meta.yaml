title:
  rus: О ратификации Соглашения о принципах взимания налога на добавленную стоимость при экспорте и импорте товаров (работ, услуг) между Правительством Республики Казахстан и Правительством Кыргызской Республики
  kaz: Қазақстан Республикасының Үкiметi мен Қырғыз Республикасының Үкiметi арасындағы Тауарларды (жұмыстарды, қызметтердi) экспорттау және импорттау кезiнде қосылған құн салығын алудың принциптерi туралы келiсiмдi бекiту туралы
