act_code: '1549'
requisite: Закон Республики Казахстан от 9 ноября 1998 года № 292-I
title:
  rus: О ратификации Договора между Республикой Казахстан и Литовской Республикой о правовой помощи и правовых отношениях по гражданским, семейным и уголовным делам и Протокола к Договору между Республикой Казахстан и Литовской Республикой о правовой помощи и правовых отношениях по гражданским, семейным и уголовным делам
  kaz: Қазақстан Республикасы мен Литва Республикасының арасындағы Азаматтық, отбасылық және қылмыстық істер бойынша құқықтық көмек және құқықтық қатынастар туралы шартты және Қазақстан Республикасы мен Литва Республикасының арасындағы Азаматтық, отбасылық және қылмыстық істер бойынша құқықтық көмек және құқықтық қатынастар туралы шартқа Хаттаманы бекіту туралы
