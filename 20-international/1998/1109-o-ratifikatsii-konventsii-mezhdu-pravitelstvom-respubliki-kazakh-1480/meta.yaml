act_code: '1480'
requisite: Закон Республики Казахстан от 9 ноября 1998 года № 289
title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Французской Республики об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доходы и имущество
  kaz: Қазақстан Республикасының Yкіметі мен Француз Республикасының Yкіметі арасындағы табыс пен мүлікке қосарланған салық салуды болғызбау және салық төлеуден жалтаруға жол бермеу туралы конвенцияны бекiту жөнiнде
