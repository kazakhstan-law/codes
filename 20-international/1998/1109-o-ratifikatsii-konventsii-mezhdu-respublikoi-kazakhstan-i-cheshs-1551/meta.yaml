act_code: '1551'
requisite: Закон Республики Казахстан от 9 ноября 1998 года № 294-I
title:
  rus: О ратификации Конвенции между Республикой Казахстан и Чешской Республикой об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов в отношении налогов на доход и на капитал
  kaz: Қазақстан Республикасы мен Чех Республикасы арасындағы Табыс пен капиталға салынатын салыққа қатысты қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы конвенцияны бекіту жөнінде
