act_code: '1553'
requisite: Закон Республики Казахстан от 9 ноября 1998 года № 296-I
title:
  rus: О ратификации Конвенции между Республикой Казахстан и Королевством Бельгия об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов в отношении налогов на доход и капитал
  kaz: Қазақстан Республикасы мен Бельгия Корольдігі арасындағы Табыс пен капиталға салынатын салыққа қатысты қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы конвенцияны бекіту жөнінде
