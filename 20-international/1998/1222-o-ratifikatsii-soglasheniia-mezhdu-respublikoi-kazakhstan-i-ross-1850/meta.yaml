title:
  rus: О ратификации Соглашения между Республикой Казахстан и Российской Федерацией о статусе города Байконур, порядке формирования и статусе его органов исполнительной власти
  kaz: Қазақстан Республикасы мен Ресей Федерациясы арасындағы Байқоңыр қаласының мәртебесі және ондағы атқарушы өкімет органдарын құрудың тәртібі мен олардың мәртебесі туралы келісімді бекіту туралы
