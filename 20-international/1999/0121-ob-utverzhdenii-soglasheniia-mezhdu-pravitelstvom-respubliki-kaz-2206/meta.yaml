act_code: '2206'
requisite: Постановление Правительства Республики Казахстан от 21 января 1999 года № 46
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о военном контроле за качеством продукции, поставляемой для Вооруженных Сил Республики Казахстан и Вооруженных Сил Республики Беларусь
  kaz: Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы Қазақстан Республикасының Қарулы Күштері мен Беларусь Республикасының Қарулы Күштері үшін жеткізіліп тұрылатын өнімдердің сапасына әскери бақылау жасау туралы келісімді бекіту туралы
