title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Исполнительной Властью Грузии о сотрудничестве в области экологически чистого автоматизированного специального транспорта и его инфраструктуры
  kaz: Қазақстан Республикасының Үкіметі мен Грузияның Атқарушы Өкіметінің арасындағы Автоматтандырылған экологиялық таза арнайы көлік пен оның инфрақұрылымы саласы бойынша ынтымақтастық туралы келісімді бекіту туралы
