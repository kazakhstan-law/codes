title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки о сотрудничестве и взаимопомощи между таможенными службами этих стран
  kaz: Қазақстан Республикасының Үкіметі мен Америка Құрама Штаттарының Үкіметі арасындағы осы елдердің кеден қызметтері арасындағы ынтымақтастық пен өзара көмек туралы келісімді бекіту туралы
