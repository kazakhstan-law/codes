act_code: '2935'
requisite: Закон Республики Казахстан от 11 мая 1999 года № 380
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Украины о принципах взимания косвенных налогов при экспорте и импорте товаров (работ, услуг)
  kaz: Қазақстан Республикасының Үкіметі мен Украина Үкіметі арасындағы Тауарлардың (жұмыстардың, қызметтердің) экспорты мен импорты кезінде жанама салықтарды алудың принциптері туралы келісімді бекіту жөнінде
