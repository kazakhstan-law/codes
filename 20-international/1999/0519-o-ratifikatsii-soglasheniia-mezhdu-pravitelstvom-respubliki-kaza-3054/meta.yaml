act_code: '3054'
requisite: Закон Республики Казахстан от 20 мая 1999 г. № 386-I
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики об особенностях правового регулирования деятельности предприятий, учреждений и организаций железнодорожного транспорта
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Темір жол көлігінің кәсіпорындары, мекемелері мен ұйымдарының қызметін құқықтық реттеудің ерекшеліктері туралы келісімді бекіту туралы
