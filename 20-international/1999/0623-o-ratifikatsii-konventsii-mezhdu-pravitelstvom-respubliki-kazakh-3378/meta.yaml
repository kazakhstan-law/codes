act_code: '3378'
requisite: Закон Республики Казахстан от 24 июня 1999 года № 401-I
title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Румынии об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и капитал
  kaz: Қазақстан Республикасының Үкіметі мен Румыния Үкіметінің арасындағы табыс пен капиталға салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы конвенцияны бекіту туралы
