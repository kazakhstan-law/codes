title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Грузии о принципах взимания косвенных налогов при экспорте и импорте товаров (работ, услуг)
  kaz: Қазақстан Республикасының Үкіметі мен Грузия Үкіметі арасындағы тауарларды (жұмыстарды, қызмет көрсетулерді) экспорттау мен импорттау кезіндегі жанама салықтарды алу принциптері туралы келісімді бекіту туралы
