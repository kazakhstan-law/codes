act_code: '3416'
requisite: Постановление Правительства Республики Казахстан от 30 июня 1999 года № 895
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Чешской Республики о сотрудничестве в борьбе с организованной преступностью, незаконным оборотом наркотических средств и психотропных веществ, терроризмом и другими опасными видами преступлений
  kaz: Қазақстан Республикасының Үкіметі мен Чех Республикасы Үкіметінің арасындағы Ұйымдасқан қылмысқа, есірткілік құралдар мен психотроптық заттардың заңсыз айналымына, терроризмге және қылмыстың басқа да қауіпті түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
