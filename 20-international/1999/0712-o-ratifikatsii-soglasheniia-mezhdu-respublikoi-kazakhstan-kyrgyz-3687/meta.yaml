title:
  rus: О ратификации Соглашения между Республикой Казахстан, Кыргызской Республикой, Республикой Таджикистан и Республикой Узбекистан о правовом статусе должностных лиц и сотрудников Исполкома Межгоссовета государств-участников Договора о создании единого экономического пространства
  kaz: Қазақстан Республикасы, Қырғыз Республикасы, Тәжікстан Республикасы және Өзбекстан Республикасы арасындағы Біртұтас экономикалық кеңістік туралы шартқа қатысушы мемлекеттердің Мемлекетаралық кеңесі Атқарушы комитетінің лауазымды адамдары мен қызметкерлерінің құқықтық мәртебесі туралы келісімді бекіту туралы
