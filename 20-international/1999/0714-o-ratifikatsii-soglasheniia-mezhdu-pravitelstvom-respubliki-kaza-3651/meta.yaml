act_code: '3651'
requisite: Закон Республики Казахстан от 15 июля 1999 года № 423-I
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о социальных гарантиях граждан Республики Казахстан и Российской Федерации, проживающих и/или работающих на комплексе "Байконур"
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы "Байқоңыр" кешенінде тұратын және/немесе жұмыс істейтін Қазақстан Республикасы мен Ресей Федерациясы азаматтарының әлеуметтік кепілдіктері туралы келісімді бекіту туралы
