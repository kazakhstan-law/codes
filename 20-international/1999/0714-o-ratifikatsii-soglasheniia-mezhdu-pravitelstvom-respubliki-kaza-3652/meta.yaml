    kaz: 1998 жылғы 12 қазандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының Ресей Федерациясындағы және Ресей Федерациясының Қазақстан Республикасындағы дипломатиялық өкілдіктері мен консулдық мекемелерін орналастыру және оларға қызмет көрсету шарттары туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
