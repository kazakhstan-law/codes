act_code: '3652'
requisite: Закон Республики Казахстан от 15 июля 1999 года № 424-I
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об условиях размещения и обслуживания дипломатических представительств и консульских учреждений Республики Казахстан в Российской Федерации и Российской Федерации в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының Ресей Федерациясындағы және Ресей Федерациясының Қазақстан Республикасындағы дипломатиялық өкілдіктері мен консулдық мекемелерін орналастыру және оларға қызмет көрсету шарттары туралы келісімді бекіту туралы
