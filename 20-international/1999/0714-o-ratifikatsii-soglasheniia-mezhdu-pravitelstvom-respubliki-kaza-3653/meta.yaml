title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о гарантиях пенсионных прав жителей города Байконыр Республики Казахстан
  kaz: Қазақстан Республикасының Байқоңыр қаласы тұрғындарының зейнетақы алу құқығының кепілдіктері туралы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы келісімді бекіту туралы
