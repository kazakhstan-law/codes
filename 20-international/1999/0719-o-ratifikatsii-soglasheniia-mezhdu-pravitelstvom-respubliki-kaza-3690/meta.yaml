title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о принципах взимания косвенных налогов при экспорте и импорте товаров (работ)
  kaz: Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы Тауарларды (жұмыстарды) экспорттау және импорттау кезінде жанама салықтарды өндіріп алудың принциптері туралы келісімді бекіту туралы
