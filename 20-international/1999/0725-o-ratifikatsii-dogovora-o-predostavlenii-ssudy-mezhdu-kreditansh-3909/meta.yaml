act_code: '3909'
requisite: Закон Республики Казахстан от 26 июля 1999 года № 461-I
title:
  rus: О ратификации Договора о предоставлении ссуды между Кредитанштальт фюр Видерауфбау ("КфВ"), Франкфурт-на-Майне, и Республикой Казахстан ("Ссудополучатель"), представленный Министерством финансов, на сумму 27000000 немецких марок - Кредитная линия для содействия малому и среднему предпринимательству
  kaz: Шағын және орта кәсіпкерлікке көмек көрсетуге арналған Несие Желісі 27 000 000 неміс маркасы сомасында Қаржы министрлігі бөлген Майндағы Франкфрут, Кредитанштальт фюр Видерауфбау ("КфВ") мен Қазақстан Республикасы ("Қарыз алушы") арасындағы қарыз беру туралы шартты бекіту туралы
