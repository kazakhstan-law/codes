act_code: '3887'
requisite: Постановление Правительства Республики Казахстан от 20 августа 1999 года N 1217
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Латвийской Республики об использовании портов Латвийской Республики для обработки и транспортировки грузов Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Латвия Республикасының Үкіметі арасындағы Қазақстан Республикасының жүктерін өңдеу және тасымалдау үшін Латвия Республикасының порттарын пайдалану туралы келісімді бекіту туралы
