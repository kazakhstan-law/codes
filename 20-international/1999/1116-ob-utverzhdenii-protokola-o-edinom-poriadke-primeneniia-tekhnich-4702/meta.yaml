act_code: '4702'
requisite: Постановление Правительства Республики Казахстан от 16 ноября 1999 года N 1716
title:
  rus: Об утверждении Протокола о едином порядке применения технических, медицинских, фармацевтических, санитарных, ветеринарных, фитосанитарных и экологических стандартов, норм, правил и требований в отношении товаров, ввозимых в государства-участники соглашений о Таможенном союзе
  kaz: Кедендік одақ туралы келісімге қатысушы мемлекеттерге әкелінетін тауарларға қатысты техникалық, медициналық, фармацевтикалық, санитарлық, мал дәрігерлік, фитосанитарлық және экологиялық стандарттардың, нормалардың, ережелердің және талаптардың қолданылуының бірыңғай тәртібі туралы хаттаманы бекіту туралы
