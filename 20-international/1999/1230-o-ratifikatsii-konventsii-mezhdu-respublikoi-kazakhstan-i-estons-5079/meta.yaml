act_code: '5079'
requisite: Закон Республики Казахстан от 30 декабря 1999 года № 30
title:
  rus: О ратификации Конвенции между Республикой Казахстан и Эстонской Республикой об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов на доход и на капитал
  kaz: Қазақстан Республикасы мен Эстония Республикасы арасындағы табысқа және капиталға қатысты қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы конвенцияны бекіту туралы
