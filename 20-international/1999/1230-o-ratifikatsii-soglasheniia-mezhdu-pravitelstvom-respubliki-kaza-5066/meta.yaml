title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Федеративной Республики Германия о международных автомобильных перевозках пассажиров и грузов
  kaz: Қазақстан Республикасының Үкіметі мен Германия Федеративтік Республикасының Үкіметі арасындағы Жолаушылар мен жүктердің халықаралық автомобиль тасымалдары туралы келісімді бекіту туралы
