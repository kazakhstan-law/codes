title:
  rus: Об утверждении Соглашения между Министерством культуры, информации и общественного согласия Республики Казахстан и Министерством культуры Республики Беларусь о сотрудничестве в области культуры и искусства
  kaz: Қазақстан Республикасының Мәдениет, ақпарат және қоғамдық келісім министрлігі мен Беларусь Республикасының Мәдениет министрлігі арасындағы мәдениет және өнер саласындағы ынтымақтастық туралы келісімді бекіту туралы
