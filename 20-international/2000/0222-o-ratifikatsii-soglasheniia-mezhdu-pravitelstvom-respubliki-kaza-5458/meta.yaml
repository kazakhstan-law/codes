title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Кувейтским Фондом Арабского Экономического Развития по использованию гранта на проект строительства нового правительственного здания
  kaz: Қазақстан Республикасының Yкiметi мен Араб Экономикалық Дамуының Кувейттiк Қоры арасындағы жаңа үкiметтiк ғимарат құрылысы жобасына арналған грантты пайдалану жөнiндегi келiсiмдi бекiту туралы
