act_code: '6015'
requisite: Постановление Правительства Республики Казахстан от 24 мая 2000 года N 783
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан, Национальным Банком Республики Казахстан и Правительством Республики Таджикистан, Национальным банком Таджикистана о мерах по обеспечению взаимной конвертируемости и стабилизации курсов казахстанского тенге и таджикского рубла
  kaz: Қазақстан Республикасының Үкіметі, Қазақстан Республикасының Ұлттық Банкі және Тәжікстан Республикасының Үкіметі, Тәжікстан Ұлттық Банкі арасындағы қазақстан теңгесі мен тәжік рублінің өзара айырбасталымдылығын және бағамын тұрақтандыруды қамтамасыз ету жөніндегі шаралар туралы келісімді бекіту туралы
