act_code: '6228'
requisite: Постановление Правительства Республики Казахстан от 16 июня 2000 года № 907
title:
  rus: Об утверждении Соглашения между Таможенным комитетом Министерства государственных доходов Республики Казахстан и Министерством государственных доходов Республики Армения о сотрудничестве в борьбе с контрабандой и нарушениями таможенных правил, а также с незаконным оборотом наркотических средств, психотропных веществ и прекурсоров
  kaz: Қазақстан Республикасы Мемлекеттік кіріс министрлігінің Кеден комитеті мен Армения Республикасы Мемлекеттік кіріс министрлігінің арасындағы Контрабандаға және кеден ережелерін бұзуға, сондай-ақ есірткі құралдарының, психотроптық заттардың және прекурсорлардың заңсыз айналымына қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
