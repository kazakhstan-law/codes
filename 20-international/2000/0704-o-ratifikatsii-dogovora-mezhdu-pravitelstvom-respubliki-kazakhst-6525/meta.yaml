act_code: '6525'
requisite: Закон Республики Казахстан от 5 июля 2000 года № 76-II
title:
  rus: О ратификации Договора между Правительством Республики Казахстан и Правительством Российской Федерации об аренде объектов и боевых полей 929 Государственного летно-испытательного центра Российской Федерации, расположенных на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясы Үкіметінің арасындағы Ресей Федерациясының 929 - Мемлекеттік ұшу-сынақ орталығының Қазақстан Республикасының аумағында орналасқан объектілері мен әскери алаңдарын жалдау туралы шартты бекіту туралы
