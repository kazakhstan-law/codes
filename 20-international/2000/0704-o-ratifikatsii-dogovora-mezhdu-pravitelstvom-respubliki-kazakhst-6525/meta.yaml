  code: '34302'
  requisite: Закон Республики Казахстан от 21 июля 2007 года № 292
  title:
    rus: О ратификации Протокола между Правительством Республики Казахстан и Правительством Российской Федерации о внесении изменений и дополнений в Договор между Правительством Республики Казахстан и Правительством Российской Федерации об аренде объектов и боевых полей 929 Государственного летно-испытательного центра Российской Федерации, расположенных на территории Республики Казахстан, от 18 октября 1996 года
    kaz: 1996 жылғы 18 қазандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясы Үкіметінің арасындағы Қазақстан Республикасының аумағында орналасқан Ресей Федерациясының 929 Мемлекеттік ұшу-сынақ орталығының объектілері мен жауынгерлік алаңдарын жалдау туралы шартқа өзгерістер мен толықтырулар енгізу туралы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы хаттаманы ратификациялау туралы
