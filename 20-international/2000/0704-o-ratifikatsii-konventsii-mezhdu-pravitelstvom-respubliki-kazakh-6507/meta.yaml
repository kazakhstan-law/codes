title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Швейцарским Федеральным Советом об избежании двойного налогообложения в отношении налогов на доход и на капитал и Протокола к Конвенции между Правительством Республики Казахстан и Швейцарским Федеральным Советом об избежании двойного налогообложения в отношении налогов на доход и на капитал
  kaz: Қазақстан Республикасының Үкiметi мен Швейцария Федералдық Кеңесi арасындағы табыс пен капиталға салынатын салықтарға қатысты қосарланған салық салуды болдырмау туралы конвенцияны және Қазақстан Республикасының Үкiметi мен Швейцария Федералдық Кеңесi арасындағы табыс пен капиталға салынатын салықтарға қатысты қосарланған салық салуды болдырмау туралы конвенцияға Хаттаманы бекiту туралы
