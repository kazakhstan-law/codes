act_code: '6508'
requisite: Закон Республики Казахстан от 5 июля 2000 года № 71-II
title:
  rus: О ратификации Соглашения между Республикой Казахстан и Российской Федерацией о порядке использования 4 Государственного центрального межвидового полигона (объекты и боевые поля, размещенные на территории Республики Казахстан) Министерства обороны Российской Федерации
  kaz: Қазақстан Республикасы мен Ресей Федерациясы арасындағы Ресей Федерациясы Қорғаныс министрлігінің 4-Мемлекеттік орталық полигонын (Қазақстан Республикасының аумағында орналасқан объектілері мен әскери алаңдарын) пайдалану тәртібі туралы келісімді бекіту туралы
