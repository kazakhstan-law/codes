title:
  rus: О ратификации Соглашения между Республикой Казахстан и Российской Федерацией о порядке использования 929 Государственного летно-испытательного центра (объекты и боевые поля, размещенные на территории Республики Казахстан) Министерства обороны Российской Федерации
  kaz: Қазақстан Республикасы мен Ресей Федерациясы арасындағы Ресей Федерациясы Қорғаныс министрлігінің 929-Мемлекеттік ұшу-сынақ орталығын (Қазақстан Республикасының аумағында орналасқан объектілері мен әскери алаңдарын) пайдалану тәртібі туралы келісімді бекіту туралы
