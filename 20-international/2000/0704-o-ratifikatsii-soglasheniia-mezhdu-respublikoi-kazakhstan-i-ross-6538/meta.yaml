title:
  rus: О ратификации Соглашения между Республикой Казахстан и Российской Федерацией об условиях использования и аренды испытательного полигона Сары-Шаган и обеспечения жизнедеятельности г. Приозерска
  kaz: Қазақстан Республикасы мен Ресей Федерациясы арасындағы Сарышаған сынақ полигонын пайдалану мен жалға беру және Приозерск қаласының тыныс-тіршілігін қамтамасыз ету шарттары туралы келісімді бекіту туралы
