    kaz: 1995 жылғы 20 қаңтардағы Қазақстан Республикасы мен Ресей Федерациясы арасындағы Ресей Федерациясы Қорғаныс министрлігінің 929-Мемлекеттік ұшу-сынақ орталығын (Қазақстан Республикасының аумағында орналасқан объектілері мен ұрыс алаңдары) пайдалану тәртібі туралы келісімге өзгерістер мен толықтырулар енгізу туралы хаттаманы ратификациялау туралы
