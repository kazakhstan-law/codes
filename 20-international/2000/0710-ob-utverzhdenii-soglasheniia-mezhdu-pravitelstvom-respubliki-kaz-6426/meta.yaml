act_code: '6426'
requisite: Постановление Правительства Республики Казахстан от 11 июля 2000 года N 1054
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Азербайджанской Республики о сотрудничестве в сфере борьбы с экономическими и финансовыми нарушениями, а также возвращении незаконно перемещенных валютных ценностей
  kaz: Қазақстан Республикасының Yкiметi мен Әзербайжан Республикасының Үкiметi арасындағы экономикалық және қаржылық бұзушылықтармен күрес саласындағы ынтымақтастық, сондай-ақ заңсыз өткiзiлген валюталық құндылықтарды қайтару туралы келiсiмдi бекiту туралы
