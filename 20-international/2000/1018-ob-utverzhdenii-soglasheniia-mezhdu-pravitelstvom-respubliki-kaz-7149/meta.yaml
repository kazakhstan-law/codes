title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Литовской Республики о сотрудничестве в борьбе с организованной преступностью, незаконным оборотом наркотических и психотропных веществ, терроризмом и иными видами преступлений
  kaz: Қазақстан Республикасының Yкiметi мен Литва Республикасының Үкiметi арасындағы Ұйымдасқан қылмысқа, есiрткiлiк және психотроптық заттардың заңсыз айналымына, терроризмге және қылмыстың өзге де түрлерiне қарсы күрестегi ынтымақтастық туралы келiсiмдi бекiту туралы
