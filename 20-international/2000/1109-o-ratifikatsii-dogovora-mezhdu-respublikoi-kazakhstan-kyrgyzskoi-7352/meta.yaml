act_code: '7352'
requisite: Закон Республики Казахстан от 9 ноября 2000 года № 97-II
title:
  rus: О ратификации Договора между Республикой Казахстан, Кыргызской Республикой, Республикой Таджикистан и Республикой Узбекистан о совместных действиях по борьбе с терроризмом, политическим и религиозным экстремизмом, транснациональной организованной преступностью и иными угрозами стабильности и безопасности Сторон
  kaz: Қазақстан Республикасы, Қырғыз Республикасы, Тәжікстан Республикасы және Өзбекстан Республикасы арасындағы терроризмге, саяси және діни экстремизмге, ұлтаралық ұйымдасқан қылмысқа және Тараптардың тұрақтылығы мен қауіпсіздігіне өзге де қауіп-қатер төндіруге қарсы күрес жөніндегі бірлескен іс-қимыл туралы шартты бекіту туралы
