title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Армения о свободной торговле и Протокола об изъятиях из режима свободной торговли к Соглашению между Правительством Республики Казахстан и Правительством Республики Армения о свободной торговле от 2 сентября 1999 года
  kaz: Қазақстан Республикасының Үкіметі мен Армения Республикасы Үкіметінің арасындағы еркін сауда туралы келісімді және 1999 жылғы 2 қыркүйектегі Қазақстан Республикасының Үкіметі мен Армения Республикасы Үкіметінің арасындағы еркін сауда туралы келісімге Еркін сауда режимінен алулар туралы хаттаманы бекіту туралы
