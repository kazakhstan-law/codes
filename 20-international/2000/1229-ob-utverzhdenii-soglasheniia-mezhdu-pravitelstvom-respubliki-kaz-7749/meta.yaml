act_code: '7749'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2000 года N 1932
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о сотрудничестве в области подготовки и аттестации научных и научно-педагогических кадров высшей квалификации
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы Жоғары білікті ғылыми және ғылыми-педагогтік кадрларды даярлау және аттестациялау саласындағы ынтымақтастық туралы келісімді бекіту туралы
