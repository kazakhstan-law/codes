title:
  rus: О ратификации Соглашения между Министерством государственных доходов Республики Казахстан и Государственным таможенным комитетом Азербайджанской Республики о сотрудничестве и взаимном признании таможенных документов и таможенных обеспечений
  kaz: Қазақстан Республикасының Мемлекеттік кiрiс министрлiгi мен Әзірбайжан Республикасы Мемлекеттiк кеден комитетiнiң арасындағы ынтымақтастық және кедендiк құжаттар мен кедендiк қамтамасыз етулердi өзара тану туралы келісімді бекіту туралы
