act_code: '8368'
requisite: Закон Республики Казахстан от 16 марта 2001 года № 165
title:
  rus: О ратификации Соглашения между Республикой Казахстан и Украиной об упрощенном порядке приобретения и прекращения гражданства гражданами Республики Казахстан, постоянно проживающими в Украине, и гражданами Украины, постоянно проживающими в Республике Казахстан, и предотвращении случаев безгражданства и двойного гражданства
  kaz: Украинада тұрақты тұрып жатқан Қазақстан Республикасы азаматтарының және Қазақстан Республикасында тұрақты тұрып жатқан Украина азаматтарының азаматтық алуының және оны тоқтатуының оңайлатылған тәртібі және азаматтықтың болмауы мен қос азаматтық жағдайларын болдырмау туралы Қазақстан Республикасы мен Украина арасындағы келісімді бекіту туралы
