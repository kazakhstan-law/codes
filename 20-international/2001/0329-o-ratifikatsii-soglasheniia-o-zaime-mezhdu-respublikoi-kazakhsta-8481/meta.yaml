title:
  rus: О ратификации Соглашения о займе между Республикой Казахстан и Саудовским Фондом Развития (проект "Дорога Караганда - Астана"), совершенного 5 числа месяца Шабан 1421 года Хиджры, соответствующего 1 ноябрю 2000 года
  kaz: Қазақстан Республикасы мен Сауд Даму Қоры арасындағы, 2000 жылғы 1 қарашаға сәйкес келетін, Қыжыраның 1421 жылғы Шабан айының 5 күні жасалған заем туралы келісімді ("Қарағанды-Астана жолының" жобасы) бекіту туралы
