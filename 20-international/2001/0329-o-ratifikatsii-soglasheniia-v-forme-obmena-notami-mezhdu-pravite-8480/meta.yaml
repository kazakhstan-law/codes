title:
  rus: О ратификации Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Японии о намерении предоставления Японским Банком Международного Сотрудничества займа Правительству Республики Казахстан для осуществления проекта реконструкции дорожной сети Западного Казахстана
  kaz: Қазақстан Республикасының Yкiметi мен Жапония Үкiметiнiң арасындағы Батыс Қазақстанның жол желiсiн қайта құру жобасын жүзеге асыру үшiн Қазақстан Республикасының Үкiметiне Жапония Халықаралық Ынтымақтастық Банкiнiң заем беру ниетi туралы ноталар алмасу нысанындағы келiсiмдi бекiту туралы
