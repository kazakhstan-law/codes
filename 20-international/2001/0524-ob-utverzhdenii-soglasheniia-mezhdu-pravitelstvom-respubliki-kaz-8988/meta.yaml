act_code: '8988'
requisite: Постановление Правительства Республики Казахстан от 25 мая 2001 года № 715
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан, Правительством Кыргызской Республики, Правительством Республики Таджикистан и Правительством Республики Узбекистан о сотрудничестве в области развития санаторно-курортных, оздоровительных и туристических учреждении и организаций
  kaz: Қазақстан Республикасының Үкіметі, Қырғыз Республикасының Үкіметі, Тәжікстан Республикасының Үкіметі және Өзбекстан Республикасының Үкіметі арасындағы санаторий-курорттық, сауықтыру және туристік мекемелер мен ұйымдарды дамыту саласындағы ынтымақтастық туралы келісімді бекіту туралы
