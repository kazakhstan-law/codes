act_code: '9550'
requisite: Закон Республики Казахстан от 11 июля 2001 года № 236-II
title:
  rus: О ратификации Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Японии по вопросу предоставления Правительством Японии гранта Правительству Республики Казахстан для осуществления проекта "Улучшение медицинского обслуживания в Семипалатинском регионе"
  kaz: '"Семей аймағында медициналық қызмет көрсетуді жақсарту" жобасын жүзеге асыру үшін Жапония Үкіметінің Қазақстан Республикасының Үкіметіне грант беру мәселесі бойынша Қазақстан Республикасының Үкіметі мен Жапония Үкіметінің арасындағы ноталар алмасу нысанындағы келісімді бекіту туралы'
