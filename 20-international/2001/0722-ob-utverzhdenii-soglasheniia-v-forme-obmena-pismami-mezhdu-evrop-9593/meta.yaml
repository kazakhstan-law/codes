act_code: '9593'
requisite: Постановление Правительства Республики Казахстан от 23 июля 2001 года № 993
title:
  rus: Об утверждении Соглашения в форме обмена письмами между Европейским Сообществом и Республикой Казахстан о внесении изменений в Соглашение между Европейским Экономическим Сообществом и Республикой Казахстан по торговле текстильными изделиями, парафированное 15 октября 1993 года в Брюсселе и измененное Соглашением в форме обмена письмами, парафированным 20 декабря 1995 года
  kaz: 1993 жылғы 15 қазанда Брюссельде алдын ала қол қойылған және 1995 жылғы 20 желтоқсандағы алдын ала қол қойылған Хаттар алмасу нысанындағы келiсiммен өзгертiлген Еуропалық Экономикалық Қоғамдастығы мен Қазақстан Республикасы арасындағы Тоқыма бұйымдарының саудасы жөнiндегі келiсiмге өзгерiстер енгізу туралы Еуропалық Қоғамдастық пен Қазақстан Республикасы арасындағы Хаттар алмасу нысанындағы келiсiмдi бекiту туралы
