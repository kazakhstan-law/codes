title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Литовской Республики о сотрудничестве в области борьбы с нарушениями налогового законодательства
  kaz: Қазақстан Республикасының Үкіметі мен Литва Республикасының Үкіметі арасындағы салық заңнамасын бұзушылықтарға қарсы күрес саласындағы ынтымақтастық туралы келісімді бекіту туралы
