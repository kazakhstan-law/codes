act_code: '10296'
requisite: Постановление Правительства Республики Казахстан от 5 ноября 2001 года № 1397
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи и Исполнительного протокола между Министерством обороны Республики Казахстан и Генеральным штабом Турецкой Республики к Соглашению между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи
  kaz: Қазақстан Республикасының Үкіметi мен Түрiк Республикасының Үкіметi арасындағы Өтеусiз әскери көмек туралы келiсiмдi және Қазақстан Республикасының Үкiметi мен Түрiк Республикасының Үкiметi арасындағы Өтеусiз әскери көмек туралы келiсiмге Қазақстан Республикасының Қорғаныс министрлiгi мен Түрiк Республикасының Бас штабы арасындағы атқару хаттамасын бекiту туралы
