title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Туркменистана о сотрудничестве и обмене информацией в области борьбы с нарушениями налогового законодательства
  kaz: Қазақстан Республикасының Үкіметі мен Түрікменстан Үкіметі арасында Салық заңнамасын бұзушылықтарға қарсы күрес саласындағы ынтымақтастық пен ақпарат алмасу туралы келісімді бекіту туралы
