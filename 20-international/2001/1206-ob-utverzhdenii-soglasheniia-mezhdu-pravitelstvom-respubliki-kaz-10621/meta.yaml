title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Азербайджанской Республики о сотрудничестве в области аттестации научных и научно-педагогических кадров высшей квалификации
  kaz: Қазақстан Республикасының Үкіметі мен Әзербайжан Республикасы Үкіметінің арасындағы жоғары білікті ғылыми және ғылыми-педагог кадрларды аттестациялау саласындағы ынтымақтастық туралы келісімді бекіту туралы
