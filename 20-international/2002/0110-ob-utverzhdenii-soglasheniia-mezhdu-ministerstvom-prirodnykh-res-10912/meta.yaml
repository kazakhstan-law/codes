act_code: '10912'
requisite: Постановление Правительства Республики Казахстан от 10 января 2002 года № 16
title:
  rus: Об утверждении Соглашения между Министерством природных ресурсов и охраны окружающей среды Республики Казахстан и Министерством окружающей среды Литовской Республики о сотрудничестве в области охраны окружающей среды
  kaz: Қазақстан Республикасының Табиғи ресурстар және қоршаған ортаны қорғау министрлiгi мен Литва Республикасының Қоршаған орта министрлігі арасындағы қоршаған ортаны қорғау саласындағы ынтымақтастық туралы келiсiмді бекiту туралы
