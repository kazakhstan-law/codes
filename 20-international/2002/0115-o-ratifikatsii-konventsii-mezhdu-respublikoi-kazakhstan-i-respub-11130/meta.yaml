title:
  rus: О ратификации Конвенции между Республикой Казахстан и Республикой Молдова об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов на доход и на имущество
  kaz: Қазақстан Республикасы мен Молдова Республикасы арасындағы Табыс пен мүлікке салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы конвенцияны бекіту туралы
