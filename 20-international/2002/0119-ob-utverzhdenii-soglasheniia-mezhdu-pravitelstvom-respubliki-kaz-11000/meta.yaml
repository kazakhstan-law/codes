act_code: '11000'
requisite: Постановление Правительства Республики Казахстан от 19 января 2002 года № 65
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о сотрудничестве в борьбе с незаконным оборотом наркотических средств, психотропных веществ и прекурсоров
  kaz: Қазақстан Республикасының Үкiметi мен Тәжiкстан Республикасы Үкiметiнiң арасындағы есiрткi құралдарының, психотроптық заттардың және прекурсорлардың заңсыз айналымына қарсы күрестегі ынтымақтастық туралы келiсiмдi бекiту туралы
