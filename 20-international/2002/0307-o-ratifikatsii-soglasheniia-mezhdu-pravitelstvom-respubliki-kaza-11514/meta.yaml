act_code: '11514'
requisite: Закон Республики Казахстан от 7 марта 2002 года № 301-ІІ
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики об использовании водохозяйственных сооружений межгосударственного пользования на реках Чу и Талас
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Шу және Талас өзендеріндегі мемлекетаралық пайдаланудағы су шаруашылығы құрылыстарын пайдалану туралы келісімді бекіту туралы
