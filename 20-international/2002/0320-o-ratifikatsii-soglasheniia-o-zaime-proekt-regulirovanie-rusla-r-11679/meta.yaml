title:
  rus: О ратификации Соглашения о займе (Проект "Регулирование русла реки Сырдарьи и сохранение северной части Аральского моря (фаза 1)") между Республикой Казахстан и Международным Банком Реконструкции и Развития
  kaz: Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкі арасындағы заем туралы келісімді ("Сырдария өзенінің арнасын реттеу және Арал теңізінің солтүстік бөлігін сақтау (1 фаза)" жобасы) бекіту туралы
