act_code: '11926'
requisite: Постановление Правительства Республики Казахстан от 23 апреля 2002 года N 468
title:
  rus: Об утверждении Соглашения между Министерством экономики и торговли Республики Казахстан и Управлением по стандартизации, метрологии и испытаниям Словацкой Республики о сотрудничестве в области стандартизации, метрологии и сертификации
  kaz: Қазақстан Республикасының Экономика және сауда министрлігі мен Словакия Республикасының стандарттау, метрология және сынақтар басқармасы арасындағы стандарттау, метрология және сертификаттау саласындағы ынтымақтастық туралы келiсiмдi бекiту туралы
