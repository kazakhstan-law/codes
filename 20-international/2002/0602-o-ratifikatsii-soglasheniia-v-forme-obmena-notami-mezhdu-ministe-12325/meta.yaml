act_code: '12325'
requisite: Закон Республики Казахстан от 3 июня 2002 года № 328-II
title:
  rus: О ратификации Соглашения в форме обмена нотами между Министерством иностранных дел Республики Казахстан и Посольством Соединенных Штатов Америки в Республике Казахстан по вопросу продления Соглашения между Республикой Казахстан и Соединенными Штатами Америки относительно уничтожения шахтных пусковых установок межконтинентальных баллистических ракет, ликвидации последствий аварийных ситуаций и предотвращения распространения оружия массового уничтожения от 13 декабря 1993 года
  kaz: 1993 жылғы 13 желтоқсандағы Қазақстан Республикасы мен Америка Құрама Штаттарының арасындағы континентаралық баллистикалық ракеталардың шахталық ұшыру қондырғыларын, апатты жағдайлардың салдарын жоюға және жаппай қырып жоятын қарудың таралуына жол бермеуге қатысты келісімді ұзарту мәселесі жөнінде Қазақстан Республикасының Сыртқы істер министрлігі мен Америка Құрама Штаттарының Қазақстан Республикасындағы Елшілігі арасындағы ноталар алмасу нысанындағы келісімді бекіту туралы
