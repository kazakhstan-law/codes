act_code: '12346'
requisite: Постановление Правительства Республики Казахстан от 10 июня 2002 года № 623
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи и Исполнительного протокола между Министерством обороны Республики Казахстан и Генеральным штабом Турецкой Республики относительно финансовой помощи к Соглашению между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи
  kaz: Қазақстан Республикасының Yкiметi мен Түрiк Республикасының Үкiметi арасындағы Өтеусiз әскери көмек туралы келiсiмдi және Қазақстан Республикасының Yкiметi мен Түрiк Республикасының Үкiметi арасындағы Өтеусiз әскери көмек туралы келiсiмге қаржылай көмекке қатысты Қазақстан Республикасының Қорғаныс министрлiгi мен Түрiк Республикасы Бас штабының арасындағы Атқару хаттамасын бекiту туралы
