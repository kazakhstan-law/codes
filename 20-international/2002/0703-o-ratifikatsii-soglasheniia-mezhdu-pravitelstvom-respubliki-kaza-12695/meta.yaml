act_code: '12695'
requisite: Закон Республики Казахстан от 4 июля 2002 года № 337-ІІ
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о взаимном предоставлении земельных участков для строительства зданий дипломатических представительств
  kaz: Қазақстан Республикасының Үкіметі мен Түрік Республикасының Үкіметі арасындағы дипломатиялық өкілдіктер ғимараттарының құрылысын салу үшін жер учаскелерін өзара беру туралы келісімді бекіту туралы
