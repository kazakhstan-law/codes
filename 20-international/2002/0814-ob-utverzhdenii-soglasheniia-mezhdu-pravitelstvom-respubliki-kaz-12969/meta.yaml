title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об организации и условиях перевозок грузов и пассажиров казахстанскими и российскими судами в бассейне реки Иртыш
  kaz: Қазақстан Республикасының Yкiметi мен Ресей Федерациясы Yкiметiнiң арасындағы Ертiс өзенiнiң бассейнiнде қазақстандық және ресейлiк кемелерiмен жүктер әрi жолаушылар тасымалдарын ұйымдастыру және оның шарттары туралы келiсiмдi бекiту туралы
