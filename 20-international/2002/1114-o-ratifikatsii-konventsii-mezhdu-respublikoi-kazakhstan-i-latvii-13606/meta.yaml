act_code: '13606'
requisite: Закон Республики Казахстан от 14 ноября 2002 года N 353
title:
  rus: О ратификации Конвенции между Республикой Казахстан и Латвийской Республикой об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и на капитал и Протокола к ней
  kaz: Қазақстан Республикасы мен Латвия Республикасы арасындағы табыс пен капиталға салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы конвенцияны және оған Хаттаманы бекіту туралы
