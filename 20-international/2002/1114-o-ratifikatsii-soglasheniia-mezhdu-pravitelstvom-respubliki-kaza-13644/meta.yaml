title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о деятельности Координационного офиса программ Правительства Турецкой Республики
  kaz: Қазақстан Республикасының Үкіметі мен Түрік Республикасының Үкіметі арасындағы Түрік Республикасы Үкіметінің Бағдарламаларды үйлестіру кеңсесінің қызметі туралы келісімді бекіту туралы
