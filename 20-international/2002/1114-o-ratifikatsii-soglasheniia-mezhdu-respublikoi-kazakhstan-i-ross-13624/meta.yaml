    kaz: 1998 жылғы 6 шілдедегі Қазақстан Республикасы мен Ресей Федерациясы арасындағы Жер қойнауын пайдалануға арналған егемендік құқықтарды жүзеге асыру мақсатында Каспий теңізі солтүстік бөлігінің түбін межелеу туралы келісімге Хаттамаға өзгеріс енгізу туралы Хаттаманы ратификациялау туралы
