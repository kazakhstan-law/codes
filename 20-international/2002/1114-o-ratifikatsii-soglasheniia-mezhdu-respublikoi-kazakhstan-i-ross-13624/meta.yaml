act_code: '13624'
requisite: Закон Республики Казахстан от 14 ноября 2002 года N 356
title:
  rus: О ратификации Соглашения между Республикой Казахстан и Российской Федерацией о разграничении дна северной части Каспийского моря в целях осуществления суверенных прав на недропользование и Протокола к Соглашению между Республикой Казахстан и Российской Федерацией о разграничении дна северной части Каспийского моря в целях осуществления суверенных прав на недропользование
  kaz: Қазақстан Республикасы мен Ресей Федерациясы арасындағы Жер қойнауын пайдалануға арналған егемендік құқықтарды жүзеге асыру мақсатында Каспий теңізі солтүстік бөлігі түбінің ара-жігін ажырату туралы келісімді және Қазақстан Республикасы мен Ресей Федерациясы арасындағы Жер қойнауын пайдалануға арналған егемендік құқықтарды жүзеге асыру мақсатында Каспий теңізі солтүстік бөлігі түбінің ара-жігін ажырату туралы келісімге Хаттаманы бекіту туралы
