act_code: '13743'
requisite: Закон Республики Казахстан от 2 декабря 2002 года № 359-II
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о реструктуризации государственного кредита, предоставленного Правительству Республики Таджикистан Правительством Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы Қазақстан Республикасының Үкіметі Тәжікстан Республикасының Үкіметіне берген мемлекеттік несиені қайта құрылымдау туралы келісімді бекіту туралы
