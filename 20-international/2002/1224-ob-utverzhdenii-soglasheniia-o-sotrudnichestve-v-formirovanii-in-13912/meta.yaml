title:
  rus: Об утверждении Соглашения о сотрудничестве в формировании информационных ресурсов и систем, реализации межгосударственных программ государств-участников Содружества Независимых Государств в сфере информатизации
  kaz: Ақпараттандыру саласындағы ақпараттық ресурстар мен жүйелердi қалыптастырудағы ынтымақтастық, Тәуелсiз Мемлекеттер Достастығына қатысушы мемлекеттердiң мемлекетаралық бағдарламаларын iске асыру туралы келiсімдi бекiту туралы
