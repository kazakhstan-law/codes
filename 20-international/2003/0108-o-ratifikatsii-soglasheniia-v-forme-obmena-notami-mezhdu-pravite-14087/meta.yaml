act_code: '14087'
requisite: Закон Республики Казахстан от 8 января 2003 года N 377-II
title:
  rus: О ратификации Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Японии о привлечении гранта Правительства Японии для осуществления проекта "Поддержка развития службы скорой и неотложной помощи населению города Астаны"
  kaz: '"Астана қаласының халқына жедел және шұғыл жәрдем көрсету қызметін дамытуды қолдау" жобасын жүзеге асыру үшін Жапония Үкіметінің грантын тарту туралы Қазақстан Республикасының Үкіметі мен Жапония Үкіметінің арасында ноталар алмасу нысанындағы келісімді бекіту туралы'
