title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о трудовой деятельности и социальной защите трудящихся-мигрантов, занятых на сельскохозяйственных работах в приграничных областях
  kaz: Қазақстан Республикасының Үкiметi мен Қырғыз Республикасының Yкіметi арасындағы шекараға iргелес облыстарда ауыл шаруашылығы жұмыстарымен айналысатын еңбекшi-көшiп келушiлердің еңбек кызметi және оларды әлеуметтiк қорғау туралы келiсiмді бекiту туралы
