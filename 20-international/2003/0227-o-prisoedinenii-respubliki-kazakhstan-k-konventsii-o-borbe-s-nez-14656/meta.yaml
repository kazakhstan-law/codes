act_code: '14656'
requisite: Закон Республики Казахстан от 27 февраля 2003 года № 390
title:
  rus: О присоединении Республики Казахстан к Конвенции о борьбе с незаконными актами, направленными против безопасности морского судоходства, и Протоколу о борьбе с незаконными актами, направленными против безопасности стационарных платформ, расположенных на континентальном шельфе
  kaz: Қазақстан Республикасының Теңіз кеме қатынасы қауіпсіздігіне қарсы бағытталған заңсыз іс-әрекеттермен күрес туралы конвенцияға және Құрлықтық шельфте орналасқан стационарлық платформалар қауіпсіздігіне қарсы бағытталған заңсыз іс-әрекеттермен күрес туралы хаттамаға қосылуы туралы
