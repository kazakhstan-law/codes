act_code: '14842'
requisite: Закон Республики Казахстан от 26 марта 2003 года N 397-II
title:
  rus: О ратификации Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Японии о привлечении гранта Правительства Японии для осуществления проекта "Предоставление медицинского оборудования многопрофильному больничному комплексу города Кызылорды"
  kaz: Қазақстан Республикасының Үкіметі мен Жапония Үкіметінің арасындағы "Қызылорда қаласының көп бағдарлы аурухана кешеніне медициналық жабдықтар беру" жобасын жүзеге асыру үшін Жапония Үкіметінің грантын тарту туралы ноталар алмасу нысанындағы келісімді бекіту туралы
