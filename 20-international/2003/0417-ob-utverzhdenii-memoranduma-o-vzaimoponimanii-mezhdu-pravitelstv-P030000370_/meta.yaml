title:
  rus: Об утверждении Меморандума о взаимопонимании между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки в области контроля над наркотиками и обеспечения правопорядка
  kaz: Қазақстан Республикасының Үкiметi мен Америка Құрама Штаттарының Үкiметi арасындағы Есiрткiнi бақылау және құқықтық тәртiптi қамтамасыз ету саласындағы өзара түсiнiстiк туралы меморандумды бекiту туралы
