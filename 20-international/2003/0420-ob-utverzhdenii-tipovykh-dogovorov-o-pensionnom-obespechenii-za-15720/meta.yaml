  code: '26215'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года № 416. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 декабря 2005 года № 3986. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 февраля 2009 года № 36
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года № 138 "Об утверждении типовых договоров о пенсионном обеспечении за счет обязательных, добровольных и добровольных профессиональных пенсионных взносов" и определении объема информации об акционерах накопительного пенсионного фонда, организации, осуществляющей инвестиционное управление пенсионными активами, и банка-кастодиана"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Міндетті, ерікті және ерікті кәсіби зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы үлгі шарттарын бекіту туралы" 2003 жылғы 21 сәуірдегі № 138 қаулысына өзгерістер мен толықтырулар енгізу және жинақтаушы зейнетақы қорының, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның және кастодиан банктің акционерлері туралы ақпараттың көлемін айқындау туралы
  link: https://zan.gov.kz/client/#!/doc/26215/rus
