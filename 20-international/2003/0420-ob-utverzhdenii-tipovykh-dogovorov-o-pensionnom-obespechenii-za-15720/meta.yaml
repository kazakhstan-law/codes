act_code: '15720'
requisite: Постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года № 138. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 июня 2003 года № 2345. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 февраля 2009 года № 36
title:
