act_code: '15441'
requisite: Закон Республики Казахстан от 20 мая 2003 года № 419-II
title:
  rus: О ратификации Меморандума о взаимопонимании между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки о предоставлении земельного участка Правительству Соединенных Штатов Америки для строительства новых объектов дипломатического представительства Соединенных Штатов Америки
  kaz: Қазақстан Республикасының Үкіметі мен Америка Құрама Штаттарының Үкіметі арасындағы Америка Құрама Штаттары дипломатиялық өкілдігінің жаңа объектілерін салу үшін Америка Құрама Штаттарының Үкіметіне жер учаскесін беру туралы өзара түсіністік туралы меморандумды бекіту туралы
