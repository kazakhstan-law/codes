title:
  rus: Об утверждении Исполнительного протокола между Министерством обороны Республики Казахстан и Генеральным штабом Турецкой Республики к Соглашению между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи
  kaz: Қазақстан Республикасының Үкiметi мен Түрiк Республикасының Үкiметi арасындағы Өтеусiз әскери көмек туралы келiсiмге Қазақстан Республикасының Қорғаныс министрлігі мен Түрiк Республикасының Бас штабы арасындағы атқару хаттамасын бекiту туралы
