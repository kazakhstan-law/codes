act_code: '15594'
requisite: Закон Республики Казахстан от 2 июня 2003 года N 421-II
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики об избежании двойного налогообложения и предотвращения уклонения от налогообложения в отношении налогов на доход
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасында Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді бекіту туралы
