  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам деятельности Акционерного общества "Фонд гарантирования страховых выплат"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне "Сақтандыру төлемдеріне кепілдік беру қоры" акционерлік қоғамының қызметі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
