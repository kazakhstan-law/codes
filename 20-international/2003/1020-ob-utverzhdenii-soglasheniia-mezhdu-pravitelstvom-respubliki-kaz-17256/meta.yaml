act_code: '17256'
requisite: Постановление Правительства Республики Казахстан от 21 октября 2003 года N 1066
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи и Исполнительного протокола между Министерством обороны Республики Казахстан и Генеральным штабом Турецкой Республики относительно финансовой помощи к Соглашению между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи
  kaz: Қазақстан Республикасының Үкiметi мен Түрiк Республикасының Үкiметi арасындағы Өтеусiз әскери көмек туралы келiсiмдi және Қазақстан Республикасының Yкiметi мен Түрiк Республикасының Yкiметi арасындағы Өтеусiз әскери көмек туралы келiсiмге Қазақстан Республикасының Қорғаныс министрлігі мен Түрiк Республикасының Бас штабы арасындағы Қаржылай көмекке қатысты атқару хаттамасын бекiту туралы
