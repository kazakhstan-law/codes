title:
  rus: Об утверждении Правил организации и проведения торгов (конкурсов, аукционов) по продаже земельного участка или права аренды земельного участка
  kaz: Жер учаскесiн немесе жер учаскесiн жалдау құқығын сату жөнiндегi сауда-саттықты (конкурстарды, аукциондарды) ұйымдастыру және өткiзу ережесiн бекiту туралы
