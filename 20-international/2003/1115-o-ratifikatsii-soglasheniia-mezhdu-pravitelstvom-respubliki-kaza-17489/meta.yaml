act_code: '17489'
requisite: Закон Республики Казахстан от 15 ноября 2003 года N 496-ІІ
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки об учреждении защищенной линии связи между Центром по контролю за сокращением вооружений и обеспечению инспекционной деятельности при Министерстве обороны Республики Казахстан и Центром по уменьшению ядерной опасности Соединенных Штатов Америки
  kaz: Қазақстан Республикасының Yкiметi мен Америка Құрама Штаттарының Yкiметi арасындағы Қазақстан Республикасы Қорғаныс министрлiгiнiң жанындағы Қару-жарақты қысқартуды бақылау және инспекциялық қызметтi қамтамасыз ету жөнiндегi орталық пен Америка Құрама Штаттарының Ядролық қауiптi азайту жөнiндегi орталығы арасында қорғалған байланыс желiсiн құру туралы келiсiмдi бекiту туралы
