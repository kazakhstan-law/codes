act_code: '18106'
requisite: Закон Республики Казахстан от 8 января 2004 года N 518
title:
  rus: О ратификации Грантового соглашения Доверительного фонда (Проект по управлению засушливыми землями) между Республикой Казахстан и Международным Банком Реконструкции и Развития, действующим в качестве Исполнительного агентства Глобального экологического фонда
  kaz: Қазақстан Республикасы мен Жаhандық экологиялық қордың Атқарушы агенттiгi ретiнде әрекет ететiн Халықаралық Қайта Құру және Даму Банкi арасындағы Сенiмгерлiк қордың Гранттық келiсiмiн (Қуаң жерлердi басқару жөнiндегi жоба) бекiту туралы
