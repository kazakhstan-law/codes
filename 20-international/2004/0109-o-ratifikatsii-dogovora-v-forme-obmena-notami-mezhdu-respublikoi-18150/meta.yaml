title:
  rus: О ратификации Договора в форме обмена нотами между Республикой Казахстан, Комиссией Европейских Сообществ, Программой развития Организации Объединенных Наций о внесении изменений в Соглашение об условиях работы регионального экологического центра Центральной Азии
  kaz: Қазақстан Республикасы, Еуропалық Қоғамдастық Комиссиясы, Бiрiккен Ұлттар Ұйымының Даму бағдарламасы арасындағы Орталық Азия аймақтық экологиялық орталығы жұмысының жағдайлары жөнiндегi келiсiмге өзгерiстер енгiзу туралы ноталар алмасу нысанындағы шартты бекiту туралы
