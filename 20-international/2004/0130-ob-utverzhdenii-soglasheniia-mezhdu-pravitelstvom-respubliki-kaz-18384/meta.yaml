act_code: '18384'
requisite: Постановление Правительства Республики Казахстан от 30 января 2004 года N 120
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Болгария о сотрудничестве в борьбе с терроризмом, организованной преступностью, незаконным оборотом наркотических средств, психотропных веществ, их аналогов и прекурсоров и иными преступлениями
  kaz: Қазақстан Республикасының Үкiметi мен Болгария Республикасының Yкіметi арасындағы Терроризмге, ұйымдасқан қылмысқа, есiрткi құралдарының, психотроптық заттардың, олардың аналогтарының және прекурсорлардың заңсыз айналымына және өзге де қылмыстарға қарсы күрестегi ынтымақтастық туралы келiсiмдi бекiту туралы
