act_code: '18427'
requisite: Постановление Правительства Республики Казахстан от 2 февраля 2004 года № 124
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Румынии о сотрудничестве в борьбе с организованной преступностью, незаконным оборотом наркотических средств, психотропных веществ и прекурсоров, терроризмом и иными опасными преступлениями
  kaz: Қазақстан Республикасының Үкiметi мен Румыния Yкiметi арасындағы Ұйымдасқан қылмысқа, есiрткi құралдарының, психотроптық заттар мен прекурсорлардың заңсыз айналымына, терроризмге және өзге де қауiптi қылмыстарға қарсы күрестегi ынтымақтастық туралы келiсiмді бекiту туралы
