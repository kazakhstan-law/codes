title:
  rus: О присоединении Республики Казахстан к Международной конвенции о Гармонизированной системе описания и кодирования товаров и Протоколу о внесении поправки в Международную конвенцию о Гармонизированной системе описания и кодирования товаров
  kaz: Қазақстан Республикасының Тауарларды сипаттау мен оларға код белгілеудің үйлестірілген жүйесі туралы халықаралық конвенцияға және Тауарларды сипаттау мен оларға код белгілеудің үйлестірілген жүйесі туралы халықаралық конвенцияға түзетулер енгізу туралы хаттамаға қосылуы туралы
