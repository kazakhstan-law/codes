act_code: '18732'
requisite: Постановление Правительства Республики Казахстан от 25 февраля 2004 года N 223
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Молдова о сотрудничестве и обмене информацией в области борьбы с экономическими преступлениями и нарушениями налогового законодательства
  kaz: Қазақстан Республикасының Үкiметi мен Молдова Республикасының Үкiметi арасындағы Экономикалық қылмыстарға және салық заңнамасын бұзушылықтарға қарсы күрес саласындағы ынтымақтастық пен ақпарат алмасу туралы келiсiмдi бекiту туралы
