requisite: Постановление Правительства Республики Казахстан от 25 февраля 2004 года N 224
title:
  rus: Об утверждении Соглашения о сотрудничестве между Правительством Республики Казахстан и Европейским Сообществом по Атомной Энергии в области управляемого ядерного синтеза
  kaz: Қазақстан Республикасының Үкiметi мен Атом Энергиясы жөнiндегi Еуропалық Қоғамдастық арасындағы басқарылатын ядролық синтез саласындағы ынтымақтастық туралы келiсiмдi бекiту туралы
