title:
  rus: О ратификации Протокола о порядке осуществления контроля за целевым использованием продукции военного назначения, поставляемой в рамках Соглашения об основных принципах военно-технического сотрудничества между государствами-участниками Договора о коллективной безопасности от 15 мая 1992 года
  kaz: 1992 жылғы 15 мамырдағы Ұжымдық қауіпсіздік туралы шартқа қатысушы мемлекеттер арасындағы әскери-техникалық ынтымақтастықтың негізгі қағидаттары туралы келісімнің шеңберінде жеткізілетін әскери мақсаттағы өнімдердің нысаналы пайдаланылуын бақылауды жүзеге асыру тәртібі туралы хаттаманы бекіту туралы
