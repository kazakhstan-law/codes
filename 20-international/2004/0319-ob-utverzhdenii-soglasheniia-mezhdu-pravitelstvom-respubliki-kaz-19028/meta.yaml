act_code: '19028'
requisite: Постановление Правительства Республики Казахстан от 19 марта 2004 года N 346
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан, Правительством Российской Федерации и Кабинетом Министров Украины о содействии в развитии и деятельности закрытого акционерного общества "Совместное украинско-казахстанско-российское предприятие по производству ядерного топлива"
  kaz: Қазақстан Республикасының Yкiметi, Ресей Федерациясының Yкiметi мен Украина Министрлер Кабинетi арасындағы "Ядролық отын өндiру жөнiндегi бiрлескен украиндық-қазақстандық-ресейлiк кәсiпорны" жабық акционерлiк қоғамының дамуы мен қызметiне көмектесу туралы келiсiмдi бекiту туралы
