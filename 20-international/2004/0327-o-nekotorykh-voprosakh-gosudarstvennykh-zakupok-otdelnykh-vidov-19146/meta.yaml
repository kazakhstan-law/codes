title:
  rus: О некоторых вопросах государственных закупок отдельных видов сельскохозяйственной продукции
  kaz: Ауыл шаруашылығы өнiмiнiң жекелеген түрлерiн мемлекеттiк сатып алудың кейбiр мәселелерi туралы
