act_code: '19432'
requisite: Закон Республики Казахстан от 1 апреля 2004 года № 538
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о порядке взаимного предоставления военных полигонов для проведения боевых стрельб соединениями и воинскими частями Сил воздушной обороны Вооруженных Сил Республики Казахстан и Военно-воздушных сил Российской Федерации
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасы Қарулы Күштерінің Әуе қорғанысы күштері мен Ресей Федерациясы Әскери әуе күштерінің құрамалары мен әскери бөлімдеріне жауынгерлік атыстар өткізу үшін әскери полигондарды өзара беру тәртібі туралы келісімді бекіту туралы
