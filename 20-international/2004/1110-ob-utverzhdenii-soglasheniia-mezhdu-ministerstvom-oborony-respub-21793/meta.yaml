act_code: '21793'
requisite: Постановление Правительства Республики Казахстан от 10 ноября 2004 года N 1171
title:
  rus: Об утверждении Соглашения между Министерством обороны Республики Казахстан и Министерством обороны Кыргызской Республики о сотрудничестве в области военного образования и Протокола о внесении изменения в Соглашение между Министерством обороны Республики Казахстан и Министерством обороны Кыргызской Республики о сотрудничестве в области военного образования от 31 октября 2002 года
  kaz: Қазақстан Республикасының Қорғаныс министрлiгi мен Қырғыз Республикасының Қорғаныс министрлiгi арасындағы әскери бiлiм саласындағы ынтымақтастық туралы келiсiмдi және 2002 жылғы 31 қазандағы Қазақстан Республикасының Қорғаныс министрлігі мен Қырғыз Республикасының Қорғаныс министрлiгi арасындағы әскери бiлiм беру саласындағы ынтымақтастық туралы келiсiмге өзгерiс енгiзу туралы хаттаманы бекiту туралы
