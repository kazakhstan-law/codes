  kaz: Табиғи және техногендiк сипаттағы төтенше жағдайлар туралы ақпараттар алмасу, олардың салдарларын жою және зардап шеккен халыққа көмек көрсету кезiндегi өзара ақпараттық iс-қимыл туралы келiсiмдi бекiту туралы
