act_code: '22160'
requisite: Постановление Правительства Республики Казахстан от 13 декабря 2004 года N 1311
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Австрийским Федеральным Правительством об экономическом, сельскохозяйственном, природоохранном, промышленном, техническом и технологическом сотрудничестве
  kaz: Қазақстан Республикасының Yкiметi мен Австрия Федералдық Yкiметi арасындағы Экономикалық, ауыл шаруашылық, табиғатты қорғау, өнеркәсiптiк, техникалық және технологиялық ынтымақтастық туралы келiсiмдi бекiту туралы
