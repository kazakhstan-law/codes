requisite: Совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 26 января 2005 года N 50-I, Министра внутренних дел Республики Казахстан от 24 февраля 2005 года N 130, Министра иностранных дел Республики Казахстан от 24 февраля 2005 года N 08-1/64 и Министра труда и социальной защиты населения Республики Казахстан от 24 февраля 2005 года N 52-п. Зарегистрирован Министерством юстиции Республики Казахстан 23 марта 2005 года N 3508. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 26 июля 2013 года № 571
title:
  rus: Об утверждении условий, на которых иностранцы и лица без гражданства могут входить в состав экипажа судна, плавающего под Государственным флагом Республики Казахстан
