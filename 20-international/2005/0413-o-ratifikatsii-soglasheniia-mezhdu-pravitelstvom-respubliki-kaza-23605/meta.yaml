act_code: '23605'
requisite: Закон Республики Казахстан от 13 апреля 2005 года № 42
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о транзитном перемещении автомобильным транспортом товаров через территорию Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Тауарларды Қазақстан Республикасының аумағы арқылы автомобиль көлігімен транзиттік өткізу туралы келісімді бекіту туралы
