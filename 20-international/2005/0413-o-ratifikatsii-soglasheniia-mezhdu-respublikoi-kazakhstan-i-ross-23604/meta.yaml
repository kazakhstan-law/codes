title:
  rus: О ратификации Соглашения между Республикой Казахстан и Российской Федерацией о совместном планировании применения войск (сил) в интересах обеспечения совместной безопасности Республики Казахстан и Российской Федерации
  kaz: Қазақстан Республикасы мен Ресей Федерациясы арасындағы Қазақстан Республикасы мен Ресей Федерациясының бірлескен қауіпсіздігін қамтамасыз ету мүддесінде әскерлерді (күштерді) қолдануды бірлесіп жоспарлау туралы келісімді бекіту туралы
