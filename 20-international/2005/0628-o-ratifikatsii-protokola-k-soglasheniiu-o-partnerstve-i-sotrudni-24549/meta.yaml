act_code: '24549'
requisite: Закон Республики Казахстан от 28 июня 2005 года № 65
title:
  rus: О ратификации Протокола к Соглашению о партнерстве и сотрудничестве, устанавливающему партнерство между Республикой Казахстан, с одной стороны, и Европейскими сообществами и их государствами-членами, с другой стороны, принимая во внимание вступление Чешской Республики, Эстонской Республики, Республики Кипр, Латвийской Республики, Литовской Республики, Венгерской Республики, Республики Мальта, Республики Польша, Республики Словения и Словацкой Республики в Европейский союз
  kaz: Чех Республикасының, Эстония Республикасының, Кипр Республикасының, Латвия Республикасының, Литва Республикасының, Венгрия Республикасының, Мальта Республикасының, Польша Республикасының, Словения Республикасының және Словак Республикасының Еуропалық Одаққа кіруін назарға ала отырып, бір тараптан Қазақстан Республикасы және екінші тараптан Еуропалық қоғамдастықтар мен оларға мүше мемлекеттер арасындағы әріптестік орнататын әріптестік пен ынтымақтастық туралы келісімге хаттаманы бекіту туралы
