act_code: '24665'
requisite: Постановление Правительства Республики Казахстан от 7 июля 2005 года N 704
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о взаимной охране прав на результаты интеллектуальной деятельности, используемые и полученные в ходе двустороннего военно-технического сотрудничества
  kaz: Қазақстан Республикасынын Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Екі жақты әскери-техникалық ынтымақтастық барысында пайдаланылатын және алынған зияткерлік қызметтің нәтижелеріне құқықтарды өзара қорғау туралы келісімді бекіту туралы
