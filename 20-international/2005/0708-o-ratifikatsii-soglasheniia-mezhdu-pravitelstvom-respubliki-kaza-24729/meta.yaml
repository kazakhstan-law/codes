title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Комиссией Европейских сообществ об учреждении, привилегиях и иммунитетах представительства Комиссии Европейских сообществ в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Еуропалық қоғамдастықтар Комиссиясы арасындағы Қазақстан Республикасында Еуропалық қоғамдастықтар Комиссиясының Өкілдігін құру, оның артықшылықтары мен иммунитеттері туралы келісімді бекіту туралы
