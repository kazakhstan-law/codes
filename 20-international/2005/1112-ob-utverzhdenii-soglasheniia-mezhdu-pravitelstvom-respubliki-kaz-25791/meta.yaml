act_code: '25791'
requisite: Постановление Правительства Республики Казахстан от 12 ноября 2005 года N 1123
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Исламской Республики Иран о долгосрочном торгово- экономическом сотрудничестве и Протокола о внесении дополнения и изменения в Соглашение между Правительством Республики Казахстан и Правительством Исламской Республики Иран о долгосрочном торгово-экономическом сотрудничестве от 6 октября 1999 года
  kaz: Қазақстан Республикасының Yкiметi мен Иран Ислам Республикасының Yкiметi арасындағы Ұзақ мерзiмдiк сауда-экономикалық ынтымақтастық туралы келiсiмдi және Қазақстан Республикасының Yкiметi мен Иран Ислам Республикасының Yкiметi арасындағы 1999 жылғы 6 қазандағы Ұзақ мерзiмдi сауда-экономикалық ынтымақтастық туралы келiсiмге толықтыру мен өзгерiс енгiзу туралы хаттаманы бекiту туралы
