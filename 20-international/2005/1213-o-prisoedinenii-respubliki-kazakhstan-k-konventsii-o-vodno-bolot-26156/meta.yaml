act_code: '26156'
requisite: Закон Республики Казахстан от 13 декабря 2005 года № 94
title:
  rus: О присоединении Республики Казахстан к Конвенции о водно-болотных угодьях, имеющих международное значение, главным образом в качестве местообитаний водоплавающих птиц (с поправками, внесенными в нее Парижским протоколом от 3 декабря 1982 года, и поправками, внесенными в Режине 28 мая 1987 года)
  kaz: Қазақстан Республикасының Ең алдымен суда жүзетін құстардың тіршілік ету орны ретінде халықаралық мәні бар сулы-батпақты алқаптар туралы конвенцияға (оған 1982 жылғы 3 желтоқсандағы Париж хаттамасымен енгізілген түзетулермен және 1987 жылғы 28 мамырда Режинде енгізілген түзетулермен) қосылуы туралы
