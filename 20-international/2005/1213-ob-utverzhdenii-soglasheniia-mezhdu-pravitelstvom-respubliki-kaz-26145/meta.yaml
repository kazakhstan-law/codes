act_code: '26145'
requisite: Постановление Правительства Республики Казахстан от 13 декабря 2005 года № 1242
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации по экологии и природопользованию на территории комплекса "Байконур" в условиях его аренды Российской Федерацией
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы "Байқоңыр" кешенін Ресей Федерациясының жалға алуы жағдайында оның аумағында экология және табиғатты пайдалану жөніндегі келісімді бекіту туралы
