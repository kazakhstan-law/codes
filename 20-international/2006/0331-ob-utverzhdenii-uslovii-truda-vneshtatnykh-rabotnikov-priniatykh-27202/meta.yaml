title:
  rus: Об утверждении Условий труда внештатных работников, принятых на месте на работу в загранучреждения Республики Казахстан, в том числе из числа членов семей персонала дипломатической службы
  kaz: Қазақстан Республикасының шет елдердегі мекемелеріне жергілікті жерден, соның ішінде дипломатиялық қызмет персоналының отбасы мүшелері қатарынан жұмысқа қабылданған штаттан тыс жұмыскерлердің еңбек шарттарын бекіту туралы
