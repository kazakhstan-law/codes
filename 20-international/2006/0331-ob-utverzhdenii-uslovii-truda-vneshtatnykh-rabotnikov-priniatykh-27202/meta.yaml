  title:
    rus: О внесении изменений и дополнения в приказ Министра иностранных дел Республики Казахстан от 31 марта 2006 года № 08-2/83 "Об утверждении Условий труда внештатных работников, принятых на месте на работу в загранучреждения Республики Казахстан, в том числе из числа членов семей персонала дипломатической службы"
    kaz: '"Қазақстан Республикасының шет елдердегі мекемелеріне жергілікті жерден, соның ішінде дипломатиялық қызмет персоналының отбасы мүшелері қатарынан жұмысқа қабылданған штаттан тыс жұмыскерлердің еңбек шарттарын бекіту туралы" Қазақстан Республикасы Сыртқы істер министрінің 2006 жылғы 31 наурыздағы № 08-2/83 бұйрығына өзгерістер мен толықтыру енгізу туралы'
