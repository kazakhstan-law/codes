title:
  rus: Об утверждении Соглашения об обеспечении гражданам государств-участников Содружества Независимых Государств доступа в общеобразовательные учреждения на условиях, предоставленных гражданам этих государств, а также о социальной защите обучающихся и педагогических работников общеобразовательных учреждений
  kaz: Тәуелсiз Мемлекеттер Достастығына қатысушы мемлекеттердiң азаматтарына осы мемлекеттердiң азаматтарына берiлетiн шарттарда жалпы бiлiм беретiн мекемелерге қол жетiмдiлiктi қамтамасыз ету, сондай-ақ жалпы бiлiм беретiн мекемелердiң бiлiм алушылары мен педагог қызметкерлерiн әлеуметтiк қорғау туралы келiсiмдi бекiту туралы
