title:
  rus: О ратификации поправки к Соглашению об учреждении Европейского Банка Реконструкции и Развития с целью принятия Монголии в качестве страны операций
  kaz: Моңғолияны операциялар елі ретінде қабылдау мақсатында Еуропа Қайта Құру және Даму Банкін құру туралы келісімге түзетуді ратификациялау туралы
