  title:
    rus: О ратификации Протокола о внесении изменений в Соглашение между Правительством Республики Казахстан и Правительством Российской Федерации о порядке взаимодействия в случае возникновения аварий при пусках ракет с космодрома "Байконур" от 18 ноября 1999 года
    kaz: 1999 жылғы 18 қарашадағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы "Байқоңыр" ғарыш айлағынан зымырандарды жіберу кезінде авариялар болған жағдайдағы өзара іс-қимыл тәртібі туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
