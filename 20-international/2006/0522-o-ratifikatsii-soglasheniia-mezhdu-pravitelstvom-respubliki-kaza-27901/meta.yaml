act_code: '27901'
requisite: Закон Республики Казахстан от 22 мая 2006 года № 141
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о порядке взаимодействия в случае возникновения аварий при пусках ракет с космодрома "Байконур"
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясы Үкіметінің арасындағы "Байқоңыр" ғарыш айлағынан зымырандарды жіберу кезінде авариялар болған жағдайдағы өзара іс-қимыл тәртібі туралы келісімді ратификациялау туралы
