act_code: '30178'
requisite: Постановление Правительства Республики Казахстан от 6 ноября 2006 года № 1050
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики об урегулировании прав собственности Республики Казахстан на объекты курортно-рекреационного хозяйства, расположенные на территории Иссык-Кульской области Кыргызской Республики
  kaz: Қазақстан Республикасының Yкiметi мен Қырғыз Республикасының Үкiметi арасындағы Қырғыз Республикасы Ыстықкөл облысының аумағында орналасқан курорттық-рекреациялық шаруашылық объектiлерiне Қазақстан Республикасының меншiк құқықтарын реттеу туралы келiсiмдi бекiту туралы
