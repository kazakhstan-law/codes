  kaz: 2000 жылғы 30 қарашадағы Беларусь Республикасының Yкiметi, Қазақстан Республикасының Yкiметi, Қырғыз Республикасының Yкiметi, Ресей Федерациясының Үкіметі және Тәжікстан Республикасының Үкіметі арасындағы азаматтардың өзара визасыз сапарлары туралы келісімге Хаттаманы ратификациялау туралы Yкiметi және Тәжiкстан Республикасының Yкiметi арасындағы азаматтардың өзара визасыз сапарлары туралы келiсiмге Хаттаманы ратификациялау туралы
