act_code: '30746'
requisite: Постановление Правительства Республики Казахстан от 23 декабря 2006 года № 1248
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о трудовой деятельности и защите прав трудящихся-мигрантов, граждан Республики Казахстан, временно работающих на территории Республики Таджикистан, о трудовой деятельности и защите прав трудящихся-мигрантов, граждан Республики Таджикистан, временно работающих на территории Республики Казахстан
  kaz: Қазақстан Республикасының Yкiметi мен Тәжiкстан Республикасының Үкiметi арасындағы Еңбекшi-мигранттар - Тәжiкстан Республикасының аумағында уақытша жұмыс iстейтiн Қазақстан Республикасы азаматтарының еңбек қызметi мен құқықтарын қорғау туралы және еңбекшi-мигранттар - Қазақстан Республикасының аумағында уақытша жұмыс iстейтiн Тәжiкстан Республикасы азаматтарының еңбек қызметi мен құқықтарын қорғау туралы келiсiмдi бекiту туралы
