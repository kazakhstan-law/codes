    rus: Об утверждении Протокола о внесении изменения в Соглашение между Правительством Республики Казахстан и Правительством Республики Таджикистан о трудовой деятельности и защите прав трудящихся-мигрантов, граждан Республики Казахстан, временно работающих на территории Республики Таджикистан, о трудовой деятельности и защите прав трудящихся-мигрантов, граждан Республики Таджикистан, временно работающих на территории Республики Казахстан, от 4 мая 2006 года
    kaz: 2006 жылғы 4 мамырдағы Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы Еңбекші-мигранттар - Тәжікстан Республикасының аумағында уақытша жұмыс істейтін Қазақстан Республикасы азаматтарының еңбек қызметі мен құқықтарын қорғау туралы, еңбекші-мигранттар - Қазақстан Республикасының аумағында уақытша жұмыс істейтін Тәжікстан Республикасы азаматтарының еңбек қызметі мен құқықтарын қорғау туралы келісімге өзгеріс енгізу туралы хаттаманы бекіту туралы
