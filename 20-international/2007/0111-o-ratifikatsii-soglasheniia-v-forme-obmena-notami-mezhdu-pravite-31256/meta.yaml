title:
  rus: О ратификации Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Японии о привлечении гранта Правительства Японии для осуществления проекта "Поставка оборудования для образовательного комплекса Алматинского хореографического училища им. А.В. Селезнева"
  kaz: Қазақстан Республикасының Үкіметі мен Жапония Үкіметі арасындағы "А.В.Селезнев атындағы Алматы хореографиялық училищесінің білім беру кешеніне арналған жабдықтарды жеткізу" жобасын жүзеге асыру үшін Жапония Үкіметінің грантын тарту туралы ноталар алмасу нысанындағы келісімді ратификациялау туралы
