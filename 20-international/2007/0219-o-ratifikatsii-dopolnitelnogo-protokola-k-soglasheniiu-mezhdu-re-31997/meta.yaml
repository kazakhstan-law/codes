title:
  rus: О ратификации Дополнительного протокола к Соглашению между Республикой Казахстан и Международным агентством по атомной энергии о применении гарантий в связи с Договором о нераспространении ядерного оружия
  kaz: Қазақстан Республикасы мен Атом энергиясы жөнiндегi халықаралық агенттiк арасындағы Ядролық қаруды таратпау туралы шартқа байланысты кепiлдiктердi қолдану туралы келiсiмге қосымша хаттаманы ратификациялау туралы
