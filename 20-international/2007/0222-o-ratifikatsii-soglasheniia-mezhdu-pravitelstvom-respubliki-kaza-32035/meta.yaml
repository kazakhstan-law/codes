act_code: '32035'
requisite: Закон Республики Казахстан от 22 февраля 2007 года N 231
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Малайзии об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и Протокола к нему
  kaz: Қазақстан Республикасының Үкіметі мен Малайзия Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді және оның Хаттамасын ратификациялау туралы
