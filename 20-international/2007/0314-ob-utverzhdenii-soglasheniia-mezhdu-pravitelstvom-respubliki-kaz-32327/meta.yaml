act_code: '32327'
requisite: Постановление Правительства Республики Казахстан от 14 марта 2007 года № 191
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о сотрудничестве в борьбе с международной террористической деятельностью, организованной преступностью, незаконным оборотом наркотических средств, психотропных веществ, их аналогов, прекурсоров и иными видами преступлений
  kaz: Қазақстан Республикасының Yкiметi мен Түрiк Республикасының Yкiметi арасындағы Халықаралық террористiк қызметке, ұйымдасқан қылмысқа, есiрткi құралдарының, психотроптық заттардың, олардың аналогтарының, прекурсорлардың заңсыз айналымына және өзге де қылмыс түрлерiне қарсы күрестегi ынтымақтастық туралы келiсiмдi бекiту туралы
