act_code: '32566'
requisite: Постановление Правительства Республики Казахстан от 4 апреля 2007 года N 264
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о сотрудничестве и обмене информацией в области борьбы с экономическими преступлениями и нарушениями налогового законодательства
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы Экономикалық қылмыстарға және салық заңнамасын бұзушылықтарға қарсы күрес саласындағы ынтымақтастық пен ақпарат алмасу туралы келісімді бекіту туралы
