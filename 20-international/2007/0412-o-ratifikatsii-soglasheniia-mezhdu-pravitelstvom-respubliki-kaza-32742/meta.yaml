act_code: '32742'
requisite: Закон Республики Казахстан от 12 апреля 2007 года № 243
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Подготовительной комиссией Организации по Договору о всеобъемлющем запрещении ядерных испытаний о проведении мероприятий, включая постсертификационные мероприятия, на объектах по международному мониторингу в поддержку Договора о всеобъемлющем запрещении ядерных испытаний
  kaz: Қазақстан Республикасының Үкіметі мен Ядролық сынауларға жан-жақты тыйым салу туралы шарт жөніндегі ұйымның Дайындық комиссиясы арасындағы Ядролық сынауларға жан-жақты тыйым салу туралы шартты қолдауға халықаралық мониторинг объектілерінде, сертификаттаудан кейінгі іс-шараларды қоса алғанда, іс-шараларды өткізу жөніндегі келісімді ратификациялау туралы
