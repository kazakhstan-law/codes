act_code: '33158'
requisite: Закон Республики Казахстан от 8 мая 2007 года № 248
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о порядке уплаты провозных платежей и оформления перевозок грузов по участкам железных дорог Республики Казахстан, расположенным на территории Российской Федерации, и по участкам железных дорог Российской Федерации, расположенным на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Ресей Федерациясының аумағында орналасқан Қазақстан Республикасының темір жол учаскелері бойынша және Қазақстан Республикасының аумағында орналасқан Ресей Федерациясының темір жол учаскелері бойынша тасымалдау төлемдерін төлеу және жүк тасымалдарын ресімдеу тәртібі туралы келісімді ратификациялау туралы
