  title:
    rus: О ратификации Протокола о внесении изменений в Соглашение между Правительством Республики Казахстан и Правительством Российской Федерации о порядке уплаты провозных платежей и оформления перевозок грузов по участкам железных дорог Республики Казахстан, расположенным на территории Российской Федерации, и по участкам железных дорог Российской Федерации, расположенным на территории Республики Казахстан, от 15 августа 2006 года
    kaz: 2006 жылғы 15 тамыздағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Ресей Федерациясының аумағында орналасқан Қазақстан Республикасының теміржол учаскелері бойынша және Қазақстан Республикасының аумағында орналасқан Ресей Федерациясының теміржол учаскелері бойынша тасымалдау төлемдерін төлеу және жүк тасымалдарын ресімдеу тәртібі туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
