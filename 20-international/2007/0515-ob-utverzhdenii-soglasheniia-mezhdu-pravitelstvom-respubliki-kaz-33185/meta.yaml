act_code: '33185'
requisite: Постановление Правительства Республики Казахстан от 15 мая 2007 года № 383
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Азербайджанской Республики о сотрудничестве в борьбе с терроризмом, незаконным оборотом наркотических средств, психотропных веществ и прекурсоров, организованной и иными видами преступности
  kaz: Қазақстан Республикасының Үкіметі мен Әзірбайжан Республикасының Үкіметі арасындағы Терроризмге, есірткі құралдарының, психотроптық заттар мен прекурсорлардың заңсыз айналымына, ұйымдасқан және өзге де қылмыс түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
