act_code: '33442'
requisite: Закон Республики Казахстан от 29 мая 2007 года N 256
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Сингапур об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и Протокола к нему
  kaz: Қазақстан Республикасының Үкіметі мен Сингапур Республикасының Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді және оған Хаттаманы ратификациялау туралы
