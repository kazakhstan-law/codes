act_code: '33528'
requisite: Постановление Правительства Республики Казахстан от 5 июня 2007 года № 462
title:
  rus: Об утверждении Соглашения о сотрудничестве в области выявления и перекрытия каналов проникновения на территории государств-членов Шанхайской организации сотрудничества лиц, причастных к террористической, сепаратистской и экстремистской деятельности
  kaz: Шанхай ынтымақтастық ұйымына мүше мемлекеттердің аумағына террористік, сепаратистік және экстремистік іс-әрекетке қатысы бар адамдардың кіру арналарын анықтау және жабу саласындағы ынтымақтастық туралы келісімді бекіту туралы
