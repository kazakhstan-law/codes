act_code: '33611'
requisite: Закон Республики Казахстан от 7 июня 2007 года N 261
title:
  rus: О ратификации Соглашения о займе (проект сохранения лесов и увеличения лесистости территории республики) между Республикой Казахстан и Международным Банком Реконструкции и Развития и Соглашения о гранте траст-фонда (проект сохранения лесов и увеличения лесистости территории республики) между Республикой Казахстан и Международным Банком Реконструкции и Развития, выступающим в качестве исполнительной организации Глобального экологического фонда
  kaz: Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкі арасындағы Қарыз туралы келісімді (Ормандарды сақтау және республика аумағының орманды жерлерін көбейту жобасы) және Қазақстан Республикасы мен Ғаламдық экологиялық қордың атқарушы ұйымы ретінде қатысушы Халықаралық Қайта Құру және Даму Банкі арасындағы Траст-қордың гранты туралы келісімді (Ормандарды сақтау және республика аумағының орманды жерлерін көбейту жобасы) ратификациялау туралы
