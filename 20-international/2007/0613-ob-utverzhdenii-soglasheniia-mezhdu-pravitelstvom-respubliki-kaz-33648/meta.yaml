act_code: '33648'
requisite: Постановление Правительства Республики Казахстан от 13 июня 2007 года № 494
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о трудовой деятельности и защите прав трудящихся-мигрантов, граждан Республики Казахстан, временно работающих на территории Кыргызской Республики, о трудовой деятельности и защите прав трудящихся-мигрантов, граждан Кыргызской Республики, временно работающих на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Еңбекші-мигранттар - Қырғыз Республикасының аумағында уақытша жұмыс істейтін Қазақстан Республикасы азаматтарының еңбек қызметі мен құқықтарын қорғау туралы, еңбекші-мигранттар - Қазақстан Республикасының аумағында уақытша жұмыс істейтін Қырғыз Республикасы азаматтарының еңбек қызметі мен құқықтарын қорғау туралы келісімді бекіту туралы
