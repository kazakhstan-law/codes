act_code: '33763'
requisite: Постановление Правительства Республики Казахстан от 22 июня 2007 года № 523
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Арабской Республики Египет о сотрудничестве в области борьбы с терроризмом, организованной преступностью, незаконным оборотом наркотических средств и психотропных веществ и иными видами преступлений
  kaz: Қазақстан Республикасының Үкіметі мен Египет Араб Республикасының Үкіметі арасындағы Терроризмге, ұйымдасқан қылмысқа, есірткі құралдары мен психотроптық заттардың заңсыз айналымына және өзге де қылмыс түрлеріне қарсы күрес саласындағы ынтымақтастық туралы келісімді бекіту туралы
