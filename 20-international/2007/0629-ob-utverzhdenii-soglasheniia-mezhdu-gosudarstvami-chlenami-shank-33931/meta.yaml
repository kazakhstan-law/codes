title:
  rus: Об утверждении Соглашения между государствами-членами Шанхайской организации сотрудничества о сотрудничестве в борьбе с незаконным оборотом наркотических средств, психотропных веществ и их прекурсоров
  kaz: Шанхай ынтымақтастық ұйымына мүше мемлекеттер арасындағы есірткі құралдарының, психоторптық заттар мен олардың прекурсорларының заңсыз айналымына қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
