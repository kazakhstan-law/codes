act_code: '34305'
requisite: Закон Республики Казахстан от 21 июля 2007 года N 295
title:
  rus: О ратификации Меморандума о понимании между Казахстаном и Организацией НАТО по техническому обслуживанию и обеспечению (НАМСО) по сотрудничеству в области материально-технического обеспечения
  kaz: Қазақстан мен НАТО-ның Техникалық қызмет және қамтамасыз ету жөніндегі ұйымы (НАМСО) арасындағы Материалдық-техникалық қамтамасыз ету саласындағы ынтымақтастық бойынша түсіністік меморандумын ратификациялау туралы
