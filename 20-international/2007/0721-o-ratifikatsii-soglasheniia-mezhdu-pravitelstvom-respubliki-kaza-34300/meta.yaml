  title:
    rus: О ратификации Протокола о внесении изменений и дополнений в Соглашение между Правительством Республики Казахстан и Правительством Российской Федерации о порядке пересечения казахстанско-российской государственной границы жителями приграничных территорий Республики Казахстан и Российской Федерации от 3 октября 2006 года
    kaz: 2006 жылғы 3 қазандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының және Ресей Федерациясының шекара маңындағы аумақтары тұрғындарының Қазақстан - Ресей мемлекеттік шекарасын кесіп өту тәртібі туралы келісімге өзгерістер мен толықтырулар енгізу туралы хаттаманы ратификациялау туралы
