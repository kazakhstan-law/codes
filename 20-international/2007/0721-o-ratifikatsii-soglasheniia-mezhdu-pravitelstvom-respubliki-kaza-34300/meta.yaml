act_code: '34300'
requisite: Закон Республики Казахстан от 21 июля 2007 года № 290
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о порядке пересечения казахстанско-российской государственной границы жителями приграничных территорий Республики Казахстан и Российской Федерации
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының және Ресей Федерациясының шекара маңындағы аумақтары тұрғындарының Қазақстан-Ресей мемлекеттік шекарасын кесіп өту тәртібі туралы келісімді ратификациялау туралы
