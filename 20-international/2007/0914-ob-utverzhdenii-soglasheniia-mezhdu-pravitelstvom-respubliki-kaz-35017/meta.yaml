act_code: '35017'
requisite: Постановление Правительства Республики Казахстан от 14 сентября 2007 года № 803
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Хорватия о сотрудничестве в борьбе с организованной преступностью, незаконным оборотом наркотических средств и психотропных веществ, терроризмом и иными видами преступлений
  kaz: Қазақстан Республикасының Үкіметі мен Хорватия Республикасының Үкіметі арасындағы ұйымдасқан қылмысқа, есірткі құралдары мен психотроптық заттардың заңсыз айналымына, тероризмге және қылмыстың өзге де түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
