act_code: '35614'
requisite: Постановление Правительства Республики Казахстан от 6 ноября 2007 года № 1046
title:
  rus: Об утверждении Протокола между Республикой Казахстан и Турецкой Республикой о передаче в пользование Республике Казахстан собственности, находящейся в уезде Кемер провинции Анталия
  kaz: Қазақстан Республикасы мен Түрік Республикасының арасындағы Анталия аймағы Кемер болысында орналасқан меншікті Қазақстан Республикасына пайдалануға беру туралы хаттаманы бекіту туралы
