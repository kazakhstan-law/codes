  code: '70010'
  requisite: Закон Республики Казахстан от 11 января 2013 года № 65-V ЗРК
  title:
    rus: О ратификации Протокола между Правительством Республики Казахстан и Правительством Турецкой Республики о внесении изменений и дополнений в Протокол между Республикой Казахстан и Турецкой Республикой о передаче в пользование Республике Казахстан собственности, находящейся в уезде Кемер провинции Анталия, от 13 декабря 1993 года
    kaz: 1993 жылғы 13 желтоқсандағы Қазақстан Республикасы мен Түрік Республикасы арасындағы Анталия аймағы Кемер болысында орналасқан меншікті Қазақстан Республикасына пайдалануға беру туралы хаттамаға өзгерістер мен толықтырулар енгізу туралы Қазақстан Республикасының Үкіметі мен Түркия Республикасының Үкіметі арасындағы хаттаманы ратификациялау туралы
