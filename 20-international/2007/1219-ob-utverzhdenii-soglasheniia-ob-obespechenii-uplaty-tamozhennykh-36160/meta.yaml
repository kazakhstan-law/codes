act_code: '36160'
requisite: Постановление Правительства Республики Казахстан от 19 декабря 2007 года N 1240
title:
  rus: Об утверждении Соглашения об обеспечении уплаты таможенных платежей путем внесения на счет таможенного органа денежных средств или путем использования гарантий банков при перемещении товаров под таможенным контролем между таможенными органами государств членов Евразийского экономического сообщества
  kaz: Еуразия экономикалық коғамдастығына мүше мемлекеттердің кеден органдары арасында тауарларды кедендік бақылаумен өткізу кезінде кеден органының шотына ақша қаражатын енгізу жолымен немесе банктердің кепілдіктерін пайдалану жолымен кедендік төлемдердің төленуін қамтамасыз ету туралы келісімді бекіту туралы
