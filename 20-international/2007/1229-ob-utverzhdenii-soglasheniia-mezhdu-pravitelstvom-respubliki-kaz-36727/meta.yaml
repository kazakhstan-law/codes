act_code: '36727'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2007 года N 1383
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Азербайджанской Республики о производственной и научно-технической кооперации предприятий оборонных отраслей промышленности
  kaz: Қазақстан Республикасының Үкіметі мен Әзірбайжан Республикасының Үкіметі арасындағы Өнеркәсіптің қорғаныс салалары кәсіпорындарының өндірістік және ғылыми-техникалық кооперациясы туралы келісімді бекіту туралы
