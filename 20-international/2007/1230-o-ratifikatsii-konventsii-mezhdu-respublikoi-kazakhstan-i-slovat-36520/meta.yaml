title:
  rus: О ратификации Конвенции между Республикой Казахстан и Словацкой Республикой об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и капитал
  kaz: Қазақстан Республикасы мен Словакия Республикасы арасындағы Табыс пен капиталға салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы конвенцияны ратификациялау туралы
