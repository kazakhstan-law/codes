act_code: '36521'
requisite: Закон Республики Казахстан от 30 декабря 2007 года № 15-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Федеративной Республики Германия о транзите военного имущества и персонала через территорию Республики Казахстан в связи с участием Вооруженных Сил Федеративной Республики Германия в усилиях по стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Германия Федеративтік Республикасының Үкіметі арасындағы Германия Федеративтік Республикасы Қарулы Күштерінің Ауғанстан Ислам Республикасын тұрақтандыру мен қалпына келтіру жөніндегі іс-әрекеттерге қатысуына байланысты Қазақстан Республикасының аумағы арқылы әскери мүлік пен персоналдың транзиті туралы келісімді ратификациялау туралы
