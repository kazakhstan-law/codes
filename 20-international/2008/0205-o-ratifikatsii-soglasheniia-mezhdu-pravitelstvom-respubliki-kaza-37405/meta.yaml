act_code: '37405'
requisite: Закон Республики Казахстан от 5 февраля 2008 года № 18-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в создании хозяйственного общества на базе Оренбургского газоперерабатывающего завода
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Орынбор газ өңдеу зауытының базасында шаруашылық қоғам құрудағы ынтымақтастық туралы келісімді ратификациялау туралы
