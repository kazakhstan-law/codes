act_code: '37613'
requisite: Постановление Правительства Республики Казахстан от 7 февраля 2008 года N 122
title:
  rus: Об утверждении Рамочного соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о создании международных центров приграничного сотрудничества "Аухатты - Кен-булун" и "Айша биби - Чон-Капка"
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы "Аухатты - Кен-Булун" және "Айша бибі - Чон-Капка" шекара маңы ынтымақтастығы халықаралық орталықтарын құру туралы негіздемелік келісімді бекіту туралы
