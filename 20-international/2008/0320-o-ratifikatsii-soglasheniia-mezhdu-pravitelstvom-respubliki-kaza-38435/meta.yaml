title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Секретариатом Совещания по взаимодействию и мерам доверия в Азии об условиях пребывания Секретариата на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Азиядағы өзара іс-қимыл және сенім шаралары жөніндегі кеңестің Хатшылығы арасындағы Хатшылықтың Қазақстан Республикасының аумағында болуы шарттары туралы келісімді ратификациялау туралы
