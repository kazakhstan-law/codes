act_code: '38631'
requisite: Постановление Правительства Республики Казахстан от 31 марта 2008 года N 303
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Словацкой Республики о сотрудничестве в борьбе с организованной преступностью, терроризмом, незаконным оборотом наркотических средств, психотропных веществ, прекурсоров и иными видами преступлений
  kaz: Қазақстан Республикасының Үкіметі мен Словак Республикасының Үкіметі арасындағы Ұйымдасқан қылмысқа, терроризмге, есірткі құралдарының, психотроптық заттардың, олардың прекурсорларының заңсыз айналымына және қылмыстың өзге де түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
