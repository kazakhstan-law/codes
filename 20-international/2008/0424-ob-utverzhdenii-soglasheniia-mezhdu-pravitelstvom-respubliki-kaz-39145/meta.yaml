act_code: '39145'
requisite: Постановление Правительства Республики Казахстан от 24 апреля 2008 года N 386
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Федеративной Республики Бразилии об освобождении владельцев дипломатических и служебных паспортов от визовых требований
  kaz: Қазақстан Республикасының Үкіметі мен Бразилия Федеративтік Республикасының Үкіметі арасындағы дипломатиялық және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
