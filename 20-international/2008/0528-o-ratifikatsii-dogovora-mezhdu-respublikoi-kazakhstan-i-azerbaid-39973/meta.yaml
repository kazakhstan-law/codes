title:
  rus: О ратификации Договора между Республикой Казахстан и Азербайджанской Республикой по поддержке и содействию транспортировке нефти из Республики Казахстан через Каспийское море и территорию Азербайджанской Республики на международные рынки посредством системы Баку - Тбилиси - Джейхан
  kaz: Қазақстан Республикасы мен Әзірбайжан Республикасы арасындағы Қазақстан Республикасынан Каспий теңізі және Әзірбайжан Республикасының аумағы арқылы мұнайды Баку - Тбилиси - Джейхан жүйесімен халықаралық нарықтарға тасымалдауға қолдау көрсету және жәрдемдесу жөніндегі шартты ратификациялау туралы
