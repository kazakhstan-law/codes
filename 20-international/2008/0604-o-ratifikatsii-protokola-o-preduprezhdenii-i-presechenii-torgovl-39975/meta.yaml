act_code: '39975'
requisite: Закон Республики Казахстан от 4 июня 2008 года N 37-IV
title:
  rus: О ратификации Протокола о предупреждении и пресечении торговли людьми, особенно женщинами и детьми, и наказании за нее, дополняющего Конвенцию Организации Объединенных Наций против транснациональной организованной преступности
  kaz: Біріккен Ұлттар Ұйымының Трансұлттық ұйымдасқан қылмысқа қарсы конвенциясын толықтыратын Адамдарды, әсіресе әйелдер мен балаларды сатудың алдын алу мен жолын кесу және ол үшін жазалау туралы хаттаманы ратификациялау туралы
