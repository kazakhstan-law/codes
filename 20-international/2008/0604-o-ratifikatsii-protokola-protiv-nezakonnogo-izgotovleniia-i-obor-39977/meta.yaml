act_code: '39977'
requisite: Закон Республики Казахстан от 4 июня 2008 года N 39-IV
title:
  rus: О ратификации Протокола против незаконного изготовления и оборота огнестрельного оружия, его составных частей и компонентов, а также боеприпасов к нему, дополняющего Конвенцию Организации Объединенных Наций против транснациональной организованной преступности
  kaz: Біріккен Ұлттар Ұйымының Трансұлттық ұйымдасқан қылмысқа қарсы конвенциясын толықтыратын Атыс қаруының, оның құрамдас бөліктері мен компоненттерінің, сондай-ақ оның оқ-дәрілерінің заңсыз дайындалуына және айналымына қарсы хаттаманы ратификациялау туралы
