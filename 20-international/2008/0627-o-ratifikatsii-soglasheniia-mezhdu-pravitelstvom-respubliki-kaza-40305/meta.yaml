act_code: '40305'
requisite: Закон Республики Казахстан от 27 июня 2008 года № 49-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о взаимном признании в пределах территорий, приграничных с Республикой Казахстан, районов Иссыккульской, Таласской, Чуйской областей Кыргызской Республики и, приграничных с Кыргызской Республикой, районов Алматинской, Жамбылской областей Республики Казахстан туристских виз Республики Казахстан и Кыргызской Республики, выдаваемых для граждан третьих государств
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Қырғыз Республикасы Ыстықкөл, Талас, Шу облыстарының Қазақстан Республикасымен шекаралас аудандарының және Қазақстан Республикасы Алматы, Жамбыл облыстарының Қырғыз Республикасымен шекаралас аудандарының аумақтары шегінде Қазақстан Республикасы мен Қырғыз Республикасының үшінші мемлекеттердің азаматтарына берілетін туристік визаларын өзара тану туралы келісімді ратификациялау туралы
