title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в области использования и развития российской глобальной навигационной спутниковой системы ГЛОНАСС
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы ресейлік ГЛОНАСС ғаламдық навигациялық спутниктік жүйесін пайдалану және дамыту саласындағы ынтымақтастық туралы келісімді бекіту туралы
