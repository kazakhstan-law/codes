title:
  rus: О ратификации Соглашения в форме обмена нотами между Правительством Республики Казахстан и Организацией Североатлантического Договора об условиях пребывания и деятельности офицера связи НАТО в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Солтүстік Атлантика Шарты Ұйымы арасындағы НАТО байланыс офицерінің Қазақстан Республикасында болу және қызмет ету шарттары туралы ноталар алмасу нысанындағы келісімді ратификациялау туралы
