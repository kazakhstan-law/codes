act_code: '41955'
requisite: Постановление Правительства Республики Казахстан от 22 октября 2008 года № 975
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о координации на приграничных зонах радиочастотных присвоений в полосе радиочастот 30.0 - 1000.0 МГц, используемых радиослужбами гражданского назначения Республики Казахстан и Республики Узбекистан
  kaz: Қазақстан Республикасы мен Өзбекстан Республикасының азаматтық мақсаттағы радиоқызметтерімен пайдаланылатын 30.0-1000.0 МГц радиожиілік жолағында шекаралық аймақтарда радиожиіліктерді тағайындауды үйлестіру туралы Қазақстан Республикасы Үкіметі мен Өзбекстан Республикасы Үкіметінің арасындағы келісімді бекіту туралы
