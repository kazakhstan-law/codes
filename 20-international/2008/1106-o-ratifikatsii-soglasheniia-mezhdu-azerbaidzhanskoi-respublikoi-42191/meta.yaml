act_code: '42191'
requisite: Закон Республики Казахстан от 6 ноября 2008 года № 78-IV
title:
  rus: О ратификации Соглашения между Азербайджанской Республикой, Республикой Казахстан, Кыргызской Республикой, Российской Федерацией, Республикой Таджикистан, Туркменистаном и Республикой Узбекистан о создании Центральноазиатского регионального информационного координационного центра по борьбе с незаконным оборотом наркотических средств, психотропных веществ и их прекурсоров
  kaz: Әзірбайжан Республикасы, Қазақстан Республикасы, Қырғыз Республикасы, Ресей Федерациясы, Тәжікстан Республикасы, Түрікменстан және Өзбекстан Республикасы арасындағы Есірткі құралдарының, психотроптық заттар мен олардың прекурсорларының заңсыз айналымына қарсы күрес жөніндегі Орталық Азия өңірлік ақпараттық үйлестіру орталығын құру туралы келісімді ратификациялау туралы
