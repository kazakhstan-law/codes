title:
  rus: О ратификации Соглашения о займе (Проект по передаче технологий и проведению институциональной реформы в секторе здравоохранения Республики Казахстан) между Республикой Казахстан и Международным Банком Реконструкции и Развития
  kaz: Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкі арасындағы Қарыз туралы келісімді (Қазақстан Республикасының денсаулық сақтау секторындағы технологияларды беру және институционалдық реформа жүргізу жөніндегі жоба) ратификациялау туралы
