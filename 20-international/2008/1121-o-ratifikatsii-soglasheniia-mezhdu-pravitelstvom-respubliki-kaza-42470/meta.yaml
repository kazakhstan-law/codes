act_code: '42470'
requisite: Закон Республики Казахстан от 21 ноября 2008 года № 90-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Сирийской Арабской Республики о сотрудничестве в строительстве историко-культурного центра и мавзолея Аль-Фараби, реставрации мавзолея Султана Аз-Захир Бейбарса в городе Дамаске
  kaz: Қазақстан Республикасының Үкіметі мен Сирия Араб Республикасының Үкіметі арасындағы Дамаск қаласында Әл-Фарабидің тарихи-мәдени орталығының және кесенесінің құрылысын салудағы, Сұлтан Аз-Захир Бейбарыс кесенесін қалпына келтірудегі ынтымақтастық туралы келісімді ратификациялау туралы
