title:
  rus: О ратификации Протокола о механизме оказания военно-технической помощи государствам-членам Организации Договора о коллективной безопасности в случаях возникновения угрозы агрессии или совершения акта агрессии
  kaz: Ұжымдық қауіпсіздік туралы шарт ұйымына мүше мемлекеттерге агрессия қатері туындаған немесе агрессия актісі жасалған жағдайларда әскери-техникалық көмек көрсету тетігі туралы хаттаманы ратификациялау туралы
