title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Арабской Республики Египет о сотрудничестве по реставрации мечети Султана Аз-Захир Бейбарса в городе Каире
  kaz: Қазақстан Республикасының Үкіметі мен Египет Араб Республикасының Үкіметі арасындағы Каир қаласында Сұлтан Аз-Захир Бейбарыс мешітін қалпына келтіру жөніндегі ынтыматастық туралы келісімді ратификациялау туралы
