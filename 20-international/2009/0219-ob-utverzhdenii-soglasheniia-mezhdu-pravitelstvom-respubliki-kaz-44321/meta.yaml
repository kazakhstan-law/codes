title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Хорватия об освобождении владельцев дипломатических и служебных паспортов от визовых требований
  kaz: Қазақстан Республикасының Үкіметі мен Хорватия Республикасының Үкіметі арасындағы Дипломатиялық және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
