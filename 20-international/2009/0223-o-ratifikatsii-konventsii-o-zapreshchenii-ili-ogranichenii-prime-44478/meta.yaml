act_code: '44478'
requisite: Закон Республики Казахстан от 23 февраля 2009 года № 140-IV
title:
  rus: 'О ратификации Конвенции о запрещении или ограничении применения конкретных видов обычного оружия, которые могут считаться наносящими чрезмерные повреждения или имеющими неизбирательное действие, и Протоколов к ней: Протокола о необнаруживаемых осколках (Протокол I), Протокола о запрещении или ограничении применения зажигательного оружия (Протокол III) и Протокола об ослепляющем лазерном оружии (Протокол IV)'
  kaz: 'Шектен тыс зиян келтіреді немесе таңдамай әрекет етеді деп саналуы мүмкін кәдімгі қарудың нақты түрлерін қолдануға тыйым салу немесе шектеу туралы конвенцияны және оған хаттамаларды: Анықталмайтын жарықшақтар туралы хаттаманы (I хаттама), Өртегіш қаруды қолдануға тыйым салу немесе шектеу туралы хаттаманы (III хаттама) және Көзді соқыр ететін лазерлік қару туралы хаттаманы (ІV хаттама) ратификациялау туралы'
