  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 февраля 2009 года № 36 "Об утверждении типовых договоров о пенсионном обеспечении за счет обязательных, добровольных и добровольных профессиональных пенсионных взносов"
