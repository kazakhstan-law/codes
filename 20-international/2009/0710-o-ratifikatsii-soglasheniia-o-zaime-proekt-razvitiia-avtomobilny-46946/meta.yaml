title:
  rus: 'О ратификации Соглашения о займе (Проект развития автомобильных дорог Юг - Запад: Международный транзитный коридор "Западная Европа - Западный Китай" (ЦАРЭС 1b и 6b)) между Республикой Казахстан и Международным Банком Реконструкции и Развития'
  kaz: 'Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкі арасындағы Қарыз туралы келісімді (Оңтүстік-Батыс автомобиль жолдарын дамыту жобасы: "Батыс Еуропа - Батыс Қытай" халықаралық транзит дәлізі (ОАӨЭЫ 1b және 6b)) ратификациялау туралы'
