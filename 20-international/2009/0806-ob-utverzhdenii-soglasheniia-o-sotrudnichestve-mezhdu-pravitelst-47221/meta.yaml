title:
  rus: Об утверждении Соглашения о сотрудничестве между правительствами государств-членов Шанхайской организации сотрудничества в борьбе с незаконным оборотом оружия, боеприпасов и взрывчатых веществ
  kaz: Шанхай ынтымақтастық ұйымына мүше мемлекеттердің үкіметтері арасындағы қарудың, оқ-дәрілердің және жарылғыш заттардың заңсыз айналымына қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
