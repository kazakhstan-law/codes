title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Государства Израиль о сотрудничестве в сфере исследования и использования космического пространства в мирных целях
  kaz: Қазақстан Республикасының Үкіметі мен Израиль Мемлекетінің Үкіметі арасындағы ғарыш кеңістігін бейбіт мақсаттарда зерттеу және пайдалану саласындағы ынтымақтастық туралы келісімді бекіту туралы
