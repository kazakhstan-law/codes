act_code: '49025'
requisite: Постановление Правительства Республики Казахстан от 4 декабря 2009 года № 2019
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Французской Республики о взаимном освобождении владельцев дипломатических паспортов от необходимости получения краткосрочных виз
  kaz: Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы Дипломаттық паспорттардың иелерін қысқа мерзімді визалар алу қажеттілігінен өзара босату туралы келісімді бекіту туралы
