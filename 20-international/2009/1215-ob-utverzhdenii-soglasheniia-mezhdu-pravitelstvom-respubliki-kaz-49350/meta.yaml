title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Французской Республики о сотрудничестве в сфере исследования и использования космического пространства в мирных целях
  kaz: Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы ғарыш кеңістігін бейбіт мақсатта зерттеу және пайдалану саласындағы ынтымақтастық туралы келісімді бекіту туралы
