title:
  rus: Об утверждении типовой формы договора поставки зерна из государственных реализационных и государственных стабилизационных ресурсов зерна в целях регулирования внутреннего рынка между агентом и зерноперерабатывающей организацией
  kaz: Агент пен астықты қайта өңдеу ұйымы арасындағы ішкі нарықты реттеу мақсатында мемлекеттік сатылатын және мемлекеттік тұрақтандыру астық ресурстарынан астық жеткізу шартының үлгі нысанын бекіту туралы
