act_code: '52714'
requisite: Постановление Правительства Республики Казахстан от 25 мая 2010 года № 465
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Итальянской Республики о сотрудничестве в борьбе с организованной преступностью, незаконным оборотом наркотических средств, психотропных веществ, прекурсоров и химических веществ, используемых для их производства, терроризмом и другими видами преступлений
  kaz: Қазақстан Республикасының Үкіметі мен Италия Республикасының Үкіметі арасындағы Ұйымдасқан қылмысқа, есірткі құралдарының, психотроптық заттардың, прекурсорлардың және оларды өндіруге пайдаланылатын химиялық заттардың заңсыз айналымына, терроризмге және қылмыстың өзге де түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
