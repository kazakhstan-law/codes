act_code: '52893'
requisite: Закон Республики Казахстан от 31 мая 2010 года № 284-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Финляндской Республики об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и Протокола к нему
  kaz: Қазақстан Республикасының Үкіметі мен Финляндия Республикасының Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді және оған Хаттаманы ратификациялау туралы
