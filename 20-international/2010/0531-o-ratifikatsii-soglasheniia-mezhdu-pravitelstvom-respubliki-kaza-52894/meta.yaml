caused_by:
  code: '124640'
  requisite: Закон Республики Казахстан от 18 сентября 2018 года № 181-VІ ЗРК
  title:
    rus: О ратификации Протокола о внесении изменений в Соглашение между Правительством Республики Казахстан и Правительством Российской Федерации о порядке медицинского обслуживания персонала космодрома «Байконур», жителей города Байконыр, поселков Торетам и Акай в условиях аренды Российской Федерацией комплекса «Байконур» от 17 ноября 2009 года
    kaz: 2009 жылғы 17 қарашадағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Ресей Федерациясының «Байқоңыр» кешенін жалға алу жағдайында Байқоңыр ғарыш айлағының персоналына, Байқоңыр қаласының, Төретам және Ақай кенттерінің тұрғындарына медициналық қызмет көрсету тәртібі туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
