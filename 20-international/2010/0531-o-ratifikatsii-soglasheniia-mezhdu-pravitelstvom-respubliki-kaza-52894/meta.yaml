act_code: '52894'
requisite: Закон Республики Казахстан от 31 мая 2010 года № 285-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о порядке медицинского обслуживания персонала космодрома "Байконур", жителей города Байконыр, поселков Торетам и Акай в условиях аренды Российской Федерацией комплекса "Байконур"
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Ресей Федерациясының "Байқоңыр" кешенін жалға алу жағдайында Байқоңыр ғарыш айлағының персоналына, Байқоңыр қаласының, Төретам және Ақай кенттерінің тұрғындарына медициналық қызмет көрсету тәртібі туралы келісімді ратификациялау туралы
