title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о таможенном контроле энергоресурсов, перемещаемых через казахстанско-китайскую таможенную границу трубопроводным транспортом
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Қазақстан-Қытай кеден шекарасы арқылы құбыржол көлігімен өткізілетін энергия ресурстарын кедендік бақылау туралы келісімді ратификациялау туралы
