    kaz: Қазақстан Республикасының Үкіметі мен Америка Құрама Штаттарының Үкіметі арасындағы Ауғанстан Ислам Республикасының тұрақтылығы және қайта қалпына келтіру жөніндегі іс-қимылға Америка Құрама Штаттарының қатысуына байланысты Қазақстан Республикасының аумағы арқылы арнайы жүктің коммерциялық теміржол транзитін қамтамасыз ету туралы келісімге өзгеріс енгізу туралы хаттаманы ратификациялау туралы
