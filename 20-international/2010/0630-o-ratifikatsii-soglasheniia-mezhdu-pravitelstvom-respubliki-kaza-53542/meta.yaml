act_code: '53542'
requisite: Закон Республики Казахстан от 30 июня 2010 года № 300-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки об обеспечении коммерческого железнодорожного транзита специального груза через территорию Республики Казахстан в связи с участием Соединенных Штатов Америки в усилиях по стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Америка Құрама Штаттарының Үкіметі арасындағы Ауғанстан Ислам Республикасының тұрақтылығы және қайта қалпына келтіру жөніндегі іс-қимылға Америка Құрама Штаттарының қатысуына байланысты Қазақстан Республикасының аумағы арқылы арнайы жүктің коммерциялық темір жол транзитін қамтамасыз ету туралы келісімді ратификациялау туралы
