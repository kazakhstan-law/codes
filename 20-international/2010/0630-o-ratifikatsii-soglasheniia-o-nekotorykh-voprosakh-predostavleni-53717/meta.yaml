caused_by:
  code: '71024'
  requisite: Закон Республики Казахстан от 19 февраля 2013 года № 80-V
  title:
    rus: О ратификации Протокола о внесении изменений и дополнений в Соглашение о некоторых вопросах предоставления обеспечения уплаты таможенных пошлин, налогов в отношении товаров, перевозимых в соответствии с таможенной процедурой таможенного транзита, особенностях взыскания таможенных пошлин, налогов и порядке перечисления взысканных сумм в отношении таких товаров от 21 мая 2010 года
    kaz: 2010 жылғы 21 мамырдағы Кедендік транзиттің кедендік рәсіміне сәйкес тасымалданатын тауарларға қатысты кедендік баждарды, салықтарды төлеуді қамтамасыз етуді ұсынудың кейбір мәселелері, кедендік баждарды, салықтарды өндіріп алудың ерекшеліктері және осындай тауарларға қатысты өндіріп алынған сомаларды аудару тәртібі туралы келісімге өзгерістер мен толықтырулар енгізу туралы хаттаманы ратификациялау туралы
  link: https://zan.gov.kz/client/#!/doc/71024/rus
