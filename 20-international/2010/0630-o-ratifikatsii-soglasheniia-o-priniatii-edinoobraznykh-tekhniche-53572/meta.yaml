act_code: '53572'
requisite: Закон Республики Казахстан от 30 июня 2010 года № 301-IV
title:
  rus: О ратификации Соглашения о принятии единообразных технических предписаний для колесных транспортных средств, предметов оборудования и частей, которые могут быть установлены и/или использованы на колесных транспортных средствах, и об условиях взаимного признания официальных утверждений, выдаваемых на основе этих предписаний
  kaz: Доңғалақты көлік құралдарына, доңғалақты көлік құралдарында орнатылуы және/немесе пайдаланылуы мүмкін жабдықтау заттары мен бөлшектерге арналған бірыңғай техникалық нұсқамаларды қабылдау туралы және осы нұсқамалардың негізінде берілетін ресми бекітулерді өзара мойындау шарттары туралы келісімді ратификациялау туралы
