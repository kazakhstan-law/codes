act_code: '53716'
requisite: Закон Республики Казахстан от 30 июня 2010 года № 324-IV ЗРК
title:
  rus: О ратификации Соглашения об особенностях использования транспортных средств международной перевозки, осуществляющих перевозку пассажиров, а также прицепов, полуприцепов, контейнеров и железнодорожного подвижного состава, осуществляющих перевозку грузов и (или) багажа для внутренней перевозки по таможенной территории таможенного союза
  kaz: Жолаушыларды тасымалдауды жүзеге асыратын халықаралық тасымалдаудың көлік құралдарын, сондай-ақ жүктерді және (немесе) багажды тасымалдауды жүзеге асыратын тіркемелерді, жартылай тіркемелерді, контейнерлер мен теміржол жылжымалы құрамын кеден одағының кедендік аумағы арқылы ішкі тасымалдау үшін пайдалану ерекшеліктері туралы келісімді ратификациялау туралы
