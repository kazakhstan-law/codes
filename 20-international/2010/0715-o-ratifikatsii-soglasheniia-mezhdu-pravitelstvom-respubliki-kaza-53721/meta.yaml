title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Французской Республики об условиях создания и использования космической системы дистанционного зондирования Земли и сборочно-испытательного комплекса космических аппаратов
  kaz: Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы Жерді қашықтықтан зондтаудың ғарыш жүйесін және ғарыш аппараттарының құрастыру-сынау кешенін құру мен пайдалану шарттары туралы келісімді ратификациялау туралы
