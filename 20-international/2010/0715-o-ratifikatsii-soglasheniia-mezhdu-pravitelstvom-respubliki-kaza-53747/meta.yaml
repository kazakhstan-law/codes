act_code: '53747'
requisite: Закон Республики Казахстан от 15 июля 2010 года № 326-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Федеративной Республики Германия о дальнейшем сотрудничестве по развитию Казахстанско-Немецкого Университета в городе Алматы
  kaz: Қазақстан Республикасының Үкіметі мен Германия Федеративтік Республикасының Үкіметі арасындағы Алматы қаласындағы Қазақстан-неміс университетін дамыту жөнінде одан әрі ынтымақтастық жасау туралы келісімді ратификациялау туралы
