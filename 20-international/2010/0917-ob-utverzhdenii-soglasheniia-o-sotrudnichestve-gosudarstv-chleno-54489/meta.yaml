title:
  rus: Об утверждении Соглашения о сотрудничестве государств-членов Евразийского экономического сообщества в сфере аттестации и/или аккредитации образовательных организаций/учреждений (образовательных программ)
  kaz: Еуразиялық экономикалық қоғамдастыққа мүше мемлекеттердің білім беру ұйымдарын/мекемелерін (білім беру бағдарламаларын) аттестаттау және/немесе аккредиттеу саласындағы ынтымақтастығы туралы келісімді бекіту туралы
