act_code: '55404'
requisite: Постановление Правительства Республики Казахстан от 4 ноября 2010 года № 1153
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Объединенных Арабских Эмиратов о сотрудничестве по строительству родильного дома и главной мечети в городе Шымкенте Южно-Казахстанской области зa счет гранта Шейха Халифа бен Заид Аль Нахаяна
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Араб Әмірліктерінің Үкіметі арасындағы Шейх Халифа бен Заид Әл Нахаянның гранты есебінен Оңтүстік Қазақстан облысының Шымкент қаласында перзентхана және бас мешіт салу жөніндегі ынтымақтастық туралы келісімді бекіту туралы
