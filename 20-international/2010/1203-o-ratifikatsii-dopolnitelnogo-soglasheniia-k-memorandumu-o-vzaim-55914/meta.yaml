title:
  rus: О ратификации Дополнительного соглашения к Меморандуму о взаимопонимании между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки по Казахстанско-Американской программе по экономическому развитию от 5 мая 2006 года
  kaz: 2006 жылғы 5 мамырдағы Қазақстан Республикасының Үкіметі және Америка Құрама Штаттарының Үкіметі арасындағы Экономикалық даму жөніндегі Қазақстан-Американ бағдарламасы бойынша өзара түсіністік туралы меморандумға Қосымша келісімді ратификациялау туралы
