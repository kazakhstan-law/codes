act_code: '56028'
requisite: Закон Республики Казахстан от 15 декабря 2010 года № 361-IV ЗРК
title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Республики Армения об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доходы и на имущество и Протокола к ней
  kaz: Қазақстан Республикасының Үкіметі мен Армения Республикасының Үкіметі арасындағы Табыс пен мүлікке салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы конвенцияны және оған Хаттаманы ратификациялау туралы
