act_code: '56029'
requisite: Закон Республики Казахстан от 15 декабря 2010 года № 362-IV ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о взаимном предоставлении земельных участков для строительства зданий дипломатических представительств Республики Казахстан в Республике Узбекистан и Республики Узбекистан в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Өзбекстан Республикасының Үкіметі арасындағы Қазақстан Республикасының Өзбекстан Республикасындағы және Өзбекстан Республикасының Қазақстан Республикасындағы дипломатиялық өкілдіктерінің ғимараттарын салу үшін жер учаскелерін өзара беру туралы келісімді ратификациялау туралы
