act_code: '56626'
requisite: Закон Республики Казахстан от 24 декабря 2010 года № 365-IV ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Государства Палестина о предоставлении в безвозмездное пользование офисного помещения в городе Астане для нужд Посольства Государства Палестина в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Палестина Мемлекетінің Үкіметі арасындағы Палестина Мемлекетінің Қазақстан Республикасындағы Елшілігінің мұқтаждықтары үшін Астана қаласындағы офистік үй-жайды өтеусіз пайдалануға беру туралы келісімді ратификациялау туралы
