title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в области исследования и использования космического пространства в мирных целях
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Ғарыш кеңістігін бейбіт мақсаттарда зерттеу және пайдалану саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
