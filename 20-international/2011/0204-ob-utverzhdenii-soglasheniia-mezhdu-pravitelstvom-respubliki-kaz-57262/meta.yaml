title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Кипр об освобождении владельцев дипломатических и служебных паспортов от визовых требований
  kaz: Қазақстан Республикасының Үкіметі мен Кипр Республикасының Үкіметі арасындағы дипломаттық және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
