act_code: '57687'
requisite: Закон Республики Казахстан от 28 февраля 2011 года № 411-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о взаимном предоставлении в безвозмездное пользование зданий и земельных участков в городе Астана и городе Бишкек для нужд Посольства Республики Казахстан в Кыргызской Республике и Посольства Кыргызской Республики в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Қазақстан Республикасының Қырғыз Республикасындағы Елшілігінің және Қырғыз Республикасының Қазақстан Республикасындағы Елшілігінің қажеттіліктері үшін Астана қаласы мен Бішкек қаласында ғимараттар мен жер учаскелерін өзара өтеусіз пайдалануға беру туралы келісімді ратификациялау туралы
