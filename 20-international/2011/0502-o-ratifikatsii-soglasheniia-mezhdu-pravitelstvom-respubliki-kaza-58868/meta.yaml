act_code: '58868'
requisite: Закон Республики Казахстан от 2 мая 2011 года № 432-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки о воздушном транзите груза и персонала через территорию Республики Казахстан в связи с участием Соединенных Штатов Америки в усилиях по обеспечению безопасности, стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Америка Құрама Штаттарының Үкіметі арасындағы Ауғанстан Ислам Республикасының қауіпсіздігін, тұрақтылығын және оны қайта қалпына келтіруді қамтамасыз ету жөніндегі іс-қимылға Америка Құрама Штаттарының қатысуына байланысты Қазақстан Республикасының аумағы арқылы өтетін жүк пен персоналдың әуе транзиті туралы келісімді ратификациялау туралы
