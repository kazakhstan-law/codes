act_code: '58870'
requisite: Закон Республики Казахстан от 2 мая 2011 года № 434-IV
title:
  rus: О ратификации Соглашения о правилах доступа к услугам субъектов естественных монополий в сфере транспортировки газа по газотранспортным системам, включая основы ценообразования и тарифной политики
  kaz: Баға белгілеу мен тарифтік саясат негіздерін қоса алғанда, газ тасымалы жүйелері арқылы газ тасымалдау саласындағы табиғи монополиялар субъектілерінің қызметтеріне қол жеткізу қағидалары туралы келісімді ратификациялау туралы
