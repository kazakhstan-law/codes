act_code: '59305'
requisite: Закон Республики Казахстан от 23 мая 2011 года № 438-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Корея о предоставлении земельных участков для строительства зданий дипломатических представительств Республики Корея в городе Астане
  kaz: Қазақстан Республикасының Үкіметі мен Корея Республикасының Үкіметі арасындағы Корея Республикасы дипломатиялық өкілдіктерінің ғимараттарын салу үшін Астана қаласында жер учаскелерін беру туралы келісімді ратификациялау туралы
