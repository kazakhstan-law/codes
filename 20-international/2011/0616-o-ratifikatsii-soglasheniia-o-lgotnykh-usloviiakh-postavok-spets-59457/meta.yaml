title:
  rus: О ратификации Соглашения о льготных условиях поставок специальной техники и специальных средств для оснащения правоохранительных органов и специальных служб государств-членов Организации Договора о коллективной безопасности
  kaz: Ұжымдық қауіпсіздік туралы шарт ұйымына мүше мемлекеттердің құқық қорғау органдары мен арнайы қызметтерін жарақтандыру үшін арнайы техника мен арнайы құралдарды жеткізудің жеңілдікті шарттары туралы келісімді ратификациялау туралы
