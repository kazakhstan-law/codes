act_code: '59323'
requisite: Постановление Правительства Республики Казахстан от 29 июня 2011 года № 730
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о создании торгово-выставочного центра Республики Казахстан на территории Всероссийского выставочного центра в г. Москве
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Мәскеу қаласындағы Бүкіл ресейлік көрме орталығының аумағында Қазақстан Республикасының сауда-көрме орталығын кұру туралы келісімді бекіту туралы
