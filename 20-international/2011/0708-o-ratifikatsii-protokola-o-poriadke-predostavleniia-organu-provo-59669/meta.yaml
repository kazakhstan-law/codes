title:
  rus: О ратификации Протокола о порядке предоставления органу, проводящему расследования, сведений, содержащих в том числе конфиденциальную информацию, для целей расследований, предшествующих введению специальных защитных, антидемпинговых и компенсационных мер по отношению к третьим странам
  kaz: Үшінші елдерге қатысты арнайы қорғау, демпингке қарсы және өтемақы шараларын енгізу алдындағы тергеулер мақсаттары үшін тергеу жүргізетін органға мәліметтерді, оның ішінде құпия ақпаратты қамтитын мәліметтерді беру тәртібі туралы хаттаманы ратификациялау туралы
