act_code: '59663'
requisite: Закон Республики Казахстан от 8 июля 2011 года № 454-IV ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Французской Республики о сотрудничестве в области гражданской обороны, предупреждения и ликвидации чрезвычайных ситуаций
  kaz: Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы Азаматтық қорғаныс, төтенше жағдайлардың алдын алу және оларды жою саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
