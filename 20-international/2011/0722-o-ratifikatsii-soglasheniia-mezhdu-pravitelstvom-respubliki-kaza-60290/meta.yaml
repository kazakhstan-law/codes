  title:
    rus: О ратификации Протокола о внесении изменений и дополнений в Соглашение между Правительством Республики Казахстан и Правительством Французской Республики об обеспечении транзита военного имущества и персонала через территорию Республики Казахстан в связи с участием Вооруженных Сил Французской Республики в усилиях по стабилизации и восстановлению Исламской Республики Афганистан, подписанное в Астане 6 октября 2009 года
    kaz: 2009 жылғы 6 қазанда Астанада қол қойылған Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы Француз Республикасы Қарулы Күштерінің Ауғанстан Ислам Республикасын тұрақтандыру мен қалпына келтіру жөніндегі іс-қимылдарға қатысуына байланысты Қазақстан Республикасының аумағы арқылы әскери мүлік пен персоналдың транзитін қамтамасыз ету туралы келісімге өзгерістер мен толықтырулар енгізу туралы хаттаманы ратификациялау туралы
