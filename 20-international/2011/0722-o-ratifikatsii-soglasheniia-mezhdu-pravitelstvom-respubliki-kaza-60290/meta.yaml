act_code: '60290'
requisite: Закон Республики Казахстан от 22 июля 2011 года № 480-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Французской Республики об обеспечении транзита военного имущества и персонала через территорию Республики Казахстан в связи с участием Вооруженных Сил Французской Республики в усилиях по стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы Француз Республикасы Қарулы Күштерінің Ауғанстан Ислам Республикасын тұрақтандыру мен қалпына келтіру жөніндегі іс-қимылдарға қатысуына байланысты Қазақстан Республикасының аумағы арқылы әскери мүлік пен персоналдың транзитін қамтамасыз ету туралы келісімді ратификациялау туралы
