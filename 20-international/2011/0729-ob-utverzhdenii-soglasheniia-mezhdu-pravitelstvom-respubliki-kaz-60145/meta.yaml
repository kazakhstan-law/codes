act_code: '60145'
requisite: Постановление Правительства Республики Казахстан от 29 июля 2011 года № 881
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Исламской Республики Афганистан о сотрудничестве в борьбе против незаконного оборота наркотических средств, психотропных веществ, их аналогов и прекурсоров и злоупотребления ими
  kaz: Қазақстан Республикасының Үкіметі мен Ауғанстан Ислам Республикасының Үкіметі арасындағы Есірткі құралдарының, психотроптық заттардың, олардың аналогтары мен прекурсорларының заңсыз айналымына және оларды теріс пайдалануға қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
