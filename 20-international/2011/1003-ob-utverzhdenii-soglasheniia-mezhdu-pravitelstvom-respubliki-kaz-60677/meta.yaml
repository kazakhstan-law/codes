act_code: '60677'
requisite: Постановление Правительства Республики Казахстан от 3 октября 2011 года № 1130
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Объединенных Арабских Эмиратов о сотрудничестве в борьбе с организованной преступностью, терроризмом, незаконным оборотом наркотических средств, психотропных веществ, их прекурсоров и аналогов, и иными видами преступлений
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Араб Әмірліктерінің Үкіметі арасындағы ұйымдасқан қылмысқа, терроризмге, есірткі құралдарының және психотроптық заттардың, олардың прекурсорлары мен аналогтарының заңсыз айналымына және қылмыстың өзге де түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
