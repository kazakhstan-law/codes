title:
  rus: Об утверждении Соглашения о сотрудничестве государств-участников СНГ в создании, использовании и развитии межгосударственной сети информационно-маркетинговых центров для продвижения товаров и услуг на национальные рынки
  kaz: Ұлттық нарықтарға тауарлар мен қызметтердi iлгерiлету үшiн ақпараттық-маркетингтiк орталықтардың мемлекетаралық желiсiн құрудағы, пайдаланудағы және дамытудағы ТМД-ға қатысушы мемлекеттердiң ынтымақтастығы туралы келiсiмді бекіту туралы
