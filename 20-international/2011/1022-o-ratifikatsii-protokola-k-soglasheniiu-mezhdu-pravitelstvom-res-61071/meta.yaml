title:
  rus: О ратификации Протокола к Соглашению между Правительством Республики Казахстан и Правительством Республики Узбекистан о пунктах пропуска через казахстанско-узбекскую государственную границу от 16 ноября 2001 года
  kaz: 2001 жылғы 16 қарашадағы Қазақстан Республикасының Үкіметі мен Өзбекстан Республикасының Үкіметі арасындағы Қазақстан-Өзбекстан мемлекеттік шекарасы арқылы өткізу пункттері туралы келісімге Хаттаманы ратификациялау туралы
