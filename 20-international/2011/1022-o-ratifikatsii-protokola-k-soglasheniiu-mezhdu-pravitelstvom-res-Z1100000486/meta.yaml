  title:
    rus: О ратификации Протокола о внесении изменений и дополнений в Протокол к Соглашению между Правительством Республики Казахстан и Правительством Республики Узбекистан о пунктах пропуска через казахстанско-узбекскую государственную границу от 4 сентября 2006 года
    kaz: Қазақстан Республикасының Үкіметі және Өзбекстан Республикасының Үкіметі арасындағы Қазақстан-өзбек мемлекеттік шекарасы арқылы өткізу пункттері туралы келісімге 2006 жылғы 4 қыркүйектегі Хаттамаға өзгерістер мен толықтырулар енгізу туралы хаттаманы ратификациялау туралы
