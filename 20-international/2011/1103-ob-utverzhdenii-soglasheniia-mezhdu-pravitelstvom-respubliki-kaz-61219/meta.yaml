act_code: '61219'
requisite: Постановление Правительства Республики Казахстан от 3 ноября 2011 года № 1290
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в области создания и запуска казахстанского спутника связи и вещания "KAZSAT-2"
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы «KAZSAT-2» байланыс және хабар тарататын қазақстандық жер серігін жасау және ұшыру саласындағы ынтымақтастық туралы келісімді бекіту туралы
