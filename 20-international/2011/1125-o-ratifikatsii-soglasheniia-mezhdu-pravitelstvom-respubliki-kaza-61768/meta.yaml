act_code: '61768'
requisite: Закон Республики Казахстан от 25 ноября 2011 года № 498-IV ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Центральноазиатским региональным информационным координационным центром по борьбе с незаконным оборотом наркотических средств, психотропных веществ и их прекурсоров об условиях его пребывания в городе Алматы
  kaz: Қазақстан Республикасының Үкіметі мен Есірткі құралдарының, психотроптық заттар мен олардың прекурсорларының заңсыз айналымына қарсы күрес жөніндегі Орталық Азия өңірлік ақпараттық үйлестіру орталығы арасындағы Алматы қаласында Орталықтың орналасу шарттары туралы келісімді ратификациялау туралы
