act_code: '61767'
requisite: Закон Республики Казахстан от 25 ноября 2011 года № 497-IV ЗРК
title:
  rus: О ратификации Соглашения о развитии в Евразийском экономическом сообществе международного лизинга сельскохозяйственной техники, машин, механизмов, оборудования и транспортных средств, используемых в агропромышленных комплексах
  kaz: Еуразиялық экономикалық қоғамдастықта агроөнеркәсіптік кешендерде пайдаланылатын ауыл шаруашылығы техникасының, машиналардың, механизмдердің, жабдықтар мен көлік құралдарының халықаралық лизингін дамыту туралы келісімді ратификациялау туралы
