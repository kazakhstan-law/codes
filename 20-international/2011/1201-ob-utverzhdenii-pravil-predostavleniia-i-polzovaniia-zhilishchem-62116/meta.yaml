  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 1 декабря 2011 года № 1420 "Об утверждении Правил предоставления и пользования жилищем из государственного жилищного фонда или жилищем, арендованным местным исполнительным органом в частном жилищном фонде" и от 26 июня 2012 года № 856 "Об утверждении Правил постановки на учет граждан Республики Казахстан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
    kaz: Қазақстан Республикасы Үкіметінің "Мемлекеттік тұрғын үй қорынан тұрғын үй немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үй беру және пайдалану қағидаларын бекіту туралы" 2011 жылғы 1 желтоқсандағы № 1420 және "Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж Қазақстан Республикасының азаматтарын есепке қою қағидаларын бекіту туралы" 2012 жылғы 26 маусымдағы № 856 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/74756/rus
