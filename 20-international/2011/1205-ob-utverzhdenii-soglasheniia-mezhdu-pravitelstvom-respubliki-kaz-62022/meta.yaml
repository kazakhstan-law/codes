act_code: '62022'
requisite: Постановление Правительства Республики Казахстан от 5 декабря 2011 года № 1450
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Грузии о сотрудничестве в борьбе с терроризмом, незаконным оборотом наркотических средств, психотропных веществ и прекурсоров, организованной и иными видами преступности
  kaz: Қазақстан Республикасының Үкіметі мен Грузия Үкіметі арасында Терроризмге, есірткі құралдарының, психотроптық заттар мен прекурсорлардың заңсыз айналымына, ұйымдасқан және өзге де қылмыс түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
