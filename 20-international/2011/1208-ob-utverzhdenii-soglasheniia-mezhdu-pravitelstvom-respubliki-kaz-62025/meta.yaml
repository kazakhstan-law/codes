title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Эстонской Республики о сотрудничестве в борьбе с организованной преступностью и иными видами преступности
  kaz: Қазақстан Республикасының Үкіметі мен Эстон Республикасының Үкіметі арасындағы ұйымдасқан қылмысқа және қылмыстың өзге де түрлерiне қарсы күрестегi ынтымақтастық туралы келісімді бекіту туралы
