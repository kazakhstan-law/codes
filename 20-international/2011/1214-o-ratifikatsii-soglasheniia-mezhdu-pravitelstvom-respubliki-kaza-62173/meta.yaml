act_code: '62173'
requisite: Закон Республики Казахстан от 14 декабря 2011 года № 510-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Кабинетом Министров Украины об условиях размещения дипломатических представительств Республики Казахстан в Украине и Украины в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Украина Министрлер Кабинетінің арасындағы Қазақстан Республикасының Украинадағы және Украинаның Қазақстан Республикасындағы дипломатиялық өкілдіктерін орналастыру шарттары туралы келісімді ратификациялау туралы
