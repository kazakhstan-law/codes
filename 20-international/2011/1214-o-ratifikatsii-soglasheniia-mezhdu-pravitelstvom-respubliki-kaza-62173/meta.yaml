  code: '62420'
  requisite: Закон Республики Казахстан от 21 декабря 2011 года № 512-IV
  title:
    rus: О ратификации Протокола между Правительством Республики Казахстан и Кабинетом Министров Украины о внесении изменений в Соглашение между Правительством Республики Казахстан и Кабинетом Министров Украины об условиях размещения дипломатических представительств Республики Казахстан в Украине и Украины в Республике Казахстан от 14 сентября 2010 года
    kaz: Қазақстан Республикасының Үкіметі мен Украинаның Министрлер Кабинетінің арасындағы 2010 жылғы 14 қыркүйектегі Қазақстан Республикасының Үкіметі мен Украинаның Министрлер Кабинетінің арасындағы Қазақстан Республикасының Украинадағы және Украинаның Қазақстан Республикасындағы дипломатиялық өкілдіктерін орналастыру шарттары туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
