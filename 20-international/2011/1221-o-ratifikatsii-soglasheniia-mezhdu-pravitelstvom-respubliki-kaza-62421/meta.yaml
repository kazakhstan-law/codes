act_code: '62421'
requisite: Закон Республики Казахстан от 21 декабря 2011 года № 513-IV
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о сотрудничестве в области гражданской обороны (защиты), предупреждения и ликвидации чрезвычайных ситуаций
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Азаматтық қорғаныс (қорғау), төтенше жағдайлардың алдын алу және оларды жою саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
