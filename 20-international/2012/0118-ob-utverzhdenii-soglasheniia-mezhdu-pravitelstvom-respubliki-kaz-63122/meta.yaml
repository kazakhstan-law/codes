act_code: '63122'
requisite: Постановление Правительства Республики Казахстан от 18 января 2012 года № 102
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики об оказании технического содействия в качестве безвозмездной помощи Правительству Республики Казахстан Правительством Китайской Народной Республики
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Қазақстан Республикасының Үкіметіне Қытай Халық Республикасы Үкіметінің өтеусіз көмек ретінде техникалық жәрдем көрсетуі туралы келісімді бекіту туралы
