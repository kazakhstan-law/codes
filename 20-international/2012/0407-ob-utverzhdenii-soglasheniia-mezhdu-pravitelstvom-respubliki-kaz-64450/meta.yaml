act_code: '64450'
requisite: Постановление Правительства Республики Казахстан от 7 апреля 2012 года № 429
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Чешской Республики об освобождении владельцев дипломатических паспортов Республики Казахстан и владельцев дипломатических паспортов Чешской Республики от визовых требований
  kaz: Қазақстан Республикасының Үкіметі мен Чех Республикасының Үкіметі арасындағы Қазақстан Республикасының дипломаттық паспорттарының иелерін және Чех Республикасының дипломаттық паспорттарының иелерін визалық талаптардан босату туралы келісімді бекіту туралы
