act_code: '64968'
requisite: Закон Республики Казахстан от 20 апреля 2012 года № 11-V
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Королевства Испания об обеспечении транзита военного имущества и персонала через территорию Республики Казахстан в связи с участием Королевства Испания в международных усилиях по стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Испания Корольдігінің Үкіметі арасындағы Ауғанстан Ислам Республикасын тұрақтандыру мен қалпына келтіру жөніндегі халықаралық іс-қимылдарға Испания Корольдігінің қатысуына байланысты Қазақстан Республикасының аумағы арқылы әскери мүлік пен персоналдың транзитін қамтамасыз ету туралы келісімді ратификациялау туралы
