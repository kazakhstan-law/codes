title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об урегулировании взаимных финансовых вопросов и условиях расчетов в области военного образования и использования испытательных полигонов
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы өзара қаржылық мәселелерді реттеу және әскери білім беру мен сынақ полигондарын пайдалану саласындағы есеп айырысу шарттары туралы келісімді ратификациялау туралы
