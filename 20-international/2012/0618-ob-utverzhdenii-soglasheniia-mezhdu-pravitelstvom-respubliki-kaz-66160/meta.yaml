title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Специального Административного Района Гонконг Китайской Народной Республики о взаимном освобождении от визовых требований
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Гонконг Арнайы Әкімшілік Ауданының Үкіметі арасындағы өзара визалық талаптардан босату туралы келісімді бекіту туралы
