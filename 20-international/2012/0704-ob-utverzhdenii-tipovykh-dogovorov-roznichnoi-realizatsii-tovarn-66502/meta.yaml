  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 4 июля 2012 года № 907 "Об утверждении типовых договоров розничной реализации товарного и сжиженного нефтяного газа, а также технического обслуживания газопотребляющих систем и газового оборудования коммунально-бытовых и бытовых потребителей"
    kaz: '"Тауарлық және сұйытылған мұнай газын бөлшек саудада өткізудің, сондай-ақ коммуналдық-тұрмыстық және тұрмыстық тұтынушылардың газ тұтыну жүйелеріне және газ жабдығына техникалық қызмет көрсетудің үлгі шарттарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 4 шілдедегі № 907 қаулысына өзгерістер енгізу туралы'
