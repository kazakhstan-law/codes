title:
  rus: Об утверждении типовых договоров розничной реализации товарного и сжиженного нефтяного газа, а также технического обслуживания газопотребляющих систем и газового оборудования коммунально-бытовых и бытовых потребителей
  kaz: Тауарлық және сұйытылған мұнай газын бөлшек саудада өткізудің, сондай-ақ коммуналдық-тұрмыстық және тұрмыстық тұтынушылардың газ тұтыну жүйелеріне және газ жабдығына техникалық қызмет көрсетудің үлгі шарттарын бекіту туралы
