  title:
    rus: О ратификации Протокола о внесении изменений и дополнений в Соглашение между Правительством Республики Казахстан и Правительством Кыргызской Республики о порядке пребывания граждан Республики Казахстан на территории Кыргызской Республики и граждан Кыргызской Республики на территории Республики Казахстан от 11 мая 2012 года
    kaz: 2012 жылғы 11 мамырдағы Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Үкіметі арасындағы Қазақстан Республикасы азаматтарының Қырғыз Республикасының аумағында және Қырғыз Республикасы азаматтарының Қазақстан Республикасының аумағында болу тәртібі туралы келісімге өзгерістер мен толықтырулар енгізу туралы хаттаманы ратификациялау туралы
