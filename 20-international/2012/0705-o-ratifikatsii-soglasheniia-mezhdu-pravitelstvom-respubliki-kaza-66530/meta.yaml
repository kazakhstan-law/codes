title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Кыргызской Республики о порядке пребывания граждан Республики Казахстан на территории Кыргызской Республики и граждан Кыргызской Республики на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкiметi мен Қырғыз Республикасының Үкiметi арасындағы Қазақстан Республикасы азаматтарының Қырғыз Республикасының аумағында және Қырғыз Республикасы азаматтарының Қазақстан Республикасының аумағында болу тәртiбi туралы келісімді ратификациялау туралы
