title:
  rus: О ратификации Соглашения об основополагающих принципах валютной политики государств-членов Евразийского экономического сообщества по регулированию и контролю операций, связанных с движением капитала
  kaz: Еуразиялық экономикалық қоғамдастыққа мүше мемлекеттердің капитал қозғалысына байланысты операцияларды реттеу және бақылау жөніндегі валюталық саясатының негізін құрайтын қағидаттар туралы келісімді ратификациялау туралы
