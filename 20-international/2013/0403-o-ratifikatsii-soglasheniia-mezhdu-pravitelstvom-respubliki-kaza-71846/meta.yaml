title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о торгово-экономическом сотрудничестве в области поставок нефти и нефтепродуктов в Республику Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасына мұнай және мұнай өнімдерін жеткізу саласындағы сауда-экономикалық ынтымақтастық туралы келісімді ратификациялау туралы
