  code: '75217'
  requisite: Закон Республики Казахстан от 11 ноября 2013 года № 137-V ЗРК
  title:
    rus: О ратификации Протокола между Правительством Республики Казахстан и Правительством Республики Корея о внесении изменений в Соглашение между Правительством Республики Казахстан и Правительством Республики Корея в области развития, финансирования, проектирования, строительства, эксплуатации и технического обслуживания Балхашской тепловой электрической станции от 25 августа 2011 года
    kaz: 2011 жылғы 25 тамыздағы Қазақстан Республикасының Үкіметі мен Корея Республикасының Үкіметі арасындағы Балқаш жылу электр станциясын дамыту, қаржыландыру, жобалау, салу, пайдалану және оған техникалық қызмет көрсету саласындағы келісімге өзгерістер енгізу туралы Қазақстан Республикасының Үкіметі мен Корея Республикасының Үкіметі арасындағы хаттаманы ратификациялау туралы
