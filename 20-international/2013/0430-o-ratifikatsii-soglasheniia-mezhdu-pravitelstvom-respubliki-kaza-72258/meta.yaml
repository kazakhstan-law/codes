act_code: '72258'
requisite: Закон Республики Казахстан от 30 апреля 2013 года № 91-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Корея в области развития, финансирования, проектирования, строительства, эксплуатации и технического обслуживания Балхашской тепловой электрической станции
  kaz: Қазақстан Республикасының Үкіметі мен Корея Республикасының Үкіметі арасындағы Балқаш жылу электр станциясын дамыту, қаржыландыру, жобалау, салу, пайдалану және оған техникалық қызмет көрсету саласындағы келісімді ратификациялау туралы
