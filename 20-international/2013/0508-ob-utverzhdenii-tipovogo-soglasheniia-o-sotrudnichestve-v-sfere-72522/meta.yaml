title:
  rus: Об утверждении Типового соглашения о сотрудничестве в сфере Государственной образовательной накопительной системы между банком-участником и оператором и Типового договора об образовательном накопительном вкладе между банком-участником и вкладчиком
  kaz: Қатысушы банк пен оператор арасындағы Мемлекеттік білім беру жинақтау жүйесі саласындағы ынтымақтастық туралы үлгілік келісімді және Қатысушы банк пен салымшы арасындағы білім беру жинақтау салымы туралы үлгілік шартты бекіту туралы
