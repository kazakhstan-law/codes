act_code: '72502'
requisite: Закон Республики Казахстан от 13 мая 2013 года № 92-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о разработке и реализации программ совместных работ в области военно-технического сотрудничества в интересах вооруженных сил Республики Казахстан и Российской Федерации
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының және Ресей Федерациясының қарулы күштері мүдделерінде әскери-техникалық ынтымақтастық саласындағы бірлескен жұмыстардың бағдарламаларын әзірлеу және іске асыру туралы келісімді ратификациялау туралы
