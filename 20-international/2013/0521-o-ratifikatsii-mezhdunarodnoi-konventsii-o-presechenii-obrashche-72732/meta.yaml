  kaz: 1923 жылғы 12 қыркүйекте Женевада жасалған, 1947 жылғы 12 қарашада Нью-Йорк, Лейк Саксессте қол қойылған Хаттамаға сәйкес енгізілген түзетулерімен Порнографиялық басылымдар айналысының және оларды саудалаудың жолын кесу туралы халықаралық конвенцияны ратификациялау туралы
