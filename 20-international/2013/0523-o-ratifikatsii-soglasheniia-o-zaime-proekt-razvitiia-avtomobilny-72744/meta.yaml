title:
  rus: 'О ратификации Соглашения о займе (Проект развития автомобильных дорог Восток-Запад (участок Алматы-Хоргос): Международный транзитный коридор Западная Европа - Западный Китай (ЦАРЭС 1b) между Республикой Казахстан и Международным Банком Реконструкции и Развития'
  kaz: 'Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкi арасындағы Қарыз туралы келiсiмді (Шығыс-Батыс автомобиль жолдарын дамыту жобасы (Алматы-Қорғас учаскесі): Батыс Еуропа – Батыс Қытай халықаралық транзит дәлізі (ОАӨЭЫ 1b) ратификациялау туралы'
