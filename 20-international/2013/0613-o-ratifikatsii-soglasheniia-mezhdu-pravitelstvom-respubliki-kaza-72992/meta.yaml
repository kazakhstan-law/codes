act_code: '72992'
requisite: Закон Республики Казахстан от 13 июня 2013 года № 103-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Соединенного Королевства Великобритании и Северной Ирландии об обеспечении транзита военного имущества и персонала через территорию Республики Казахстан в связи с участием Соединенного Королевства Великобритании и Северной Ирландии в международных усилиях по стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Ұлыбритания және Солтүстік Ирландия Құрама Корольдігінің Үкіметі арасындағы Ұлыбритания және Солтүстік Ирландия Құрама Корольдігінің Ауғанстан Ислам Республикасын тұрақтандыру мен қалпына келтіру жөніндегі халықаралық іс-қимылдарға қатысуына байланысты Қазақстан Республикасының аумағы арқылы әскери мүлік пен персоналдың транзитін қамтамасыз ету туралы келісімді ратификациялау туралы
