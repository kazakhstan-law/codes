act_code: '73105'
requisite: Закон Республики Казахстан от 21 июня 2013 года № 108-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о взаимном предоставлении земельных участков для размещения дипломатических представительств
  kaz: Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы дипломатиялық өкілдіктерді орналастыру үшін жер учаскелерін өзара беру туралы келісімді ратификациялау туралы
