act_code: '73228'
requisite: Закон Республики Казахстан от 2 июля 2013 года № 117-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в области осуществления совместного контроля на казахстанско-российской государственной границе
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан - Ресей мемлекеттік шекарасында бірлескен бақылауды жүзеге асыру саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
