title:
  rus: Об утверждении Соглашения в форме обмена нотами между Правительством Республики Казахстан и Государственным секретариатом Святого Престола об освобождении владельцев дипломатических паспортов Святого Престола от визовых требований Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қасиетті Тақтың Мемлекеттік хатшылығы арасындағы Қасиетті Тақтың дипломаттық паспорттардың иелерін Қазақстан Республикасының визалық талаптарынан босату туралы ноталар алмасу нысанындағы келісімді бекіту туралы
