title:
  rus: Об утверждении Соглашения о сотрудничестве государств-членов Евразийского экономического сообщества в сфере обращения лекарственных средств (лекарственных препаратов), изделий медицинского назначения и медицинской техники (медицинских изделий)
  kaz: Еуразиялық экономикалық қоғамдастыққа мүше мемлекеттердің дәрілік заттардың (дәрілік препараттардың), медициналық мақсаттағы бұйымдар мен медициналық техниканың (медициналық бұйымдар) айналысы саласындағы ынтымақтастығы туралы келісімді бекіту туралы
