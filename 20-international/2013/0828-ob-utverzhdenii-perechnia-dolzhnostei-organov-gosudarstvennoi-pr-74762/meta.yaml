  title:
    rus: Об утверждении Перечня должностей в органах внутренних дел Республики Казахстан, замещаемых на конкурсной основе, Правил проведения конкурса и стажировки при поступлении на службу в органы внутренних дел Республики Казахстан
    kaz: Қазақстан Республикасы ішкі істер органдарының конкурстық негізде орналасатын лауазымдар тізбесін, Қазақстан Республикасы ішкі істер органдарына қызметке орналасу кезінде конкурс пен тағылымдама өткізу қағидаларын бекіту туралы
