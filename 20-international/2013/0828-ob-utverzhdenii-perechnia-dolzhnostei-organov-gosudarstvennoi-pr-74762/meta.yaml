act_code: '74762'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 28 августа 2013 года № 391. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 октября 2013 года № 8753. Утратил силу приказом Министра внутренних дел Республики Казахстан от 31 августа 2016 года № 870
title:
  rus: Об утверждении Перечня должностей органов государственной противопожарной службы Республики Казахстан, замещаемых на конкурсной основе, Правил и условий проведения конкурса и прохождения стажировки в органах государственной противопожарной службы Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік өртке қарсы қызмет органдарының конкурстық негізде орналасатын лауазымдар тізбесін, Қазақстан Республикасы мемлекеттік өртке қарсы қызмет органдарында конкурс өткізу және тағылымдамадан өту қағидасы мен шарттарын бекіту туралы
