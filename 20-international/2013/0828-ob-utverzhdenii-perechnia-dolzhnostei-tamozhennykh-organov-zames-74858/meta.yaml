requisite: Приказ Министра финансов Республики Казахстан от 28 августа 2013 года № 409. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 октября 2013 года № 8820. Утратил силу приказом Министра финансов Республики Казахстан от 17 ноября 2014 года № 498
title:
  rus: Об утверждении Перечня должностей таможенных органов, замещаемых на конкурсной основе, Правил и условий проведения конкурса и стажировки при поступлении на правоохранительную службу в таможенные органы Республики Казахстан
  kaz: Конкурстық негізде тағайындалатын кеден органдары лауазымдарының тізбесін, Қазақстан Республикасының кеден органдарына құқық қорғау қызметке орналасу кезінде конкурсты және тағлымдаманы өткізу қағидалары мен шарттарын бекіту туралы
