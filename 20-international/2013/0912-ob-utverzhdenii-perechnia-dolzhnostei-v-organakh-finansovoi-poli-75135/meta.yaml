act_code: '75135'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 12 сентября 2013 года № 285. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 октября 2013 года № 8811. Утратил силу приказом Председателя агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 7 октября 2014 года № 10
title:
  rus: Об утверждении перечня должностей в органах финансовой полиции Республики Казахстан, замещаемых на конкурсной основе, Правил и условий проведения конкурса и стажировки в органах финансовой полиции Республики Казахстан
  kaz: Қазақстан Республикасының қаржы полициясы органдарына конкурстық негізде орналасатын лауазымдар тізбесін, Қазақстан Республикасының қаржы полициясы органдарында конкурсты және тағылымдаманы өткізу тәртібі мен шарттарын бекіту туралы
