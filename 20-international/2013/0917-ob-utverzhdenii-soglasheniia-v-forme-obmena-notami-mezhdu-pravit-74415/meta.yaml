title:
  rus: Об утверждении Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Финляндской Республики о взаимном освобождении владельцев дипломатических паспортов от визовых требований
  kaz: Қазақстан Республикасының Үкіметі мен Финляндия Республикасының Үкіметі арасындағы дипломатиялық паспорттардың иелерін визалық талаптардан өзара босату туралы ноталар алмасу нысанындағы келісімді бекіту туралы
