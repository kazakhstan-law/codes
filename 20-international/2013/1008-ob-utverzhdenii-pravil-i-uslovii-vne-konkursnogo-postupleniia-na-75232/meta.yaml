act_code: '75232'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 8 октября 2013 года N 326. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 октября 2013 года N 8854. Утратил силу приказом Председателя агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 7 октября 2014 года № 10
