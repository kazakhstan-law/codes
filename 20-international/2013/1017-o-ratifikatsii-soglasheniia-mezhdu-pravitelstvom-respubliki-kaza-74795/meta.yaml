title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о некоторых вопросах сотрудничества при развитии и эксплуатации нефтепровода "Казахстан - Китай"
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы "Қазақстан - Қытай" мұнай құбырын дамыту және пайдалану кезіндегі ынтымақтастықтың кейбір мәселелері туралы келісімді ратификациялау туралы
