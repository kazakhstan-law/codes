title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Федеративной Республики Бразилия о краткосрочных безвизовых поездках граждан Республики Казахстан и Федеративной Республики Бразилия
  kaz: Қазақстан Республикасының Үкіметі мен Бразилия Федеративтік Республикасының Үкіметі арасындағы Қазақстан Республикасы мен Бразилия Федеративтік Республикасы азаматтарының қысқа мерзімді визасыз сапарлары туралы келісімді бекіту туралы
