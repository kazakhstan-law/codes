act_code: '76478'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2013 года № 1463
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Аргентинской Республики об освобождении от визовых требований владельцев дипломатических, официальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Аргентина Республикасының Үкіметі арасындағы дипломаттық, ресми және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
