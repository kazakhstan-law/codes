act_code: '77725'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 22 января 2014 года № 12-ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2014 года № 9167. Утратил силу приказом и.о. Министра труда и социальной защиты населения Республики Казахстан от 3 августа 2017 года № 232
title:
  rus: Об утверждении Правил формирования базы данных вкладчиков (получателей) по обязательным пенсионным взносам, обязательным профессиональным пенсионным взносам и единого списка физических лиц, заключивших договор о пенсионном обеспечении за счет обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов и Правил представления единым накопительным пенсионным фондом Государственной корпорации «Правительство для граждан» сведений о заключенных и прекративших действие с вкладчиками (получателями) договорах о пенсионном обеспечении за счет обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов с использованием электронного документооборота
  kaz: Салымшылардың (алушылардың) міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары бойынша дерекқорын және міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарт жасасқан жеке тұлғалардың бірыңғай тізімін қалыптастыру қағидаларын және Бірыңғай жинақтаушы зейнетақы қорының "Азаматтарға арналған үкімет" мемлекеттік корпорациясына салымшылармен (алушылармен) міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы жасалған және қолданысын тоқтатқан шарттар жөніндегі мәліметтерді электрондық құжат айналымын пайдалана отырып ұсыну қағидаларын бекіту туралы"
