act_code: '78753'
requisite: Закон Республики Казахстан от 14 апреля 2014 года № 190-V 3PK
title:
  rus: О ратификации Протокола к Соглашению между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в области предупреждения промышленных аварий, катастроф, стихийных бедствий и ликвидации их последствий от 28 марта 1994 г. об упрощенном порядке пересечения государственной границы аварийно-спасательными службами и формированиями
  kaz: 1994 жылғы 28 наурыздағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы өнеркәсіптік авариялардың, апаттардың, дүлей зілзалалардың алдын алу және олардың зардаптарын жою саласындағы ынтымақтастық туралы келісімге авариялық-құтқару қызметтері мен құралымдарының мемлекеттік шекараны кесіп өтуінің оңайлатылған тәртібі туралы хаттаманы ратификациялау туралы
