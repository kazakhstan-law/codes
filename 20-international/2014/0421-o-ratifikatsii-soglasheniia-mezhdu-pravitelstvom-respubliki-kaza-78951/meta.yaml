title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о сотрудничестве в строительстве совместного объединенного гидроузла "Достык" на реке Хоргос
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Қорғас өзенінде "Достық" бірлескен ортақ су торабын салудағы ынтымақтастық туралы келісімді ратификациялау туралы
