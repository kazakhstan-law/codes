act_code: '81033'
requisite: Закон Республики Казахстан от 1 июля 2014 года № 223-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Итальянской Республики об обеспечении транзита военного имущества и персонала через территорию Республики Казахстан в связи с участием Вооруженных Сил Итальянской Республики в усилиях по стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Италия Республикасының Үкіметі арасындағы Ауғанстан Ислам Республикасын тұрақтандыру мен қалпына келтіру жөніндегі іс-қимылдарға Италия Республикасы Қарулы Күштерінің қатысуына байланысты Қазақстан Республикасының аумағы арқылы әскери мүлік пен персоналдың транзитін қамтамасыз ету туралы келісімді ратификациялау туралы
