title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в области транспортировки российской нефти через территорию Республики Казахстан в Китайскую Народную Республику
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының аумағы арқылы Қытай Халық Республикасына ресейлік мұнайды тасымалдау саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
