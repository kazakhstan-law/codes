    kaz: 2013 жылғы 24 желтоқсандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының аумағы арқылы Қытай Халық Республикасына ресейлік мұнайды тасымалдау саласындағы ынтымақтастық туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
