act_code: '83228'
requisite: Закон Республики Казахстан от 19 сентября 2014 года № 237-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Соединенного Королевства Великобритании и Северной Ирландии об обеспечении транзита груза/специального груза через территорию Республики Казахстан в связи с участием Вооруженных Сил Соединенного Королевства Великобритании и Северной Ирландии в международных усилиях по стабилизации и восстановлению Исламской Республики Афганистан
  kaz: Қазақстан Республикасының Үкіметі мен Ұлыбритания және Солтүстік Ирландия Құрама Корольдігінің Үкіметі арасындағы Ұлыбритания және Солтүстік Ирландия Құрама Корольдігі Қарулы Күштерінің Ауғанстан Ислам Республикасын тұрақтандыру мен қалпына келтіру жөніндегі халықаралық іс-қимылдарға қатысуына байланысты Қазақстан Республикасының аумағы арқылы жүктің/арнайы жүктің транзитін қамтамасыз ету туралы келісімді ратификациялау туралы
