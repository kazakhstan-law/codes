title:
  rus: Об утверждении типовых договоров розничной реализации товарного и сжиженного нефтяного газа, а также технического обслуживания газопотребляющих систем и газового оборудования коммунально-бытовых и бытовых потребителей
  kaz: Тауарлық және сұйытылған мұнай газын бөлшек саудада өткізудің, сондай-ақ коммуналдық-тұрмыстық және тұрмыстық тұтынушылардың газ тұтынушы жүйелері мен газ жабдықтарына техникалық қызмет көрсетудің үлгілік шарттарын бекіту туралы
