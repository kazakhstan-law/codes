act_code: '84360'
requisite: Закон Республики Казахстан от 14 ноября 2014 года № 253-V ЗРК
title:
  rus: О ратификации Протокола между Правительством Республики Казахстан и Правительством Республики Беларусь о прекращении действия Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о принципах взимания косвенных налогов при экспорте и импорте товаров (работ) от 2 февраля 1999 года
  kaz: 1999 жылғы 2 ақпандағы Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы Тауарларды (жұмыстарды) экспорттау және импорттау кезінде жанама салықтарды өндіріп алудың принциптері туралы келісімнің қолданысын тоқтату туралы Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы хаттаманы ратификациялау туралы
