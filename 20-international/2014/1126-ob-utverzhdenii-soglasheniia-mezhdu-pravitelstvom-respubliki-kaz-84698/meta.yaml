act_code: '84698'
requisite: Постановление Правительства Республики Казахстан от 26 ноября 2014 года № 1236
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Мексиканских Соединенных Штатов об освобождении от визовых требований владельцев дипломатических, официальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Мексика Құрама Штаттарының Үкіметі арасындағы Дипломатиялық, ресми және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
