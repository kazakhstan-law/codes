title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о взаимном предоставлении земельных участков для строительства зданий дипломатических представительств
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Дипломатиялық өкілдіктердің ғимараттарын салу үшін жер учаскелерін өзара беру туралы келісімді ратификациялау туралы
