  kaz: Қазақстан Республикасы мен Беларусь Республикасы арасындағы Қазақстан Республикасы азаматтарының Беларусь Республикасының аумағында және Беларусь Республикасы азаматтарының Қазақстан Республикасының аумағында болу тәртібі туралы келісімді ратификациялау туралы
