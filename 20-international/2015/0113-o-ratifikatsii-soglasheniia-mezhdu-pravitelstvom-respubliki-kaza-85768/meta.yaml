act_code: '85768'
requisite: Закон Республики Казахстан от 13 января 2015 года № 278-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Азербайджанской Республики о сотрудничестве в области гражданской обороны, предупреждения и ликвидации чрезвычайных ситуаций
  kaz: Қазақстан Республикасының Үкіметі мен Әзербайжан Республикасының Үкіметі арасындағы Азаматтық қорғаныс, төтенше жағдайлардың алдын алу және оларды жою саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
