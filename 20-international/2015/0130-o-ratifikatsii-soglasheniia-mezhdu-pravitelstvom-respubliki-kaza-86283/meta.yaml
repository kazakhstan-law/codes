title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Государства Катар об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и Протокола к Соглашению между Правительством Республики Казахстан и Правительством Государства Катар об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход
  kaz: Қазақстан Республикасының Үкіметі мен Катар Мемлекетінің Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді және Қазақстан Республикасының Үкіметі мен Катар Мемлекетінің Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімге хаттаманы ратификациялау туралы
