title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Всемирной организацией здоровья животных о создании Субрегионального координационного офиса Всемирной организации здоровья животных по ящуру в городе Астане
  kaz: Қазақстан Республикасының Үкіметі мен Жануарлардың саулығы жөніндегі дүниежүзілік ұйым арасындағы Жануарлардың саулығы жөніндегі дүниежүзілік ұйымның Аусыл бойынша субөңірлік үйлестіру кеңсесін Астана қаласында құру туралы келісімді ратификациялау туралы
