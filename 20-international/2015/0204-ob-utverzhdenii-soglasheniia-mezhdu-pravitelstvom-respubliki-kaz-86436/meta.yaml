title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики об оказании технического содействия в качестве безвозмездной помощи Вооруженным Силам Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Қазақстан Республикасының Қарулы Күштеріне өтеусіз көмек ретінде техникалық жәрдем көрсету туралы келісімді бекіту туралы
