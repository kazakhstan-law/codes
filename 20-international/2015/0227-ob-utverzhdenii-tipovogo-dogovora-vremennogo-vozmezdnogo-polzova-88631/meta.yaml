    kaz: '"Арнайы экономикалық аймақ құрылатын жеке меншіктегі жер учаскелерін уақытша өтеулі пайдаланудың (жалға алудың) үлгілік шартын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 27 ақпандағы № 220 бұйрығына өзгерістер мен толықтыру енгізу туралы'
