title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о реадмиссии лиц и Исполнительного протокола о порядке реализации Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о реадмиссии лиц
  kaz: Қазақстан Республикасының Үкіметі мен Өзбекстан Республикасының Үкіметі арасындағы Адамдардың реадмиссиясы туралы келісімді және Қазақстан Республикасының Үкіметі мен Өзбекстан Республикасының Үкіметі арасындағы Адамдардың реадмиссиясы туралы келісімді іске асыру тәртібі туралы атқару хаттамасын ратификациялау туралы
