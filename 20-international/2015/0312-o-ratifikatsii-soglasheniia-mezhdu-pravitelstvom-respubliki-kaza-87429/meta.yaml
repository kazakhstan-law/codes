act_code: '87429'
requisite: Закон Республики Казахстан от 12 марта 2015 года № 292-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Македония об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход
  kaz: Қазақстан Республикасының Үкіметі мен Македония Республикасының Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді ратификациялау туралы
