title:
  rus: О ратификации Соглашения о гранте (Проект повышения энергоэффективности) между Республикой Казахстан и Международным Банком Реконструкции и Развития (выступающим в качестве администратора Трастового фонда одного донора для программы по повышению энергоэффективности и развитию молодежных объединений)
  kaz: Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкі (энергия тиімділігін арттыру және жастар бірлестіктерін дамыту бағдарламасы үшін бір донордың Траст қоры әкімшісі ретінде әрекет етуші) арасындағы Грант туралы келісімді (Энергия тиімділігін арттыру жобасы) ратификациялау туралы
