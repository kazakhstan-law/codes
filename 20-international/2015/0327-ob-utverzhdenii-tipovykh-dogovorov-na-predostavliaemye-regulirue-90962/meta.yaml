requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 266. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июня 2015 года № 11254. Утратил силу приказом Министра национальной экономики Республики Казахстан от 24 июня 2019 года № 58 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типовых договоров на предоставляемые регулируемые коммунальные услуги (товары, работы), а также на иные предоставляемые регулируемые услуги (товары, работы), относящиеся к сфере естественной монополии
  kaz: Табиғи монополия саласына жататын, ұсынылатын реттеліп көрсетілетін коммуналдық қызметтеріне (тауарларына, жұмыстарына), сондай-ақ өзге ұсынылатын реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) үлгi шарттарды бекiту туралы
