title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о реадмиссии и Исполнительного протокола о порядке реализации Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о реадмиссии
  kaz: Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы реадмиссия туралы келісімді және Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы реадмиссия туралы келісімді іске асыру тәртібі туралы атқару хаттамасын ратификациялау туралы
