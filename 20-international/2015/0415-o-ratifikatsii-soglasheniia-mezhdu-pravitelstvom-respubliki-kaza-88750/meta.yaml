act_code: '88750'
requisite: Закон Республики Казахстан от 15 апреля 2015 года № 303-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Социалистической Республики Вьетнам об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход
  kaz: Қазақстан Республикасының Yкiметi мен Вьетнам Социалистік Республикасының Yкiметi арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді ратификациялау туралы
