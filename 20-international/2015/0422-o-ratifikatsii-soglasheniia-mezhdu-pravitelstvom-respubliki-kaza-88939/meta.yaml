act_code: '88939'
requisite: Закон Республики Казахстан от 22 апреля 2015 года № 306-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о сотрудничестве в области гражданской обороны, предупреждения и ликвидации чрезвычайных ситуаций
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы Азаматтық қорғаныс, төтенше жағдайлардың алдын алу және оларды жою саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
