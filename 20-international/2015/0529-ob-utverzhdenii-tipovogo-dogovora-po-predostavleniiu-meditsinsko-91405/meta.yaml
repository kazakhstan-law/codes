requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 29 мая 2015 года № 418. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2015 года № 11520. Утратил силу приказом Министра здравоохранения Республики Казахстан от 22 октября 2024 года № 86 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типового договора по предоставлению медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи, заключаемого между пациентом и медицинской организацией
  kaz: Пациент пен медициналық ұйым арасында жасалатын, тегін медициналық көмектің кепілдік берілген көлемі шеңберінде медициналық көмек ұсыну жөніндегі үлгілік шартты бекіту туралы
