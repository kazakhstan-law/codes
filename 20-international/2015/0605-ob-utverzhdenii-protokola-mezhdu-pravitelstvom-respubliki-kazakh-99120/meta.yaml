act_code: '99120'
requisite: Постановление Правительства Республики Казахстан от 5 июня 2015 года № 407
title:
  rus: Об утверждении Протокола между Правительством Республики Казахстан и Правительством Российской Федерации о порядке деятельности предприятий и организаций, воинских частей, других юридических лиц на территории комплекса "Байконур" в части, касающейся вопросов охраны окружающей среды
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы "Байқоңыр" кешенінің аумағында кәсіпорындар мен ұйымдардың, әскери бөлімдердің, басқа да заңды тұлғалардың қоршаған ортаны қорғау мәселелеріне қатысты бөлігіндегі қызметінің тәртібі туралы хаттаманы бекіту туралы
