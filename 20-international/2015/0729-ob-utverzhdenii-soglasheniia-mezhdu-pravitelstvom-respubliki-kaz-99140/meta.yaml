title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и правительствами государств Бенилюкс об освобождении от визовых требований владельцев дипломатических паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Бенилюкс мемлекеттерінің үкіметтері арасындағы дипломатиялық паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
