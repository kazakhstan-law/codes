title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о реадмиссии и Исполнительного протокола о порядке реализации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о реадмиссии
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы реадмиссия туралы келісімді және Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы реадмиссия туралы келісімді іске асыру тәртібі туралы атқару хаттамасын ратификациялау туралы
