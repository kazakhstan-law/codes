title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Всемирной организацией здравоохранения об открытии Географически удаленного офиса Всемирной организации здравоохранения по первичной медико-санитарной помощи в городе Алматы, Республика Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Дүниежүзілік денсаулық сақтау ұйымы арасындағы Қазақстан Республикасының Алматы қаласында Дүниежүзілік денсаулық сақтау ұйымының медициналық-санитариялық алғашқы көмек жөніндегі географиялық жағынан қашық орналасқан офисін ашу туралы келісімді ратификациялау туралы
