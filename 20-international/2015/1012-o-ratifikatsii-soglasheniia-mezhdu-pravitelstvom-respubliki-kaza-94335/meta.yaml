act_code: '94335'
requisite: Закон Республики Казахстан от 12 октября 2015 года № 354-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об условиях передачи и о порядке дальнейшего использования казахстанского Узла Балхаш в российской системе предупреждения о ракетном нападении
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы қазақстандық Балқаш торабын беру шарттары және оны зымыран шабуылы туралы Ресей ескерту жүйесінде одан әрі пайдалану тәртібі туралы келісімді ратификациялау туралы
