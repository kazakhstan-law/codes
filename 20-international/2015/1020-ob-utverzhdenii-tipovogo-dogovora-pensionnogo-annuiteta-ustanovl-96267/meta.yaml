    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования страхового рынка
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру нарығын реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
