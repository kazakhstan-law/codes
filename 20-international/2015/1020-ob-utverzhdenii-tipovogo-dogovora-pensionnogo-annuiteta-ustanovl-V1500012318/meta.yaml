requisite: Постановление Правления Национального Банка Республики Казахстан от 20 октября 2015 года № 194. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 ноября 2015 года № 12318. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 45 (вводится в действие с 1 июля 2023)
title:
  rus: Об утверждении типового договора пенсионного аннуитета, установлении Методики расчета страховой премии и страховой выплаты из страховой организации по договору пенсионного аннуитета, допустимого уровня расходов страховой организации на ведение дела по заключаемым договорам пенсионного аннуитета, а также ставки индексации страховой выплаты
  kaz: Зейнетақы аннуитетінің үлгілік шартын бекіту, Зейнетақы аннуитеті шарты бойынша сақтандыру ұйымынан сақтандыру сыйлықақысын және сақтандыру төлемін есептеу әдістемесін, сақтандыру ұйымының жасалатын зейнетақы аннуитеті шарттары бойынша істі жүргізуге жұмсалатын шығыстарының жол берілетін деңгейін, сондай-ақ сақтандыру төлемін индекстеу мөлшерлемесін белгілеу туралы
