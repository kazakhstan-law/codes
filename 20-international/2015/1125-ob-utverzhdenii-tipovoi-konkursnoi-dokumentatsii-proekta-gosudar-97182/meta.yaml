requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 25 ноября 2015 года № 724. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 декабря 2015 года № 12495. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 3 октября 2024 года № 84 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типовой конкурсной документации проекта государственно-частного партнерства и типового договора государственно-частного партнерства по способам осуществления государственно-частного партнерства в отдельных отраслях (сферах) экономики
  kaz: Экономиканың жекелеген салаларында (аясында) мемлекеттік-жекешелік әріптестікті жүзеге асыру тәсілдері бойынша мемлекеттік-жекешелік әріптестік жобасының үлгілік конкурстық құжаттамасын және мемлекеттік-жекешелік әріптестіктің үлгілік шартын бекіту туралы
