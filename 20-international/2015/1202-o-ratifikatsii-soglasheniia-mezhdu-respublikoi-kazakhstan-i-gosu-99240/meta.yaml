act_code: '99240'
requisite: Закон Республики Казахстан от 2 декабря 2015 года № 430-V ЗРК
title:
  rus: О ратификации Соглашения между Республикой Казахстан и государствами Бенилюкс (Королевство Бельгия, Великое Герцогство Люксембург и Королевство Нидерландов) о реадмиссии и Протокола реализации Соглашения между Республикой Казахстан и государствами Бенилюкс (Королевство Бельгия, Великое Герцогство Люксембург и Королевство Нидерландов) о реадмиссии
  kaz: Қазақстан Республикасы мен Бенилюкс мемлекеттері (Бельгия Корольдігі, Люксембург Ұлы Герцогтігі және Нидерланд Корольдігі) арасындағы реадмиссия туралы келісімді және Қазақстан Республикасы мен Бенилюкс мемлекеттері (Бельгия Корольдігі, Люксембург Ұлы Герцогтігі және Нидерланд Корольдігі) арасындағы реадмиссия туралы келісімді іске асыру хаттамасын ратификациялау туралы
