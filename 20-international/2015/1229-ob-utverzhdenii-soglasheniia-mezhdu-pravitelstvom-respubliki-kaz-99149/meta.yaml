act_code: '99149'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2015 года № 1114
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об особенностях осуществления хозяйственной деятельности на приграничной территории при добыче медно-колчеданных руд на Весенне-Аралчинском месторождении
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Весенне-Аралчинское кен орнында мыс-колчедан кендерін өндіру кезінде шекара маңындағы аумақта шаруашылық қызметті жүзеге асыру ерекшеліктері туралы келісімді бекіту туралы
