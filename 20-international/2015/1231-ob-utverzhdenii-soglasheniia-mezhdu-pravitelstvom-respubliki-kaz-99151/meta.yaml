act_code: '99151'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2015 года № 1169
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики об оказании на безвозмездной основе технической помощи (содействия) Вооруженным Силам Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Қазақстан Республикасының Қарулы Күштеріне өтеусіз негізде техникалық көмек (жәрдем) көрсету туралы келісімді бекіту туралы
