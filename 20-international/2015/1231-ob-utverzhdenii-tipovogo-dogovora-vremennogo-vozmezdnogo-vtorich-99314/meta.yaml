requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 31 декабря 2015 года № 1291. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 февраля 2016 года № 12960. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 19 июля 2019 года № 522 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типового договора временного возмездного вторичного землепользования (субаренды) земельными участками, находящимися в государственной собственности, на которых создается специальная экономическая зона
  kaz: Арнайы экономикалық аймақ құрылатын мемлекеттік меншіктегі жер учаскелерін уақытша өтеулі кейінгі жер пайдаланудың (қосалқы жалдаудың) үлгілік шартын әзірлеу және бекіту туралы
