act_code: '99680'
requisite: Закон Республики Казахстан от 29 февраля 2016 года № 466-V ЗРК
title:
  rus: О ратификации Соглашения о реализации в 2015-2016 годах пилотного проекта по введению маркировки товаров контрольными (идентификационными) знаками по товарной позиции "Предметы одежды, принадлежности к одежде и прочие изделия из натурального меха"
  kaz: '"Табиғи теріден жасалған киім заттары, киімге керек-жарақтар және өзге де бұйымдар" тауар позициясы бойынша тауарларды бақылау (идентификациялау) белгілерімен таңбалауды енгізу жөніндегі пилоттық жобаны 2015-2016 жылдары іске асыру туралы келісімді ратификациялау туралы'
