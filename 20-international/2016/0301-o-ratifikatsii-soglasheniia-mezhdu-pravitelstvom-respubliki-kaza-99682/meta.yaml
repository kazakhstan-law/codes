act_code: '99682'
requisite: Закон Республики Казахстан от 1 марта 2016 года № 467-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Международным бюро выставок о льготах и преференциях для официальных участников, связанных с проведением Международной специализированной выставки ЭКСПО-2017 в городе Астане
  kaz: Қазақстан Республикасының Үкіметі мен Халықаралық көрмелер бюросы арасындағы Астана қаласында ЭКСПО-2017 халықаралық мамандандырылған көрмесін өткізуге байланысты ресми қатысушыларға арналған жеңілдіктер мен преференциялар туралы келісімді ратификациялау туралы
