act_code: '99683'
requisite: Закон Республики Казахстан от 1 марта 2016 года № 468-V ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Молдова о реадмиссии лиц с незаконным пребыванием и Исполнительного протокола по реализации Соглашения между Правительством Республики Казахстан и Правительством Республики Молдова о реадмиссии лиц с незаконным пребыванием
  kaz: Қазақстан Республикасының Үкіметі мен Молдова Республикасының Үкіметі арасындағы заңсыз болатын адамдардың реадмиссиясы туралы келісімді және Қазақстан Республикасының Үкіметі мен Молдова Республикасының Үкіметі арасындағы заңсыз болатын адамдардың реадмиссиясы туралы келісімді іске асыру бойынша атқару хаттамасын ратификациялау туралы
