title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Корея о временной трудовой деятельности граждан Республики Казахстан в Республике Корея и граждан Республики Корея в Республике Казахстан в рамках внутрикорпоративных переводов
  kaz: Қазақстан Республикасының Үкіметі мен Корея Республикасының Үкіметі арасындағы Корея Республикасындағы Қазақстан Республикасы азаматтарының және Қазақстан Республикасындағы Корея Республикасы азаматтарының ішкі корпоративтік ауысулар шеңберіндегі уақытша еңбек қызметі туралы келісімді ратификациялау туралы
