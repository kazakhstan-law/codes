act_code: '101060'
requisite: Постановление Правительства Республики Казахстан от 7 апреля 2016 года № 194
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Государства Катар о взаимном освобождении от визовых требований для владельцев дипломатических и специальных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Қатар Мемлекетінің Үкіметі арасындағы дипломатиялық және арнайы паспорттардың иелерін визалық талаптардан өзара босату туралы келісімді бекіту туралы
