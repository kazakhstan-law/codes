act_code: '101067'
requisite: Постановление Правительства Республики Казахстан от 7 апреля 2016 года № 193
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о порядке оформления виз с деловыми целями в рамках сотрудничества в области индустриализации и инвестиций
  kaz: Қазақстан Республикасының Үкіметі мен  Қытай Халық Республикасының Үкіметі арасындағы индустрияландыру және инвестициялар саласындағы ынтымақтастық шеңберінде іскерлік мақсаттағы визаларды ресімдеу тәртібі туралы келісімді бекіту туралы
