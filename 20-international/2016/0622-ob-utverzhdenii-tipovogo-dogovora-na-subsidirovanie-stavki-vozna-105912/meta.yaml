  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 22 июня 2016 года № 517 «Об утверждении Типового договора на субсидирование ставки вознаграждения при кредитовании и финансовом лизинге на приобретение вагонов перевозчиками пассажиров по социально значимым сообщениям и операторами вагонов (контейнеров)»
    kaz: «Әлеуметтік маңызы бар қатынастар бойынша жолаушыларды тасымалдаушылар мен операторлардың вагондарды (контейнерлерді) сатып алуын кредиттеуге және олардың қаржылық лизингіне сыйақының мөлшерлемесін субсидиялаудың үлгілік шартын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 22 маусымдағы № 517 бұйрығына өзгеріс енгізу туралы
