title:
  rus: Об утверждении Типового договора на субсидирование ставки вознаграждения при кредитовании и финансовом лизинге на приобретение вагонов и локомотивов
  kaz: Вагондар мен локомотивтерді сатып алуға кредит беру және қаржы лизингі кезінде сыйақы мөлшерлемесін субсидиялауға арналған үлгілік шартты бекіту туралы
