title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Королевства Саудовской Аравии об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и Протокола к ней
  kaz: Қазақстан Республикасының Үкіметі мен Сауд Арабиясы Корольдігінің Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы конвенцияны және оған Хаттаманы ратификациялау туралы
