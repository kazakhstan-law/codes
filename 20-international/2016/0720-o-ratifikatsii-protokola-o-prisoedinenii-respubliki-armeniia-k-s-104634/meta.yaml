title:
  rus: О ратификации Протокола о присоединении Республики Армения к Соглашению о единых принципах и правилах обращения медицинских изделий (изделий медицинского назначения и медицинской техники) в рамках Евразийского экономического союза от 23 декабря 2014 года
  kaz: 2014 жылғы 23 желтоқсандағы Еуразиялық экономикалық одақ шеңберінде медициналық бұйымдар (медициналық мақсаттағы бұйымдар мен медициналық техника) айналысының бірыңғай қағидаттары мен қағидалары туралы келісімге Армения Республикасының қосылуы туралы хаттаманы ратификациялау туралы
