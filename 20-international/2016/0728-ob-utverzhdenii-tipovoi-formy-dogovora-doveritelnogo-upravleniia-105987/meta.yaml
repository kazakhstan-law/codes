  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 20 марта 2015 года № 241 «Об утверждении Типового положения о жилищной инспекции» и от 28 июля 2016 года № 348 «Об утверждении типовой формы договора доверительного управления голосующими акциями (долями участия в уставном капитале) уполномоченной компании»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Тұрғын үй инспекциясы туралы үлгі ережені бекіту туралы» 2015 жылғы 20 наурыздағы № 241 және «Уәкілетті компанияның дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерін) сенімгерлікпен басқару шартының үлгілік нысанын бекіту туралы» 2016 жылғы 28 шілдедегі № 348 бұйрықтарына өзгерістер енгізу туралы
