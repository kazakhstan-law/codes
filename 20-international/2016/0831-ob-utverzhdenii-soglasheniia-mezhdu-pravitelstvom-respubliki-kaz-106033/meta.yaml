title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Исламским Банком Развития о гранте технической помощи по подготовке исследования по предварительной институциональной структуре Исламской Организации по продовольственной безопасности Организации Исламского Сотрудничества
  kaz: Қазақстан Республикасының Үкіметі және Ислам Даму Банкі арасындағы Ислам Ынтымақтастығы Ұйымы Азық-түлік қауіпсіздігі жөніндегі Ислам Ұйымының алдын ала институционалдық құрылымы бойынша зерттеуді дайындау жөніндегі техникалық көмек гранты туралы келісімді бекіту туралы
