act_code: '106445'
requisite: Закон Республики Казахстан от 28 сентября 2016 года № 13-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Исламской Республики Афганистан о сотрудничестве в области гражданской обороны, предупреждения и ликвидации чрезвычайных ситуаций
  kaz: Қазақстан Республикасының Үкіметі мен Ауғанстан Ислам Республикасының Үкіметі арасындағы Азаматтық қорғаныс, төтенше жағдайлардың алдын алу және оларды жою саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
