act_code: '106892'
requisite: Постановление Правительства Республики Казахстан от 13 октября 2016 года № 587
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Демократической Социалистической Республики Шри-Ланка об освобождении от визовых требований владельцев дипломатических, официальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Шри-Ланка Демократиялық Социалистік Республикасының Үкіметі арасындағы Дипломатиялық, ресми және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
