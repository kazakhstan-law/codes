  kaz: Қазақстан Республикасының Үкіметі мен Өнеркәсіптік даму жөніндегі Біріккен Ұлттар Ұйымы арасындағы өнеркәсіптік даму қорына нысаналы жарналар туралы әкімшілік келісімді бекіту туралы
