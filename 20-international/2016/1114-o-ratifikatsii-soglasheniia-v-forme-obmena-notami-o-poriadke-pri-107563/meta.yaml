act_code: '107563'
requisite: Закон Республики Казахстан от 14 ноября 2016 года № 21-VІ ЗРК
title:
  rus: О ратификации Соглашения в форме обмена нотами о порядке признания официальных документов, подтверждающих резидентство, выданных уполномоченными органами Республики Казахстан и Российской Федерации в рамках Конвенции между Правительством Республики Казахстан и Правительством Российской Федерации об устранении двойного налогообложения и предотвращении уклонения от уплаты налогов на доход и капитал
  kaz: Қазақстан Республикасының Үкiметi мен Ресей Федерациясы Үкiметiнiң арасындағы Қосарланған салық салуды болдырмау және табыс пен капиталға салық төлеуден жалтаруға жол бермеу туралы конвенция шеңберінде Қазақстан Республикасының және Ресей Федерациясының уәкілетті органдары берген резиденттікті растайтын ресми құжаттарды тану тәртібі туралы ноталар алмасу нысанындағы келісімді ратификациялау туралы
