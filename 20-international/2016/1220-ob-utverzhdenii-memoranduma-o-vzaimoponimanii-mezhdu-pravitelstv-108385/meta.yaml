title:
  rus: Об утверждении Меморандума о взаимопонимании между Правительством Республики Казахстан и Правительством Республики Индия о создании в Республике Казахстан учебного центра в области информационно-коммуникационных технологий
  kaz: Қазақстан Республикасының Үкіметі мен Үндістан Республикасының Үкіметі арасындағы Қазақстан Республикасында ақпараттық-коммуникациялық технологиялар саласындағы оқу орталығын құру туралы өзара түсіністік туралы меморандумды бекіту туралы
