title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Международным агентством по атомной энергии о создании Банка низкообогащенного урана Международного агентства по атомной энергии в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Атом энергиясы жөніндегі халықаралық агенттік арасындағы Қазақстан Республикасында Атом энергиясы жөніндегі халықаралық агенттіктің Төмен байытылған уран банкін құру туралы келісімді ратификациялау туралы
