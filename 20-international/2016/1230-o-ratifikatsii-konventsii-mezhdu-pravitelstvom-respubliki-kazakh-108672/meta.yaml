act_code: '108672'
requisite: Закон Республики Казахстан от 30 декабря 2016 года № 37-VІ ЗРК
title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Республики Словения об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и на капитал и Протокола к ней
  kaz: Қазақстан Республикасының Үкіметі мен Словения Республикасының Үкіметі арасындағы Табыс пен капиталға салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы конвенцияны және оған Хаттаманы ратификациялау туралы
