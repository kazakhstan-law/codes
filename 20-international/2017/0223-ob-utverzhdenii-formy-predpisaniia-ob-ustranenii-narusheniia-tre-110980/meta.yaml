  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 23 февраля 2017 года № 83 «Об утверждении формы предписания об устранении нарушения требований законодательства Республики Казахстан о семеноводстве, протокола об административном правонарушении, постановления по делу об административном правонарушении»
    kaz: «Қазақстан Республикасының тұқым шаруашылығы туралы заңнамасының талаптарын бұзуды жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс бойынша қаулының нысандарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2017 жылғы 23 ақпандағы № 83 бұйрығына өзгеріс енгізу туралы
