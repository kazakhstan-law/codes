  kaz: Қазақстан Республикасының тұқым шаруашылығы туралы заңнамасының талаптарын бұзуды жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс бойынша қаулының нысандарын бекіту туралы
