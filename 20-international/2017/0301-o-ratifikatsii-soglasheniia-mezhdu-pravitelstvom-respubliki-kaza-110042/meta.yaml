act_code: '110042'
requisite: Закон Республики Казахстан от 1 марта 2017 года № 50-VI ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Организацией Объединенных Наций по вопросам образования, науки и культуры (ЮНЕСКО) о создании в Республике Казахстан Центрально-Азиатского регионального гляциологического центра (категории 2) под эгидой ЮНЕСКО
  kaz: Қазақстан Республикасының Үкіметі мен Білім, ғылым және мәдениет мәселелері жөніндегі Біріккен Ұлттар Ұйымы (ЮНЕСКО) арасындағы Қазақстан Республикасында ЮНЕСКО аясында Орталық Азия өңірлік гляциологиялық орталығын (2-санат) құру туралы келісімді ратификациялау туралы
