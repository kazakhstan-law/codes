title:
  rus: О ратификации Меморандума о взаимопонимании между Правительством Республики Казахстан и Правительством Турецкой Республики об оказании поддержки принимающей Стороны при проведении учений подразделениями специального назначения
  kaz: Қазақстан Республикасының Үкіметі мен Түркия Республикасының Үкіметі арасындағы арнайы мақсаттағы бөлімшелердің оқу-жаттығуларын өткізу кезінде қабылдаушы Тараптың қолдау көрсетуі туралы өзара түсіністік туралы меморандумды ратификациялау туралы
