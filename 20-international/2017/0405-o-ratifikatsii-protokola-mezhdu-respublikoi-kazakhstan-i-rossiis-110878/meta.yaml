act_code: '110878'
requisite: Закон Республики Казахстан от 5 апреля 2017 года № 57-VI ЗРК
title:
  rus: О ратификации Протокола между Республикой Казахстан и Российской Федерацией о мерах по прекращению действия Соглашения между Республикой Казахстан и Российской Федерацией об условиях использования и аренды полигона Эмба (5580 база обеспечения испытательных работ) от 20 января 1995 года и Договора между Правительством Республики Казахстан и Правительством Российской Федерации об аренде испытательного полигона Эмба (5580 база обеспечения испытательных работ) от 18 октября 1996 года
  kaz: 1995 жылғы 20 қаңтардағы Қазақстан Республикасы мен Ресей Федерациясы арасындағы Эмба полигонын (5580 сынақ жұмыстарын қамтамасыз ету базасы) пайдалану және жалға беру шарттары туралы келісімнің және 1996 жылғы 18 қазандағы Қазақстан Республикасының Үкіметі мен Ресей Федерациясы Үкіметінің арасындағы Ембі сынақ полигонын (5580 сынақ жұмыстарын қамтамасыз ету базасы) жалдау туралы шарттың қолданысын тоқтату жөніндегі шаралар туралы Қазақстан Республикасы мен Ресей Федерациясы арасындағы хаттаманы ратификациялау туралы
