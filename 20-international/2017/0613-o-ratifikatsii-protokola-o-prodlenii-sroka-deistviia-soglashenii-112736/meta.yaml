title:
  rus: О ратификации Протокола о продлении срока действия Соглашения о реализации в 2015 – 2016 годах пилотного проекта по введению маркировки товаров контрольными (идентификационными) знаками по товарной позиции «Предметы одежды, принадлежности к одежде и прочие изделия, из натурального меха» от 8 сентября 2015 года
  kaz: 2015 жылғы 8 қыркүйектегі «Табиғи теріден жасалған киім заттары, киімге керек-жарақтар және өзге де бұйымдар» тауар позициясы бойынша тауарларды бақылау (идентификациялау) белгілерімен таңбалауды енгізу жөніндегі пилоттық жобаны 2015 – 2016 жылдары іске асыру туралы келісімнің қолданылу мерзімін ұзарту жөніндегі хаттаманы ратификациялау туралы
