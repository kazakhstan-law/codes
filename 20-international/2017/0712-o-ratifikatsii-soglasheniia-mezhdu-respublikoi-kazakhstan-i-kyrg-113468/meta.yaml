title:
  rus: О ратификации Соглашения между Республикой Казахстан и Кыргызской Республикой о применении порядка регулирования доступа к услугам железнодорожного транспорта, включая основы тарифной политики
  kaz: Қазақстан Республикасы мен Қырғыз Республикасы арасындағы Тарифтік саясат негіздерін қоса алғанда, теміржол көлігі көрсететін қызметтерге қол жеткізуді реттеу тәртібін қолдану туралы келісімді ратификациялау туралы
