title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Королевства Таиланд об освобождении от визовых требований владельцев дипломатических и служебных/официальных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Таиланд Корольдігінің Үкіметі арасындағы дипломатиялық және қызметтік/ресми паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
