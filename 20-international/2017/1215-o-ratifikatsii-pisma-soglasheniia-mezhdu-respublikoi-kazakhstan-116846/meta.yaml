title:
  rus: 'О ратификации Письма-соглашения между Республикой Казахстан и Международным Банком Реконструкции и Развития относительно поправок № 2 к Соглашению о займе № 7681-KZ (Проект развития автомобильных дорог Юг-Запад: Международный транзитный коридор Западная Европа – Западный Китай (ЦАРЭС 1b и 6b)) между Республикой Казахстан и Международным Банком Реконструкции и Развития'
  kaz: 'Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкi арасындағы № 7681-KZ Қарыз туралы келiсiмге (Оңтүстік-Батыс автомобиль жолдарын дамыту жобасы: Батыс Еуропа – Батыс Қытай халықаралық транзит дәлізі (ОАӨЭЫ 1b және 6b)) № 2 түзетулерге қатысты Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкi арасындағы келісім-хатты ратификациялау туралы'
