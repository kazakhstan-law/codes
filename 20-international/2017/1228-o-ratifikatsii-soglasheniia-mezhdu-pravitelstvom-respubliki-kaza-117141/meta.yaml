act_code: '117141'
requisite: Закон Республики Казахстан от 28 декабря 2017 года № 129-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Грузии о повторной реструктуризации задолженности Правительства Грузии по государственным кредитам, предоставленным Правительству Грузии Правительством Республики Казахстан
  kaz: Қазақстан Республикасы Үкiметi мен Грузия Үкiметi арасындағы Қазақстан Республикасы Үкiметiнiң Грузия Үкiметiне берген мемлекеттiк кредиттерi бойынша Грузия Үкiметiнiң берешегін қайтадан қайта құрылымдау туралы келісімді ратификациялау туралы
