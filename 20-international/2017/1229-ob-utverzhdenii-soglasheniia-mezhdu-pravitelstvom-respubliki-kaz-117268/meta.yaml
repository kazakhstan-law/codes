title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в научных исследованиях и разработках в ядерно-энергетической сфере
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы ядролық энергетика саласындағы ғылыми зерттеулер мен әзірлемелердегі ынтымақтастық туралы келісімді бекіту туралы
