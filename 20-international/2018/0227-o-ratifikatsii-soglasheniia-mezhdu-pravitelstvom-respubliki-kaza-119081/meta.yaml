act_code: '119081'
requisite: Закон Республики Казахстан от 27 февраля 2018 года № 140-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Организацией Объединенных Наций относительно административных и финансовых процедур для Субрегионального отделения для Северной и Центральной Азии
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымы арасындағы Солтүстік және Орталық Азия үшін Субөңірлік бөлімшеге арналған әкімшілік және қаржылық рәсімдерге қатысты келісімді ратификациялау туралы
