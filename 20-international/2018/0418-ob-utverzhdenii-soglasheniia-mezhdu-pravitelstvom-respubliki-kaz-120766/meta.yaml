act_code: '120766'
requisite: Постановление Правительства Республики Казахстан от 18 апреля 2018 года № 202
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о сотрудничестве в области исследования и использования космического пространства в мирных целях
  kaz: Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы ғарыш кеңістігін бейбіт мақсаттарда зерттеу және пайдалану саласындағы ынтымақтастық туралы келісімді бекіту туралы
