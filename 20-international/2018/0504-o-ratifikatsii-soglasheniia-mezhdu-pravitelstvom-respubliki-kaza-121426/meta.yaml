title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о взаимном предоставлении земельных участков для строительства зданий дипломатических представительств
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы Дипломатиялық өкілдіктердің ғимараттарын салу үшін жер учаскелерін өзара беру туралы келісімді ратификациялау туралы
