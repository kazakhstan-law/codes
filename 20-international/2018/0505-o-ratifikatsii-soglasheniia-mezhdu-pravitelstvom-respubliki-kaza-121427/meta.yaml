act_code: '121427'
requisite: Закон Республики Казахстан от 5 мая 2018 года № 154-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Соединённых Штатов Америки относительно взимания платы за аэронавигационное обслуживание государственных воздушных судов
  kaz: Қазақстан Республикасының Үкіметі мен Америка Құрама Штаттарының Үкіметі арасындағы мемлекеттік әуе кемелеріне аэронавигациялық қызмет көрсету үшін төлемақы алуға қатысты келісімді ратификациялау туралы
