act_code: '123088'
requisite: Закон Республики Казахстан от 29 июня 2018 года № 164-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о сотрудничестве в строительстве совместной селезадерживающей плотины «Чукурбулак (Алмалы)» на реке Хоргос
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Қорғас өзенінде «Шүкірбұлақ (Алмалы)» бірлескен сел ұстайтын бөгетін салудағы ынтымақтастық туралы келісімді ратификациялау туралы
