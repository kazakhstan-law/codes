act_code: '123232'
requisite: Постановление Правительства Республики Казахстан от 9 июля 2018 года № 412
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Латвийской Республики о сотрудничестве в борьбе с терроризмом, незаконным оборотом наркотических и психотропных веществ, прекурсоров и организованной преступностью
  kaz: Қазақстан Республикасының Үкіметі мен Латвия Республикасының Үкіметі арасындағы Терроризмге, есірткі және психотроптық заттардың, прекурсорлардың заңсыз айналымына және ұйымдасқан қылмысқа қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
