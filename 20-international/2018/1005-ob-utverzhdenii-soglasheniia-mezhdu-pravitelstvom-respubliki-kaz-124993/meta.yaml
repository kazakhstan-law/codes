title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о реконструкции казахстанско-китайского совместного водозаборного сооружения на реке Сумбе
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Сүмбе өзеніндегі Қазақстан-Қытай бірлескен су алу құрылысжайын реконструкциялау туралы келісімді бекіту туралы
