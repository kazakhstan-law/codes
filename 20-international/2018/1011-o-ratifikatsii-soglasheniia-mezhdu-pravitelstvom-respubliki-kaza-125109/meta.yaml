act_code: '125109'
requisite: Закон Республики Казахстан от 11 октября 2018 года № 185-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Иорданского Хашимитского Королевства о сотрудничестве в области гражданской обороны, предупреждения и ликвидации чрезвычайных ситуаций
  kaz: Қазақстан Республикасының Үкіметі мен Иордан Хашимит Корольдігінің Үкіметі арасындағы Азаматтық қорғаныс, төтенше жағдайлардың алдын алу және оларды жою саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
