title:
  rus: О ратификации Соглашения о порядке расследования несчастных случаев на производстве, происшедших с гражданами одного государства – члена Евразийского экономического сообщества при осуществлении трудовой деятельности на территории другого государства – члена Евразийского экономического сообщества
  kaz: Еуразиялық экономикалық қоғамдастыққа мүше бір мемлекеттің азаматтары Еуразиялық экономикалық қоғамдастыққа мүше екінші мемлекеттің аумағында еңбек қызметін жүзеге асыру кезінде ұшыраған өндірістегі жазатайым оқиғаларды тергеп-тексеру тәртібі туралы келісімді ратификациялау туралы
