act_code: '125237'
requisite: Постановление Правительства Республики Казахстан от 11 октября 2018 года № 631
title:
  rus: Об утверждении Соглашения о сближении подходов по нормативно-правовому и нормативно-техническому регулированию, оценке соответствия, стандартизации, аккредитации и метрологическому обеспечению в области использования атомной энергии в мирных целях
  kaz: Атом энергиясын бейбіт мақсатта пайдалану саласындағы нормативтік-құқықтық және нормативтік-техникалық реттеу, сәйкестікті бағалау, стандарттау, аккредиттеу және метрологиялық қамтамасыз ету тәсілдерін жақындастыру туралы келісімді бекіту туралы
