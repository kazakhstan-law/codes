act_code: '125775'
requisite: Постановление Правительства Республики Казахстан от 25 октября 2018 года № 681
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Иорданского Хашимитского Королевства о сотрудничестве в области борьбы с терроризмом, организованной преступностью, незаконным оборотом наркотических средств, психотропных веществ, их прекурсоров и иными видами преступлений
  kaz: Қазақстан Республикасының Үкіметі мен Иордан Хашимит Корольдігінің Үкіметі арасындағы Терроризмге, ұйымдасқан қылмысқа, есірткі құралдарының, психотроптық заттардың, олардың прекурсорларының заңсыз айналымына және қылмыстың өзге де түрлеріне қарсы күрес саласындағы ынтымақтастық туралы келісімді бекіту туралы
