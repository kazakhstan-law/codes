requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 26 октября 2018 года № 437. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 декабря 2018 года № 17878
title:
  rus: Об утверждении формы предписания об устранении нарушений требований земельного законодательства Республики Казахстан, протокола об административном правонарушении, постановления по делу об административном правонарушении
  kaz: Қазақстан Республикасы жер заңнамасының талаптарын бұзушылықтарды жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс бойынша қаулының нысанын бекіту туралы
