  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 26 октября 2018 года № 437 «Об утверждении формы предписания об устранении нарушений требований земельного законодательства Республики Казахстан, протокола об административном правонарушении, постановления по делу об административном правонарушении»
    kaz: «Қазақстан Республикасы жер заңнамасының талаптарын бұзушылықтарды жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс бойынша қаулының нысанын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2018 жылғы 26 қазандағы № 437 бұйрығына өзгеріс енгізу туралы
