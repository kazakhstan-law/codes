act_code: '125461'
requisite: Закон Республики Казахстан от 29 октября 2018 года № 188-VІ ЗРК
title:
  rus: О ратификации Меморандума о взаимопонимании между Правительством Республики Казахстан и Правительством Республики Индия о порядке совместного развертывания казахстанского миротворческого контингента в составе индийского батальона во Временных силах Организации Объединенных Наций в Ливане (ВСООНЛ)
  kaz: Қазақстан Республикасының Үкіметі мен Үндістан Республикасының Үкіметі арасындағы Біріккен Ұлттар Ұйымының Ливандағы Уақытша күштеріндегі (БҰҰЛУК) үндістандық батальон құрамында қазақстандық бітімгершілік контингентті бірлесіп өрістету тәртібі туралы өзара түсіністік туралы меморандумды ратификациялау туралы
