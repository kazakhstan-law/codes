act_code: '126015'
requisite: Закон Республики Казахстан от 21 ноября 2018 года № 193-VІ ЗРК
title:
  rus: О ратификации Протокола о порядке передачи наркотических средств, психотропных веществ и их прекурсоров, огнестрельного оружия, его основных частей, боеприпасов, взрывчатых веществ и взрывных устройств, являющихся вещественными доказательствами по уголовным делам
  kaz: Қылмыстық істер бойынша заттай дәлелдемелер болып табылатын есірткі құралдарын, психотроптық заттар мен олардың прекурсорларын, атыс қаруын, оның негізгі бөліктерін, оқ-дәрілерді, жарылғыш заттар мен жарғыш құрылғыларды беру тәртібі туралы хаттаманы ратификациялау туралы
