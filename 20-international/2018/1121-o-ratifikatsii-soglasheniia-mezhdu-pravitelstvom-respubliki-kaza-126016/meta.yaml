act_code: '126016'
requisite: Закон Республики Казахстан от 21 ноября 2018 года № 194-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Международным Комитетом Красного Креста о статусе, привилегиях и иммунитетах Представительства Международного Комитета Красного Креста в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Халықаралық Қызыл Крест Комитетінің арасындағы Қазақстан Республикасындағы Халықаралық Қызыл Крест Комитеті Өкілдігінің мәртебесі, артықшылықтары және иммунитеттері туралы келісімді ратификациялау туралы
