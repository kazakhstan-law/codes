act_code: '126017'
requisite: Закон Республики Казахстан от 21 ноября 2018 года № 195-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об определении статуса технологической нефти в магистральных нефтепроводах «Туймазы – Омск - Новосибирск-2» и «Омск – Павлодар»
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы «Туймазы – Омбы – Новосибирск-2» және «Омбы – Павлодар» магистральдық мұнай құбырларындағы технологиялық мұнайдың мәртебесін айқындау туралы келісімді ратификациялау туралы
