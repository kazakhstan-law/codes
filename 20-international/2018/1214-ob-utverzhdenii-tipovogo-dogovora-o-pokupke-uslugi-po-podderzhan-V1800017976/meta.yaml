title:
  rus: Об утверждении Типового договора о покупке услуги по поддержанию готовности электрической мощности с субъектами оптового рынка, включенными в Реестр групп лиц
  kaz: Тұлғалар тобының тізіліміне енгізілген көтерме сауда нарығының субъектілерімен электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметтерді сатып алу туралы үлгілік шартты бекіту туралы
