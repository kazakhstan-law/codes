title:
  rus: О ратификации Дополнительного протокола к Протоколу к Соглашению между Республикой Казахстан и Российской Федерацией о разграничении дна северной части Каспийского моря в целях осуществления суверенных прав на недропользование от 6 июля 1998 года
  kaz: 1998 жылғы 6 шілдедегі Қазақстан Республикасы мен Ресей Федерациясы арасындағы Жер қойнауын пайдалануға арналған егемендік құқықтарды жүзеге асыру мақсатында Каспий теңізі солтүстік бөлігінің түбін межелеу туралы келісімге Хаттамаға Қосымша хаттаманы ратификациялау туралы
