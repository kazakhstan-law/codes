title:
  rus: О ратификации Соглашения о перемещении озоноразрушающих веществ и содержащей их продукции и учете озоноразрушающих веществ при осуществлении взаимной торговли государств – членов Евразийского экономического союза и Протокола о присоединении Кыргызской Республики к Соглашению о перемещении озоноразрушающих веществ и содержащей их продукции и учете озоноразрушающих веществ при осуществлении взаимной торговли государств – членов Евразийского экономического союза от 29 мая 2015 года
  kaz: Еуразиялық экономикалық одаққа мүше мемлекеттер өзара сауданы жүзеге асыру кезінде озонды бұзатын заттар мен құрамында осындай заттары бар өнімдерді өткізу және озонды бұзатын заттарды есепке алу туралы келісімді және 2015 жылғы 29 мамырдағы Еуразиялық экономикалық одаққа мүше мемлекеттер өзара сауданы жүзеге асыру кезінде озонды бұзатын заттар мен құрамында осындай заттары бар өнімдерді өткізу және озонды бұзатын заттарды есепке алу туралы келісімге Қырғыз Республикасының қосылуы туралы хаттаманы ратификациялау туралы
