act_code: '128130'
requisite: Закон Республики Казахстан от 8 января 2019 года № 214-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Хорватия об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход и Протокола к нему
  kaz: Қазақстан Республикасының Үкіметі мен Хорватия Республикасының Үкіметі арасындағы Табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді және оған Хаттаманы ратификациялау туралы
