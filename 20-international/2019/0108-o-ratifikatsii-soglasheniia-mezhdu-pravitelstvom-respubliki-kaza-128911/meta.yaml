act_code: '128911'
requisite: Закон Республики Казахстан от 8 января 2019 года № 216-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики об освобождении от налогообложения отдельных видов дохода Китайско-Казахстанского Фонда сотрудничества производственных мощностей, осуществляющего прямые инвестиции в Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Қазақстанға тікелей инвестициялар салуды жүзеге асыратын Қытай-Қазақстан өндірістік қуаттарының ынтымақтастығы қоры кірісінің жекелеген түрлерін салық салудан босату туралы келісімді ратификациялау туралы
