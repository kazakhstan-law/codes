act_code: '128912'
requisite: Закон Республики Казахстан от 25 января 2019 года № 218-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о порядке пребывания граждан Республики Казахстан на территории Республики Таджикистан и граждан Республики Таджикистан на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы Қазақстан Республикасы азаматтарының Тәжікстан Республикасының аумағында және Тәжікстан Республикасы азаматтарының Қазақстан Республикасының аумағында болу тәртібі туралы келісімді ратификациялау туралы
