title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о реадмиссии лиц и Исполнительного протокола о порядке реализации Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан о реадмиссии лиц
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы адамдардың реадмиссиясы туралы келісімді және Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы адамдардың реадмиссиясы туралы келісімді іске асыру тәртібі туралы атқару хаттамасын ратификациялау туралы
