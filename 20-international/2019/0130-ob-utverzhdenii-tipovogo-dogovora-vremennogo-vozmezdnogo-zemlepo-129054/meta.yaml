  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 30 января 2019 года № 41 «Об утверждении типового договора временного возмездного землепользования (аренды) земельного участка сельскохозяйственного назначения для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства»
