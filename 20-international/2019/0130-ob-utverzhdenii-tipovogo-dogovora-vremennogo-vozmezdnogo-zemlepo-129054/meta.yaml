title:
  rus: Об утверждении типового договора временного возмездного землепользования (аренды) земельного участка сельскохозяйственного назначения для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства
  kaz: Шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін ауыл шаруашылығы мақсатындағы жер учаскесін уақытша өтеулі жер пайдаланудың (жалға алудың) үлгі шартын бекіту туралы
