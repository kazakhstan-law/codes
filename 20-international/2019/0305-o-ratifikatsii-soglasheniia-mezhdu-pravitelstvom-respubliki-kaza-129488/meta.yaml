title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Беларусь о производственной и научно-технической кооперации организаций оборонных отраслей промышленности
  kaz: Қазақстан Республикасының Үкіметі мен Беларусь Республикасының Үкіметі арасындағы өнеркәсіптің қорғаныс салалары ұйымдарының өндірістік және ғылыми-техникалық кооперациясы туралы келісімді ратификациялау туралы
