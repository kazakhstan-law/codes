title:
  rus: Об утверждении Протокола о присоединении Республики Армения к Соглашению об обмене информацией, в том числе конфиденциальной, в финансовой сфере в целях создания условий на финансовых рынках для обеспечения свободного движения капитала от 23 декабря 2014 года
  kaz: 2014 жылғы 23 желтоқсандағы Қаржы нарықтарында капиталдың еркін қозғалысын қамтамасыз ету үшін жағдайлар жасау мақсатында қаржы саласында ақпарат, оның ішінде құпия ақпарат алмасу туралы келісімге Армения Республикасының қосылуы туралы хаттаманы бекіту туралы
