act_code: '131377'
requisite: Закон Республики Казахстан от 13 мая 2019 года № 255-VІ ЗРК
title:
  rus: О ратификации Соглашения между Республикой Казахстан и Российской Федерацией о порядке осуществления контроля за наличием и целевым использованием продукции военного назначения, поставляемой в рамках Договора между Республикой Казахстан и Российской Федерацией о военно-техническом сотрудничестве от 24 декабря 2013 года
  kaz: Қазақстан Республикасы мен Ресей Федерациясы арасындағы 2013 жылғы 24 желтоқсандағы Қазақстан Республикасы мен Ресей Федерациясы арасындағы әскери-техникалық ынтымақтастық туралы шарт шеңберінде берілетін әскери мақсаттағы өнімнің болуын және нысаналы пайдаланылуын бақылауды жүзеге асыру тәртібі туралы келісімді ратификациялау туралы
