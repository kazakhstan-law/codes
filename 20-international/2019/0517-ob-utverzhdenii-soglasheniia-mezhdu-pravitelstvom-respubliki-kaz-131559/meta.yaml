act_code: '131559'
requisite: Постановление Правительства Республики Казахстан от 17 мая 2019 года № 295
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Азербайджанской Республики об организации содействия в совместном строительстве, владении и пользовании волоконно-оптических линий связи по дну Каспийского моря по маршруту Казахстан – Азербайджан операторами связи Республики Казахстан и Азербайджанской Республики
  kaz: Қазақстан Республикасының Үкіметі мен Әзербайжан Республикасының Үкіметі арасындағы Қазақстан Республикасы мен Әзербайжан Республикасы байланыс операторларының Қазақстан – Әзербайжан маршруты бойынша Каспий теңізінің түбімен өтетін талшықты-оптикалық байланыс желілерін бірлесіп салуға, иеленуге және пайдалануға жәрдемдесуін ұйымдастыру туралы келісімді бекіту туралы
