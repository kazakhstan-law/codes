act_code: '131932'
requisite: Постановление Правительства Республики Казахстан от 30 мая 2019 года № 351
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Сингапур о взаимном освобождении от визовых требований владельцев дипломатических, служебных или официальных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Сингапур Республикасының Үкіметі арасындағы дипломатиялық, қызметтік немесе ресми паспорттардың иелерін визалық талаптардан өзара босату туралы келісімді бекіту туралы
