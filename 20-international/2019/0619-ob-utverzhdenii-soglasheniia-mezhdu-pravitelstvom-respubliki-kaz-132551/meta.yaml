act_code: '132551'
requisite: Постановление Правительства Республики Казахстан от 19 июня 2019 года № 417
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Государства Кувейт о взаимном освобождении от первичных въездных виз владельцев дипломатических, служебных и специальных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Кувейт Мемлекетінің Үкіметі арасындағы дипломатиялық, қызметтік және арнайы паспорттардың иелерін алғашқы кіру визаларынан өзара босату туралы келісімді бекіту туралы
