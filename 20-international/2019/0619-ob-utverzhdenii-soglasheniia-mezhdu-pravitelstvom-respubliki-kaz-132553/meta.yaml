act_code: '132553'
requisite: Постановление Правительства Республики Казахстан от 19 июня 2019 года № 418
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Султаната Оман о взаимном освобождении от визовых требований владельцев дипломатических, специальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Оман Сұлтандығының Үкіметі арасындағы дипломатиялық, арнайы және қызметтік паспорттар иелерін визалық талаптардан өзара босату туралы келісімді бекіту туралы
