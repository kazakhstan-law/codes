act_code: '137910'
requisite: Закон Республики Казахстан от 30 декабря 2019 года № 298-VІ ЗРК
title:
  rus: О ратификации Конвенции между Правительством Республики Казахстан и Правительством Республики Кипр об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доходы и Протокола к ней
  kaz: Қазақстан Республикасының Үкіметі мен Кипр Республикасының Үкіметі арасындағы табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы конвенцияны және оған Хаттаманы ратификациялау туралы
