  rus: О ратификации Соглашения между Республикой Казахстан и Советом Европы в отношении привилегий и иммунитетов представителей Группы государств против коррупции и членов оценочных групп
  kaz: Қазақстан Республикасы мен Еуропа Кеңесі арасындағы Сыбайлас жемқорлыққа қарсы мемлекеттер тобы өкілдерінің және бағалаушы топтар мүшелерінің артықшылықтары мен иммунитеттеріне қатысты келісімді ратификациялау туралы
