title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики о сотрудничестве по предоставлению суперкомпьютера Правительством Китайской Народной Республики
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасы Үкіметінің арасындағы Қытай Халық Республикасы Үкіметінің суперкомпьютерді ұсынуы жөніндегі ынтымақтастық туралы келісімді бекіту туралы
