  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 27 марта 2020 года № 157 «Об утверждении Типового договора на субсидирование ставок купонного вознаграждения по облигациям перевозчика, выпущенным в целях развития магистральной железнодорожной сети и подвижного состава железнодорожного транспорта»
    kaz: «Магистральдық теміржол желісін және теміржол көлігінің жылжымалы құрамын дамыту мақсатында шығарылған тасымалдаушының облигациялары бойынша купондық сыйақы мөлшерлемесін субсидиялауға арналған үлгілік шартты бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндітін атқарушының 2020 жылғы 27 наурыздағы № 157 бұйрығына өзгерістер енгізу туралы
