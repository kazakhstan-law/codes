title:
  rus: Об утверждении Типового договора на субсидирование ставки купонного вознаграждения по облигациям перевозчика, выпущенным в целях развития магистральной железнодорожной сети и подвижного состава железнодорожного транспорта
  kaz: Магистральдық теміржол желісін және теміржол көлігінің жылжымалы құрамын дамыту мақсатында шығарылған тасымалдаушының облигациялары бойынша купондық сыйақы мөлшерлемесін субсидиялауға арналған үлгілік шартты бекіту туралы
