act_code: '141207'
requisite: Закон Республики Казахстан от 28 марта 2020 года № 308-VІ ЗРК
title:
  rus: О ратификации Соглашения в форме обмена нотами о порядке признания официальных документов, подтверждающих резидентство, выданных уполномоченными органами Республики Казахстан и Республики Армения в рамках Конвенции между Правительством Республики Казахстан и Правительством Республики Армения об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доходы и на имущество и Протокола к ней от 6 ноября 2006 года
  kaz: 2006 жылғы 6 қарашадағы Қазақстан Республикасының Үкіметі мен Армения Республикасының Үкіметі арасындағы Табыс пен мүлікке салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы конвенция және оған Хаттама шеңберінде Қазақстан Республикасының және Армения Республикасының уәкілетті органдары берген резиденттікті растайтын ресми құжаттарды тану тәртібі туралы ноталар алмасу нысанындағы келісімді ратификациялау туралы
