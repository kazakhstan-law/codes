  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 30 марта 2020 года № 165 «Об утверждении Типовых форм договоров между объединением собственников имущества или простым товариществом с управляющим многоквартирным жилым домом, управляющей компанией или субъектами сервисной деятельности»
    kaz: «Мүліктің меншік иелері бірлестігі немесе жай серіктестік пен көппәтерлі тұрғын үйді басқарушы немесе басқарушы компания немесе сервистік қызмет субъектілері арасындағы шарттардың үлгілік нысандарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 30 наурыздағы № 165 бұйрығына өзгерістер енгізу туралы
