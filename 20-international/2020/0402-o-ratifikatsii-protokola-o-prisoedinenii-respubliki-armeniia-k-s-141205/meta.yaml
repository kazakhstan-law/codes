title:
  rus: О ратификации Протокола о присоединении Республики Армения к Соглашению о введении единых форм паспорта транспортного средства (паспорта шасси транспортного средства) и паспорта самоходной машины и других видов техники и организации систем электронных паспортов от 15 августа 2014 года
  kaz: 2014 жылғы 15 тамыздағы Көлік құралы паспортының (көлік құралының шассиі паспортының) және өздігінен жүретін машина және техниканың басқа да түрлері паспортының бірыңғай нысандарын енгізу және электрондық паспорттар жүйелерін ұйымдастыру туралы келісімге Армения Республикасының қосылуы туралы хаттаманы ратификациялау туралы
