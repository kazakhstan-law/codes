act_code: '141954'
requisite: Закон Республики Казахстан от 17 апреля 2020 года № 314-VІ ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о трудовой деятельности и защите прав трудящихся-мигрантов, являющихся гражданами Республики Узбекистан, в Республике Казахстан и трудящихся-мигрантов, являющихся гражданами Республики Казахстан, в Республике Узбекистан
  kaz: Қазақстан Республикасының Үкіметі мен Өзбекстан Республикасының Үкіметі арасындағы Өзбекстан Республикасының азаматтары болып табылатын еңбекші көшіп-қонушылардың Қазақстан Республикасындағы және Қазақстан Республикасының азаматтары болып табылатын еңбекші көшіп-қонушылардың Өзбекстан Республикасындағы еңбек қызметі және құқықтарын қорғау туралы келісімді ратификациялау туралы
