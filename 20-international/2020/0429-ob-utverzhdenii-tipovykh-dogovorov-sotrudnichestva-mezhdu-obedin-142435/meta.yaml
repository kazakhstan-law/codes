act_code: '142435'
requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 250. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2020 года № 20545
title:
  rus: Об утверждении типовых договоров сотрудничества между объединением собственников имущества или субъектом управления объектом кондоминиума и организациями, предоставляющими коммунальные услуги
  kaz: Мүліктің меншік иелері бірлестігі немесе кондоминиум объектісін басқару субъектісі мен коммуналдық көрсетілетін қызметтерді ұсынатын ұйымдар арасындағы ынтымақтастықтың үлгілік шарттарын бекіту туралы
