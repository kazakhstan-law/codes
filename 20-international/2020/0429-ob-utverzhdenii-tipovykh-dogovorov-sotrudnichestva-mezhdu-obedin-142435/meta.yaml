caused_by:
  code: '216683'
  requisite: Приказ Министра промышленности и строительства Республики Казахстан от 12 сентября 2025 года № 361. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 сентября 2025 года № 36845
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 250 «Об утверждении типовых договоров сотрудничества между объединением собственников имущества или простым товариществом, или управляющим многоквартирным жилым домом, или управляющей компанией и организациями, предоставляющими коммунальные услуги»
    kaz: «Мүліктің меншік иелері бірлестігі немесе жай серіктестік немесе көппәтерлі тұрғын үйді басқарушы немесе басқарушы компания мен коммуналдық көрсетілетін қызметтерді ұсынатын ұйымдар арасындағы ынтымақтастықтың үлгілік шарттарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 29 сәуірдегі № 250 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/216683/rus
