act_code: '143384'
requisite: Постановление Правительства Республики Казахстан от 29 мая 2020 года № 335
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Колумбия об освобождении от визовых требований владельцев дипломатических, официальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Колумбия Республикасының Үкіметі арасындағы дипломатиялық, ресми және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
