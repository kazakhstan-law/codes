act_code: '146640'
requisite: Постановление Правительства Республики Казахстан от 23 сентября 2020 года № 600
title:
  rus: Об утверждении Соглашения в форме обмена письмами между Правительством Республики Казахстан и Фондом Организации Объединенных Наций в области народонаселения относительно правового статуса странового офиса Фонда Организации Объединенных Наций в области народонаселения в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымының Халықтың қоныстануы саласындағы қорының арасындағы Біріккен Ұлттар Ұйымының Халықтың қоныстануы саласындағы қорының Қазақстан Республикасындағы елдік офисінің құқықтық мәртебесіне қатысты хаттармен алмасу нысанындағы келісімді бекіту туралы
