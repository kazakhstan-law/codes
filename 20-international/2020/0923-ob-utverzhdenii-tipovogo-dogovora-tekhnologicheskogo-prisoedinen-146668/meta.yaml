title:
  rus: Об утверждении Типового договора технологического присоединения электрических установок с установленной мощностью до 200 кВт субъектов предпринимательства к электрическим сетям энергопередающих организаций
  kaz: Кәсіпкерлік субъектілерінің белгіленген қуаты 200 кВт-қа дейінгі электр қондырғыларын энергия беруші ұйымдардың электр желілеріне технологиялық қосудың үлгілік шартын бекіту туралы
