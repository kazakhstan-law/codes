title:
  rus: О ратификации Соглашения о взаимодействии государств – участников СНГ по обеспечению готовности на случай ядерной аварии или возникновения радиационной аварийной ситуации и взаимопомощи при ликвидации их последствий
  kaz: ТМД-ға қатысушы мемлекеттердің ядролық авария немесе радиациялық авариялық ахуалдың туындау жағдайына дайындықты және олардың зардаптарын жою кезіндегі өзара көмекті қамтамасыз ету бойынша өзара іс-қимылы туралы келісімді ратификациялау туралы
