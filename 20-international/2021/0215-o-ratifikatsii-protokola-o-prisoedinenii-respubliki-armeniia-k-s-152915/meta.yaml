act_code: '152915'
requisite: Закон Республики Казахстан от 15 февраля 2021 года № 8-VII ЗРК
title:
  rus: О ратификации Протокола о присоединении Республики Армения к Соглашению о порядке защиты конфиденциальной информации и ответственности за ее разглашение при осуществлении Евразийской экономической комиссией полномочий по контролю за соблюдением единых правил конкуренции от 12 ноября 2014 года
  kaz: 2014 жылғы 12 қарашадағы Еуразиялық экономикалық комиссияның бәсекелестіктің бірыңғай қағидаларының сақталуын бақылау жөніндегі өкілеттіктерді жүзеге асыруы кезінде құпия ақпаратты қорғау тәртібі және оны жария еткені үшін жауаптылық туралы келісімге Армения Республикасының қосылуы туралы хаттаманы ратификациялау туралы
