act_code: '152917'
requisite: Закон Республики Казахстан от 15 февраля 2021 года № 10-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Организацией Объединенных Наций по вопросам образования, науки и культуры (ЮНЕСКО) о создании Международного центра сближения культур под эгидой ЮНЕСКО (категория 2)
  kaz: Қазақстан Республикасының Үкіметі мен Білім, ғылым және мәдениет мәселелері жөніндегі Біріккен Ұлттар Ұйымы (ЮНЕСКО) арасындағы ЮНЕСКО аясында Мәдениеттерді жақындастыру халықаралық орталығын (2-санат) құру туралы келiсiмді ратификациялау туралы
