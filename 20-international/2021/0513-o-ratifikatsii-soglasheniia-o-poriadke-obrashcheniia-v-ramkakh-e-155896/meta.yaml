title:
  rus: О ратификации Соглашения о порядке обращения в рамках Евразийского экономического союза продукции, требования к которой не установлены техническими регламентами Евразийского экономического союза, и правилах обеспечения безопасности такой продукции
  kaz: Еуразиялық экономикалық одақтың техникалық регламенттерінде талаптар белгіленбеген өнімнің Еуразиялық экономикалық одақ шеңберіндегі айналысының тәртібі және мұндай өнімнің қауіпсіздігін қамтамасыз ету қағидалары туралы келісімді ратификациялау туралы
