title:
  rus: Об утверждении Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Японии о получении японского гранта в рамках Программы экономического и социального развития
  kaz: Қазақстан Республикасының Үкіметі мен Жапония Үкіметі арасындағы Экономикалық және әлеуметтік даму бағдарламасы шеңберінде жапондық грант алу туралы ноталар алмасу нысанындағы келісімді бекіту туралы
