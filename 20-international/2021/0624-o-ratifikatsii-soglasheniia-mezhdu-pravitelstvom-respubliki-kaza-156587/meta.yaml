act_code: '156587'
requisite: Закон Республики Казахстан от 24 июня 2021 года № 55-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве по осуществлению пусков с космодрома «Байконур» ракет-носителей типа «Союз-2» для запусков космических аппаратов в северном направлении на приполярные орбиты
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы поляр маңындағы орбиталарға солтүстік бағытта ғарыш аппараттарын ұшыру үшін «Байқоңыр» ғарыш айлағынан «Союз-2» типіндегі тасымалдағыш зымырандарды ұшыруды жүзеге асыру жөніндегі ынтымақтастық туралы келісімді ратификациялау туралы
