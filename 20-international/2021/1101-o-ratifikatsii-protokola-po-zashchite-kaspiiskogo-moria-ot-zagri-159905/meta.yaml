title:
  rus: О ратификации Протокола по защите Каспийского моря от загрязнения из наземных источников и в результате осуществляемой на суше деятельности к Рамочной конвенции по защите морской среды Каспийского моря
  kaz: Каспий теңізінің теңіз ортасын қорғау жөніндегі негіздемелік конвенцияға Каспий теңізін жерүсті көздерінен және құрлықта жүзеге асырылатын қызмет нәтижесінде ластанудан қорғау жөніндегі хаттаманы ратификациялау туралы
