act_code: '161095'
requisite: Закон Республики Казахстан от 2 декабря 2021 года № 80-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Таджикистан об оказании военно-технического содействия в обеспечении безопасности в прилегающих районах таджикско-афганской границы
  kaz: Қазақстан Республикасының Үкіметі мен Тәжікстан Республикасының Үкіметі арасындағы тәжік-ауған шекарасына іргелес аудандарда қауіпсіздікті қамтамасыз етуде әскери-техникалық жәрдем көрсету туралы келісімді ратификациялау туралы
