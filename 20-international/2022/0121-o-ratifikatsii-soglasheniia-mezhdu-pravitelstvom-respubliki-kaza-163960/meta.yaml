title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о реализации проекта «Строительство и эксплуатация завода по выпуску минеральных удобрений»
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы «Минералдық тыңайтқыштар шығару зауытын салу және пайдалану» жобасын іске асыру туралы келісімді ратификациялау туралы
