act_code: '164697'
requisite: Постановление Правительства Республики Казахстан от 21 февраля 2022 года № 75
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Федеративной Республики Германия о сотрудничестве в борьбе с организованной преступностью, терроризмом и другими опасными видами преступлений
  kaz: Қазақстан Республикасының Үкiметi мен Германия Федеративтік Республикасының Үкiметi арасындағы ұйымдасқан қылмысқа, терроризмге  және қылмыстың басқа да қауiптi түрлеріне қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы
