title:
  rus: Об утверждении Протокола к Соглашению между Правительством Республики Казахстан и Федеральным Советом Швейцарии о торгово-экономическом сотрудничестве, подписанному в городе Алматы 12 мая 1994 года (Правила по внутреннему регулированию торговли услугами)
  kaz: 1994 жылы 12 мамырда Алматы қаласында қол қойылған Қазақстан Республикасының Үкіметі мен Швейцарияның Федералдық Кеңесі арасындағы сауда-экономикалық ынтымақтастық туралы келісімге хаттаманы (Көрсетілетін қызметтер саудасын ішкі реттеу жөніндегі қағидалар) бекіту туралы
