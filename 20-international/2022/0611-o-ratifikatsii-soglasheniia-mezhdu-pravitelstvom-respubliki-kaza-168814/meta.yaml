title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Армения о торгово-экономическом сотрудничестве в области поставок нефтепродуктов в Республику Армения
  kaz: Қазақстан Республикасының Үкіметі мен Армения Республикасының Үкіметі арасындағы Армения Республикасына мұнай өнімдерін беру саласындағы сауда-экономикалық ынтымақтастық туралы келісімді ратификациялау туралы
