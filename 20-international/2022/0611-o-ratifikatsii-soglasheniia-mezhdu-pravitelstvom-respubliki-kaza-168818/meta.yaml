act_code: '168818'
requisite: Закон Республики Казахстан от 11 июня 2022 года № 126-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Кабинетом Министров Кыргызской Республики об оказании военно-технического содействия в обеспечении безопасности Центральноазиатского региона
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Министрлер Кабинеті арасындағы Орталық Азия өңірінің қауіпсіздігін қамтамасыз етуде әскери-техникалық жәрдем көрсету туралы келісімді ратификациялау туралы
