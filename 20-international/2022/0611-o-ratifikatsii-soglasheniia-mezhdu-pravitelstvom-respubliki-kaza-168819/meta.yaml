act_code: '168819'
requisite: Закон Республики Казахстан от 11 июня 2022 года № 125-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики по взаимодействию в предотвращении незаконного перемещения ядерных материалов, радиоактивных материалов, радиоактивных отходов и радиационно-опасных предметов
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Ядролық материалдарды, радиоактивті материалдарды, радиоактивті қалдықтарды және радиациялық-қауіпті заттарды заңсыз өткізуді болғызбаудағы өзара іс-қимыл жөніндегі келісімді ратификациялау туралы
