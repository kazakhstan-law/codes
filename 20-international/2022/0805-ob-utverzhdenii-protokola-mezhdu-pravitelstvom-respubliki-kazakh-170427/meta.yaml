title:
  rus: Об утверждении Протокола между Правительством Республики Казахстан и Правительством Турецкой Республики о сотрудничестве в области военных архивов, военной истории, музееведения и военных публикаций
  kaz: Қазақстан Республикасының Үкіметі мен Түркия Республикасының Үкіметі арасындағы әскери архивтер, әскери тарих, музейтану және әскери жарияланымдар саласындағы ынтымақтастық туралы хаттаманы бекіту туралы
