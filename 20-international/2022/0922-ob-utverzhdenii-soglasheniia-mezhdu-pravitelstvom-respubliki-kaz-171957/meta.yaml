act_code: '171957'
requisite: Постановление Правительства Республики Казахстан от 22 сентября 2022 года № 724
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об особенностях осуществления хозяйственной деятельности на приграничной территории на Восточно-Тарутинском (Республика Казахстан), Тарутинском (Российская Федерация) месторождении
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы шекара маңы аумағындағы Шығыс Тарутинский (Қазақстан Республикасы), Тарутинский (Ресей Федерациясы) кен орындарында шаруашылық қызметті жүзеге асыру ерекшеліктері туралы келісімді бекіту туралы
