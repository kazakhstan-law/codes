act_code: '173253'
requisite: Закон Республики Казахстан от 27 октября 2022 года № 149-VII ЗРК
title:
  rus: О ратификации Соглашения об обмене информацией в сфере противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма при перемещении наличных денежных средств и (или) денежных инструментов через таможенную границу Евразийского экономического союза
  kaz: Еуразиялық экономикалық одақтың кедендік шекарасы арқылы қолма-қол ақша қаражатын және (немесе) ақша құралдарын өткізу кезінде қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл саласында ақпарат алмасу туралы келісімді ратификациялау туралы
