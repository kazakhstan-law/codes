  code: '223358'
  requisite: Закон Республики Казахстан от 26 марта 2026 года № 273-VIII ЗРК
  title:
    rus: О ратификации Протокола о внесении изменений в Соглашение о принципах и подходах осуществления государственного контроля (надзора) за соблюдением требований технических регламентов Евразийского экономического союза в целях гармонизации законодательства государств – членов Евразийского экономического союза в указанной сфере от 16 февраля 2021 года
    kaz: 2021 жылғы 16 ақпандағы Еуразиялық экономикалық одақтың техникалық регламенттері талаптарының сақталуына мемлекеттік бақылауды (қадағалауды) Еуразиялық экономикалық одаққа мүше мемлекеттердің көрсетілген саладағы заңнамасын үйлестіру мақсатында жүзеге асыру қағидаттары мен тәсілдері туралы келісімге өзгерістер енгізу туралы хаттаманы ратификациялау туралы
