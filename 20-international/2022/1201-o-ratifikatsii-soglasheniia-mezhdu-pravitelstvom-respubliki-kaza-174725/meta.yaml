act_code: '174725'
requisite: Закон Республики Казахстан от 1 декабря 2022 года № 164-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Швейцарским Федеральным Советом об оплачиваемой трудовой деятельности членов семей сотрудников дипломатических представительств, постоянных представительств при международных организациях и консульских учреждений
  kaz: Қазақстан Республикасының Үкіметі мен Швейцария Федералдық Кеңесі арасындағы дипломатиялық өкілдіктер, халықаралық ұйымдар жанындағы тұрақты өкілдіктер және консулдық мекемелер қызметкерлерінің отбасы мүшелерінің ақылы еңбек қызметі туралы келісімді ратификациялау туралы
