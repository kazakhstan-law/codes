act_code: '174722'
requisite: Закон Республики Казахстан от 1 декабря 2022 года № 162-VII ЗРК
title:
  rus: О ратификации Соглашения о займе (Заем на финансирование политики развития, основанное на частном секторе, и более устойчивое восстановление экономики) между Республикой Казахстан и Международным Банком Реконструкции и Развития
  kaz: Қазақстан Республикасы мен Халықаралық Қайта Құру және Даму Банкі арасындағы Қарыз туралы келісімді (Жекеше секторға және экономиканы неғұрлым орнықты қалпына келтіруге негізделген даму саясатын қаржыландыруға арналған қарыз) ратификациялау туралы
