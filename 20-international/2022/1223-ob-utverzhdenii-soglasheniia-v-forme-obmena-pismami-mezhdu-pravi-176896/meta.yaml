act_code: '176896'
requisite: Постановление Правительства Республики Казахстан от 23 декабря 2022 года № 1054
title:
  rus: Об утверждении Соглашения в форме обмена письмами между Правительством Республики Казахстан и Программой Организации Объединенных Наций по окружающей среде (ЮНЕП) о правовом статусе Субрегионального офиса ЮНЕП для Центральной Азии в Казахстане
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымының Қоршаған орта жөніндегі бағдарламасы (ЮНЕП) арасындағы ЮНЕП-тің Орталық Азияға арналған Қазақстандағы субөңірлік офисінің құқықтық мәртебесі туралы хаттар алмасу нысанындағы келісімді бекіту туралы
