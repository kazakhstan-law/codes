title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Туркменистана о сотрудничестве в области гражданской обороны, предупреждения и ликвидации чрезвычайных ситуаций
  kaz: Қазақстан Республикасының Үкіметі мен Түрікменстанның Үкіметі арасындағы Азаматтық қорғаныс, төтенше жағдайлардың алдын алу және оларды жою саласындағы ынтымақтастық туралы келісімді ратификациялау туралы
