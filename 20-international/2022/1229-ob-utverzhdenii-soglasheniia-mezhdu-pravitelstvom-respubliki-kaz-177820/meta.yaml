act_code: '177820'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2022 года № 1096
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Парагвай о взаимном освобождении от визовых требований владельцев дипломатических, официальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Парагвай Республикасының Үкіметі арасындағы дипломатиялық, ресми және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
