title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Боливарианской Республики Венесуэла об освобождении от визовых требований владельцев дипломатических и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Венесуэла Боливариан Республикасының Үкіметі арасындағы дипломатиялық және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
