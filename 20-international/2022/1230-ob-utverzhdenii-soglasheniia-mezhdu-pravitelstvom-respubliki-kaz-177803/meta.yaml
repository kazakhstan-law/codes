act_code: '177803'
requisite: Постановление Правительства Республики Казахстан от 30 декабря 2022 года № 1124
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Многонационального Государства Боливия об освобождении от визовых требований владельцев дипломатических, официальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Боливия Көпұлтты Мемлекетінің Үкіметі арасындағы дипломатиялық, ресми және қызметтік паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
