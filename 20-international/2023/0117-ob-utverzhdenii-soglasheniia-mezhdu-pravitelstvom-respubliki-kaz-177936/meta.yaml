act_code: '177936'
requisite: Постановление Правительства Республики Казахстан от 17 января 2023 года № 22
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Доминиканской Республики об отмене визовых требований для владельцев дипломатических, официальных и служебных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Доминикан Республикасының Үкіметі арасындағы дипломатиялық, ресми және қызметтік паспорттардың иелері үшін визалық талаптарды жою туралы келісімді бекіту туралы
