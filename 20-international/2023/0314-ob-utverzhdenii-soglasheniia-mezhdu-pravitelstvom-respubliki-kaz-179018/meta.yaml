act_code: '179018'
requisite: Постановление Правительства Республики Казахстан от 14 марта 2023 года № 201
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о сотрудничестве в области политики ветеринарных услуг и безопасности пищевых продуктов
  kaz: Қазақстан Республикасының Үкіметі мен Түркия Республикасының Үкіметі арасындағы ветеринариялық көрсетілетін қызметтер саясаты және тамақ өнімдерінің қауіпсіздігі саласындағы ынтымақтастық туралы келісімді бекіту туралы
