act_code: '179418'
requisite: Закон Республики Казахстан от 3 апреля 2023 года № 219-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о создании и функционировании филиалов организаций высшего и послевузовского образования Республики Казахстан в Российской Федерации и филиалов образовательных организаций высшего образования Российской Федерации в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Ресей Федерациясында Қазақстан Республикасының жоғары және жоғары оқу орнынан кейінгі білім беру ұйымдарының филиалдарын және Қазақстан Республикасында Ресей Федерациясының жоғары білім беретін білім беру ұйымдарының филиалдарын құру және олардың жұмыс істеуі туралы келісімді ратификациялау туралы
