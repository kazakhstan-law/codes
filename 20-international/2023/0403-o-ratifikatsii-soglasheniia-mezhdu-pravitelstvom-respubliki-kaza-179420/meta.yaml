act_code: '179420'
requisite: Закон Республики Казахстан от 3 апреля 2023 года № 220-VII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о купле-продаже части доли Российской Федерации в оплаченном уставном капитале Евразийского банка развития
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Еуразия даму банкінің төленген жарғылық капиталындағы Ресей Федерациясы үлесінің бір бөлігін сатып алу және сату туралы келісімді ратификациялау туралы
