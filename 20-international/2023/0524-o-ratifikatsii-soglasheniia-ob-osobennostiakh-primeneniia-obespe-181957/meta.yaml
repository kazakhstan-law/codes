act_code: '181957'
requisite: Закон Республики Казахстан от 24 мая 2023 года № 4-VIII ЗРК
title:
  rus: О ратификации Соглашения об особенностях применения обеспечения исполнения обязанности по уплате таможенных пошлин, налогов, специальных, антидемпинговых, компенсационных пошлин при перевозке (транспортировке) товаров в соответствии с таможенной процедурой таможенного транзита
  kaz: Кедендік транзиттің кедендік рәсіміне сәйкес тауарларды тасымалдау (тасу) кезінде кедендік баждарды, салықтарды, арнайы, демпингке қарсы, өтемақы баждарын төлеу жөніндегі міндеттің орындалуын қамтамасыз етуді қолданудың ерекшеліктері туралы келісімді ратификациялау туралы
