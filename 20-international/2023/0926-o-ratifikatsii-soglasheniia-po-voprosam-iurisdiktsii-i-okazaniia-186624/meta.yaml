title:
  rus: О ратификации Соглашения по вопросам юрисдикции и оказания правовой помощи по делам, связанным с временным пребыванием формирований сил и средств системы коллективной безопасности на территориях государств – членов Организации Договора о коллективной безопасности
  kaz: Ұжымдық қауіпсіздік туралы шарт ұйымына мүше мемлекеттердің аумағында ұжымдық қауіпсіздік жүйесінің күштері мен құралдары құралымдарының уақытша болуына байланысты істер бойынша юрисдикция және құқықтық көмек көрсету мәселелері жөніндегі келісімді ратификациялау туралы
