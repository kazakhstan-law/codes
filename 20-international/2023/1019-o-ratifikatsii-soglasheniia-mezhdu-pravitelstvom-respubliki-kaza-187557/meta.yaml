act_code: '187557'
requisite: Закон Республики Казахстан от 19 октября 2023 года № 35-VIII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о совместном таможенном контроле при перемещении энергоресурсов через казахстанско-узбекскую таможенную границу трубопроводным транспортом и по линиям электропередачи
  kaz: Қазақстан Республикасының Үкіметі мен Өзбекстан Республикасының Үкіметі арасындағы Қазақстан-Өзбекстан кедендік шекарасы арқылы құбыржол көлігімен және электр беру желілері бойынша энергия ресурстарын өткізу кезіндегі бірлескен кедендік бақылау туралы келісімді ратификациялау туралы
