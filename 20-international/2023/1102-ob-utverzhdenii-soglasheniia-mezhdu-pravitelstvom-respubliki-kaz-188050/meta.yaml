title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Социалистической Республики Вьетнам об освобождении от визовых требований владельцев национальных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Вьетнам Социалистік Республикасының Үкіметі арасындағы ұлттық паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
