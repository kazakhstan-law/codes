act_code: '190767'
requisite: Постановление Правительства Республики Казахстан от 7 декабря 2023 года № 1091
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Народной Республики Бангладеш об освобождении от визовых требований владельцев дипломатических и служебных/официальных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Бангладеш Халық Республикасының Үкіметі арасындағы дипломатиялық және қызметтік/ресми паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
