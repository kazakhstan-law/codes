title:
  rus: О ратификации Специального Соглашения между Правительством Республики Казахстан и Правительством Французской Республики о реализации сотрудничества в сфере борьбы с глобальным потеплением
  kaz: Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы жаһандық жылынуға қарсы күрес саласындағы ынтымақтастықты іске асыру туралы арнайы келісімді ратификациялау туралы
