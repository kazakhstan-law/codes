act_code: '196063'
requisite: Постановление Правительства Республики Казахстан от 27 марта 2024 года № 234
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Французской Республики относительно создания международных (французских) школ в Республике Казахстан и преподавания французского языка в организациях образования Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Француз Республикасының Үкіметі арасындағы Қазақстан Республикасында халықаралық (француз) мектептер құруға және Қазақстан Республикасының білім беру ұйымдарында француз тілін оқытуға қатысты келісімді бекіту туралы
