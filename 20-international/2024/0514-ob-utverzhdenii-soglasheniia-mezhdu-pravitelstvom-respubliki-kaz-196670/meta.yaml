act_code: '196670'
requisite: Постановление Правительства Республики Казахстан от 14 мая 2024 года № 374
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Итальянской Республики относительно статуса мест захоронений военнослужащих, погибших в период Второй мировой войны
  kaz: Қазақстан Республикасының Үкіметі мен Италия Республикасының Үкіметі арасындағы Екінші дүниежүзілік соғыс кезеңінде қаза тапқан әскери қызметшілер жерленген жерлердің мәртебесіне қатысты келісімді бекіту туралы
