act_code: '198408'
requisite: Закон Республики Казахстан от 1 июля 2024 года № 101-VIII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики по развитию Транскаспийского международного транспортного маршрута, в том числе для контейнерных поездов сообщением Китай – Европа
  kaz: Қазақстан Республикасының Үкіметі мен Қытай Халық Республикасының Үкіметі арасындағы Транскаспий халықаралық көлік бағытын, оның ішінде Қытай – Еуропа қатынасындағы контейнерлік пойыздар үшін дамыту жөніндегі келісімді ратификациялау туралы
