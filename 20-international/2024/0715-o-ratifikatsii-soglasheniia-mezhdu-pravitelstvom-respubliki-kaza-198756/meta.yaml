title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Организацией Объединенных Наций об организации Азиатско-Тихоокеанской министерской конференции по цифровой инклюзии и трансформации
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымы арасындағы Цифрлық инклюзия және трансформация жөніндегі Азия-Тынық мұхиты министрлік конференциясын ұйымдастыру туралы келісімді ратификациялау туралы
