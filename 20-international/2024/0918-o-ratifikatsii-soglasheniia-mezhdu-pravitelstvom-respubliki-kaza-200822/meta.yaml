act_code: '200822'
requisite: Закон Республики Казахстан от 18 сентября 2024 года № 128-VIII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Кабинетом Министров Кыргызской Республики о создании и регулировании деятельности индустриального торгово-логистического комплекса в районе автодорожных пунктов пропуска «Карасу» и «Ак-Тилек»
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Министрлер Кабинеті арасындағы «Қарасу» және «Ақ-Тілек» автожол өткізу пункттері ауданында индустриялық сауда-логистикалық кешенді құру және оның қызметін реттеу туралы келісімді ратификациялау туралы
