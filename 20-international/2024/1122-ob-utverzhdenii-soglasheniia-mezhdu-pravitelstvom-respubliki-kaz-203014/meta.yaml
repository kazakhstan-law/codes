title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Лаосской Народно-Демократической Республики об освобождении от визовых требований владельцев дипломатических и служебных/официальных паспортов
  kaz: Қазақстан Республикасының Үкіметі мен Лаос Халық Демократиялық Республикасының Үкіметі арасындағы дипломатиялық және қызметтік/ресми паспорттардың иелерін визалық талаптардан босату туралы келісімді бекіту туралы
