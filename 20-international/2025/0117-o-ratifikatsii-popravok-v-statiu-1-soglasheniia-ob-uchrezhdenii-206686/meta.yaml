act_code: '206686'
requisite: Закон Республики Казахстан от 17 января 2025 года № 159-VIII ЗРК
title:
  rus: О ратификации поправок в статью 1 Соглашения об учреждении Европейского Банка Реконструкции и Развития, позволяющих осуществить ограниченное и постепенное распространение географического охвата операций банка на страны Африки к югу от Сахары и Ирак
  kaz: Еуропа Қайта Құру және Даму Банкін құру туралы келісімнің 1-бабына банк операцияларын географиялық қамтуды Сахарадан оңтүстікке қарай орналасқан Африка елдері мен Иракқа шектеулі түрде және біртіндеп қолдануды жүзеге асыруға мүмкіндік беретін түзетулерді ратификациялау туралы
