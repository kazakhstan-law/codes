  kaz: 2024 жылғы 14 ақпандағы Біріккен Ұлттар Ұйымының бөлуді бақылау жөніндегі күштеріне (UNDOF) ресурс ұсынатын Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымы арасындағы өзара түсіністік туралы меморандумға хаттар алмасу нысанындағы келісімді ратификациялау туралы
