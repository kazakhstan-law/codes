act_code: '210600'
requisite: Закон Республики Казахстан от 19 мая 2025 года № 190-VIII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки о предоставлении Правительству Соединенных Штатов Америки земельного участка в аренду для строительства помещений консульского учреждения Соединенных Штатов Америки в городе Алматы
  kaz: Қазақстан Республикасының Үкіметі мен Америка Құрама Штаттарының Үкіметі арасындағы Алматы қаласында Америка Құрама Штаттарының консулдық мекемесінің үй-жайларын салу үшін Америка Құрама Штаттарының Үкіметіне жер учаскесін жалға беру туралы келісімді ратификациялау туралы
