title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Кабинетом Министров Кыргызской Республики в области подготовки кадров для Пограничной службы Государственного комитета национальной безопасности Кыргызской Республики
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Министрлер Кабинеті арасындағы Қырғыз Республикасы Ұлттық қауіпсіздік мемлекеттік комитетінің Шекара қызметі үшін кадрлар даярлау саласындағы келісімді бекіту туралы
