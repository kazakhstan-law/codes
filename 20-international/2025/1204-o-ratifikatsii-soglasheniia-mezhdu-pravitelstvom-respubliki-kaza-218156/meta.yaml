act_code: '218156'
requisite: Закон Республики Казахстан от 4 декабря 2025 года № 237-VIII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о функционировании Костанайского филиала федерального государственного бюджетного образовательного учреждения высшего образования «Челябинский государственный университет»
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы «Челябі мемлекеттік университеті» жоғары білім берудің федералдық мемлекеттік бюджеттік білім беру мекемесі Қостанай филиалының жұмыс істеуі туралы келісімді ратификациялау туралы
