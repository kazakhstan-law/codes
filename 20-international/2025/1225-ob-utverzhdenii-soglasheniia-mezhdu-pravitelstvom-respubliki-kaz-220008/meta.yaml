act_code: '220008'
requisite: Постановление Правительства Республики Казахстан от 25 декабря 2025 года № 1144
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о создании Казахстанско-Российской межгосударственной комиссии по проведению летных испытаний космического ракетного комплекса «Союз-5» и космического ракетного комплекса «Байтерек»
  kaz: Қазақстан Республикасының Үкiметi мен Ресей Федерациясының Үкiметi арасындағы «Союз-5» ғарыш зымыран кешені мен «Бәйтерек» ғарыш зымыран кешенінің ұшу сынақтарын жүргізу жөнінде Қазақстан-Ресей мемлекетаралық комиссиясын құру туралы келiсiмді бекіту туралы
