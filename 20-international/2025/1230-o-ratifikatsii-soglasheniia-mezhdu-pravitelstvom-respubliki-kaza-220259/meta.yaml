act_code: '220259'
requisite: Закон Республики Казахстан от 30 декабря 2025 года № 250-VIII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Организацией Объединенных Наций по вопросам образования, науки и культуры (ЮНЕСКО) о возобновлении статуса Центрально-Азиатского регионального гляциологического центра в Казахстане в качестве центра категории 2 под эгидой ЮНЕСКО
  kaz: Қазақстан Республикасының Үкіметі мен Білім, ғылым және мәдениет мәселелері жөніндегі Біріккен Ұлттар Ұйымы (ЮНЕСКО) арасындағы Қазақстанда ЮНЕСКО аясындағы 2-санатты орталық ретінде Орталық Азия өңірлік гляциология орталығының мәртебесін қайта жалғастыру туралы келісімді ратификациялау туралы
