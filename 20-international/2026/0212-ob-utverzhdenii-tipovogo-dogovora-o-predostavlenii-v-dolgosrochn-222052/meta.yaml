act_code: '222052'
requisite: Постановление Правительства Республики Казахстан от 12 февраля 2026 года № 84
title:
  rus: Об утверждении типового договора о предоставлении в долгосрочное пользование участков особо охраняемых природных территорий для проектирования, строительства и обслуживания инженерной инфраструктуры (дороги, мосты, линии электропередачи и другие коммуникации) к объектам туризма
  kaz: Туризм объектілеріне инженерлік инфрақұрылымды (жолдарды, көпірлерді, электр беру желілерін және басқа да коммуникацияларды) жобалау, салу және оларға қызмет көрсету үшін ерекше қорғалатын табиғи аумақтардың учаскелерін ұзақ мерзімді пайдалануға беру туралы үлгілік шартты бекіту туралы
