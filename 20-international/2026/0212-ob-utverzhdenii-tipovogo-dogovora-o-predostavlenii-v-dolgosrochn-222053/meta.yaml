act_code: '222053'
requisite: Постановление Правительства Республики Казахстан от 12 февраля 2026 года № 85
title:
  rus: Об утверждении типового договора о предоставлении в долгосрочное пользование участков особо охраняемых природных территорий для расширения сети сейсмологических станций, строительства гидротехнических и иных защитных сооружений от селевых потоков, снежных лавин, оползней
  kaz: Сейсмологиялық станциялар желілерін кеңейту, гидротехникалық құрылысжайларды және сел ағындарынан, қар көшкіндерінен, көшкіндерден қорғайтын өзге де қорғаныш құрылысжайларын салу үшін ерекше қорғалатын табиғи аумақтардың учаскелерін ұзақ мерзімді пайдалануға беру туралы үлгілік шартты бекіту туралы
