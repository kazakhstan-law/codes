act_code: '223704'
requisite: Закон Республики Казахстан от 7 апреля 2026 года № 275-VIII ЗРК
title:
  rus: О ратификации Рамочного соглашения о партнерстве между Правительством Республики Казахстан с одной стороны и Международным Банком Реконструкции и Развития, Международной Финансовой Корпорацией и Многосторонним Агентством Гарантии Инвестиций с другой стороны по расширению сотрудничества в целях содействия устойчивому развитию и росту Республики Казахстан
  kaz: Бір тараптан Қазақстан Республикасының Үкіметі және екінші тараптан Халықаралық Қайта Құру және Даму Банкі, Халықаралық Қаржы Корпорациясы мен Инвестициялар Кепілдігінің Көпжақты Агенттігі арасындағы Қазақстан Республикасының орнықты дамуына және өркендеуіне жәрдемдесу мақсатында ынтымақтастықты кеңейту жөніндегі әріптестік туралы негіздемелік келісімді ратификациялау туралы
