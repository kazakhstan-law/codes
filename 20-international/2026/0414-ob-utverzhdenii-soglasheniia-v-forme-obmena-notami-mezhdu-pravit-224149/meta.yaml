title:
  rus: Об утверждении Соглашения в форме обмена нотами между Правительством Республики Казахстан и Правительством Японии относительно гранта, предоставленного в целях содействия реализации Программы экономического и социального развития
  kaz: Қазақстан Республикасының Үкіметі мен Жапония Үкіметі арасындағы Экономикалық және әлеуметтік даму бағдарламасын іске асыруға жәрдемдесу мақсатында берілген грантқа қатысты нота алмасу нысанындағы келісімді бекіту туралы
