title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о транзите военного имущества и персонала через воздушное пространство Республики Казахстан и Турецкой Республики
  kaz: Қазақстан Республикасының Үкіметі мен Түркия Республикасының Үкіметі арасындағы Қазақстан Республикасы мен Түркия Республикасының әуе кеңістігі арқылы әскери мүлік пен персоналды транзиттеу туралы келісімді ратификациялау туралы
