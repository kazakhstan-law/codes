title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Султаната Оман об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на  доход и капитал и Протокола к нему
  kaz: Қазақстан Республикасының Үкіметі мен Оман Сұлтандығының Үкіметі арасындағы табыс пен капиталға салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық салудан жалтаруға жол бермеу туралы келісімді және оған Хаттаманы ратификациялау туралы
