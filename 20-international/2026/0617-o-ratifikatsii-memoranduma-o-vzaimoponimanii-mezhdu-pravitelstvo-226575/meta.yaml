title:
  rus: О ратификации Меморандума о взаимопонимании между Правительством Республики Казахстан и Организацией Объединенных Наций относительно Регионального центра Организации Объединенных Наций по целям в области устойчивого развития для Центральной Азии и Афганистана
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымы арасындағы Біріккен Ұлттар Ұйымының Орталық Азия мен Ауғанстан үшін орнықты даму саласындағы мақсаттар жөніндегі өңірлік орталығына қатысты өзара түсіністік туралы меморандумды ратификациялау туралы
