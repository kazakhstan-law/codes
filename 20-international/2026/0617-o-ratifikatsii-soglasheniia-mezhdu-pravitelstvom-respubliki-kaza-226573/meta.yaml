title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Организацией Объединенных Наций о создании в Республике Казахстан Регионального центра Организации Объединенных Наций по целям устойчивого развития для Центральной Азии и Афганистана
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымы арасындағы Қазақстан Республикасында Біріккен Ұлттар Ұйымының Орталық Азия мен Ауғанстан үшін орнықты даму мақсаттары жөніндегі өңірлік орталығын құру туралы келісімді ратификациялау туралы
