title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о предоставлении Правительству Республики Казахстан государственного экспортного кредита для финансирования строительства атомной электростанции на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының аумағында атом электр станциясын салуды қаржыландыру үшін Қазақстан Республикасының Үкіметіне мемлекеттік экспорттық кредит беру туралы келісімді ратификациялау туралы
