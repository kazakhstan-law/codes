title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об основных принципах и условиях сотрудничества по проекту строительства атомной электростанции на территории Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Қазақстан Республикасының аумағында атом электр станциясын салу жобасы бойынша ынтымақтастықтың негізгі қағидаттары мен шарттары туралы келісімді ратификациялау туралы
