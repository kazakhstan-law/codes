act_code: '227551'
requisite: Закон Республики Казахстан от 8 июля 2026 года № 339-VIII ЗРК
title:
  rus: О ратификации Соглашения между Правительством Республики Казахстан и Кабинетом Министров Кыргызской Республики о взаимном предоставлении в безвозмездное пользование зданий и земельных участков в городе Астане и городе Бишкеке для нужд Посольства Республики Казахстан в Кыргызской Республике и Посольства Кыргызской Республики в Республике Казахстан, а также резиденций Чрезвычайного и Полномочного Посла Республики Казахстан в Кыргызской Республике и Чрезвычайного и Полномочного Посла Кыргызской Республики в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Қырғыз Республикасының Министрлер Кабинеті арасындағы Қазақстан Республикасының Қырғыз Республикасындағы Елшілігінің және Қырғыз Республикасының Қазақстан Республикасындағы Елшілігінің, сондай-ақ Қазақстан Республикасының Қырғыз Республикасындағы Төтенше және Өкілетті Елшісі мен Қырғыз Республикасының Қазақстан Республикасындағы Төтенше және Өкілетті Елшісі резиденцияларының мұқтаждықтары үшін Астана қаласы мен Бішкек қаласындағы ғимараттарды және жер учаскелерін өзара өтеусіз пайдалануға беру туралы келісімді ратификациялау туралы
