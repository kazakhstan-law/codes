requisite: Приказ и.о. Министра экологии и природных ресурсов Республики Казахстан от 9 октября 2026 года № 264. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2026 года № 40145
title:
  rus: Об утверждении формы типового договора об организации сбора, транспортировки, подготовки к повторному использованию, сортировки, обработки, переработки, обезвреживания и (или) утилизации отходов, образующихся после утраты потребительских свойств продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров), и ее (их) упаковки заключаемого между оператором расширенных обязательств производителей (импортеров) и производителем (импортером) продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров), и ее (их) упаковки
  kaz: Өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелерінің операторы мен өндірушілердің (импорттаушылардың) және оның (олардың) қаптамасының кеңейтілген міндеттемелері қолданылатын өнімдерді (тауарларды) өндіруші (импорттаушы) арасында жасалатын өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері қолданылатын өнімдер (тауарлар) және олардың қаптамалары тұтынушылық қасиеттерін жоғалтқаннан кейін түзілетін қалдықтарды жинауды, тасымалдауды, қайта пайдалануға дайындауды, сұрыптауды, өңдеуді, қайта өңдеуді, залалсыздандыруды және (немесе) кәдеге жаратуды ұйымдастыру туралы үлгілік шарттың нысанын бекіту туралы
