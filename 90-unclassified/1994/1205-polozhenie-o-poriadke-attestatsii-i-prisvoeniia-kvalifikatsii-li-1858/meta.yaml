act_code: '1858'
requisite: Утверждено Заместителем Министра сельского хозяйства Республики Казахстан от 5 декабря 1994 года. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 декабря 1994 года № 30. Утратило силу Приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 29 января 2004 года № 33
title:
  rus: Положение о порядке аттестации и присвоения квалификации лицам, овладевающим профессией тракториста-машиниста, и допуска их к управлению тракторами и другими самоходными сельскохозяйственными, мелиоративными и дорожно-строительными машинами
  kaz: Аттестациялау, тракторис-машинист мамандығын меңгерген адамдарға бiлiктiлiк беру және оларға тракторлар, басқа өздiгiнен жүретiн ауыл шаруашылық, мелиорациялық және жол-құрылыс машиналарын жүргiзуге рұқсат беру тәртiбi туралы ЕРЕЖЕ
