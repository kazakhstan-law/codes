requisite: Утверждено Министром юстиции Республики Казахстан от 25 декабря 1995 г. Зарегистрировано в Министерстве юстиции Республики Казахстан 26.09.1996 г. № 204. Утратил силу - см. приказ Министерства юстиции Республики Казахстан от 13 мая 1997г. № 260/24 ~V970320
title:
  rus: Положение о порядке распределения денежных средств, получаемых за оказание платных услуг работниками государственных нотариальных контор республики по просьбе физических и юридических лиц по тарифам, утвержденным Государственным комитетом Республики Казахстан по ценовой и антимонопольной политике
  kaz: Жеке және заңды тұлғалардың өтiнiшi бойынша Қазақстан Республикасының Баға және монополияға қарсы саясат жөнiндегi мемлекеттiк комитетi бекiткен тарифтер бойынша Республика мемлекеттiк нотариалдық кеңселерiнiң қызметкерлерi ақылы қызмет көрсету үшiн алатын ақшалай қаражаттарды бөлу тәртiбi туралы
