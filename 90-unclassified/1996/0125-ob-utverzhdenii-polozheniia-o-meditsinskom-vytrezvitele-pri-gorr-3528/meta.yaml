act_code: '3528'
requisite: Приказ Министра внутренних дел Республики Казахстан от 25 января 1996 года N 37. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 1997 года N 324. Утратил силу приказом Министра внутренних дел Республики Казахстан от 4 апреля 2011 года № 143
title:
  rus: Об утверждении Положения о медицинском вытрезвителе при горрайоргане (управлении) внутренних дел, Инструкции по оказанию медицинской помощи лицам, доставляемым в медицинские вытрезвители и Инструкции по организации работы кабинета профилактики при медицинском вытрезвителе
  kaz: Қалалық, аудандық (басқармалар) iшкi iстер органдарының жанындағы медициналық айықтырғыш туралы Ереженi, медициналық айықтырғыштарға жеткiзiлетiн адамдарға медициналық көмек көрсету жөнiндегi және медициналық айықтырғыш жанындағы профилактика кабинетiнiң жұмысын ұйымдастыру жөнiндегi Нұсқаулықтарды бекiту туралы
