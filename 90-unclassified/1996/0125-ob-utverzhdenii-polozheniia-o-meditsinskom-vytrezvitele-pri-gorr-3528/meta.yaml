  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 25 января 1996 года N 37 "Об утверждении Положения о медицинском вытрезвителе при горрайоргане (управлении) внутренних дел, Инструкции по оказанию медицинской помощи лицам, доставляемым в медицинские вытрезвители и Инструкции по организации работы кабинета профилактики при медицинском вытрезвителе", зарегистрированный за N 324
    kaz: N 324 болып тіркелген "Қалалық, аудандық (басқармалар) ішкі істер органдарының жанындағы медициналық айықтырғыш туралы Ережені, медициналық айықтырғыштарға жеткізілетін адамдарға медициналық көмек көрсету жөніндегі және медициналық айықтырғыш жанындағы профилактика кабинетінің жұмысын ұйымдастру жөніндегі Нұсқаулықтарды бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 1996 жылғы 25 қаңтардағы N 37 бұйрығына өзгерістер енгізу туралы
