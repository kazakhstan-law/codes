act_code: '4775'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 февраля 1996 г. N 50. Зарегистрировано в Министерстве юстиции Республики Казахстан 21.01.1998 г. за N 430. Утратило силу - Постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года N 197 (V043034)
title:
  rus: О Правилах выдачи, отзыва разрешения на создание, реорганизацию банка, лицензии на проведение банковских операций и иной банковской деятельности, их аннулирования и приостановления, дачи, отзыва согласия на открытие, слияние филиалов и открытие представительств банка
  kaz: Банктi құруға, қайта құруға, банктiк операциялар және басқа банктiк қызметтер жүргiзуге лицензиялар беру, қайтарып алу, олардың күшiн жою және тоқтату, банктердiң филиалдарын ашу, оларды бiрiктiру және өкiлдiктерiн ашу ережелерi жөнiнде
