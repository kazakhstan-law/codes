  code: '16241'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 17 июня 2003 года N 193. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 июля 2003 года за N 2402. Утратило силу - Постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года N 197
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 февраля 1996 года N 50 "О Правилах выдачи, отзыва разрешения на создание, реорганизацию банка, лицензии на проведение банковских операций и иной банковской деятельности, их аннулирования и приостановления, дачи, отзыва согласия на открытие, слияние филиалов и открытие представительств банка", зарегистрированное в Министерстве юстиции Республики Казахстан под N 430
    kaz: Қазақстан Республикасының Әділет министрлігінде N 430 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының«"Банкті құруға, қайта құруға рұқсатты, банк операцияларын жүргізуге және өзге де банк қызметіне лицензияларды беру, қайтарып алу, олардың күшін жою және қолданылуын тоқтату, банктің филиалдарын ашуға, қосуға және өкілдіктерін ашуға келісім беру, қайтарып алу ережесі туралы"»1996 жылғы 29 ақпандағы N 50 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/16241/rus
