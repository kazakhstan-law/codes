act_code: '3419'
requisite: Утверждены Министром строительства, жилья и застройки территорий Республики Казахстан от 1 июля 1996 г. Зарегистрирован в Министерстве юстиции Республики Казахстан 24.07.1996 г. за N 188. Утратили силу совместным приказом Председателя Агентства РК по регулированию естественных монополий и защите конкуренции от 30 сентября 1999 года N 76-ОД и Министра энергетики, индустрии и торговли РК от 1 октября 1999 г. N 302 (извлечение).
title:
  rus: ПРАВИЛА предоставления жилищно-коммунальных услуг (эксплуатация, содержание жилого дома и земельного участка, тепло-, электро-, водо-, газоснабжение, канализация, мусороудаление, лифты)
  kaz: Тұрғын үй-коммуналдық қызмет көрсетудiң /тұрғын үй мен жер учаскесiн пайдалану, күтiп ұстау, жылумен, электрмен, сумен жабдықтау, канализация, қоқыс шығару, лифттер/ ЕРЕЖЕЛЕРI
