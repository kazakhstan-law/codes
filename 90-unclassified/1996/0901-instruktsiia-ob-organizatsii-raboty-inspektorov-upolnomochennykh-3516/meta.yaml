requisite: Утверждена приказом Государственного Агентства Республики Казахстан по авторским и смежным правам 2 сентября 1996 года. Зарегистрирована в Министерстве юстиции Республики Казахстан 27 марта 1997 г. N 274. Утратила силу - приказом Председателя Комитета по правам интеллектуальной собственности Министерства юстиции РК от 1 декабря 2004 года N 81-п
