  kaz: Қазақстан Республикасының мемлекеттiк авторлық және сабақтас құқықтар Агенттiгi (ҚазМАСҚА) НҰСҚАУЛЫҚ ҚазМАСҚА тексерушi-уәкiлдерiнiң авторлық сыйақы алымдарымен творчестволық одақтар қорына аударылған қаржыларды жинау жұмыстарын жүргiзудi ұйымдастыру жөнiндегi нұсқаулық
