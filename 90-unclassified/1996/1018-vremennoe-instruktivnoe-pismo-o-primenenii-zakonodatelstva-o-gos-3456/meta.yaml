title:
  rus: Временное инструктивное письмо "О применении законодательства о государственном нотариате к иностранным гражданам, лицам без гражданства, иностранным юридическим лицам, а также о применении международных договоров о правовой помощи в нотариальной практике"
  kaz: '"Мемлекеттiк нотариат туралы заңдарды шет ел азаматтарына, азаматтығы жоқ адамдарға, шет елдiк заңды тұлғаларға қолдану, сондай-ақ құқықтық көмек туралы халықаралық шарттарды нотариалдық практикада пайдалану туралы" уақытша нұсқаулы хат'
