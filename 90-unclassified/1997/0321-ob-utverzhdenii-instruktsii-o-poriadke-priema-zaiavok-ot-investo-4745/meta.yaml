requisite: Постановление Государственного комитета Республики Казахстан об инвестициям от 21 марта 1997 г. N 2. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 1997 г. N 394. Утратило силу - Приказом Председателя Комитета по инвестициям Министерства иностранных дел Республики Казахстан от 30 марта 2001 года N 24-п
title:
  rus: Об утверждении Инструкции "О порядке приема заявок от инвесторов на получение льгот и преференций для реализации инвестиционных проектов" и формы "Заявки на получение льгот и преференций для реализации инвестиционного проекта"
  kaz: '"Инвестициялық жобаларды жүзеге асыру үшiн жеңiлдiктер мен преференциялар алуға инвесторлардан түскен өтiнiмдердi қабылдаудың тәртiбi туралы нұсқаулықты" және "Инвестициялық жобаны жүзеге асыру үшiн жеңiлдiктер мен преференциялар алуға арналған өтiнiмнiң нысанын бекiту туралы"'
