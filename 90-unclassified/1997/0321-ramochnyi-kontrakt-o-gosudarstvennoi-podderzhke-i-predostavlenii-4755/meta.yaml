title:
  rus: Рамочный контракт "О государственной поддержке и предоставлении мер стимулирования Инвестору, осуществляющему инвестиционную деятельность в приоритетные сектора экономики Республики Казахстан"
  kaz: '"Қазақстан Республикасы экономикасының басым секторларында инвестициялық қызметтi жүзеге асырушы Инвесторды мемлекеттiк қолдау және оған ынталандыру шараларын қолдану туралы негiзгi келiсiм-шартты бекiту туралы"'
