act_code: '3699'
requisite: Утверждена приказом Министра энергетики и природных ресурсов Республики Казахстан 26 марта 1997г. N 9. Зарегистрирована в Министерстве юстиции Республики Казахстан 21 апреля 1997 года N 284. Приказ от 26.03.1997г. N 9. утратил силу - приказом Министра энергетики и минеральных ресурсов РК от 01.11.2004г. N 257
title:
  rus: Методика расчета компенсации дополнительных затрат энергоснабжающей организации потребителями энергии для финансирования решения и реконструкции энергоисточников, строительства сетей транспортировки энергии и электроподстанций общего пользования при подключении дополнительных нагрузок
  kaz: Энергия көздерiн тұрғызу, кеңейту және қайта жаңарту жылу және электр тораптары мен жалпы пайдаланыстағы көмекшi станцияларды салуды қаржыландыру үшiн энергия тұтынушылардың электрмен жабдықтаушы ұйымның қосымшашығыстарын өтеуiн есептеу Әдiстемесi
