act_code: '314'
requisite: Утверждено Департаментом управления государственным имуществом и активами Министерства финансов Республики Казахстан от 14 апреля 1997 г. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 апреля 1997 г. N 290. Утратило силу - приказ Председателя Комитета государственного имущества и приватизации Министерства финансов РК от 7 января 2000 г. N 6 (письмо Министерства юстиции РК от 11 февраля 2000 г. N 4-01-10-1/33Г)
title:
  rus: Положение "О порядке проведения тендеров по предоставлению субъектам малого предпринимательства в аренду или доверительное управление с правом последующей передачи в собственность неиспользуемых производственных помещений и объектов, офисных помещений на государственных предприятиях (а также по передаче предприятиям малого предпринимательства государственных объектов незавершенного строительства)"
  kaz: Шағын кәсiпкерлiк субъектiлерiне мемлекеттiк кәсiпорындарда пайдаланылмай тұрған өндiрiстiк жайлар мен объектiлердi, кеңселiк жайларды кейiн меншiкке беру құқығымен жалға немесе сенiп басқаруға беру жөнiнде (сондай-ақ шағын кәсiпкерлiк кәсiпорындарына құрылысы аяқталмаған мемлекеттiк объектiлердi беру жөнiнде) тендерлер өткiзудiң ретi туралы ереже
