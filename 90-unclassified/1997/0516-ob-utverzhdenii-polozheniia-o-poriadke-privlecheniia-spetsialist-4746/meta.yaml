act_code: '4746'
requisite: Постановление Государственного комитета Республики Казахстан по инвестициям от 17 мая 1997 г. N 14. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 1997 г. N 395. Утратило силу - приказом председателя Комитета по инвестициям Министерства индустрии и торговли Республики Казахстан от 20 февраля 2004 года N 7-п
title:
  rus: Об утверждении ПОЛОЖЕНИЯ "О порядке привлечения специалистов государственных органов, советников, консультантов и независимых экспертов при организации и проведении Государственным комитетом Республики Казахстан по инвестициям экспертизы инвестиционной заявки и подготовке контракта"
  kaz: '"Қазақстан Республикасы Инвестициялар жөнiндегi мемлекеттiк комитетiнiң инвестициялық өтiнiмге сараптама ұйымдастыру мен жүргiзу және келiсiм-шартты әзiрлеу кезiнде мемлекеттiк органдардың мамандарын, кеңесшiлердi, консультанттар мен тәуелсiз сарапшыларды тартуының тәртiбi туралы" ереженi бекiту туралы"'
