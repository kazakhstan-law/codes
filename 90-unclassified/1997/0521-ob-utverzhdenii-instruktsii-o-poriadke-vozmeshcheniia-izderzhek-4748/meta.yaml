act_code: '4748'
requisite: Постановление Государственного комитета Республики Казахстан по инвестициям от 22 мая 1997 г. N 16. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 1997 г. N 397. Утратило силу - приказом председателя Комитета по инвестициям Министерства индустрии и торговли Республики Казахстан от 20 февраля 2004 года N 7-п
title:
  rus: Об утверждении ИНСТРУКЦИИ "О порядке возмещения издержек Государственного комитета Республики Казахстан по инвестициям по организации и проведению экспертизы инвестиционной заявки и контракта"
  kaz: '"Қазақстан Республикасы Инвестициялар жөнiндегi мемлекеттiк комитетiнiң инвестициялық өтiнiм мен келiсiм-шартқа сараптама ұйымдастыру және оны жүргiзу жөнiндегi шығындарын өтеудiң тәртiбi туралы нұсқаулықты бекiту туралы"'
