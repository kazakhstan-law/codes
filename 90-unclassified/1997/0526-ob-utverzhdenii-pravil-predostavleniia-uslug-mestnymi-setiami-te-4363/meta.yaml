  title:
    rus: '"О внесении дополнений в приказ Министерства транспорта и коммуникаций Республики Казахстан и Министерства экономики и торговли Республики Казахстан "Об утверждении Правил предоставления услуг местными сетями телекоммуникаций, телеграфной и почтовой связи"'
    kaz: '"Қазақстан Республикасының Транспорт және коммуникация министрлігі мен Қазақстан Республикасының Экономика және сауда министрлігінің "Жергілікті телекоммуникация желілері, телеграф және почта байланысы қызметін ұсыну Ережесін бекіту туралы" бұйрығына толықтырулар енгізу туралы"'
