act_code: '4753'
requisite: Постановление Государственного комитета Республики Казахстан по инвестициям от 30 мая 1997 года № 19. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 октября 1997 г. № 405. Утратило силу - приказом председателя Комитета по инвестициям Министерства индустрии и торговли Республики Казахстан от 20 февраля 2004 года № 7-п
title:
  rus: Об утверждении Положения "О порядке координации деятельности центральных и местных исполнительных органов и дипломатических миссий Республики Казахстан за рубежом с целью стимулирования иностранного участия в инвестиционных проектах, осуществляемых в Республике Казахстан"
  kaz: '"Қазақстан Республикасында жүзеге асырылатын инвестициялық жобаларға шетелдiк қатысуды ынталандыру мақсатында Қазақстан Республикасының орталық және жергiлiктi атқарушы органдары мен шетелдегi дипломатиялық миссияларының қызметiн үйлестiрудiң тәртiбi туралы ереженi" бекiту туралы'
