act_code: '4749'
requisite: Постановление Государственного комитета Республики Казахстан по инвестициям от 30 мая 1997 г. № 18. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 1997 г. № 398. Утратило силу - приказом председателя Комитета по инвестициям Министерства индустрии и торговли Республики Казахстан от 20 февраля 2004 года № 7-п
title:
  rus: Об утверждении Положения "О порядке обеспечения согласительными и разрешительными документами, лицензиями, визами и другими документами, предоставляющих права и полномочия инвестору для реализации инвестиционного проекта"
  kaz: '"Инвесторды инвестициялық жобаны жүзеге асыру үшiн құқықтар мен өкiлеттiктер беретiн келiсушi және рұқсат етушi құжаттармен, лицензиялармен, визалармен және басқа да құжаттармен қамтамасыз етудiң тәртiбi туралы ереженi" бекiту туралы"'
