act_code: '4372'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам  от 2 июня 1997 г. № 80. Зарегистрировано в Министерстве юстиции 04 августа 1997 г. № 342. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27.12.2004г. № 392
title:
  rus: Об утверждении Инструкции о порядке ведения внутреннего документооборота учебных центров, осуществляющих подготовку специалистов для работы на рынке ценных бумаг
  kaz: '"Бағалы қағаздар рыногында жұмыс iстеу үшiн мамандар даярлауды жүзеге асыратын оқу орталықтарының iшкi құжаттар айналысын жүргiзу тәртiбi туралы нұсқауды" бекiту туралы'
