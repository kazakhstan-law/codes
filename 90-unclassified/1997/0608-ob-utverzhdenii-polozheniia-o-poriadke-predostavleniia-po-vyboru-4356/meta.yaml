act_code: '4356'
requisite: Постановление Министерства финансов Республики Казахстан Департамент управления государственным имуществом и активами от 9 июня 1997 г. № 145 Зарегистрировано в Министерстве юстиции Республики Казахстан 13 июня 1997 г. № 317. Утратило силу - (письмо Министерства юстиции РК от 11.02.2000г. № 4-01-10-1/33Г)
title:
  rus: Об утверждении Положения о порядке предоставления по выбору субъектов малого предпринимательства в аренду или в доверительное управление с правом последующей передачи в собственность неиспользуемых производственных помещений и объектов, офисных помещений на государственных предприятиях на основании представленной ими информации
  kaz: Шағын кәсiпкерлiк субъектiлерi тапсырған ақпарлар негiзiнде олардың қалауымен мемлекеттiк кәсiпорындардағы пайдаланылмай тұрған жайлар мен объектiлердi, кеңселiк жайларды кейiн меншiкке беру құқымен жалға немесе сенiп басқаруға берудiң ретi туралы ЕРЕЖЕ
