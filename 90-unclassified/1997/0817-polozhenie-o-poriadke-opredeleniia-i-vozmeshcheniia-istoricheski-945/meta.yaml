requisite: Утверждено Вице-министром энергетики и природных ресурсов Республики Казахстан 18 августа 1997 года и Вице-министром финансов Республики Казахстан 18 августа 1997 года. Зарегистрированo в Министерстве юстиции Республики Казахстан 29.06.1998 г. за № 526. Утратило силу совместным приказом Заместителя Премьер-Министра Республики Казахстан – Министра индустрии и новых технологий Республики Казахстан от 3 июля 2013 года № 206 и Министра финансов Республики Казахстан 3 июля 2013 года № 308
title:
  rus: Положение "О порядке определения и возмещения исторических затрат, понесенных государством на геологическое изучение Контрактной территории, и порядке приобретения геологической информации"
