act_code: '4720'
requisite: Приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 27 августа 1997 г. N 2-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 17.09.1997г. N 374. Утратил силу - постановлением Правления Национального Банка  Республики Казахстан от 21 апреля 2003 года N 127
title:
  rus: Об утверждении Инструкции об основных требованиях по формированию собственного капитала накопительных пенсионных фондов в Республике Казахстан
  kaz: 'Қазақстан Республикасында Жинақтаушы зейнетақы қорларының өз капиталын қалыптастыру жөнiндегi негiзгi талаптар туралы нұсқаулық ЕСКЕРТУ: Нормативтiк-құқықтық актiнiң атауы жаңа редакцияда жазылды - ҚР Еңбек және халықты әлеуметтік қорғау министрлігінің Жинақтаушы зейнетақы қорларының қызметін реттеу жөніндегі комитетінің 1999 жылғы 15 қазандағы N 83-Ө Бұйрығымен.'
