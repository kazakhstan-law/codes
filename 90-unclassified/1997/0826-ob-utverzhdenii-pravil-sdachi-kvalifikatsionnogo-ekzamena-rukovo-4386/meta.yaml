  rus: https://zan.gov.kz/client/#!/doc/4386/rus/19.12.2000
caused_by:
  code: '7965'
  requisite: Приказ Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 19 декабря 2000 года N 156-П. Зарегистрирован в Министерстве юстиции Республики Казахстан от 20 января 2001 года N 1369. Утратил силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 305
  title:
    rus: О внесении изменений и дополнений в "Положение о порядке согласования кандидатур, подлежащих назначению на руководящие должности в накопительные пенсионные фонды, их филиалы и представительства", утвержденное приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 27 августа 1997 года N 4-П, государственная регистрация 12 сентября 1997 года N 366
    kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрлігі Ұлттық зейнетақы агенттігінің 1997 жылғы 27 тамыздағы N 4-Ө бұйрығымен бекітілген "Жинақтаушы зейнетақы қорларына, олардың филиалдары мен өкілдіктеріне басшы лауазымдарға тағайындауға жататын кандидатураларды келісудің тәртібі туралы" Ережеге өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/7965/rus
