act_code: '4386'
requisite: Приказ Директора Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 27 августа 1997 г. N 4-П. Зарегистрирован в Министерстве юстиции 12 сентября 1997 г. N 366. Утратил силу - постановлением Правления Национального Банка Республики Казахстан от 21 апреля 2003 года N 135
title:
  rus: Об утверждении Правил сдачи квалификационного экзамена руководящими работниками накопительных пенсионных фондов, их филиалов и представительств
  kaz: Жинақтаушы зейнетақы қорларының, олардың филиалдары мен өкiлдiктерiнiң басшы лауазымдарын кандидаттар бiлiктiлiк емтиханын тапсыру тәртiбi туралы Ереже
type_codes:
- ПОЛ
approved_on: 1997-08-26
