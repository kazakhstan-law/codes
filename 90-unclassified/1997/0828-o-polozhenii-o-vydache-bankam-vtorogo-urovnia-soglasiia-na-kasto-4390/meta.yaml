title:
  rus: О Положении о выдаче банкам второго уровня согласия на кастодиальную деятельность и об условиях их участия в уставном капитале негосударственных накопительных пенсионных фондов и компаний по управлению пенсионными активами
  kaz: Екiншi деңгейдегi банктердiң кастодиандық қызметiне келiсiм беруi туралы және олардың мемлекеттiк емес жинақтаушы зейнетақы қорларының және зейнетақы активтерiн басқару жөнiндегi компаниялардың жарғылық қорына қатысуы туралы ЕРЕЖЕ
