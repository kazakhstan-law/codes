requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 2 cентября 1997 года N 138. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 октября 1997 года N 406. Утратило силу постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 23 февраля 1999 года N 26
title:
  rus: Об утверждении Положения о порядке подготовки специалистов для работы на рынке ценных бумаг, контроля за использованием выданных квалификационных свидетельств, приостановления их действия и отзыва
  kaz: '"Бағалы қағаздар рыногында жұмыс iстеу үшiн мамандар даярлаудың, берiлген бiлiктiлiк куәлiктерiнiң пайдаланылуына бақылау жасаудың, олардың қолданылуын тоқтата тұрудың және қайтарып алудың тәртiбi туралы ереженi" бекiту туралы'
