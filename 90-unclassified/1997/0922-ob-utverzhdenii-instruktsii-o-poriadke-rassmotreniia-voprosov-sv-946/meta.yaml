requisite: Приказ Министерства внутренних дел Республики Казахстан от 23 сентября 1997 года N 344. Зарегистрирован в Министерстве юстиции Республики Казахстан 03.07.1998 г. N 534. Утратил силу - приказом Министра внутренних дел РК от 23 августа 2002 года N 556
title:
  rus: Об утверждении Инструкции "О порядке рассмотрения вопросов, связанных с упрощенным (регистрационным) порядком приобретения гражданства Республики Казахстан гражданами Российской Федерации, прибывающими для постоянного проживания в Республику Казахстан"
  kaz: '"Қазақстан Республикасына тұрақты тұру үшін келетін Ресей Федерациясы азаматтарының Қазақстан Республикасының азаматтығын алуының жеңілдетілген (тіркелімдік) тәртібіне байланысты мәселелерді қарау тәртібі туралы" Нұсқауды бекіту туралы'
