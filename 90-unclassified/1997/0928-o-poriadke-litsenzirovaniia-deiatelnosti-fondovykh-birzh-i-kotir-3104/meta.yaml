caused_by:
  code: '17920'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 2 декабря 2003 года № 415. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 декабря 2003 года № 2622. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года № 373
  title:
    rus: О внесении изменений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 29 сентября 1997 года N 152 "О порядке лицензирования деятельности фондовых бирж, котировочных организаций внебиржевого рынка, саморегулируемых организаций профессиональных участников рынка ценных бумаг в Республике Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 389
    kaz: Қазақстан Республикасының Әділет министрлігінде N 389 тіркелген Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының "Қазақстан Республикасындағы қор биржаларының, биржадан тыс рыноктың баға кесу ұйымдарының, бағалы қағаздар рыногы кәсiпқой қатысушыларының өзiн-өзi реттейтiн ұйымдарының қызметтерiн лицензиялаудың тәртiбi туралы" 1997 жылғы 29 қыркүйектегі N 152 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/17920/rus
