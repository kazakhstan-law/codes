act_code: '3104'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 29 сентября 1997 г. N 152. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 октября 1997 г. N 390. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года N 373
title:
  rus: О порядке лицензирования деятельности фондовых бирж и котировочных организаций внебиржевого рынка ценных бумаг в Республике Казахстан
  kaz: Қазақстан Республикасындағы қор биржаларының және биржадан тыс рыноктың баға кесу ұйымдарының қызметтерiн лицензиялау тәртiбi туралы
