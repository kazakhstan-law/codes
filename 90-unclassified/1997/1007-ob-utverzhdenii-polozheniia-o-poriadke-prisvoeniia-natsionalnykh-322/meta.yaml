  requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 1 июля 1999 года N 359. Зарегистрировано в Министерстве юстиции Республики Казахстан 26.07.99 г. за N 851. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 143
  title:
    rus: О внесении изменений и дополнений в Положение о порядке присвоения национальных идентификационных номеров государственным ценным бумагам в Республике Казахстан ~V970458, утвержденное постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 8 октября 1997 года N 161
    kaz: Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының 1997 жылғы 8 қазандағы N 161 қаулысымен бекітілген Қазақстан Республикасындағы мемлекеттік бағалы қағаздарға ұлттық бірдейлендіру нөмірлерін берудің тәртібі туралы ережеге өзгерістер мен толықтырулар енгізу туралы
