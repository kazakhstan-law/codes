title:
  rus: Об утверждении Положения "О порядке присвоения национальных идентификационных номеров государственным ценным бумагам в Республике Казахстан"
  kaz: Қазақстан Республикасындағы мемлекеттiк бағалы қағаздарға ұлттық бiрдейлендiру нөмiрлерiн берудiң тәртiбi туралы ереженi бекiту туралы
