act_code: '459'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 8 октября 1997 года № 159. Зарегистрированo в Министерстве юстиции Республики Казахстан 13 февраля 1998 года № 460. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 октября 2003 года № 382
title:
  rus: Об утверждении Положения "О порядке регистрации в Государственном реестре ценных бумаг акций акционерных обществ в Республике Казахстан и присвоения им национальных идентификационных номеров"
  kaz: Қазақстан Республикасындағы акционерлiк қоғамдардың акцияларын Бағалы қағаздардың мемлекеттiк тiзiлiмiне тiркеудiң және оларға ұлттық бiрдейлендiру нөмiрлерiн берудiң тәртiбi туралы ереженi бекiту туралы
