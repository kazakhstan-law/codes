    kaz: '"Қазақстан Республикасындағы акционерлiк қоғамдардың акцияларын Бағалы қағаздардың мемлекеттiк тiзiлiмiне тiркеудiң және оларға ұлттық бiрдейлендiру нөмiрлерiн берудiң тәртiбi туралы ереженi бекiту туралы" Қазақстан Республикасы Бағалы қағаздар жөнiндегі ұлттық комиссиясының 1997 жылғы 08 қазандағы N 159 қаулысына өзгерiстер енгiзу туралы'
