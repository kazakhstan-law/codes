caused_by:
  code: '5998'
  requisite: Приказ Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 29 февраля 2000 года N 14-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2000 года N 1133. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 153
  title:
    rus: О внесении изменений и дополнений в "Инструкцию по ведению учета пенсионных взносов на индивидуальных пенсионных счетах вкладчиков (получателей) в накопительных пенсионных фондах", утвержденную приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 14 октября 1997 года N 11-П
    kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтiк қорғау министрлiгi Ұлттық зейнетақы агенттiгiнiң 1997 жылғы 14 қазандағы N 11-Ө бұйрығымен бекiтiлген "Жинақтаушы зейнетақы қорларындағы салымшылардың (алушылардың) дербес зейнетақы шоттарындағы зейнетақы жарналарының есебiн жүргiзу жөнiндегi нұсқаулыққа" өзгерiстер мен толықгырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/5998/rus
