act_code: '2187'
requisite: Утверждена приказом Национальным пенсионным агентством Министерства труда и социальной защиты населения Республики Казахстан 14 октября 1997 г. N 11-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 1997 г. N 414. Утратил силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 153 (V042953)
title:
  rus: Инструкция по ведению учета пенcионных накоплений на индивидуальных пенсионных счетах вкладчиков (получателей) в накопительных пенсионных фондах
  kaz: Жинақтаушы зейнетақы қорларындағы салымшылардың (алушылардың) дербес зейнетақы шоттарындағы зейнетақы жинақталған қаражатының есебін жүргізу жөніндегі нұсқаулық<*><*> ЕСКЕРТУ. Атауы жаңа редакцияда жазылды - ҚР Еңбек және халықты әлеуметтік қорғау министрлігі Ұлттық зейнетақы агенттігінің 1998.12.18. N 173-п ~V980672 бұйрығымен, атауы өзгертілді 29.02.2000 ж. N 14-Ө ~V001133
