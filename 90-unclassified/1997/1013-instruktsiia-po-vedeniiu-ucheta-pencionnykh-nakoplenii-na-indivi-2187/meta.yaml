version_date:
  rus: 1998-12-18
source:
  rus: https://zan.gov.kz/client/#!/doc/2187/rus/18.12.1998
caused_by:
  code: '2118'
  requisite: Приказ Национального пенсионного агентства Министерства труда и соцзащиты населения Республики Казахстан от 18 декабря 1998 года N 173-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 января 1999 года N 672. Утратил силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 153
  title:
    rus: Об утверждении изменений и дополнений в Порядок ведения учета индивидуальных пенсионных взносов на лицевых счетах вкладчиков (получателей) в накопительных пенсионных фондах, утвержденный приказом Национального пенсионного агентства Министерства труда и соцзащиты населения Республики Казахстан от 14 октября 1997 года N 11-П (государственная регистрация от 6 ноября 1997 года N 414)
    kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрлігі Ұлттық зейнетақы агенттігінің 1997 жылғы 14 қазандағы N 11-Ө бұйрығымен бекітілген (мемлекеттік тіркелім N 414, 1997 жылғы 6 қараша) "Жинақтаушы зейнетақы қорларындағы салымшылардың (алушылардың) жеке шоттарындағы дербес зейнетақы жарналарының есебін жүргізу тәртібіне" өзгерістер мен толықтыруларды бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/2118/rus
