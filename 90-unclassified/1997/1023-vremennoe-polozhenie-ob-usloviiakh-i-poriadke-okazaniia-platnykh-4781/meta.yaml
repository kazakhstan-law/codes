act_code: '4781'
requisite: УТВЕРЖДЕНО Министром внутренних дел Республики Казахстан от 24 октября 1997 г. Зарегистрирован в Министерстве юстиции Республики Казахстан 14.11.1997 г. № 420. Утратил силу приказом Министра внутренних дел Республики Казахстан от 15 июля 2004 года № 417
title:
  rus: ВРЕМЕННОЕ ПОЛОЖЕНИЕ "Об условиях и порядке оказания платных бытовых, медицинских, оздоровительных и иных видов услуг лицам, заключенным под стражу и осужденным в следственных изоляторах МВД Республики Казахстан"
  kaz: Қазақстан Республикасының Iшкi iстер Министрлiгiнiң қамауға алынған және тергеу изоляторларындағы сотталған адамдарға ақылы тұрмыстық, медициналық, сауықтыру және тағы басқа қызмет көрсету түрлерiнiң шарттары және тәртiбi туралы УАҚЫТША ЕРЕЖЕ
