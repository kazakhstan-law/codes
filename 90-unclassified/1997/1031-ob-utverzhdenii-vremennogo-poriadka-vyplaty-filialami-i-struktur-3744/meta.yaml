  requisite: Утверждено Приказом Департамента Казначейства Министерства финансов Республики Казахстан от 15 июля 1998 года № 325. Зарегистрирован Министерством юстиции Республики Казахстан 12.10.1998 г. № 616. Утратил силу приказом Министра финансов Республики Казахстан от 29 ноября 2012 года № 523
  title:
    rus: Дополнения и изменения № 1 к Временному порядку выплаты Филиалами и структурными подразделениями Народного Банка Казахстана заработной платы и других денежных выплат работникам бюджетных организаций путем зачисления их суммы на счета по вкладам или карт-счета
    kaz: Бюджеттік ұйымдардың қызметкерлеріне жалақы және басқа да ақша төлемдерін салымдар немесе карт-шот бойынша шотқа олардың сомаларын аудару жолымен Қазақстан Халықтық банкі филиалдары мен құрылымдық бөлімшелері төлеунің Уақытша тәртібіне N 1 толықтырулар мен өзгерістер
