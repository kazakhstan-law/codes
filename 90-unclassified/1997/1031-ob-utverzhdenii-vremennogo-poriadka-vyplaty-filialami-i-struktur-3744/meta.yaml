act_code: '3744'
requisite: Приказ Министерства финансов Республики Казахстан от 31 октября 1997 г. N 379. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 октября 1997 г. N 413. Утратил силу - приказом Министра финансов РК от 17 ноября 2000г. N 488
title:
  rus: Об утверждении Временного порядка выплаты филиалами и структурными подразделениями Народного Банка Казахстана заработной платы и других денежных выплат работникам бюджетных организаций путем зачисления их суммы на счета по вкладам или карт-счета
  kaz: Қазақстан Халықтық банкiсiнiң филиалдары мен құрылымдық бөлiмшелерiнiң жалақы мен басқа да ақшалай төлемдердiң сомасын салымдар бойынша шоттарға немесе басқа да карт-шоттарға есептеу жолымен оларды бюджеттiк ұйымдардың қызметкерлерiне төлеуiнiң Уақытша тәртібі
