act_code: '2064'
requisite: Утвержден приказом Министерства финансов Республики Казахстан от 31 октября 1997 г. N 379. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 октября 1997 г. N 412. Утратил силу - приказом Министра финансов РК от 17 ноября 2000г. N 488
title:
  rus: Временный порядок выдачи наличных денег бюджетным организациям через ОАО (Открытое Акционерное Общество) Народный Сберегательный банк Казахстана (кроме заработной платы, зачисляемой на лицевые счета по вкладам и стипендий)
  kaz: Бюджеттік ұйымдарға Қазақстанның ААҚ (Ашық Акционерлік Қоғам) Халықтық Жинақ банкісі арқылы қолма-қол ақшаларды берудің уақытша тәртібі (салымдар мен стипендиялар бойынша бет шоттарына есептелетін еңбекақылардан басқалары)
