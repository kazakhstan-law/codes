  requisite: Приказ Департамента Казначейства Министерства финансов Республики Казахстан от 15 июля 1998 года N 325. Зарегистрирован Министерством юстиции Республики Казахстан 15.10.1998 г. N 623. Утратил силу - Приказом Председателя Комитета казначейства Министерства финансов Республики Казахстан от 10 июня 2005 года N 28
  title:
    rus: Об утверждении дополнений и изменений к Временному порядку выдачи наличных денег бюджетным организациям через Народный Банк Казахстана
    kaz: Қазақстан акционерлік Халықтық Жинақ банкі арқылы бюджеттік ұйымдарға қолма-қол ақша берудің Уақытша тәртібілеріне толықтырулар мен өзгерістер бекіту туралы
