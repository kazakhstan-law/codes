act_code: '324'
requisite: Утверждены приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 15 декабря 1997 года N 33-п. Зарегистрированы в Министерстве юстиции Республики Казахстан 22.02.1998 г. N 468. Приказ N 33-П утратил силу - постановлением Правления Агентства РК по регулирования и нардзору финансового рынка и финансовых организаций от 26.03.2005г. N 112
title:
