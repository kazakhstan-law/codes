  requisite: Приказ и.о. Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 26 ноября 1999 года № 94-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2000 года № 1033. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 марта 2005 года № 112
  title:
    rus: О внесении изменений и дополнений в Положение об основных требованиях, предъявляемых к автоматизированной информационной системе накопительных пенсионных фондов, утвержденное приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 5 декабря 1997 года № 33-П
    kaz: '"Қазақстан Республикасының Еңбек және халықты әлеуметтiк қорғау министрлiп Ұлттық зейнетақы агенттiгiнiң 1997 жылғы 5 желтоқсандағы № 33-Ө бұйрығымеи бекiтiлген "Жинақтаушы зейнетақы қорларының автоматтандырылған ақпараттар жүйесiне қойылатын негiзгi талаптар туралы ережеге" өзгерiстер мен толықтырулар енгiзу туралы"'
