act_code: '214'
requisite: Приказ Национального пенсионного агентства Министерства труда и соцзащиты населения Республики Казахстан от 7 января 1998 года № 4-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 февраля 1998 года № 467. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года № 242
title:
  rus: Об утверждении Инструкции о порядке согласования открытия и закрытия филиалов и представительств накопительных пенсионных фондов
  kaz: Жинақтаушы зейнетақы қорларының филиалдары мен өкiлдiктерiн ашуды және жабуды келiсу тәртiбi туралы нұсқаулық
