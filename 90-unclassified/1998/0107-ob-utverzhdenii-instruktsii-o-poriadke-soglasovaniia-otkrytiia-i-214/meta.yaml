caused_by:
  code: '6777'
  requisite: Приказ Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 27 июня 2000 года № 70-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 августа 2000 года № 1218. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года № 242 (вводится в действие по истечении четырнадцати дней со дня государственной регистрации в Министерстве юстиции Республики Казахстан)
  title:
    rus: О внесении изменений и дополнений в "Положение о порядке согласования открытия и закрытия филиалов и представительств накопительного пенсионного фонда", утвержденного приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 7 января 1998 года № 4-П
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау министрлiгiнiң Ұлттық зейнетақы агенттiгiнiң 1998 жылғы 7 қаңтардағы № 4-Ө бұйрығымен бекiтiлген "Жинақтаушы зейнетақы қорының филиалдары мен өкiлдiктерiн ашуды және жабуды келiсу тәртiбi туралы ережеге" өзгерiстер мен толықтырулар енгiзу туралы"
  link: https://zan.gov.kz/client/#!/doc/6777/rus
