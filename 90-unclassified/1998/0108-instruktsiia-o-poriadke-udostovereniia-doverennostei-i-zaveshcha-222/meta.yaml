act_code: '222'
requisite: Утверждена приказом Министра юстиции Республики Казахстан от 8 января 1998 года № 5. Зарегистрированa в Министерстве юстиции Республики Казахстан 10 марта 1998 года № 481. Утратила силу приказом Министра юстиции Республики Казахстан от 4 ноября 2004 года № 325
title:
  rus: Инструкция "О порядке удостоверения доверенностей и завещаний начальниками, эаместителями по медицинской части, старшими и дежурными врачами госпиталей, санаториев и других военно-лечебных заведений, а также командирами (начальниками) воинских частей, соединений, учреждений и военно-учебных заведений в местах, где отсутствуют органы и лица, имеющие право совершать нотариальные действия"
  kaz: Госпитальдардың, санаторийлердің және басқа әскери-емдеу мекемелерінің бастықтарымен, олардың медицина жағынан орынбасарларының, аға және кезекші дәрігерлердің, сондай-ақ нотариаттық іс-әрекеттерді жасауға өкілетті органдары мен адамдары жоқ әскери бөлімдердің, құрамалардың, мекемелердің және әскери-оқу орындарының командирлерімен (бастықтарымен) сенімхаттар мен өсиеттерді куәландыру тәртібі туралы Нұсқаулық
