title:
  rus: ИНСТРУКЦИЯ "О порядке удостоверения доверенностей руководителями учреждений и органов социальной защиты населения Республики Казахстан и завещаний директорами, главными врачами домов для престарелых и инвалидов"
  kaz: Қазақстан Республикасының халықты әлеуметтік қорғау мекемелері мен органдарының басшыларының сенімхаттарды және қарттар мен мүгедектер үйлерінің директорларының, бас дәрігерлерінің өсиеттерді куәландыру тәртібі туралы НҰСҚАУЛЫҚ
