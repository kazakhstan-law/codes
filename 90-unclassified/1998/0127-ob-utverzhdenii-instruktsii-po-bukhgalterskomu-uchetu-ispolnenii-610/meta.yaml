  requisite: Приказ Департамента Казначейства Министерства финансов Республики Казахстан от 11 августа 1998 года N 372. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 сентября 1998 года N 596. Утратил силу приказом Министра финансов Республики Казахстан от 16 ноября 2009 года N 495
  title:
    rus: О внесении дополнений и изменений в Инструкцию по бухгалтерскому учету исполнения республиканского бюджета в Департаменте Казначейства Министерства финансов Республики Казахстан
    kaz: Қазақстан Республикасы Қаржы министрлігі Қазынашылық Департаментіндегі республикалық бюджетті орындаудың бухгалтерлік есебі жөніндегі Нұсқаулыққа өзгерістер мен толықтырулар енгізу туралы
