act_code: '610'
requisite: Приказ Министерства финансов Республики Казахстан от 27 января 1998 года N 31. Зарегистрирован в Министерстве юстиции Республики Казахстан 19.03.1998 г. за N 487. Утратил силу приказом Министра финансов Республики Казахстан от 16 ноября 2009 года N 495
title:
  rus: Об утверждении "Инструкции по бухгалтерскому учету исполнения республиканского бюджета в Департаменте Казначейства Министерства финансов Республики Казахстан"
  kaz: Қазақстан Республикасы Қаржы министрлігінің Қазынашылық департаментіндегі республикалық бюджетті орындаудың бухгалтерлік есебі жөніндегі Нұсқаулық
