version_date:
  rus: 2000-10-05
source:
  rus: https://zan.gov.kz/client/#!/doc/210/rus/05.10.2000
caused_by:
  code: '7433'
  requisite: Приказ Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 6 октября 2000 года N 117-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 ноября 2000 года N 1296. Утратил силу - постановлением Правления Национального Банка РК от 7.05.2003г. N 149
  title:
    rus: О внесении изменений и дополнений в "Положение по раскрытию и публикации информации о деятельности накопительных пенсионных фондов в Республике Казахстан", утвержденное приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 9 марта 1998 года N 30-П и зарегистрированное Министерством юстиции Республики Казахстан от 19 марта 1998 года N 436
    kaz: '"Қазақстан Республикасы еңбек және халықты әлеуметтiк қорғау Министрлiгінің Ұлттық зейнетақы агенттiгiнің 1998 жылғы 9 наурызындағы N 30-Ө бұйрығымен бекiтiлген және Қазақстан Республикасының Әдiлет Министрлiгi 1998 жылғы 19 наурызда тiркеген N 436 "Қазақстан Республикасында жинақтаушы зейнетақы қорларының қызметi туралы ақпараттарды ашу және жариялау жөнiндегі ережеге" өзгерiстер мен толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/7433/rus
