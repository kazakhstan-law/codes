act_code: '210'
requisite: Приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 9 марта 1998 г. N 30-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 18.03.1998 г. N 436. Утратил силу - постановлением Правления Национального Банка РК от 7.05.2003г. N 149
title:
  rus: Об утверждении "Инструкции по раскрытию и публикации информации о деятельности накопительных пенсионных фондов в Республике Казахстан"
  kaz: 'Қазақстан Республикасында жинақтаушы зейнетақы қорларының қызметi туралы ақпараттарды ашу және жариялау жөнiндегi Нұсқамасы <*> Ескерту: Нормативтiк құқықтық актiнiң аталуы жаңа редакцияда жазылды - ҚР Еңбек және халықты әлеуметтік қорғау министрлігінің 2000 жылғы 6 қазандағы N 117-ө бұйрығымен. ~V001296'
