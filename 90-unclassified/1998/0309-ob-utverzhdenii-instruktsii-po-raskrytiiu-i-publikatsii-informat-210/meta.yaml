  requisite: Приказ Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 20 июля 2001 года N 73-П. Зарегистрировано в Министерстве юстиции от 13 августа 2001 г. N 1625. Утратил силу - постановлением Правления Национального Банка РК от 7.05.2003г. N 149
  title:
    rus: О внесении изменений в приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 9 марта 1998 года N 30-П "Об утверждении Инструкции по раскрытию и публикации информации о деятельности накопительных пенсионных фондов в Республике Казахстан"
    kaz: Қазақстан Республикасы еңбек және халықты әлеуметтiк қорғау Министрлiгiнiң Ұлттық зейнетақы агенттiгiнiң "Қазақстан Республикасындағы жинақтаушы зейнетақы қорларының қызметi жөнiндегi ақпаратты ашу және жариялау туралы Нұсқаулығын бекiту туралы" 1998 жылғы 9 наурыздағы N 30-Ө бұйрығына өзгерту енгiзу туралы
