title:
  rus: Положение об аттестации должностных лиц аппаратов акимов городов районного значения, поселков, аулов (сел), аульных (сельских) округов, совершающих нотариальные действия
  kaz: Аудандық маңызы бар қалалардың, кенттердің, ауылдардың (селолардың), ауылдық (селолық) округтердің әкімдері аппараттарының нотариаттық іс-әрекеттер жасайтын лауазымды адамдарын аттестаттау туралы ереже
