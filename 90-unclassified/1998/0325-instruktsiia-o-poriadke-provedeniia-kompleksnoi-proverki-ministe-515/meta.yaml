title:
  rus: Инструкция "О порядке проведения комплексной проверки Министерством финансов Республики Казахстан и его территориальными органами состояния работы по формированию и исполнению местных бюджетов Республики"
  kaz: Қазақстан Республикасы Қаржы министрлігі мен оның аумақтық органдарының республика жергілікті бюджеттерінің қалыптасуы және атқарылуы жөніндегі жұмыстардың жай-күйіне кешенді тексеріс жүргізу тәртібі туралы НҰСҚАУЛЫҚ
