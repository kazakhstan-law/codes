  title:
    rus: О внесении изменений и дополнений в Приказ председателя Комитета по государственному контролю над производством и оборотом алкогольной продукции от 4 июня 1998 года № 4 "Об утверждении Положения о порядке и условиях проведения конкурсов на размещение объемов (квот) импорта этилового спирта и водки" ~V980531
    kaz: '"Этил спирті мен арақ импорты көлемін (квотасын) орналастыруға Конкурстар өткізудің тәртібі мен шарттары туралы Ережені бекіту туралы" Алкоголь өнімін өндіру және оның айналымын мемлекеттік бақылау жөніндегі Комитет төрағасының 1998 жылғы 4 маусымдағы N 4 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
