  title:
    rus: О внесении изменений в Приказ председателя Комитета по государственному контролю над производством и оборотом алкогольной продукции от 4 июня 1998 года № 4 "Об утверждении Правил и условий проведения конкурсов на размещение объемов (квот) импорта этилового спирта и алкогольной продукции (кроме пива)"
    kaz: '"Этил спирті мен алкоголь өнімі (сырадан басқа) импорты көлемін (квотасын) орналастыруға конкурстар өткізудің тәртібі мен шарттарын бекіту туралы" Алкоголь өнімін өндіру және оның айналымын мемлекеттік бақылау жөніндегі Комитет төрағасының 1998 жылғы 4 маусымдағы N 4 бұйрығына өзгерістер енгізу туралы'
