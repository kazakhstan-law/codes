act_code: '954'
requisite: Утверждена постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 12 июня 1998 г. N 7. Зарегистрирована в Министерстве юстиции Республики Казахстан 29.06.1998 г. N 530. Исключена - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 267
title:
  rus: Инструкция о порядке расчета и применения пруденциальных нормативов для организаций, осуществляющих деятельность по управлению портфелем ценных бумаг
  kaz: Бағалы қағаздар портфелін басқару жөніндегі қызметті жүзеге асыратын ұйымдарға арналған пруденциялық нормативтерді есептеудің және қолданудың тәртібі туралы НҰСҚАУЛЫҚ
