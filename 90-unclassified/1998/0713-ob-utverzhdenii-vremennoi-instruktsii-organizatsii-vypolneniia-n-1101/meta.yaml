act_code: '1101'
requisite: Приказ Комитета по использованию воздушного пространства и деятельности гражданской авиации при Министерстве транспорта и коммуникаций Республики Казахстан от 14 июля 1998 года № 98-П Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 1998 года № 553. Утратил силу совместным приказом Министра транспорта, коммуникаций и туризма Республики Казахстан от 8 октября 1999 года № 705 А-I, Министра иностранных дел Республики Казахстан от 12 октября 1999 года № 36, Министра обороны Республики Казахстан от 14 октября 1999 года № 170
title:
  rus: Об утверждении Временной инструкции организации выполнения нерегулярных полетов иностранными гражданскими воздушными судами в воздушном пространстве Республики Казахстан
  kaz: '"Қазақстан Республикасының әуе кеңістігінде шетелдік азаматтық әуе кемелерінің оқтын-оқтын ұшуларының орындалуын ұйымдастырудың Уақытша нұсқаулығын бекіту туралы"'
