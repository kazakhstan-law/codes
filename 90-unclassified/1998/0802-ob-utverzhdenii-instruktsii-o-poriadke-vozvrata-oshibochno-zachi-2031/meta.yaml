act_code: '2031'
requisite: Приказ Директора Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 3 августа 1998 года N 100-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 27.08.1998 г. за N 585. Утратил силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 305
