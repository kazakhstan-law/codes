  title:
    rus: О внесении изменений и дополнений в "Инструкцию о порядке возврата ошибочно зачисленных пенсионных взносов", утвержденную приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 3 августа 1998 года N 100-П (государственная регистрация 27 августа 1998 года N 585)
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі Ұлттық зейнетақы агенттігінің 1998 жылғы 3 тамыздағы N 100-Ө бұйрығымен бекітілген (1998 жылғы 27 тамыздағы мемлекеттік тіркелім N 585) "Қате есептелген зейнетақы жарналарын қайтару тәртібі туралы нұсқаулыққа "өзгерістер мен толықтырулар енгізу туралы"
