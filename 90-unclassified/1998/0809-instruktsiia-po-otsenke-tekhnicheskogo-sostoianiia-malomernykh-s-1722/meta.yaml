  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра транспорта и коммуникаций Республики Казахстан от 10 августа 1998 года № 172 "Об утверждении документов, регламентирующих безопасность плавания маломерных судов на водоемах Республики Казахстан"
    kaz: '"Қазақстан Республикасы су қоймаларында шағын өлшемді кемелердің жүзу қауіпсіздігін белгілейтін құжаттарды бекіту туралы" Қазақстан Республикасының Көлік және коммуникациялар министрі м.а. 1998 жылғы 10 тамыздағы N 172 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
