act_code: '1722'
requisite: Утверждено приказом Министра транспорта и коммуникаций Республики Казахстан от 10 августа 1998 года № 172. Зарегистрирован Министерством юстиции Республики Казахстан 13 октября 1998 года № 617. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 12 октября 2012 года № 691
title:
  rus: Инструкция по оценке технического состояния маломерных судов, их баз-стоянок, переправ, поднадзорных Комитету транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан
  kaz: Қазақстан Республикасы Көлік және коммуникация министрлігі Көліктік бақылау комитетінің қадағалауындағы шағын өлшемді кемелердің, олардың тұрақ-базаларының, өткелдердің техникалық күйін бағалау бойынша нұсқаулық
