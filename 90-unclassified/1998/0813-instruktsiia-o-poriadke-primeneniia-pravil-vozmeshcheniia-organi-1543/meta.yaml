act_code: '1543'
requisite: Приказ Министерства труда и социальной защиты населения Республики Казахстан от 14 августа 1998 года N 158-п Зарегистрирован Министерством юстиции РК 23 сентября 1998г. N 612. Утратил силу - приказом Министра труда и социальной защиты населения РК от 29 июня 2000г. N 157-п (извлечение из текста приказа см. ниже)
title:
  rus: Инструкция "О порядке применения Правил возмещения организациями всех форм собственности ущерба, причиненного рабочим и служащим увечьем либо иным повреждением здоровья, связанным с исполнением ими трудовых обязанностей"
  kaz: Қазақстан Республикасы Министрлер Кабинетінің 1993 жылғы 17 наурыздағы N 201 қаулысымен бекітілген Жұмысшылар мен қызметшілерге еңбек міндетін атқаруына байланысты мертігіп қалған жағдайда немесе денсаулығына басқадай зақым келгенде олардың шеккен зиянын меншіктің барлық нысанындағы ұйымдардың өтеуі ережесін (енгізілген өзгертулер мен толықтыруларды ескере отырып) қолданудың тәртібі туралы НҰСҚАУЛЫҚ
