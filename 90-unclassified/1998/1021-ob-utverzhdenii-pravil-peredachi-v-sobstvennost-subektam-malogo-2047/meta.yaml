act_code: '2047'
requisite: Постановление Департамента государственного имущества и приватизации Министерства финансов Республики Казахстан от 22 октября 1998 года N 637. Зарегистрировано Министерством юстиции Республики Казахстан 08.12.1998 г. N 652. Утратило силу - приказом Председателя Комитета государственного имущества и приватизации МФ РК от 5.04.2005г. N 111
title:
  rus: Об утверждении Правил передачи в собственность субъектам малого препринимательства неиспользуемых производственных помещений и объектов, офисных помещений государственных предприятий и организаций с государственным участием, переданных в аренду или доверительное управление на условиях организации производственной деятельности
  kaz: Шағын кәсіпкерлiк субъектiлердiң меншiгiне өндiрiстiк қызмет ұйымдастыру үшiн бос тұрған өндiрiстiк объектiлердi, мемлекеттiк кәсiпорындарымен мекемелердiң офистiк бөлмелерiн жалға немесе сенiмгерлiк басқаруға өндiрiстiк қызмет ұйымдастыру шартымен беру туралы қағидасын бекiту туралы
