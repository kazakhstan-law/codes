  requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 11 октября 1999 года № 46 Зарегистрирован в Министерстве юстиции Республики Казахстан 20 октября 1999года за N 937. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года N 175
  title:
    rus: О внесении изменений и дополнений в Правила осуществления деятельности организаторов торгов с ценными бумагам, утвержденные постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 23 декабря 1998 года № 19
    kaz: Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының 1998 жылғы 23 желтоқсанындағы N 19 қаулысымен бекітілген Бағалы қағаздармен сауда-саттық ұйымдастырушылардың қызметін жүзеге асыру қағидаларына өзгерістер мен толықтырулар енгізу туралы
