requisite: Приказ Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 02 апреля 1999 г. N 08-ОД Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 1999 года N 758. Утратил силу - приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий, защите конкуренции и поддержке малого бизнеса от 24 декабря 1999 года N 19-ОД
