  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 20 апреля 1999 года N 82 "Об утверждении Правил взимания платы за услуги по кассовому обслуживанию филиалами Национального Банка Республики Казахстан банков второго уровня и организаций, осуществляющих отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 746
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 746 тiркелген Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасының Ұлттық Банкi филиалдарының екiншi деңгейдегi банктерге және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдарға кассалық қызмет көрсеткенi үшiн ақы алу ережесiн бекiту туралы" 1999 жылғы 20 сәуiрдегi N 82 қаулысына өзгерiстер мен толықтыру енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/18267/rus
