act_code: '2834'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 апреля 1999 года N 82. Зарегистрировано в Министерстве юстиции Республики Казахстан 30.04.1999 г. за N 746. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 октября 2006 года N 114
title:
  rus: Об утверждении Правил взимания платы за услуги по кассовому обслуживанию филиалами Национального Банка Республики Казахстан банков второго уровня и организаций, осуществляющих отдельные виды банковских операций
  kaz: Қазақстан Республикасының Ұлттық Банкі филиалдарының, екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың кассалық қызмет көрсету бойынша қызметтер үшін ақы алу ережесін бекіту туралы
