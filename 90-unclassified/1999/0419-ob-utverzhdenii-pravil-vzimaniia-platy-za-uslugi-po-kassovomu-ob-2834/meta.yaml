  title:
    rus: О внесении дополнения в приложение N 1 к постановлению Правления Национального Банка Республики Казахстан от 20 апреля 1999 года N 82 "Об установлении тарифов Национального Банка Республики Казахстан за услуги по кассовому обслуживанию банков второго уровня и организаций, осуществляющих отдельные виды банковских операций"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық Банкінің екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың кассалық қызмет көрсету жөніндегі тарифтерін белгілеу туралы" 1999 жылғы 20 сәуірдегі N 82 қаулысының N 1 қосымшасына толықтыру енгізу туралы
