  title:
    rus: О внесении изменения и дополнения в приложение N 1 к постановлению Правления Национального Банка Республики Казахстан от 20 апреля 1999 года N 82 "Об установлении тарифов Национального Банка Республики Казахстан за услуги по кассовому обслуживанию банков второго уровня и организаций, осуществляющих отдельные виды банковских операций"
    kaz: Қазақстан Республикасы Ұлттық Банкi Басқармасының "Қазақстан Республикасы Ұлттық Банкiнiң екiншi деңгейдегi банктердiң және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың кассалық қызмет көрсету жөнiндегi тарифтерiн белгiлеу туралы" 1999 жылғы 20 сәуiрдегi N 82 қаулысының N 1 қосымшасына өзгерiс пен толықтыру енгiзу туралы
