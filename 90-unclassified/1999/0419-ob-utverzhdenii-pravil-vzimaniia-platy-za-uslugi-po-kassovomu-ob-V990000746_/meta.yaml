  title:
    rus: О внесении дополнения и изменений в постановление Правления Национального Банка Республики Казахстан от 20 апреля 1999 года № 82 "Об утверждении Правил взимания платы за услуги по кассовому обслуживанию филиалами Национального Банка Республики Казахстан банков второго уровня и организаций, осуществляющих отдельные виды банковских операций"
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасы Ұлттық Банкi филиалдарының, екiншi деңгейдегi банктердiң және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың кассалық қызмет көрсету бойынша қызметтер үшiн ақы алу ережесiн бекiту туралы" 1999 жылғы 20 сәуiрдегi N 82 қаулысына толықтыру мен өзгерiстер енгiзу туралы
