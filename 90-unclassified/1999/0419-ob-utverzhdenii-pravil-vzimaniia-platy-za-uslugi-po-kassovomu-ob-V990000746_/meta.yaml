  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 20 апреля 1999 года N 82 "Об установлении тарифов Национального Банка Республики Казахстан за услуги по кассовому обслуживанию банков второго уровня и организаций, осуществляющих отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 746
    kaz: Қазақстан Республикасының Әділет министрлігінде N 746 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық Банкінің екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың кассалық қызмет көрсету жөніндегі тарифтерін белгілеу туралы" 1999 жылғы 20 сәуірдегі N 82 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/16945/rus
