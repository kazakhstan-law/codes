title:
  rus: Об утверждении Правил приема наличных денег от представителей государственных учреждений, физических лиц для зачисления в бюджет и на счета государственных учреждений через филиалы и структурные подразделения Банка-агента
  kaz: Банк-агентіктің филиалдары мен құрылымдық бөлімшелері арқылы мемлекеттік мекемелер өкілдерінен, жеке тұлғалардан бюджетке және мемлекеттік мекемелерді шоттарына есептеу үшін қолма-қол ақшаны қабылдау Ережелерін бекіту туралы
