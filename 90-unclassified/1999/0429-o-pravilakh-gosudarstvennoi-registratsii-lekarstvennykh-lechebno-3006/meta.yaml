  title:
    rus: О внесении дополнений в приказ Министерства здравоохранения, образования и спорта Республики Казахстан от 30 апреля 1999 года № 226 "О Правилах государственной регистрации лекарственных, лечебно-диагностических и косметических средств, изделий медицинского назначения, медицинской техники и продуктов лечебно-профилактического питания" (Государственная регистрация в Министерстве юстиции Республики Казахстан 17 мая 1999 года № 759)
    kaz: Қазақстан Республикасы Денсаулық сақтау, білім және спорт министрлігінің "Дәрі-дәрмек, емдеу-диагностика және косметика құралдарын, медициналық мақсаттағы бұйымдарды, медицина техникасы мен емдеу-алдын алу тамақ өнімдерін мемлекеттік тіркеу ережелері туралы" (Қазақстан Республикасының Әділет министрлігіндегі мемлекеттік тіркеуі 1999 жылғы 17 мамырдағы № 759) 1999 жылғы 30 сәуірдегі № 226 бұйрығына толықтырулар енгізу туралы
