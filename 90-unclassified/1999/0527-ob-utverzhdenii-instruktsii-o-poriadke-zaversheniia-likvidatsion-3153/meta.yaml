requisite: Постановление Правления Национального Банка Республики Казахстан от 28 мая 1999 года N 122. Зарегистрирован в Министерстве юстиции Республики Казахстан 4.06.1999г. за N 790. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 апреля 2006 года N 93
