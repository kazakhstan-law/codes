act_code: '3719'
requisite: Постановление Правления Национального Банка Республики Казахстан от 18 июня 1999 года N 129. Зарегистрировано в Министерстве юстиции Республики Казахстан от 26 июля 1999 года N 855. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 октября 2006 года N 229
title:
  rus: Об утверждении Правил о требованиях, предъявляемых к отчету о проведении аудита банков
  kaz: Банктерге аудит жүргізу жөніндегі есеп беруге қойылатын талаптар туралы ережені бекіту туралы
