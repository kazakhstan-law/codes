act_code: '4411'
requisite: Приказ Министра юстиции Республики Казахстан от 2 августа 1999 года N 61 Зарегистрирован в Министерстве юстиции Республики Казахстан 6 августа 1999 года за N 865. Утратил силу - совместным приказом Генерального прокурора Республики Казахстан от 22 января 2001 года N 7-17-5-2001 и Министра юстиции Республики Казахстан от 29 декабря 2000 года N 108
title:
  rus: Об утверждении Правил проведения проверок нормативных правовых актов государственных органов Республики Казахстан, подлежащих государственной регистрации Министерством юстиции Республики Казахстан и его территориальными органами
  kaz: Мемлекеттік тіркеуге жататын Қазақстан Республикасы мемлекеттік органдары нормативтік құқықтық актілерін Қазақстан Республикасы Әділет министрлігі мен оның аумақтық органдарының тексеруден өткізу Ережелерін бекіту
