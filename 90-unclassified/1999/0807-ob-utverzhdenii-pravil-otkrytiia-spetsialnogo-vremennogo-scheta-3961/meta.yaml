  title:
    rus: О внесении изменений и дополнений в постановление Центральной избирательной комиссии Республики Казахстан от 7 августа 1999 года N 19/222 "Об утверждении Правил расходования средств избирательных фондов и представления отчетов об их использовании при выборах депутатов Мажилиса Парламента Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан за N 870
    kaz: Қазақстан Республикасы Орталық сайлау комиссиясының "Қазақстан Республикасы Парламенті Мәжілісінің депутаттарын сайлау кезінде сайлау қорларының қаражатын жұмсаудың және оның жұмсалуы туралы есеп берудің Ережесін бекіту туралы", Қазақстан Республикасы Әділет министрлігінде N 870 болып тіркелген, 1999 жылғы 7 тамыздағы N 19/222 қаулысына өзгерістер мен толықтырулар енгізу туралы
