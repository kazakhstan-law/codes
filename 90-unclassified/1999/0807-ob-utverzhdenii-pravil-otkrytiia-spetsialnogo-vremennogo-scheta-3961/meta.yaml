  title:
    rus: О внесении изменений и дополнений в постановление Центральной избирательной комиссии Республики Казахстан от 7 августа 1999 года N 19/222 "Об утверждении Правил расходования средств избирательных фондов и представления отчетов об их использовании при выборах Президента, депутатов Парламента, маслихатов и акимов Республики Казахстан"
    kaz: '"Қазақстан Республикасы Президентін, Парламент, мәслихаттар депутаттарын және әкімдерді сайлау кезінде сайлау қорларының қаражатын жұмсаудың және оны пайдалану туралы есеп берудің Ережесін бекіту туралы" Қазақстан Республикасы Орталық сайлау комиссиясының 1999 жылғы 7 тамыздағы N 19/222 қаулысына өзгерістер мен толықтырулар енгізу туралы'
