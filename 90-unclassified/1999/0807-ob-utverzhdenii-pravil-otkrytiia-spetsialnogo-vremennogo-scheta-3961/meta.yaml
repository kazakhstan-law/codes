  title:
    rus: О внесении изменений в постановление Центральной избирательной комиссии Республики Казахстан от 7 августа 1999 года № 19/222 "Об утверждении Правил расходования средств избирательных фондов и представления отчетов об их использовании при выборах Президента, депутатов Парламента, маслихатов Республики Казахстан"
    kaz: '"Қазақстан Республикасы Президентін, Парламент, мәслихаттар депутаттарын және әкімдерді сайлау кезінде сайлау қорларының қаражатын жұмсаудың және оны пайдалану туралы есеп берудің Ережесін бекіту туралы" Қазақстан Республикасы Орталық сайлау комиссиясының 1999 жылғы 7 тамыздағы № 19/222 қаулысына өзгерістер енгізу туралы'
