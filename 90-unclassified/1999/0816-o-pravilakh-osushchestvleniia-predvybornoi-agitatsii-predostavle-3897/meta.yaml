title:
  rus: О Правилах осуществления предвыборной агитации, предоставления эфирного времени на радио- и телепрограммах и на публикацию агитационных предвыборных материалов в периодических печатных изданиях государственных и других средств массовой информации кандидатам в депутаты Парламента и маслихатов Республики Казахстан
  kaz: Қазақстан Республикасы Парламентінің және мәслихаттарының депутаттығына кандидаттарға радио-телебағдарламалардан эфир уақытын беру және мемлекеттік мерзімді баспа басылымдарына және басқа да бұқаралық ақпарат құралдарына сайлау алдындағы үгіт материалдарын жариялаудың, сайлау алдындағы үгітті жүргізудің Ережесі туралы
