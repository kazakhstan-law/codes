  requisite: Приказ Председателя Комитета по защите конкуренций Министерства индустрии и торговли Республики Казахстан от 8 января 2007 года N 8-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 января 2007 года N 4515. Утратил силу приказом Председателя Агентства Республики Казахстан по защите конкуренции (антимонопольное агентство) от 12 ноября 2008 года N 340-ОД
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 25 августа 1999 года N 61-ОД "Об утверждении Правил регулирования цен на услуги монопольно осуществляемые государственными предприятиями"
    kaz: '"Мемлекеттік кәсіпорындардың монопольды жүзеге асыратын қызметтеріне бағаларды реттеу ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау агенттігі Төрағасының 1999 жылғы 25 тамыздағы N 61-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы'
