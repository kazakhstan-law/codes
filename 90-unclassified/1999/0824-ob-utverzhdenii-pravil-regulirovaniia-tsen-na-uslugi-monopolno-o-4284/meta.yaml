act_code: '4284'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 25 августа 1999 года N 61-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 8.10.99 г. за N 930. Утратил силу приказом Председателя Агентства Республики Казахстан по защите конкуренции (антимонопольное агентство) от 12 ноября 2008 года N 340-ОД
title:
  rus: Об утверждении Правил регулирования цен на услуги монопольно осуществляемые государственными предприятиями
  kaz: Мемлекеттік кәсіпорындардың монопольды жүзеге асыратын қызметтеріне бағаларды реттеу Ережесін бекіту туралы
