act_code: '4267'
requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 30 сентября 1999 года № 443. Зарегистрировано в Министерстве юстиции Республики Казахстан 5.10.99г. N 923. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 года N 110
title:
  rus: Об утверждении Инструкции о порядке проведения проверок субъектов рынка ценных бумаг на соответствие условиям полученных ими лицензий и действующего законодательства Республики Казахстан
  kaz: Бағалы қағаздар рыногы субъектiлерiне олар алған лицензиялардың және Қазақстан Республикасының қолданылып жүрген заңдарының шарттарына сәйкес келуiне тексерiстер жүргiзудiң тәртiбi туралы нұсқаулықты бекiту туралы
