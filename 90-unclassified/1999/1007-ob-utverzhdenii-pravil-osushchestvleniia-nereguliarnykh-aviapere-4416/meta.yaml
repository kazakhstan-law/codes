act_code: '4416'
requisite: Совместный приказ Министра транспорта, коммуникаций и туризма Республики Казахстан от 8 октября 1999 года № 705 А-I, Министра иностранных дел Республики Казахстан от 12 октября 1999 года № 36, Министра обороны Республики Казахстан от 14 октября 1999 года № 170. Зарегистрирован в Министерстве юстиции Республики Казахстан 20.10.99г. за N 944. Утратил силу - совместным приказом Министра транспорта, коммуникаций и туризма Республики Казахстан от 8 октября 1999 года № 705 А-I, Министра иностранных дел Республики Казахстан от 12 октября 1999 года № 36, Министра обороны Республики Казахстан от 14 октября 1999 года № 170
title:
