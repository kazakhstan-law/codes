  requisite: Совместный приказ Министра иностранных дел Республики Казахстан от 16 июня 2000 года № 42, Министра обороны Республики Казахстан от 24 июня 2000 года № 163 и Министра транспорта и коммуникаций Республики Казахстан от 7 июня 2000 года № 288-I. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2000 года за № 1178. Утратил силу совместным приказом и.о. Министра иностранных дел Республики Казахстан от 16 ноября 2009 года № 08-1-1-1/396, Министра обороны Республики Казахстан от 3 декабря 2009 года № 456 и и.о. Министра транспорта и коммуникаций Республики Казахстан от 12 ноября 2009 года № 477
  title:
    rus: О внесении изменений в совместный приказ Министра иностранных дел Республики Казахстан от 12.10.1999 г. N 36, Министра обороны Республики Казахстан от 14.10.1999 г. N 170 и Министра транспорта, коммуникаций и туризма Республики Казахстан от 8.10.1999 г. N 705 А-1 "Об утверждении Правил осуществления нерегулярных авиаперевозок гражданскими воздушными судами в Республике Казахстан"
    kaz: '"Қазақстан Республикасында азаматтық әуе кемелерімен оқтын-оқтын авиатасымалдарды орындаудың тәртібін бекіту туралы" Қазақстан Республикасы Сыртқы істер министрінің 1999 жылғы 12 қазандағы N 36, Қазақстан Республикасы Қорғаныс министрінің 1999 жылғы 14 қазандағы N 170 және Қазақстан Республикасы Көлік, коммуникациялар және туризм министрінің 1999 жылғы 8 қазандағы N 705-А-І бірлескен бұйрығына өзгерістер енгізу туралы'
