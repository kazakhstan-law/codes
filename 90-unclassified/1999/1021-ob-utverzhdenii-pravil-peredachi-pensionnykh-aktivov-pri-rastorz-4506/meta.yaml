caused_by:
  code: '15557'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года № 131. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2003 года № 2321. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 мая 2007 года № 153 (вводится в действие по истечении 14 дней со дня гос. регистрации)
  title:
    rus: О внесении изменений и дополнения в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 22 октября 1999 года № 460 "Об утверждении Инструкции о порядке передачи пенсионных активов при расторжении договоров на инвестиционное управление пенсионными активами", зарегистрированное в Министерстве юстиции Республики Казахстан под № 955
    kaz: Қазақстан Республикасының Әдiлет министрлігінде № 955 тiркелген Қазақстан Республикасының Бағалы қағаздар жөнiндегі ұлттық комиссиясы Директоратының "Зейнетақы активтерiн инвестициялық басқаруға жасасқан шарттар бұзылған кезде зейнетақы активтерiн өткiзiп берудiң тәртiбi туралы нұсқаулықты бекiту туралы" 1999 жылғы 22 қазандағы № 460 қаулысына өзгерiстер мен толықтыру енгізу туралы
