  requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 16 октября 2000 года N 692 Зарегистрировано Министерством юстиции Республики Казахстан 25 ноября 2000 года N 1303. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 мая 2007 года N 153 (вводится в действие по истечении 14 дней со дня гос. регистрации)
  title:
    rus: О внесении дополнений в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам "Об утверждении Инструкции о порядке передачи пенсионных активов при расторжении договоров на инвестиционное управление пенсионными активами" от 22 октября 1999 года N 460
    kaz: '"Зейнетақы активтерiн инвестициялық басқаруға жасасқан шарттар бұзылған кезде зейнетақы активтерiн өткiзiп берудiң тәртiбi туралы нұсқаулықты бекiту туралы" Қазақстан Республикасы Бағалы қағаздар жөнiндегi ұлттық комиссиясы Директоратының 1999 жылғы 22 қазандағы N 460 қаулысына толықтырулар енгiзу туралы'
