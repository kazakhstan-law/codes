act_code: '4506'
requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 22 октября 1999 года N 460. Зарегистрировано в Министерстве юстиции Республики Казахстан 28.10.99г. N 955. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 мая 2007 года N 153
title:
  rus: Об утверждении Правил передачи пенсионных активов при расторжении договоров на инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерiн инвестициялық басқаруға жасасқан шарттар бұзылған кезде зейнетақы активтерiн өткiзiп беру ережесiн бекiту туралы
