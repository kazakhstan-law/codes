  requisite: Приказ Министра финансов Республики Казахстан от 23 февраля 2004 года N 85. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2004 года N 2747. Утратил силу - приказом Министра финансов РК от 03.06.2005г. N 211
  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 12 ноября 1999 года N 607 "Об утверждении Правил отзыва бюджетных средств, выделенных из местных бюджетов и использованных государственными учреждениями на цели, не предусмотренные финансовыми разрешениями", зарегистрированный в Министерстве юстиции Республики Казахстан за N 995
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 995 тiркелген "Жергiлiктi бюджеттерден бөлiнген және қаржылық рұқсат беруде көзделмеген мақсаттарға мемлекеттiк мекемелер пайдаланған бюджеттiк қаражатын қайтарып алу Ережесiн бекiту туралы" Қазақстан Республикасы Қаржы министрiнiң 1999 жылғы 12 қарашадағы N 607 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
