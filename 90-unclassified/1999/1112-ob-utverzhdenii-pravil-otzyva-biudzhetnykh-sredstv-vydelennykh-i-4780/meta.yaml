requisite: Приказ Министра финансов Республики Казахстан от 12 ноября 1999 года N 607. Зарегистрирован в Министерстве юстиции Республики Казахстан 9.12.99г. за N 995. Утратил силу - приказом Министра финансов РК от 03.06.2005г. N 211
title:
  rus: Об утверждении Правил отзыва бюджетных средств, выделенных из местных бюджетов и использованных государственными учреждениями на цели, не предусмотренные разрешениями
  kaz: Жергілікті бюджеттерден бөлінген және рұқсат беруде көзделмеген мақсаттарға мемлекеттік мекемелер пайдаланған бюджеттік қаражатын қайтарып алу Ережесін бекіту туралы
