title:
  rus: Об утверждении Правил учета векселей банками второго уровня Республики Казахстан, филиалами банков-нерезидентов Республики Казахстан
  kaz: Қазақстан Республикасының екiншi деңгейдегi банктерінiң, Қазақстан Республикасы бейрезидент банктері филиалдарының вексельдерді есепке алуы қағидаларын бекіту туралы
