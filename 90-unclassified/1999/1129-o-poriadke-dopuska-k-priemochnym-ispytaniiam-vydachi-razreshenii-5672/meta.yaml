act_code: '5672'
requisite: Приказ Председателя Агентства Республики Казахстан по чрезвычайным ситуациям от 29 ноября 1999 года N 256. Зарегистрирован в Министерстве юстиции Республики Казахстан 6.03.2000 г. N 1072. Утратил силу - приказом Министра по чрезвычайным ситуациям РК от 20.05.2005г. N 469
title:
  rus: О порядке допуска к приемочным испытаниям, выдачи разрешений на серийный выпуск и применение новых образцов отечественной, а также импортной продукции повышенной опасности, эксплуатируемой в отраслях промышленности, поднадзорных органам Государственной инспекции по предупреждению и ликвидации чрезвычайных ситуаций
  kaz: Төтенше жағдайлардың алдын алу және оны жою жөнiндегi Мемлекеттiк инспекция органдарының қадағалауындағы өнеркәсіп салаларында пайдаланатын қауiп-қатерi жоғары өзіміздiң елде шығарылатын өнiмдердiң, жаңа түрлерiн қабылдау сынағына жiберуге, сериялық шығаруға және қолдануға, сол сияқты шет елден әкелiнген қауiп-қатерi жоғары өнiмдердi пайдалануға рұқсат беру тәртiбi туралы
