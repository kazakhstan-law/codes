  kaz: Қазақстан Республикасының Төтенше жағдайлар жөніндегі Агенттігі адамдарының қадағалауындағы кәсіпорындардың қызметкерлеріне әкімшілік тәртіппен айыппұл салу және төлету тәртібі туралы Нұсқаулықты бекіту туралы
