act_code: '4993'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий, защите конкуренции и поддержке малого бизнеса от 24 декабря 1999 года N 19-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 28.12.99г. за N 1012. Утратил силу - приказом и.о.Председателя Агентства РК по регулированию естественных монополий и защите конкуренции от 9.09.2004г. N 377-ОД
title:
