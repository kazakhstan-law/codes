act_code: '5682'
requisite: Приказ Министра внутренних дел Республики Казахстан и Председателя Комитета национальной безопасности Республики Казахстан от 24 января 2000 года N 2/36. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 марта 2000 года за N 1100. Утратил силу совместным приказом Председателя Комитета национальной безопасности Республики Казахстан от 17 октября 2005 года N 148 и Министра внутренних дел Республики Казахстан от 6 октября 2005 года N 439
title:
  rus: Об утверждении Инструкции "О согласованных мерах по контролю за въездом в Республику Казахстан и выездом из Республики Казахстан иностранных граждан и лиц без гражданства"
