requisite: Приказ Министерства труда и социальной защиты населения Республики Казахстан от 18.02.2000г. N 46-п Зарегистрирован в Министерстве юстиции Республики Казахстан 21.03.2000г. за N 1097. Утратил силу - приказом Министра труда и соцзащиты населения РК от 25 марта 2001г. N 17-п ~V011432
title:
  rus: Об утверждении Инструкции о порядке рассмотрения документов для назначения и выплаты государственных специальных пособий лицам, работавшим на подземных и открытых горных работах, на работах с особо вредными и особо тяжелыми условиями труда
  kaz: Жерасты және ашық кен жұмыстарында, еңбек жағдайлары зиянды және ерекше ауыр жұмыстарда істеген адамдарға мемлекеттік арнаулы жәрдемақылар тағайындау және төлеу үшін құжаттарды қараудың тәртібі туралы Нұсқаулықты бекіту туралы
