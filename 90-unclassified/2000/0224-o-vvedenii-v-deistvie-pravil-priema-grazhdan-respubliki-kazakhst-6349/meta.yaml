requisite: Приказ Министра обороны Республики Казахстан от 24 февраля 2000 года N 37. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июня 2000 года N 1171. Утратил силу приказом Министра обороны Республики Казахстан от 15 апреля 2005 года N 160 (вводится в действие со дня официального опубликования)
title:
  rus: О введении в действие Правил приема граждан Республики Казахстан в военно-учебные заведения Министерства обороны Республики Казахстан и других государств
