    kaz: Қазақстан Республикасы Ауыл шаруашылығы Министрінің 2000 жылғы 4 сәуірдегі N 97 "Астық қабылдау кәсіпорындарында астықты сақтау бойынша қызметті лицензиялаудың ережесін бекіту туралы" бұйрығына өзгерістер мен толықтырулар енгізу туралы, Әділет министрлігінде 2000 жылғы N 1124 тіркелген
