  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 21 апреля 2000 года N 146 "Об утверждении Правил обмена электронными документами при осуществлении платежей и переводов денег в Республике Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1148
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1148 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасында ақша төлемі мен аударымын жүзеге асырған кезде электронды құжаттар алмасу ережесін бекіту туралы" 2000 жылғы 21 сәуірдегі N 146 қаулысына өзгерістер мен толықтырулар енгізу туралы
