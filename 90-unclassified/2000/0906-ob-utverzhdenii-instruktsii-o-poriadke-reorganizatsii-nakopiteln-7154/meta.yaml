  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года № 70. Зарегистрировано Министерством юстиции Республики Казахстан от 26 апреля 2004 года № 2821. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 августа 2009 года № 199
  title:
    rus: О внесении изменений в приказ Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 7 сентября 2000 года № 100-П "Об утверждении "Инструкции о порядке реорганизации и ликвидации негосударственных накопительных пенсионных фондов", зарегистрированный в Министерстве юстиции Республики Казахстан под № 1265
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1265 тіркелген Қазақстан Республикасының еңбек және халықты әлеуметтік қорғау министрлігінің жинақтаушы зейнетақы қорларын реттеу жөніндегі комитеті Төрағасының 2000 жылғы 7 қыркүйектегі N 100-П "Мемлекеттік емес жинақтаушы зейнетақы қорларын қайта ұйымдастыру және тарату тәртібі туралы Нұсқаулықты" бекіту туралы" бұйрығына өзгерістер мен толықтырулар енгізу туралы
