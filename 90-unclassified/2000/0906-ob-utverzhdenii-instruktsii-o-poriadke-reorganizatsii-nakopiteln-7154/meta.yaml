act_code: '7154'
requisite: Приказ Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 7 сентября 2000 года № 100-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 октября 2000 года № 1265. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 августа 2009 года № 199
title:
