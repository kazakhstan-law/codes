  kaz: Сот шешiмiмен iс-әрекетке қабiлетсiз деп танылған және қамқорлыққа мұқтаж, интернат-үйлерінде тұратын адамдарға зейнетақы, мемлекеттiк әлеуметтiк жәрдемақы және мемлекеттiк арнайы жәрдемақы төлеу тәртiбiн бекiту туралы
