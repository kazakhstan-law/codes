act_code: '7556'
requisite: Постановление Директората Национальной Комиссии Республики Казахстан по ценным бумагам от 16 октября 2000 года N 690. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 ноября 2000 года N 1311. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года N 89
title:
  rus: Об утверждении Инструкции о действиях субъектов рынка ценных бумаг в случае приостановления действия или отзыва лицензии на осуществление брокерской и дилерской деятельности на рынке ценных бумаг с правом ведения счетов клиентов в качестве номинального держателя
  kaz: Нақтылы ұстаушы ретінде клиенттердің шоттарын жүргізу құқығымен бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыруға лицензиясын қолдану тоқтатыла тұрған немесе қайтарып алынған жағдайда бағалы қағаздар рыногы субъектілерінің әрекеттері туралы нұсқаулықты бекіту туралы
