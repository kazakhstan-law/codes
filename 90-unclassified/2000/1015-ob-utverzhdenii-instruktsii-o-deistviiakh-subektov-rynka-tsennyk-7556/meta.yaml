caused_by:
  code: '22839'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года № 380. Зарегистрировано Министерством юстиции Республики Казахстан 4 февраля 2005 года № 3423. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года № 89
  title:
    rus: О внесении изменений в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 16 октября 2000 года № 690 "Об утверждении Инструкции о действиях субъектов рынка ценных бумаг в случае приостановления действия или отзыва лицензий на осуществление брокерской и дилерской деятельности на рынке ценных бумаг с правом ведения счетов клиентов в качестве номинального держателя"
    kaz: Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясы Директоратының "Нақтылы ұстаушы ретінде клиенттердің шоттарын жүргізу құқығымен бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыруға лицензиясын қолдану тоқтатыла тұрған немесе қайтарып алынған жағдайда бағалы қағаздар рыногы субъектілерінің әрекеттері туралы нұсқаулықты бекіту туралы" 2000 жылғы 16 қазандағы № 690 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/22839/rus
