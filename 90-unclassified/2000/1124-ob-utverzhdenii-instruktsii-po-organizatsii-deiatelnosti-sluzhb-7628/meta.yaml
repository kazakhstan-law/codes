act_code: '7628'
requisite: Приказ Министра внутренних дел Республики Казахстан от 24 ноября 2000 года N 631 Зарегистрирован в Министерстве юстиции Республики Казахстан 13 декабря 2000 года N 1329. Утратил силу приказом Министра внутренних дел Республики Казахстан от 19 апреля 2021 года № 223 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по организации деятельности служб и подразделений органов внутренних дел Республики Казахстан при обнаружении транспортных средств, разыскиваемых по линии Интерпола
  kaz: Интерпол саласы бойынша іздестірудегі көлік құралдары табылғанда Қазақстан Республикасы ішкі істер органдарының қызметтері мен бөлімшелерінің қызметін ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
