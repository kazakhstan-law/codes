act_code: '8114'
requisite: Приказ Министра финансов Республики Казахстан от 28 ноября 2000 года N 509  Зарегистрировано в Министерстве юстиции Республики Казахстан 7 февраля 2001 года N 1395. Утратил силу - Приказом Министра Финансов Республики Казахстан от 3 августа 2004 г. № 309
title:
  rus: Об утверждении Правил выдачи Министерством финансов Республики Казахстан письменного согласия на совершение операций, связанных с движением капитала, предусматривающих переход (перемещение) валютных ценностей от резидентов в пользу нерезидентов, а также на открытие счетов резидентами за границей
  kaz: Қазақстан Республикасы Қаржы министрлігінің валюталық құндылықтардың резиденттерден резидент еместердің пайдасына көшуді (жылжуды) көздейтін капиталдың қозғалысына байланысты операцияларды жасауға, сондай-ақ резиденттердің шетелде шоттар ашуына жазбаша келісім берудің ережесін бекіту туралы
