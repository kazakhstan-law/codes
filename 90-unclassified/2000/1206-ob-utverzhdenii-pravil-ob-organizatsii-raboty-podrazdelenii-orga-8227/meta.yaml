act_code: '8227'
requisite: Приказ Министра внутренних дел Республики Казахстан от 6 декабря 2000 года N 665. Зарегистрирован в Министерстве юстиции Республики Казахстан 19.01.2001 г. за N 1368. Утратил силу приказом Министра внутренних дел Республики Казахстан от 15 октября 2015 года № 842
title:
  rus: Об утверждении Правил об организации работы подразделений органов внутренних дел по обеспечению охраны общественного порядка и безопасности граждан при проведении мероприятий общественными объединениями на улицах и в других общественных местах
  kaz: '"Қоғамдық бірлестіктердің көшелерде және басқа да қоғамдық орындарда іс-шаралар өткізу кезінде ішкі істер органдары бөлімшелерінің қоғамдық тәртіпті сақтау мен азаматтардың қауіпсіздігін қамтамасыз ету жөніндегі жұмысын ұйымдастыру туралы ережені бекіту туралы"'
