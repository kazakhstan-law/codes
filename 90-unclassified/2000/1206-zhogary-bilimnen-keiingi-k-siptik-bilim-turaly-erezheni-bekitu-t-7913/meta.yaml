act_code: '7913'
requisite: Қазақстан Республикасының Білім және ғылым министрлігі 2000 жылғы 6 желтоқсан N 1134 Бұйрық. Қазақстан Республикасы Әділет министрлігінде 2001 жылғы 10 қаңтар N 1356 тіркелді. Бұйрықтың күші жойылды - ҚР Білім және ғылым министрінің 2006 жылғы 25 қаңтардағы N 37 бұйрығымен.
