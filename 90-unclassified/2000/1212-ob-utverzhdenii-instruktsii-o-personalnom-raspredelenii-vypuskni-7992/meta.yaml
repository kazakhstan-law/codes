    kaz: '"Қазақстан Республикасының Ішкіісмині оқу орындарының бітірушілерін дербес бөлу және жас мамандармен жұмыс ұйымдастыру туралы нұсқаулықты бекіту туралы" Қазақстан Республикасының Ішкі істер министрінің 2000 жылғы 12 желтоқсандағы N 692 бұйрығына өзгерістер мен толықтыру енгізу туралы'
