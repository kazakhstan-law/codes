requisite: Приказ Председателя Комитета по управлению архивами и документацией Министерства культуры, информации и общественного согласия Республики Казахстан от 26 декабря 2000 года № 83. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 января 2001 года № 1355. Утратил силу приказом Председателя Комитета информации и архивов Министерства культуры и информации Республики Казахстан от 24 сентября 2012 года № 165
title:
