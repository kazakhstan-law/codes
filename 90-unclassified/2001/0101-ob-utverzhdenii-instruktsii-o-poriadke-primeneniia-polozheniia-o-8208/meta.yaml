  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 1 января 2001 года № 1 "Об утверждении Инструкции о порядке применения Положения о прохождении службы лицами рядового и начальствующего состава органов внутренних дел Республики Казахстан"
    kaz: '"Қазақстан Республикасы ішкі істер органдарының қатардағы және басшы құрамдағы адамдарының қызмет өткеруі туралы ережені қолданудың тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2001 жылғы 1 қаңтардағы N 1 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
