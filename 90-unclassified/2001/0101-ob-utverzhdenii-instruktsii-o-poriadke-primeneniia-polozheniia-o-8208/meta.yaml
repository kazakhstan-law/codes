    kaz: '"Қазақстан Республикасы ішкі істер органдарының қатардағы және басшы құрамдағы адамдарының қызмет өткеруі туралы ережені қолданудың тәртібі туралы»нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2001 жылғы 1 қаңтардағы № 1 бұйрығына толықтырулар енгізу туралы'
