  rus: Об утверждении Инструкции о порядке применения Положения о прохождении службы лицами рядового и начальствующего состава органов внутренних дел Республики Казахстан
  kaz: '"Қазақстан Республикасы ішкі істер органдарының қатардағы және басшы құрамдағы адамдарының қызмет өткеруі туралы ережені қолданудың тәртібі туралы нұсқаулықты бекіту туралы"'
