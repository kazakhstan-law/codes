act_code: '8341'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 января 2001 года N 15  Зарегистрировано Министерством юстиции Республики Казахстан 12 марта 2001 года N 1424. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 23 февраля 2007 года N 49 (вводится в действие с 1 апреля 2007 года).
title:
  rus: Об утверждении изменений и дополнений в Правила ведения документации по кредитованию банками второго уровня, утвержденные постановлением Правления Национального Банка Республики Казахстан от 16 августа 1999 года N 276 "Об утверждении Правил ведения документации по кредитованию банками второго уровня"
  kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің кредиттеу жөніндегі құжаттаманы жүргізу ережелерін бекіту туралы" 1999 жылғы 16 тамыздағы N 276 қаулысымен бекітілген Екінші деңгейдегі банктердің кредиттеу жөніндегі құжаттаманы жүргізу ережелеріне өзгерістер мен толықтыруларды бекіту туралы
