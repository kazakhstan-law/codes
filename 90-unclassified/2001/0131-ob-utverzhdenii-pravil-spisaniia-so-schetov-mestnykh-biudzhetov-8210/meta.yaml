title:
  rus: Об утверждении Правил списания со счетов местных бюджетов сумм непогашенного долга по бюджетным кредитам, выданным из республиканского бюджета и областных бюджетов, бюджетов городов Астаны и Алматы
  kaz: Республикалық және облыстық бюджеттерден, Астана және Алматы қалаларының бюджеттерінен берілген, бюджеттік несиелер бойынша өтелмеген борыштың сомаларын жергілікті бюджеттердің шоттарынан есептен шығару ережесін бекіту туралы
