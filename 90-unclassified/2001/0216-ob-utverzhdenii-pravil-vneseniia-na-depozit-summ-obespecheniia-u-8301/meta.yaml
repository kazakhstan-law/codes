act_code: '8301'
requisite: Приказ Министра государственных доходов Республики Казахстан от 16 февраля 2001 года N 166. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2001 года N 1417. Утратил силу - приказом Председателя Агентства таможенного контроля Республики Казахстан от 11.06.2003г. N 288
title:
  rus: Об утверждении Правил внесения на депозит сумм обеспечения уплаты таможенных пошлин и налогов и их возврата и Правил предоставления отсрочки или рассрочки уплаты таможенных пошлин на импортируемое сырье и материалы, предназначенные для промышленной переработки
  kaz: Кеден баждары мен салықтарын төлеуді қамтамасыз ету сомаларын депозитке енгізудің және оларды қайтарудың тәртібін және өнеркәсіптік қайта өңдеу үшін арналған импортталатын шикізаттар мен материалдарға кедендік баждар төлеуді кейінге қалдырудың немесе бөліп төлеудің ережесін бекіту туралы
