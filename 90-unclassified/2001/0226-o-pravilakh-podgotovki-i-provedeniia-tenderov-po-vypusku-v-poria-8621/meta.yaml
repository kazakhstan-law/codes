  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по государственным материальным резервам от 26 февраля 2001 года N 10 "О правилах подготовки и проведения тендеров по выпуску (в порядке освежения, замены и разбронирования) и поставке материальных ценностей государственного материального резерва Республики Казахстан"
    kaz: '"Қазақстан Республикасы мемлекеттік материалдық резервінің материалдық құндылықтарын (жаңарту, алмастыру және броньнан шығару тәртібімен) шығару және жеткізу жөніндегі тендерлерді әзірлеу және өткізу ережелері туралы" Қазақстан Республикасының Мемлекеттік материалдық резервтер жөніндегі агенттігі төрағасының 2001 жылғы 26 ақпандағы N 10 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
