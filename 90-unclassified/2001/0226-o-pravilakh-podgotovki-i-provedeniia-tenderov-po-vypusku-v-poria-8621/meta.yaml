  code: '12244'
  requisite: Приказ Председателя Агентства Республики Казахстан по государственным материальным резервам от 25 апреля 2002 года N 24. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 мая 2002 года N 1861. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 22 июля 2008 года N 128.
  title:
    rus: О внесении изменений и дополнений в Приказ Председателя Агентства Республики Казахстан по государственным материальным резервам от 26 февраля 2001 года N 10 "О правилах подготовки и проведения тендеров по выпуску (в порядке освежения, замены и разбронирования) и поставке материальных ценностей государственного материального резерва Республики Казахстан", государственная регистрация 7 апреля 2001 года за N 1456
    kaz: '"Қазақстан Республикасы мемлекеттік резервінің материалдық құндылықтарын шығару (жаңарту, алмастыру және броньнан шығару тәртібімен) және жеткізу жөніндегі тендерлерді әзірлеу және өткізу ережелері туралы" (мемлекеттік тіркеу N 1456 2001 жылғы 7 сәуір) Қазақстан Республикасының Мемлекеттік материалдық резервтер жөніндегі агенттігі төрағасының 2001 жылғы 26 ақпандағы N 10 Бұйрығына өзгертулер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/12244/rus
