act_code: '8621'
requisite: Приказ Председателя Агентства Республики Казахстан по государственным материальным резервам от 26 февраля 2001 года N 10. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2001 года N 1456. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 22 июля 2008 года N 128.
title:
  rus: О правилах подготовки и проведения тендеров по выпуску (в порядке освежения, замены и разбронирования) и поставке материальных ценностей государственного материального резерва Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік материалдық резервінің материалдық құндылықтарын (жаңарту, алмастыру және броньнан шығару тәртібімен) шығару және жеткізу жөніндегі тендерлерді әзірлеу және өткізу ережелері
