  requisite: Приказ Председателя Агентства Республики Казахстан по государственным материальным резервам от 11 мая 2004 года N 40. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 мая 2004 года N 2868. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 22 июля 2008 года N 128.
  title:
    rus: О внесении дополнений в приказ Председателя Агентства Республики Казахстан по государственным материальным резервам от 26 февраля 2001 года № 10 "О правилах подготовки и проведения тендеров по выпуску (в порядке освежения, замены и разбронирования) и поставке материальных ценностей государственного материального резерва Республики Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан за № 1456
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1456 болып тіркелген "Қазақстан Республикасы мемлекеттік материалдық резервінің материалдық құндылықтарын (жаңарту, алмастыру және броньнан шығару тәртібімен) шығару және жеткізу жөніндегі тендерлерді әзірлеу және өткізу ережелері туралы" Қазақстан Республикасының Мемлекеттік материалдық резервтер жөніндегі агенттігі төрағасының 2001 жылғы 26 ақпандағы N 10 бұйрығына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19911/rus
