  kaz: Қазақстан Республикасының екiншi деңгейдегi банктерiнде ашылатын, мемлекеттiк сыртқы заемдардың қаражаты мен гранттардың есебiнен қаржыландырылатын Инвестициялық жобалардың арнайы шоттары жөнiндегi нұсқаулықты бекіту туралы
