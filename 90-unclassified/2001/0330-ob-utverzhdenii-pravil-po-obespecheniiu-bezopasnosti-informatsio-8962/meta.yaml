act_code: '8962'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 марта 2001 года № 80. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2001 года за № 1517. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 марта 2018 года № 48 (вводится в действие с 1 декабря 2018 года)
title:
  rus: Об утверждении Правил по обеспечению безопасности информационных систем банков второго уровня и организаций, осуществляющих отдельные виды банковских операций
  kaz: Екiншi деңгейдегi банктердiң және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың ақпарат жүйелерiнiң қауiпсiздiгiн қамтамасыз ету жөнiндегi ереженi бекiту туралы
