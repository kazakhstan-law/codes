title:
  rus: Об утверждении дополнений в Детализированный План счетов бухгалтерского учета для составления Главной бухгалтерской книги банков второго уровня, утвержденный постановлением Правления Национального Банка Республики Казахстан от 24 августа 2000 года № 325 "Об утверждении Детализированного Плана счетов бухгалтерского учета для составления Главной бухгалтерской книги банков второго уровня"
