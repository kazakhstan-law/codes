act_code: '8977'
requisite: Постановление Правления Национального Банка Республики Казахстан от 9 апреля 2001 года N 92. Зарегистрирован в Министерстве юстиции Республики Казахстан 25.05.2001 г. за N 1520. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 11 (V064076).
title:
