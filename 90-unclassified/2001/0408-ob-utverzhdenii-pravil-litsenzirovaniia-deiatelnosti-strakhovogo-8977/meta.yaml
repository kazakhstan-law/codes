  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года N 198. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 августа 2004 года N 3021. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 11 (V064076).
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 9 апреля 2001 года N 92 "Об утверждении Правил лицензирования деятельности страхового брокера, приостановления действия и отзыва лицензии", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1520
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1520 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру брокерінің қызметін лицензиялау, лицензияның қолданылуын тоқтату және қайтарып алу ережесін бекіту туралы" 2001 жылғы 9 сәуірдегі N 92 қаулысына өзгерістер мен толықтырулар енгізу туралы
