requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий, защите конкуренции и поддержке малого бизнеса от 17 апреля 2001 года N 77-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2001 года за N 1500. Утратил силу приказом Председателя Комитета по защите конкуренции Министерства индустрии и торговли Республики Казахстан от 22 сентября 2006 года N 230-ОД
