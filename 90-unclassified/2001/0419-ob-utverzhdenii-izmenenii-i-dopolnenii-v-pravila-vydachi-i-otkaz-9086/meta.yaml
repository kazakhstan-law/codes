act_code: '9086'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года N 107 Зарегистрирован в Министерстве юстиции Республики Казахстан 06.06.2001 г. за N 1533. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций Республики Казахстан от 9 января 2006 года N 20 (V064068)
title:
  rus: Об утверждении изменений и дополнений в Правила выдачи и отказа в выдаче согласия на открытия филиалов и представительств страховых (перестраховочных) организаций, утвержденные постановлением Правления Национального Банка Республики Казахстан от 31 января 2000 года N 15
  kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының 2000 жылғы 31 қаңтардағы N 15 қаулысымен бекiтiлген Сақтандыру (қайта сақтандыру) ұйымдарының филиалдары мен өкiлдiктерiн ашуға келiсiм беру және келiсiм беруден бас тарту ережесiне өзгерiстер мен толықтыруларды бекiту туралы
