  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 301. Зарегистрировано Министерством юстиции Республики Казахстан от 1 декабря 2004 года N 3240. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2008 года N 158
  title:
    rus: О внесении изменений в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 15 мая 2001 года № 828 "Об утверждении Правил присвоения национальных идентификационных номеров государственным ценным бумагам", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1569
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1569 тiркелген, Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясы Директоратының "Мемлекеттiк бағалы қағаздарға Ұлттық бiрiздендiру нөмiрлерiн беру қағидаларын бекiту туралы" 2001 жылғы 15 мамырдағы N 828 қаулысына өзгерiстер енгізу туралы
