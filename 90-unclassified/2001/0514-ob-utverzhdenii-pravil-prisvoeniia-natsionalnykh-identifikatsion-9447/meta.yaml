  requisite: Постановление Правления Национального Банка Республики Казахстан от 16 апреля 2003 года N 114. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 мая 2003 года N 2312. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2008 года N 158
  title:
    rus: О внесении изменений и дополнений в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 15 мая 2001 года N 828 "Об утверждении Правил присвоения национальных идентификационных номеров государственным ценным бумагам", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1569
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1569 тiркелген Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясы Директоратының "Мемлекеттiк бағалы қағаздарға ұлттық бiрегейлендiру нөмiрлерiн беру қағидаларын бекiту туралы" 2001 жылғы 15 мамырдағы N 828 қаулысына өзгерiстер мен толықтырулар енгiзу туралы
