act_code: '9447'
requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 15 мая 2001 года N 828. Зарегистрирован в Министерстве юстиции Республики Казахстан 10.07.2001 г. N 1569. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2008 года N 158
