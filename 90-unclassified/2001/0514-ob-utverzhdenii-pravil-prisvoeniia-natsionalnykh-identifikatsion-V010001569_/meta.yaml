  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 139. Зарегистрировано в Министерстве юстиции Республики Казахстан от 4 сентября 2008 года № 5299. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2008 года № 158
  title:
    rus: О внесении дополнений и изменения в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 15 мая 2001 года № 828 "Об утверждении Правил присвоения национальных идентификационных номеров государственным ценным бумагам"
    kaz: Қазақстан Республикасы Бағалы қағаздар жөніндегі Ұлттық комиссиясы Директоратының "Мемлекеттiк бағалы қағаздарға ұлттық бiрiздендiру нөмiрлерiн беру қағидаларын бекіту туралы" 2001 жылғы 15 мамырдағы № 828 қаулысына толықтырулар мен өзгеріс енгізу туралы
