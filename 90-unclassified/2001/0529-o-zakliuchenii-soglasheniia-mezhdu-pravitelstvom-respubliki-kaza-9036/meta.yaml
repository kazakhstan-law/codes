act_code: '9036'
requisite: Постановление Правительства Республики Казахстан от 30 мая 2001 года N 740
title:
  rus: О заключении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об организации и условиях перевозок грузов и пассажиров казахстанскими и российскими судами в бассейне реки Иртыш
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясы Үкіметінің арасында Ертіс өзенінің бассейнінде қазақстандық және ресейлік кемелермен жүктер мен жолаушылар тасымалын ұйымдастыру және оның шарттары туралы келісім жасасу туралы
