act_code: '9117'
requisite: Приказ Министра юстиции Республики Казахстан от 4 июня 2001 года N 67  Зарегистрирован в Министерстве юстиции Республики Казахстан 07.06.2001 г. за N 1536. Утратил силу совместным приказом и.о. Министра юстиции Республики Казахстан от 4 ноября 2021 года № 950, Министра внутренних дел Республики Казахстан от 15 ноября 2021 года № 702, Министра финансов Республики Казахстан от 16 ноября 2021 года № 1182, Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 16 ноября 2021 года № 30, Министра культуры и спорта Республики Казахстан от 24 ноября 2021 года № 363, и.о. Генерального Прокурора Республики Казахстан от 24 ноября 2021 года № 155, Министра образования и науки Республики Казахстан от 29 ноября 2021 года № 574 и Министра обороны Республики Казахстан от 8 декабря 2021 года № 851 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Единых правил о порядке и условиях проставления апостиля на официальных документах, исходящих из государственных органов, а также от нотариусов Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттiк органдарынан, сондай-ақ нотариустардан шығатын ресми құжаттарға апостиль қою тәртiбi мен шарттары туралы Бiрыңғай қағиданы бекiту туралы
