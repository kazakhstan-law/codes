act_code: '9704'
requisite: Постановление Правления Национального Банка Республики Казахстан от 25 июня 2001 года N 255. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 августа 2001 года N 1611. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 3 (V064042)
title:
  rus: Об утверждении Правил о порядке дачи согласия на приобретение статуса крупного участника банка второго уровня или банковского холдинга
  kaz: Екінші деңгейдегі банктің немесе банктік холдингтің ірі қатысушысы мәртебесіне ие болуға келісім беру тәртібі туралы ережені бекіту жөнінде
