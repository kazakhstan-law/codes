caused_by:
  code: '17710'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 27 октября 2003 года N 376. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 декабря 2003 года N 2587. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 3 (V064042)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 25 июня 2001 года N 255 "Об утверждении Правил о порядке дачи согласия Национального Банка Республики Казахстан на приобретение статуса крупного участника банка второго уровня или банковского холдинга", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1611
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1611 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктің немесе банктік холдингтің ірі қатысушысы мәртебесіне ие болуға Қазақстан Республикасы Ұлттық Банкінің келісім беру тәртібі туралы ережені бекіту жөнінде" 2001 жылғы 25 маусымдағы N 255 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/17710/rus
