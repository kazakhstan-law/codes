act_code: '9724'
requisite: Постановление Правления Национального Банка Республики Казахстан от 13 июля 2001 года N 279. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 августа 2001 года N 1623. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 42 (V064154)
title:
  rus: Об утверждении Правил применения мер воздействия в отношении банков второго уровня, организаций, осуществляющих отдельные виды банковских операций, их руководящих работников, а также аффилиированных лиц банков второго уровня
  kaz: Екiншi деңгейдегi банктерге, банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдарға, олардың басшы қызметкерлерiне, сондай-ақ екiншi деңгейдегi банктердiң қосылма тұлғаларына қатысты ықпал ету шараларын қолдану ережесiн бекiту туралы
