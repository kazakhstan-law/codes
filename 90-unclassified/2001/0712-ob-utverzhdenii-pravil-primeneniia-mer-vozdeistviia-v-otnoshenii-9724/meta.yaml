caused_by:
  code: '21816'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 268. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2004 года N 3195. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 42 (V064154)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 13 июля 2001 года N 279 "Об утверждении Правил применения Национальным Банком Республики Казахстан мер воздействия в отношении банков второго уровня, организаций, осуществляющих отдельные виды банковских операций, их руководящих работников, а также аффилиированных лиц банков второго уровня", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1623
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1623 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық Банкінің екінші деңгейдегі банктерге, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға, олардың басшы қызметкерлеріне, сондай-ақ екінші деңгейдегі банктердің қосылма тұлғаларына қатысты ықпал ету шараларын қолдану ережесін бекіту туралы" 2001 жылғы 13 шілдедегі N 279 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/21816/rus
