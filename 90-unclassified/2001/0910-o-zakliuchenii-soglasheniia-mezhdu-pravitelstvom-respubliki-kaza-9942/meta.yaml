title:
  rus: О заключении Соглашения между Правительством Республики Казахстан и Правительством Китайской Народной Республики об избежании двойного налогообложения и предотвращении уклонения от налогообложения в отношении налогов на доход
  kaz: Қазақстан Республикасының Yкiметi мен Қытай Халық Республикасының Yкiметi арасында табысқа салынатын салықтарға қатысты қосарланған салық салуды болдырмау және салық төлеуден жалтаруға жол бермеу туралы келiсiм жасасу туралы
