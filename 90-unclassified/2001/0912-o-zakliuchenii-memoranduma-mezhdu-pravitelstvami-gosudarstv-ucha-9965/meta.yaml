act_code: '9965'
requisite: Постановление Правительства Республики Казахстан от 13 сентября 2001 года N 1192
title:
  rus: О заключении Меморандума между правительствами государств-участников Шанхайской организации сотрудничества об основных целях и направлениях регионального экономического сотрудничества и запуске процесса по созданию благоприятных условий в области торговли и инвестиций
  kaz: Шанхай ынтымақтастық ұйымына қатысушы мемлекеттердің үкіметтері арасындағы аймақтық экономикалық ынтымақтастықтың негізгі мақсаттары мен бағыттары туралы және сауда мен инвестициялар саласында қолайлы жағдайлар жасау процесін бастау жөнінде меморандум жасасу туралы
