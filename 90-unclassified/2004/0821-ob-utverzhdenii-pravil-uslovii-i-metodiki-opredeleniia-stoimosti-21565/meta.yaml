  title:
    rus: О внесении дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года № 259 "Об утверждении Правил учета и определения стоимости активов инвестиционного фонда, чистых активов инвестиционного фонда, расчетной стоимости пая паевого инвестиционного фонда и цены выкупа акции акционерного инвестиционного фонда"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Инвестициялық қор активтерінің, инвестициялық қордың таза активтерінің құнын, инвестициялық пай қоры пайының есепті құнын және акционерлік инвестициялық қордың акцияларын сатып алу бағасын есепке алу және айқындау ережесін бекіту туралы" 2004 жылғы 21 тамыздағы N 259 қаулысына толықтыру енгізу туралы
