  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования рынка ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығын реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
