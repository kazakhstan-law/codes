  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года № 259 "Об утверждении Правил учета и определения стоимости активов инвестиционного фонда, чистых активов инвестиционного фонда, расчетной стоимости пая паевого инвестиционного фонда и цены выкупа акции акционерного инвестиционного фонда"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Инвестициялық қор активтерiнiң, инвестициялық қордың таза активтерiнiң құнын, инвестициялық пай қоры пайының есептi құнын және акционерлiк инвестициялық қордың акцияларын сатып алу бағасын есепке алу және айқындау ережесiн бекiту туралы" 2004 жылғы 21 тамыздағы N 259 қаулысына өзгерістер мен толықтырулар енгізу туралы
