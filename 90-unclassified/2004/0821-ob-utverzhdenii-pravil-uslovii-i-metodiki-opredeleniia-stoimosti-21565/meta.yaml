  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года № 259 «Об утверждении Правил определения стоимости активов инвестиционного фонда, чистых активов инвестиционного фонда, расчетной стоимости пая паевого инвестиционного фонда и цены выкупа акции акционерного инвестиционного фонда»
    kaz: «Инвестициялық қор активтерiнiң, инвестициялық қордың таза активтерiнiң құнын, инвестициялық пай қоры пайының есептiк құнын және акционерлiк инвестициялық қор акциясын сатып алу бағасын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2004 жылғы 21 тамыздағы № 259 қаулысына өзгерістер мен толықтыру енгізу туралы
