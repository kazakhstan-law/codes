act_code: '21565'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года № 259. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 октября 2004 года № 3124
title:
  rus: Об утверждении Правил, условий и методики определения стоимости активов инвестиционного фонда, чистых активов инвестиционного фонда, расчетной стоимости пая паевого инвестиционного фонда и цены выкупа акции акционерного инвестиционного фонда, а также Правил, форм и сроков предоставления акционерным инвестиционным фондом или управляющей компанией информации о стоимости и составе активов и обязательств, стоимости чистых активов инвестиционного фонда, а также количестве держателей паев и доходности пая
  kaz: Инвестициялық қор активтерінің, инвестициялық қордың таза активтерінің құнын, инвестициялық пай қоры пайының есептік құнын және акционерлік инвестициялық қор акциясын сатып алу бағасын айқындау қағидаларын, талаптарын және әдістемесін, сондай-ақ акционерлік инвестициялық қордың немесе басқарушы компанияның активтер мен міндеттемелердің құны және құрамы, инвестициялық қордың таза активтерінің құны, сондай-ақ пай ұстаушылардың саны және пай кірістілігі туралы ақпарат ұсыну қағидаларын, нысандарын және мерзімдерін бекіту туралы
