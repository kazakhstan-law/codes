act_code: '79883'
requisite: Решение Кокпектинского районного маслихата Восточно-Казахстанской области от 3 апреля 2014 года № 22-6/6. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 мая 2014 года № 3289. Утратило силу решением Кокпектинского районного маслихата области Абай от 11 октября 2023 года № 7-6/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходе местного сообщества на территории Кокпектинского района
  kaz: Көкпекті ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу Қағидаларын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау туралы
