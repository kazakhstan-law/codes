requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 17 апреля 2014 года N 22/157-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 мая 2014 года N 3328. Утратило силу решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 26 декабря 2023 года № 10/134-VIII (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
