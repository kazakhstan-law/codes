    kaz: Катонқарағай аудандық мәслихатының 2014 жылғы 17 сәуірдегі № 22/157-V «Катонқарағай ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
