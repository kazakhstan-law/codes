  title:
    rus: О внесении изменения в решение Катон-Карагайского районного маслихата от 17 апреля 2014 года № 22/157-V «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Катон-Карагайского района»
    kaz: Катонқарағай аудандық мәслихатының 2014 жылғы 17 сәуірдегі № 22/157-V «Катонқарағай ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
